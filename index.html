<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чистим Ковры</title>
    <script src="phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%;
            background: #1a1a1a; overflow: hidden;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script>
// ============================================
// ⚙️ НАСТРОЙКИ
// ============================================
const CONFIG = {
    startMoney: 0, startFood: 3, startToolLevel: 1,
    foodPrice: 10, toolBasePrice: 50,
    rewardMin: 50, rewardMax: 100,
    brushRadius: 40,
    toolRadiusBonus: 0.05,
    
    soapPower: 1.0,
    soapThreshold: 0.01,
    eraseStrength: 0.9,
    
    progressThreshold: 1.0,
    
    newCarpetRadiusRequired: 70,
    newCarpetBasePrice: 5000,
    rewardMultiplierPerCarpet: 1.25,
    
    penaltyStartRadius: 60,
    penaltyIncreasePerCarpet: 5,
    penaltyPerPixel: 0.02,
    minRewardMultiplier: 0.3,
    
    starChance: 0.2,
    starLifetime: 700,
    starCount: 1,
    finishStarCount: 25,
    finishStarDuration: 1800,
    
    totalCarpets: 5
};

const SAVE_KEY = 'carpetGameStats_v3';

// ============================================
// ✅ СТИЛИ ТЕКСТА (обводка + тень + яркие цвета)
// ============================================
const TEXT_STYLES = {
    // Большой заголовок
    title: (color = '#FFD700') => ({
        fontSize: '48px',
        fill: color,
        fontStyle: 'bold',
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 6,
        shadow: {
            offsetX: 3, offsetY: 3,
            color: '#000000',
            blur: 5,
            fill: true
        }
    }),
    
    // Счётчики (деньги, еда, щётка)
    stat: (color = '#FFFFFF', size = 30) => ({
        fontSize: size + 'px',
        fill: color,
        fontStyle: 'bold',
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 5,
        shadow: {
            offsetX: 2, offsetY: 2,
            color: '#000000',
            blur: 4,
            fill: true
        }
    }),
    
    // Кнопки
    button: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px',
        fill: color,
        fontStyle: 'bold',
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 5,
        shadow: {
            offsetX: 2, offsetY: 2,
            color: '#000000',
            blur: 4,
            fill: true
        }
    }),
    
    // Магазин — крупные надписи
    shop: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px',
        fill: color,
        fontStyle: 'bold',
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 4,
        align: 'center'
    }),
    
    // Магазин — инфо
    shopInfo: (color = '#FFFFFF', size = 20) => ({
        fontSize: size + 'px',
        fill: color,
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 3,
        align: 'center'
    }),
    
    // Сообщения
    message: (color = '#FFFF00', size = 26) => ({
        fontSize: size + 'px',
        fill: color,
        fontStyle: 'bold',
        fontFamily: 'Arial',
        stroke: '#000000',
        strokeThickness: 5,
        shadow: {
            offsetX: 2, offsetY: 2,
            color: '#000000',
            blur: 4,
            fill: true
        },
        align: 'center',
        wordWrap: { width: 640 }
    })
};

// ============================================
// СОСТОЯНИЕ
// ============================================
const GameState = {
    money: CONFIG.startMoney,
    food: CONFIG.startFood,
    toolLevel: CONFIG.startToolLevel,
    carpetIndex: 1,
    carpetLevel: 0
};
let ysdk = null;

// ============================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================
function getCurrentRadius() {
    return Math.floor(CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus));
}

function getRewardMultiplier() {
    return Math.pow(CONFIG.rewardMultiplierPerCarpet, GameState.carpetLevel);
}

function getPenaltyStartRadius() {
    return CONFIG.penaltyStartRadius + (GameState.carpetLevel * CONFIG.penaltyIncreasePerCarpet);
}

function getRadiusPenaltyMultiplier() {
    const radius = getCurrentRadius();
    const threshold = getPenaltyStartRadius();
    if (radius <= threshold) return 1.0;
    const excess = radius - threshold;
    const penalty = excess * CONFIG.penaltyPerPixel;
    return Math.max(CONFIG.minRewardMultiplier, 1.0 - penalty);
}

function getNewCarpetPrice() {
    return CONFIG.newCarpetBasePrice * GameState.carpetIndex;
}

function canBuyNewCarpet() {
    return getCurrentRadius() >= CONFIG.newCarpetRadiusRequired
        && GameState.money >= getNewCarpetPrice()
        && GameState.carpetIndex < CONFIG.totalCarpets;
}

// ============================================
// YANDEX SDK
// ============================================
async function initYandexSDK() {
    try {
        if (typeof YaGames === 'undefined') throw new Error('no SDK');
        ysdk = await YaGames.init();
        const stats = await ysdk.player.getStats(['money', 'food', 'toolLevel', 'carpetIndex', 'carpetLevel']);
        if (stats.money !== undefined) GameState.money = Number(stats.money) || 0;
        if (stats.food !== undefined) GameState.food = Number(stats.food) || 3;
        if (stats.toolLevel !== undefined) GameState.toolLevel = Number(stats.toolLevel) || 1;
        if (stats.carpetIndex !== undefined) GameState.carpetIndex = Number(stats.carpetIndex) || 1;
        if (stats.carpetLevel !== undefined) GameState.carpetLevel = Number(stats.carpetLevel) || 0;
    } catch (e) {
        ysdk = {
            player: {
                getStats: async () => {
                    const s = localStorage.getItem(SAVE_KEY);
                    return s ? JSON.parse(s) : {};
                },
                setStats: async (stats) => {
                    localStorage.setItem(SAVE_KEY, JSON.stringify(stats));
                }
            },
            adv: {
                showRewardedVideo: (o) => { if (o?.callbacks?.onRewarded) o.callbacks.onRewarded(); if (o?.callbacks?.onClose) o.callbacks.onClose(); },
                showFullscreenAdv: (o) => { if (o?.callbacks?.onClose) o.callbacks.onClose(); }
            },
            features: { LoadingAPI: { ready: () => {} } }
        };
        const s = localStorage.getItem(SAVE_KEY);
        if (s) {
            try {
                const d = JSON.parse(s);
                if (d.money !== undefined) GameState.money = Number(d.money) || 0;
                if (d.food !== undefined) GameState.food = Number(d.food) || 3;
                if (d.toolLevel !== undefined) GameState.toolLevel = Number(d.toolLevel) || 1;
                if (d.carpetIndex !== undefined) GameState.carpetIndex = Number(d.carpetIndex) || 1;
                if (d.carpetLevel !== undefined) GameState.carpetLevel = Number(d.carpetLevel) || 0;
            } catch (err) {}
        }
    }
}

async function saveGame() {
    if (!ysdk) return;
    try {
        await ysdk.player.setStats({
            money: GameState.money,
            food: GameState.food,
            toolLevel: GameState.toolLevel,
            carpetIndex: GameState.carpetIndex,
            carpetLevel: GameState.carpetLevel
        });
    } catch (e) {}
}

// ============================================
// СЦЕНА ЗАГРУЗКИ
// ============================================
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }
    preload() {
        for (let i = 1; i <= CONFIG.totalCarpets; i++) {
            this.load.image('carpet' + i, `image.carpet/carpet${i}.png`);
        }
        
        const w = this.cameras.main.width, h = this.cameras.main.height;
        this.add.text(w/2, h/2 - 50, 'Загрузка...', TEXT_STYLES.title())
            .setOrigin(0.5);
        this.add.rectangle(w/2, h/2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w/2 - 200, h/2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (v) => { bar.width = 400 * v; });
    }
    create() {
        initYandexSDK();
        this.scene.start('MainScene');
    }
}

// ============================================
// ОСНОВНАЯ СЦЕНА
// ============================================
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    create() {
        if (this.input.mouse) this.input.mouse.disableContextMenu();
        if (ysdk?.features?.LoadingAPI) ysdk.features.LoadingAPI.ready();
        
        const W = 720, H = 1280;
        
        this.carpetW = 500;
        this.carpetH = 700;
        this.carpetX = W/2;
        this.carpetY = 700;
        
        this.roomGfx = this.add.graphics().setDepth(-10);
        this.drawRoom();
        
        this.carpetContainer = this.add.container(0, 0).setDepth(0);
        this.drawCarpet();
        
        this.gridCellSize = 20;
        this.gridCols = Math.ceil(this.carpetW / this.gridCellSize);
        this.gridRows = Math.ceil(this.carpetH / this.gridCellSize);
        
        this.dirtGrid = new Float32Array(this.gridCols * this.gridRows);
        this.soapGrid = new Float32Array(this.gridCols * this.gridRows);
        this.dirtGrid.fill(1.0);
        
        this.dirtGfx = this.add.graphics().setDepth(1);
        this.soapGfx = this.add.graphics().setDepth(2);
        
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW/2, this.carpetY - this.carpetH/2,
            this.carpetW, this.carpetH
        );
        
        this.cleanProgress = 0;
        this.isPointerDown = false;
        this.currentTool = 'soap';
        this.lastLocalX = -9999;
        this.lastLocalY = -9999;
        this.celebrationShown = false;
        
        this.brush = this.add.circle(0, 0, CONFIG.brushRadius, 0xFFFFFF, 0.15).setDepth(3);
        this.brush.setVisible(false);
        
        // ============================================
        // ✅ UI — ТЁМНАЯ ПЛАШКА СЗАДИ ДЛЯ ЧИТАЕМОСТИ
        // ============================================
        this.uiPanel = this.add.rectangle(0, 0, 260, 180, 0x000000, 0.5)
            .setOrigin(0, 0).setDepth(9);
        
        this.moneyText = this.add.text(30, 30, '💰 ' + GameState.money, TEXT_STYLES.stat('#FFD700', 34))
            .setDepth(10);
        this.foodText = this.add.text(30, 80, '🍞 ' + GameState.food, TEXT_STYLES.stat('#FFFFFF', 26))
            .setDepth(10);
        this.toolText = this.add.text(30, 118, '🧹 Радиус: ' + getCurrentRadius(), TEXT_STYLES.stat('#87CEEB', 20))
            .setDepth(10);
        this.carpetText = this.add.text(30, 148, '🟫 Ковёр: ' + GameState.carpetIndex + '/' + CONFIG.totalCarpets, TEXT_STYLES.stat('#FFD700', 20))
            .setDepth(10);
        
        // Прогресс-бар
        this.add.rectangle(W/2, 200, 400, 30, 0x000000, 0.6).setDepth(10);
        this.add.rectangle(W/2, 200, 400, 30, 0x333333).setDepth(10);
        this.progressBar = this.add.rectangle(W/2 - 200, 200, 0, 26, 0x00FF00).setOrigin(0, 0.5).setDepth(10);
        this.progressText = this.add.text(W/2, 200, '0%', TEXT_STYLES.stat('#FFFFFF', 22))
            .setOrigin(0.5).setDepth(11);
        
        // Магазин
        this.add.text(640, 40, '🛒', { fontSize: '48px' })
            .setDepth(10).setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.openShop());
        
        // Кнопки мыло/смыть
        const btnY = 1200;
        this.soapBtnBg = this.add.rectangle(180, btnY, 280, 80, 0x4A90D9).setDepth(10);
        this.soapBtnBg.setStrokeStyle(5, 0xFFFFFF);
        this.soapBtnText = this.add.text(180, btnY, '🧼 МЫЛО', TEXT_STYLES.button('#FFFFFF', 28))
            .setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('soap'));
        
        this.washBtnBg = this.add.rectangle(540, btnY, 280, 80, 0x555555).setDepth(10);
        this.washBtnBg.setStrokeStyle(5, 0x888888);
        this.washBtnText = this.add.text(540, btnY, '💧 СМЫТЬ', TEXT_STYLES.button('#AAAAAA', 28))
            .setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('wash'));
        
        // Получить деньги
        this.add.text(W/2, 1100, 'ПОЛУЧИТЬ ДЕНЬГИ', {
            ...TEXT_STYLES.button('#00FF00', 30),
            backgroundColor: '#000000',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.finishCarpet());
        
        this.selectTool('soap');
        this.setupCleaning();
    }

    drawRoom() {
        const W = 720, H = 1280;
        const level = GameState.carpetLevel;
        const g = this.roomGfx;
        g.clear();
        
        const isCozy = (level % 2 === 0);
        
        if (isCozy) {
            const wallColors = [0xE8D5B7, 0xD4B896, 0xC9A87C, 0xB89A6A, 0xA8895A];
            const wallColor = wallColors[level % wallColors.length];
            g.fillStyle(wallColor, 1);
            g.fillRect(0, 0, W, 900);
            
            for (let x = 0; x < W; x += 60) {
                g.fillStyle(0x000000, 0.05);
                g.fillRect(x, 0, 30, 900);
            }
            
            g.fillStyle(0x8B5A2B, 1);
            g.fillRect(0, 900, W, H - 900);
            
            for (let y = 900; y < H; y += 40) {
                g.fillStyle(0x000000, 0.15);
                g.fillRect(0, y, W, 3);
            }
            for (let x = 0; x < W; x += 100) {
                g.fillStyle(0x000000, 0.1);
                g.fillRect(x, 900, 2, H - 900);
            }
            
            g.fillStyle(0x5C3A1E, 1);
            g.fillRect(0, 880, W, 20);
            
            g.fillStyle(0x87CEEB, 1);
            g.fillRect(80, 150, 200, 250);
            g.fillStyle(0xFFFFFF, 1);
            g.fillRect(80, 150, 200, 250);
            g.lineStyle(8, 0x5C3A1E, 1);
            g.strokeRect(80, 150, 200, 250);
            g.fillStyle(0x5C3A1E, 1);
            g.fillRect(175, 150, 10, 250);
            g.fillRect(80, 270, 200, 10);
            g.fillStyle(0xFFEB3B, 0.8);
            g.fillCircle(240, 200, 35);
            
            g.fillStyle(0x8B4513, 1);
            g.fillRect(480, 200, 150, 120);
            g.fillStyle(0x87CEEB, 1);
            g.fillRect(490, 210, 130, 100);
            g.fillStyle(0x228B22, 1);
            g.fillTriangle(490, 310, 555, 240, 620, 310);
            
        } else {
            const colors = [0x2C3E50, 0x34495E, 0x1A252F, 0x3D5A80, 0x293241];
            const wallColor = colors[level % colors.length];
            g.fillStyle(wallColor, 1);
            g.fillRect(0, 0, W, 900);
            
            g.fillStyle(0x00E5FF, 0.5);
            g.fillRect(0, 400, W, 4);
            g.fillStyle(0xFF00E5, 0.5);
            g.fillRect(0, 500, W, 4);
            
            g.fillStyle(0x1a1a1a, 1);
            g.fillRect(0, 900, W, H - 900);
            
            for (let i = 0; i < 5; i++) {
                g.fillStyle(0x00E5FF, 0.05);
                g.fillRect(0, 900 + i * 40, W, 10);
            }
            
            g.lineStyle(3, 0x00E5FF, 0.6);
            g.strokeCircle(600, 250, 80);
            g.lineStyle(3, 0xFF00E5, 0.6);
            g.strokeRect(100, 180, 120, 120);
            
            g.fillStyle(0x000000, 1);
            g.fillRect(0, 880, W, 20);
        }
    }

    drawCarpet() {
        this.carpetContainer.removeAll(true);
        
        const carpetKey = 'carpet' + GameState.carpetIndex;
        
        if (this.textures.exists(carpetKey)) {
            const img = this.add.image(this.carpetX, this.carpetY, carpetKey);
            img.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetContainer.add(img);
        } else {
            const g = this.add.graphics();
            const cx = this.carpetX - this.carpetW / 2;
            const cy = this.carpetY - this.carpetH / 2;
            
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(GameState.carpetIndex - 1) % palettes.length];
            
            g.fillStyle(p.main, 1);
            g.fillRect(cx, cy, this.carpetW, this.carpetH);
            
            g.lineStyle(20, p.border, 1);
            g.strokeRect(cx + 10, cy + 10, this.carpetW - 20, this.carpetH - 20);
            
            g.lineStyle(4, p.accent, 0.7);
            for (let i = 0; i < 3; i++) {
                const size = 100 - i * 30;
                const x = this.carpetX;
                const y = this.carpetY;
                g.beginPath();
                g.moveTo(x, y - size);
                g.lineTo(x + size, y);
                g.lineTo(x, y + size);
                g.lineTo(x - size, y);
                g.closePath();
                g.strokePath();
            }
            
            g.fillStyle(p.accent, 1);
            g.fillCircle(cx + 50, cy + 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + 50, 12);
            g.fillCircle(cx + 50, cy + this.carpetH - 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + this.carpetH - 50, 12);
            
            this.carpetContainer.add(g);
        }
    }

    selectTool(tool) {
        this.currentTool = tool;
        if (tool === 'soap') {
            this.soapBtnBg.setFillStyle(0x4A90D9); this.soapBtnBg.setStrokeStyle(5, 0xFFFFFF); this.soapBtnText.setColor('#FFFFFF');
            this.washBtnBg.setFillStyle(0x555555); this.washBtnBg.setStrokeStyle(5, 0x888888); this.washBtnText.setColor('#AAAAAA');
        } else {
            this.soapBtnBg.setFillStyle(0x555555); this.soapBtnBg.setStrokeStyle(5, 0x888888); this.soapBtnText.setColor('#AAAAAA');
            this.washBtnBg.setFillStyle(0x4A90D9); this.washBtnBg.setStrokeStyle(5, 0xFFFFFF); this.washBtnText.setColor('#FFFFFF');
        }
    }

    spawnStars(x, y) {
        if (Math.random() > CONFIG.starChance) return;
        for (let i = 0; i < CONFIG.starCount; i++) {
            const star = this.add.text(x, y, Math.random() > 0.5 ? '⭐' : '✨', {
                fontSize: (20 + Math.random() * 15) + 'px', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(5);
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 60;
            this.tweens.add({
                targets: star, x: x + Math.cos(angle) * distance, y: y + Math.sin(angle) * distance - 40,
                alpha: { from: 1, to: 0 }, scale: { from: 1, to: 0.3 },
                duration: CONFIG.starLifetime, ease: 'Cubic.easeOut',
                onComplete: () => star.destroy()
            });
        }
    }

    spawnCelebration() {
        const W = 720, H = 1280;
        const symbols = ['⭐', '✨', '🌟', '💫'];
        for (let i = 0; i < CONFIG.finishStarCount; i++) {
            const startX = Math.random() * W;
            const startY = Math.random() * H;
            const symbol = symbols[Math.floor(Math.random() * symbols.length)];
            const star = this.add.text(startX, startY, symbol, {
                fontSize: (25 + Math.random() * 30) + 'px', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(15);
            const delay = Math.random() * 600;
            const angle = Math.random() * Math.PI * 2;
            const distance = 60 + Math.random() * 150;
            this.tweens.add({
                targets: star, x: startX + Math.cos(angle) * distance, y: startY + Math.sin(angle) * distance,
                alpha: { from: 0, to: 1 }, scale: { from: 0.3, to: 1.2 },
                delay: delay, duration: CONFIG.finishStarDuration * 0.4, ease: 'Back.easeOut',
                onComplete: () => {
                    this.tweens.add({
                        targets: star, alpha: 0, scale: 0.2, y: star.y - 60,
                        duration: CONFIG.finishStarDuration * 0.6, ease: 'Cubic.easeIn',
                        onComplete: () => star.destroy()
                    });
                }
            });
        }
    }

    drawDirt() {
        this.dirtGfx.clear();
        const cx = this.carpetX - this.carpetW / 2;
        const cy = this.carpetY - this.carpetH / 2;
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        for (let row = 0; row < this.gridRows; row++) {
            for (let col = 0; col < cols; col++) {
                const dirt = this.dirtGrid[row * cols + col];
                const px = cx + col * cs;
                const py = cy + row * cs;
                if (dirt > 0.05) {
                    this.dirtGfx.fillStyle(0x2a1a0a, dirt * 0.65);
                    this.dirtGfx.fillRect(px, py, cs, cs);
                } else {
                    this.dirtGfx.fillStyle(0xFFFFFF, 0.08);
                    this.dirtGfx.fillRect(px, py, cs, cs);
                }
            }
        }
        this.needRedrawDirt = false;
    }

    drawSoap() {
        this.soapGfx.clear();
        const cx = this.carpetX - this.carpetW / 2;
        const cy = this.carpetY - this.carpetH / 2;
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        for (let row = 0; row < this.gridRows; row++) {
            for (let col = 0; col < cols; col++) {
                const soap = this.soapGrid[row * cols + col];
                if (soap < 0.05) continue;
                const px = cx + col * cs;
                const py = cy + row * cs;
                this.soapGfx.fillStyle(0x88CCFF, soap * 0.2);
                this.soapGfx.fillRect(px, py, cs, cs);
            }
        }
        this.needRedrawSoap = false;
    }

    update() {
        if (this.needRedrawDirt) this.drawDirt();
        if (this.needRedrawSoap) this.drawSoap();
    }

    setupCleaning() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        const handlePointer = (pointer) => {
            this.brush.setPosition(pointer.x, pointer.y);
            const inBounds = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(GameState.food > 0 && inBounds);
            if (GameState.food <= 0 || !inBounds) return;
            
            const localX = pointer.x - (this.carpetX - this.carpetW/2);
            const localY = pointer.y - (this.carpetY - this.carpetH/2);
            
            const dx = localX - this.lastLocalX;
            const dy = localY - this.lastLocalY;
            if (dx*dx + dy*dy < 64) return;
            
            this.lastLocalX = localX;
            this.lastLocalY = localY;
            this.applyTool(localX, localY);
        };
        
        this.input.on('pointerdown', (pointer) => {
            this.isPointerDown = true;
            this.lastLocalX = -9999;
            this.lastLocalY = -9999;
            handlePointer(pointer);
        });
        this.input.on('pointermove', (pointer) => {
            if (!this.isPointerDown && !pointer.isDown) return;
            handlePointer(pointer);
        });
        this.input.on('pointerup', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
        this.input.on('pointerout', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
    }

    applyTool(localX, localY) {
        const radius = getCurrentRadius();
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(cols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(this.gridRows - 1, Math.floor((localY + radius) / cs));
        
        const radiusSq = radius * radius;
        let dirtChanged = false, soapChanged = false, erasedSomething = false;
        
        for (let row = minRow; row <= maxRow; row++) {
            for (let col = minCol; col <= maxCol; col++) {
                const ccx = col * cs + cs / 2;
                const ccy = row * cs + cs / 2;
                const dx = ccx - localX;
                const dy = ccy - localY;
                const distSq = dx*dx + dy*dy;
                if (distSq > radiusSq) continue;
                
                const falloff = Math.max(0.5, 1 - Math.sqrt(distSq) / radius);
                const index = row * cols + col;
                
                if (this.currentTool === 'soap') {
                    if (this.soapGrid[index] < 1.0) {
                        this.soapGrid[index] = Math.min(1.0, this.soapGrid[index] + CONFIG.soapPower * falloff);
                        soapChanged = true;
                    }
                } else {
                    if (this.soapGrid[index] < CONFIG.soapThreshold) continue;
                    if (this.dirtGrid[index] > 0.01) {
                        this.dirtGrid[index] = Math.max(0, this.dirtGrid[index] - CONFIG.eraseStrength * falloff);
                        dirtChanged = true;
                        erasedSomething = true;
                        this.soapGrid[index] = Math.max(0, this.soapGrid[index] - 0.05);
                        soapChanged = true;
                    }
                }
            }
        }
        
        if (erasedSomething) {
            const screenX = localX + (this.carpetX - this.carpetW/2);
            const screenY = localY + (this.carpetY - this.carpetH/2);
            this.spawnStars(screenX, screenY);
        }
        
        if (dirtChanged) {
            this.needRedrawDirt = true;
            this.recalcProgress();
        }
        if (soapChanged) {
            this.needRedrawSoap = true;
        }
    }

    recalcProgress() {
        let total = 0;
        const cells = this.dirtGrid.length;
        for (let i = 0; i < cells; i++) total += (1 - this.dirtGrid[i]);
        this.cleanProgress = total / cells;
        
        if (this.cleanProgress >= 0.9999) {
            let allClean = true;
            for (let i = 0; i < cells; i++) {
                if (this.dirtGrid[i] > 0.05) { allClean = false; break; }
            }
            if (allClean) {
                this.cleanProgress = 1.0;
                if (!this.celebrationShown) {
                    this.celebrationShown = true;
                    this.spawnCelebration();
                    this.showMessage('Ковёр чистый! ✨');
                }
            } else {
                this.cleanProgress = 0.99;
            }
        }
        
        this.updateProgressBar();
    }

    updateProgressBar() {
        const p = Math.min(100, Math.floor(this.cleanProgress * 100));
        this.progressBar.width = 400 * this.cleanProgress;
        this.progressText.setText(p + '%');
    }

    async finishCarpet() {
        if (this.cleanProgress < 1.0) {
            this.showMessage('Ковёр ещё грязный! Нужно 100%.');
            return;
        }
        
        const baseReward = Math.floor(
            CONFIG.rewardMin + Math.random() * (CONFIG.rewardMax - CONFIG.rewardMin)
        );
        const carpetMultiplier = getRewardMultiplier();
        const radiusPenalty = getRadiusPenaltyMultiplier();
        const reward = Math.floor(
            baseReward * GameState.toolLevel * carpetMultiplier * radiusPenalty
        );
        
        GameState.money += reward;
        GameState.food -= 1;
        this.moneyText.setText('💰 ' + GameState.money);
        this.foodText.setText('🍞 ' + GameState.food);
        await saveGame();
        
        let msg = `+${reward} 💰`;
        if (carpetMultiplier > 1.0) {
            msg += ` (×${carpetMultiplier.toFixed(2)})`;
        }
        if (radiusPenalty < 1.0) {
            msg += ` (-${Math.floor((1 - radiusPenalty) * 100)}%)`;
        }
        this.showMessage(msg);
        
        this.children.list.forEach(child => {
            if (child.type === 'Text' && child.text && ['⭐','✨','🌟','💫'].includes(child.text)) {
                child.destroy();
            }
        });
        
        this.dirtGrid.fill(1.0);
        this.soapGrid.fill(0.0);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.cleanProgress = 0;
        this.celebrationShown = false;
        this.isPointerDown = false;
        this.lastLocalX = -9999;
        this.lastLocalY = -9999;
        this.updateProgressBar();
    }

    openShop() {
        const W = 720, H = 1280;
        const els = [];
        
        const ov = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(20);
        ov.setInteractive(); els.push(ov);
        const bg = this.add.rectangle(W/2, H/2, 660, 1040, 0x2a2a2a).setDepth(21);
        bg.setStrokeStyle(5, 0xFFD700); els.push(bg);
        els.push(this.add.text(W/2, 190, 'МАГАЗИН', TEXT_STYLES.title()).setOrigin(0.5).setDepth(22));
        
        // ЕДА
        const fb = this.add.text(W/2, 310, `Купить еду (${CONFIG.foodPrice}💰)\n🍞 +1`, {
            ...TEXT_STYLES.shop('#FFFFFF', 28),
            backgroundColor: '#444444',
            padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (GameState.money >= CONFIG.foodPrice) {
                GameState.money -= CONFIG.foodPrice; GameState.food += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                this.foodText.setText('🍞 ' + GameState.food);
                await saveGame(); this.showMessage('Куплена еда!');
            } else this.showMessage('Не хватает денег!');
        });
        els.push(fb);
        
        // УЛУЧШЕНИЕ ЩЁТКИ
        const tc = GameState.toolLevel * CONFIG.toolBasePrice;
        const cr = getCurrentRadius();
        const nr = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
        const penaltyStart = getPenaltyStartRadius();
        
        let warningText = '';
        if (nr > penaltyStart) {
            const newMult = Math.max(CONFIG.minRewardMultiplier, 1.0 - (nr - penaltyStart) * CONFIG.penaltyPerPixel);
            warningText = `\n⚠️ Награда: ${Math.floor(newMult * 100)}%`;
        }
        
        const tb = this.add.text(W/2, 480,
            `Улучшить щётку (${tc}💰)\nРадиус: ${cr} → ${nr}${warningText}`, {
            ...TEXT_STYLES.shop(warningText ? '#FFAA00' : '#FFFFFF', 26),
            backgroundColor: '#444444',
            padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            const cost = GameState.toolLevel * CONFIG.toolBasePrice;
            if (GameState.money >= cost) {
                GameState.money -= cost; GameState.toolLevel += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                const r = getCurrentRadius();
                this.toolText.setText('🧹 Радиус: ' + r);
                await saveGame(); this.showMessage('Щётка улучшена!');
                
                if (r >= CONFIG.newCarpetRadiusRequired && GameState.carpetIndex < CONFIG.totalCarpets) {
                    this.showMessage('Новый ковёр доступен в магазине!');
                }
                
                const nc = GameState.toolLevel * CONFIG.toolBasePrice;
                const nr2 = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
                const ps2 = getPenaltyStartRadius();
                let warn2 = '';
                if (nr2 > ps2) {
                    const m2 = Math.max(CONFIG.minRewardMultiplier, 1.0 - (nr2 - ps2) * CONFIG.penaltyPerPixel);
                    warn2 = `\n⚠️ Награда: ${Math.floor(m2 * 100)}%`;
                }
                tb.setText(`Улучшить щётку (${nc}💰)\nРадиус: ${r} → ${nr2}${warn2}`);
                tb.setColor(warn2 ? '#FFAA00' : '#FFFFFF');
            } else this.showMessage('Не хватает денег!');
        });
        els.push(tb);
        
        // НОВЫЙ КОВЁР
        const newCarpetPrice = getNewCarpetPrice();
        const canBuy = canBuyNewCarpet();
        const radiusEnough = getCurrentRadius() >= CONFIG.newCarpetRadiusRequired;
        const hasNextCarpet = GameState.carpetIndex < CONFIG.totalCarpets;
        
        let newCarpetLabel = '';
        let newCarpetColor = '#888888';
        
        if (!hasNextCarpet) {
            newCarpetLabel = '🏆 ВСЕ КОВРЫ ОТКРЫТЫ';
            newCarpetColor = '#FFD700';
        } else if (!radiusEnough) {
            newCarpetLabel = `🔒 Нужен радиус ${CONFIG.newCarpetRadiusRequired}\n(сейчас ${getCurrentRadius()})`;
            newCarpetColor = '#AAAAAA';
        } else if (GameState.money < newCarpetPrice) {
            newCarpetLabel = `🆕 НОВЫЙ КОВЁР (${newCarpetPrice}💰)\nНе хватает денег`;
            newCarpetColor = '#AAAAAA';
        } else {
            newCarpetLabel = `🆕 КУПИТЬ НОВЫЙ КОВЁР (${newCarpetPrice}💰)\nКовёр ${GameState.carpetIndex} → ${GameState.carpetIndex + 1}\n⚠️ Сброс щётки и денег\n✅ Заработок ×1.25 навсегда`;
            newCarpetColor = '#00FF00';
        }
        
        const nb = this.add.text(W/2, 700, newCarpetLabel, {
            ...TEXT_STYLES.shop(newCarpetColor, 22),
            backgroundColor: '#1a1a1a',
            padding: { x: 25, y: 15 }
        }).setOrigin(0.5).setDepth(22);
        
        if (canBuy) {
            nb.setInteractive({ useHandCursor: true })
              .on('pointerdown', async () => {
                this.showMessage('Ковёр куплен! Всё сброшено.');
                await this.buyNewCarpet();
                els.forEach(el => el.destroy());
              });
        }
        els.push(nb);
        
        // ИНФО
        const infoText = `Уровень ковра: ${GameState.carpetLevel}\nМножитель: ×${getRewardMultiplier().toFixed(2)}\nШтраф радиуса с: ${getPenaltyStartRadius()}`;
        const ib = this.add.text(W/2, 900, infoText, {
            ...TEXT_STYLES.shopInfo('#CCCCCC', 20),
            backgroundColor: '#1a1a1a',
            padding: { x: 20, y: 12 }
        }).setOrigin(0.5).setDepth(22);
        els.push(ib);
        
        // ЗАКРЫТЬ
        const cb = this.add.text(620, 190, '✖', {
            fontSize: '52px', fill: '#FF4444', fontStyle: 'bold', fontFamily: 'Arial',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => { els.forEach(el => el.destroy()); });
        els.push(cb);
    }

    async buyNewCarpet() {
        if (!canBuyNewCarpet()) return;
        
        GameState.money = 0;
        GameState.toolLevel = CONFIG.startToolLevel;
        GameState.carpetIndex += 1;
        GameState.carpetLevel += 1;
        
        this.moneyText.setText('💰 ' + GameState.money);
        this.toolText.setText('🧹 Радиус: ' + getCurrentRadius());
        this.carpetText.setText('🟫 Ковёр: ' + GameState.carpetIndex + '/' + CONFIG.totalCarpets);
        
        this.drawRoom();
        this.drawCarpet();
        
        this.dirtGrid.fill(1.0);
        this.soapGrid.fill(0.0);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.cleanProgress = 0;
        this.celebrationShown = false;
        this.updateProgressBar();
        
        await saveGame();
        this.spawnCelebration();
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            ...TEXT_STYLES.message('#FFFF00', 26),
            backgroundColor: '#000000',
            padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(2200, () => msg.destroy());
    }
}

// ============================================
// ЗАПУСК
// ============================================
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>
