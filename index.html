<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чистим Ковры</title>
    <script src="phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #1a1a1a; overflow: hidden;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script>
/* ============================================================
   1. BALANCE — все числа в одном месте
   ============================================================ */
const BALANCE = {
    startMoney: 0, startFood: 5, startToolLevel: 1,
    totalCarpets: 5,

    foodPrice: 8,

    rewardMin: 80, rewardMax: 140,
    rewardMultiplierPerCarpet: 1.5,

    brushRadius: 40,
    toolRadiusBonus: 0.15,
    toolMoneyBonus: 0.35,
    toolBasePrice: 60,

    newCarpetRadiusRequired: 55,
    newCarpetRadiusIncrease: 8,
    newCarpetBasePrice: 400,

    autoFoodBasePrice: 300,
    autoFoodPriceIncrease: 150,

    soapPower: 1.0, soapThreshold: 0.01, eraseStrength: 0.9,
    autoCleanThreshold: 0.99, autoCleanIdleDelay: 2000, autoCleanDuration: 2000,
    inputLockDuration: 300,
    starChance: 0.2, starLifetime: 700,
    finishStarCount: 25, finishStarDuration: 1800,
    bugCountBase: 4, bugSpeed: 135, bugFadeDuration: 400,
    swatterRadius: 50, swatterCooldown: 200,
    splashChance: 0.5, bubbleChance: 0.4,

    gridCellSize: 20
};

const SAVE_KEY = 'carpetGameStats_v4';

/* ============================================================
   2. TEXT STYLES
   ============================================================ */
const TEXT_STYLES = {
    title: (color = '#FFD700') => ({
        fontSize: '48px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 6,
        shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
    }),
    stat: (color = '#FFFFFF', size = 30) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true }
    }),
    button: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true }
    }),
    shop: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 4, align: 'center'
    }),
    shopInfo: (color = '#FFFFFF', size = 20) => ({
        fontSize: size + 'px', fill: color, fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 3, align: 'center'
    }),
    message: (color = '#FFFF00', size = 26) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true },
        align: 'center', wordWrap: { width: 640 }
    })
};

/* ============================================================
   3. GAMESTATE
   ============================================================ */
class GameState {
    constructor() {
        this.money = BALANCE.startMoney;
        this.food = BALANCE.startFood;
        this.toolLevel = BALANCE.startToolLevel;
        this.carpetIndex = 1;
        this.carpetLevel = 0;
        this.carpetsCleaned = 0;
        this.autoFoodEnabled = false;
    }

    getCurrentRadius() {
        return Math.floor(BALANCE.brushRadius * (1 + (this.toolLevel - 1) * BALANCE.toolRadiusBonus));
    }
    getRewardMultiplier() {
        return Math.pow(BALANCE.rewardMultiplierPerCarpet, this.carpetLevel);
    }
    getToolMoneyMultiplier() {
        return 1 + (this.toolLevel - 1) * BALANCE.toolMoneyBonus;
    }
    getRequiredRadius() {
        return BALANCE.newCarpetRadiusRequired + this.carpetLevel * BALANCE.newCarpetRadiusIncrease;
    }
    getNewCarpetPrice() {
        return BALANCE.newCarpetBasePrice * this.carpetIndex;
    }
    getAutoFoodPrice() {
        return BALANCE.autoFoodBasePrice + this.carpetLevel * BALANCE.autoFoodPriceIncrease;
    }
    getToolUpgradePrice() {
        return this.toolLevel * BALANCE.toolBasePrice;
    }

    addReward() {
        const base = Math.floor(BALANCE.rewardMin + Math.random() * (BALANCE.rewardMax - BALANCE.rewardMin));
        const reward = Math.floor(base * this.getRewardMultiplier() * this.getToolMoneyMultiplier());
        this.money += reward;
        this.food -= 1;
        this.carpetsCleaned += 1;
        if (this.autoFoodEnabled && this.money >= this.getAutoFoodPrice()) {
            this.money -= this.getAutoFoodPrice();
            this.food += 1;
        }
        return reward;
    }

    canBuyNewCarpet() {
        return this.getCurrentRadius() >= this.getRequiredRadius()
            && this.money >= this.getNewCarpetPrice()
            && this.carpetIndex < BALANCE.totalCarpets;
    }

    buyNewCarpet() {
        if (!this.canBuyNewCarpet()) return false;
        this.money = 0;
        // toolLevel и food НЕ сбрасываются — ключевая правка баланса
        this.carpetIndex += 1;
        this.carpetLevel += 1;
        return true;
    }

    upgradeTool() {
        const price = this.getToolUpgradePrice();
        if (this.money < price) return false;
        this.money -= price;
        this.toolLevel += 1;
        return true;
    }
    buyFood() {
        if (this.money < BALANCE.foodPrice) return false;
        this.money -= BALANCE.foodPrice;
        this.food += 1;
        return true;
    }
    buyAutoFood() {
        if (this.autoFoodEnabled) return false;
        const price = this.getAutoFoodPrice();
        if (this.money < price) return false;
        this.money -= price;
        this.autoFoodEnabled = true;
        return true;
    }

    toSaveObject() {
        return {
            money: this.money, food: this.food, toolLevel: this.toolLevel,
            carpetIndex: this.carpetIndex, carpetLevel: this.carpetLevel,
            carpetsCleaned: this.carpetsCleaned,
            autoFoodEnabled: this.autoFoodEnabled ? 1 : 0
        };
    }
    fromSaveObject(d) {
        if (!d) return;
        const n = (v, fallback) => (v === undefined || v === null ? fallback : Number(v));
        this.money = n(d.money, this.money);
        this.food = n(d.food, this.food);
        this.toolLevel = n(d.toolLevel, this.toolLevel);
        this.carpetIndex = n(d.carpetIndex, this.carpetIndex);
        this.carpetLevel = n(d.carpetLevel, this.carpetLevel);
        this.carpetsCleaned = n(d.carpetsCleaned, this.carpetsCleaned);
        this.autoFoodEnabled = Number(d.autoFoodEnabled) === 1;
    }
}

/* ============================================================
   4. SAVESYSTEM
   ============================================================ */
class SaveSystem {
    constructor(state) {
        this.state = state;
        this.ysdk = null;
        this.useLocal = false;
    }

    async init() {
        try {
            if (typeof YaGames === 'undefined') throw new Error('no SDK');
            this.ysdk = await YaGames.init();
            const keys = ['money','food','toolLevel','carpetIndex','carpetLevel','carpetsCleaned','autoFoodEnabled'];
            const stats = await this.ysdk.player.getStats(keys);
            this.state.fromSaveObject(stats);
        } catch (e) {
            this.useLocal = true;
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (raw) this.state.fromSaveObject(JSON.parse(raw));
            } catch {}
        }
        return this;
    }

    ready() {
        try { this.ysdk?.features?.LoadingAPI?.ready(); } catch {}
    }

    async save() {
        const data = this.state.toSaveObject();
        if (!this.useLocal && this.ysdk) {
            try { await this.ysdk.player.setStats(data); } catch {}
        }
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
    }
}

/* ============================================================
   5. EFFECTS — визуальные эффекты
   ============================================================ */
class Effects {
    constructor(scene) {
        this.scene = scene;
        this.gfxSwatter = scene.add.graphics().setDepth(6);
        this.gfxSwatter.setVisible(false);
    }

    bubbles(x, y) {
        if (Math.random() > BALANCE.bubbleChance) return;
        const s = ['🫧','💭','⭕'][Math.floor(Math.random() * 3)];
        const t = this.scene.add.text(x, y, s, { fontSize: (25 + Math.random() * 20) + 'px' })
            .setOrigin(0.5).setDepth(8).setAlpha(0.85);
        const a = Math.random() * Math.PI * 2;
        const d = 30 + Math.random() * 50;
        this.scene.tweens.add({
            targets: t, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d - 50,
            alpha: { from: 0.85, to: 0 }, scale: { from: 1, to: 1.6 },
            duration: 700 + Math.random() * 300, ease: 'Cubic.easeOut',
            onComplete: () => t.destroy()
        });
    }

    splash(x, y) {
        if (Math.random() > BALANCE.splashChance) return;
        const n = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < n; i++) {
            const s = ['💧','💦','·','°'][Math.floor(Math.random() * 4)];
            const t = this.scene.add.text(x, y, s, { fontSize: (20 + Math.random() * 25) + 'px' })
                .setOrigin(0.5).setDepth(8).setAlpha(0.9);
            const a = Math.random() * Math.PI * 2;
            const d = 40 + Math.random() * 70;
            this.scene.tweens.add({
                targets: t, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d,
                alpha: { from: 0.9, to: 0 }, scale: { from: 1, to: 0.3 },
                angle: { from: 0, to: (Math.random() - 0.5) * 360 },
                duration: 500 + Math.random() * 300, ease: 'Cubic.easeOut',
                onComplete: () => t.destroy()
            });
        }
    }

    star(x, y) {
        if (Math.random() > BALANCE.starChance) return;
        const s = Math.random() > 0.5 ? '⭐' : '✨';
        const t = this.scene.add.text(x, y, s, { fontSize: (20 + Math.random() * 15) + 'px' })
            .setOrigin(0.5).setDepth(5);
        const a = Math.random() * Math.PI * 2;
        const d = 30 + Math.random() * 60;
        this.scene.tweens.add({
            targets: t, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d - 40,
            alpha: { from: 1, to: 0 }, scale: { from: 1, to: 0.3 },
            duration: BALANCE.starLifetime, ease: 'Cubic.easeOut',
            onComplete: () => t.destroy()
        });
    }

    starBurst(x, y, count = 3) {
        for (let i = 0; i < count; i++) this.star(x, y);
    }

    swatEffect(x, y) {
        const t = this.scene.add.text(x, y, '💥', { fontSize: '60px' }).setOrigin(0.5).setDepth(20);
        this.scene.tweens.add({
            targets: t, alpha: 0, scale: 1.8, duration: 400, ease: 'Cubic.easeOut',
            onComplete: () => t.destroy()
        });
    }

    drawSwatterCursor(x, y) {
        const g = this.gfxSwatter;
        g.clear();
        g.lineStyle(6, 0xFF4444, 0.8); g.strokeCircle(x, y, BALANCE.swatterRadius);
        g.lineStyle(4, 0xFF8888, 0.6);
        g.beginPath();
        g.moveTo(x - 15, y); g.lineTo(x + 15, y);
        g.moveTo(x, y - 15); g.lineTo(x, y + 15);
        g.strokePath();
        g.setVisible(true);
    }
    hideSwatterCursor() { this.gfxSwatter.setVisible(false); }

    celebration(W, H) {
        const sym = ['⭐','✨','🌟','💫'];
        for (let i = 0; i < BALANCE.finishStarCount; i++) {
            const sx = Math.random() * W, sy = Math.random() * H;
            const t = this.scene.add.text(sx, sy, sym[Math.floor(Math.random() * 4)], {
                fontSize: (25 + Math.random() * 30) + 'px'
            }).setOrigin(0.5).setDepth(15);
            const a = Math.random() * Math.PI * 2;
            const d = 60 + Math.random() * 150;
            this.scene.tweens.add({
                targets: t, x: sx + Math.cos(a) * d, y: sy + Math.sin(a) * d,
                alpha: { from: 0, to: 1 }, scale: { from: 0.3, to: 1.2 },
                delay: Math.random() * 600, duration: BALANCE.finishStarDuration * 0.4, ease: 'Back.easeOut',
                onComplete: () => this.scene.tweens.add({
                    targets: t, alpha: 0, scale: 0.2, y: t.y - 60,
                    duration: BALANCE.finishStarDuration * 0.6, ease: 'Cubic.easeIn',
                    onComplete: () => t.destroy()
                })
            });
        }
    }
}

/* ============================================================
   6. CLEANINGSYSTEM — сетка грязи / мыла / прогресс
   ============================================================ */
class CleaningSystem {
    constructor(scene, bounds, opts = {}) {
        this.scene = scene;
        this.bounds = bounds;
        this.cellSize = opts.cellSize || BALANCE.gridCellSize;
        this.cols = Math.ceil(bounds.width / this.cellSize);
        this.rows = Math.ceil(bounds.height / this.cellSize);
        this.originX = bounds.x;
        this.originY = bounds.y;

        this.dirt = new Float32Array(this.cols * this.rows);
        this.soap = new Float32Array(this.cols * this.rows);
        this.dirt.fill(1.0);

        this.dirtGfx = scene.add.graphics().setDepth(1);
        this.soapGfx = scene.add.graphics().setDepth(2);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.progress = 0;

        this.onProgress = null;
        this.onErase = null;
        this.onSoap = null;
        this.onCelebrate = null;
        this.celebrationFired = false;
    }

    reset() {
        this.dirt.fill(1.0);
        this.soap.fill(0.0);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.progress = 0;
        this.celebrationFired = false;
        this.onProgress?.(this.progress);
    }

    isComplete() { return this.progress >= 1.0; }

    applyStroke(localX, localY, radius, tool) {
        const cs = this.cellSize, cols = this.cols, rows = this.rows;
        const r2 = radius * radius;
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(cols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(rows - 1, Math.floor((localY + radius) / cs));

        const isSoap = tool === 'soap';
        let dirtChanged = false, soapChanged = false, erased = false;

        for (let row = minRow; row <= maxRow; row++) {
            const rowOff = row * cols;
            const dy = row * cs + cs / 2 - localY;
            const dy2 = dy * dy;
            if (dy2 > r2) continue;
            for (let col = minCol; col <= maxCol; col++) {
                const dx = col * cs + cs / 2 - localX;
                const d2 = dx * dx + dy2;
                if (d2 > r2) continue;
                const falloff = Math.max(0.5, 1 - Math.sqrt(d2) / radius);
                const i = rowOff + col;
                if (isSoap) {
                    if (this.soap[i] < 1.0) {
                        this.soap[i] = Math.min(1.0, this.soap[i] + BALANCE.soapPower * falloff);
                        soapChanged = true;
                    }
                } else {
                    if (this.soap[i] < BALANCE.soapThreshold) continue;
                    if (this.dirt[i] > 0.01) {
                        this.dirt[i] = Math.max(0, this.dirt[i] - BALANCE.eraseStrength * falloff);
                        this.soap[i] = Math.max(0, this.soap[i] - 0.05);
                        dirtChanged = true; soapChanged = true; erased = true;
                    }
                }
            }
        }

        const screenX = localX + this.originX;
        const screenY = localY + this.originY;
        if (isSoap && soapChanged) this.onSoap?.(screenX, screenY);
        if (!isSoap && erased) this.onErase?.(screenX, screenY);

        if (dirtChanged) { this.needRedrawDirt = true; this.recalcProgress(); }
        if (soapChanged) this.needRedrawSoap = true;

        return { dirtChanged, soapChanged, erased };
    }

    recalcProgress() {
        let total = 0;
        const cells = this.dirt.length;
        for (let i = 0; i < cells; i++) total += 1 - this.dirt[i];
        this.progress = total / cells;

        if (this.progress >= 0.9999) {
            let allClean = true;
            for (let i = 0; i < cells; i++) if (this.dirt[i] > 0.05) { allClean = false; break; }
            this.progress = allClean ? 1.0 : 0.99;
        }
        this.onProgress?.(this.progress);
        if (this.progress >= 1.0 && !this.celebrationFired) {
            this.celebrationFired = true;
            this.onCelebrate?.();
        }
    }

    draw() {
        if (this.needRedrawDirt) this.drawDirt();
        if (this.needRedrawSoap) this.drawSoap();
    }

    drawDirt() {
        const g = this.dirtGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols;
            const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const d = this.dirt[rowOff + col];
                if (d <= 0.05) continue;
                g.fillStyle(0x2a1a0a, d * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawDirt = false;
    }

    drawSoap() {
        const g = this.soapGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols;
            const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const s = this.soap[rowOff + col];
                if (s < 0.05 || this.dirt[rowOff + col] < 0.1) continue;
                g.fillStyle(0xAAE0FF, s * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawSoap = false;
    }
}

/* ============================================================
   7. BUGSYSTEM
   ============================================================ */
class BugSystem {
    constructor(scene, bounds, opts = {}) {
        this.scene = scene;
        this.bounds = bounds;
        this.padding = 40;
        this.bugs = [];
        this.lastSwat = 0;
        this.onKill = opts.onKill || null;
    }

    get count() { return this.bugs.length; }

    clear() {
        this.bugs.forEach(b => b.destroy());
        this.bugs = [];
    }

    spawnForLevel(carpetIndex) {
        if (carpetIndex < 2) return;
        const maxBugs = BALANCE.bugCountBase + carpetIndex;
        const n = Phaser.Math.Between(1, maxBugs);
        for (let i = 0; i < n; i++) this.spawnOne();
    }

    spawnOne() {
        const b = this.bounds;
        const x = Phaser.Math.Between(b.x + this.padding, b.x + b.width - this.padding);
        const y = Phaser.Math.Between(b.y + this.padding, b.y + b.height - this.padding);
        const bug = this.scene.add.container(x, y).setDepth(4);
        bug.add(this.buildBody());
        bug.bugAngle = Math.random() * Math.PI * 2;
        bug.bugSpeed = BALANCE.bugSpeed * (0.7 + Math.random() * 0.6);
        bug.isDead = false;
        bug.setRotation(bug.bugAngle);
        this.bugs.push(bug);
    }

    buildBody() {
        const g = this.scene.add.graphics();
        g.fillStyle(0x1a1a1a, 1); g.fillEllipse(0, 0, 36, 24);
        g.lineStyle(2, 0x000000, 1); g.strokeEllipse(0, 0, 36, 24);
        g.fillStyle(0x0a0a0a, 1); g.fillCircle(15, 0, 9);
        g.fillStyle(0xFFFFFF, 1); g.fillCircle(18, -4, 2.5); g.fillCircle(18, 4, 2.5);
        g.fillStyle(0x000000, 1); g.fillCircle(19, -4, 1.2); g.fillCircle(19, 4, 1.2);
        g.lineStyle(1.5, 0x4a2a0a, 1);
        g.beginPath();
        g.moveTo(-8, -8); g.lineTo(-8, 8);
        g.moveTo(0, -10); g.lineTo(0, 10);
        g.moveTo(8, -8); g.lineTo(8, 8);
        g.strokePath();
        g.lineStyle(1.5, 0x1a1a1a, 1);
        g.beginPath();
        g.moveTo(22, -3); g.lineTo(30, -8);
        g.moveTo(22, 3); g.lineTo(30, 8);
        g.strokePath();
        g.lineStyle(2, 0x0a0a0a, 1);
        g.beginPath();
        g.moveTo(-10, -10); g.lineTo(-15, -15);
        g.moveTo(-10, 10); g.lineTo(-15, 15);
        g.moveTo(0, -12); g.lineTo(-2, -18);
        g.moveTo(0, 12); g.lineTo(-2, 18);
        g.moveTo(10, -10); g.lineTo(15, -15);
        g.moveTo(10, 10); g.lineTo(15, 15);
        g.strokePath();
        return g;
    }

    kill(bug) {
        if (bug.isDead) return;
        bug.isDead = true;
        this.onKill?.(bug.x, bug.y);
        this.scene.tweens.add({
            targets: bug, alpha: 0, scale: 1.5,
            duration: BALANCE.bugFadeDuration, ease: 'Cubic.easeOut',
            onComplete: () => {
                const idx = this.bugs.indexOf(bug);
                if (idx > -1) this.bugs.splice(idx, 1);
                bug.destroy();
            }
        });
    }

    swat(x, y, now) {
        if (now - this.lastSwat < BALANCE.swatterCooldown) return false;
        this.lastSwat = now;
        const r2 = BALANCE.swatterRadius * BALANCE.swatterRadius;
        let hit = false;
        for (let i = this.bugs.length - 1; i >= 0; i--) {
            const bug = this.bugs[i];
            if (bug.isDead) continue;
            const dx = bug.x - x, dy = bug.y - y;
            if (dx * dx + dy * dy <= r2) { this.kill(bug); hit = true; }
        }
        return hit;
    }

    update(delta) {
        if (this.bugs.length === 0) return;
        const dt = delta / 1000;
        const b = this.bounds;
        const minX = b.x + this.padding, maxX = b.x + b.width - this.padding;
        const minY = b.y + this.padding, maxY = b.y + b.height - this.padding;
        for (const bug of this.bugs) {
            if (bug.isDead) continue;
            bug.x += Math.cos(bug.bugAngle) * bug.bugSpeed * dt;
            bug.y += Math.sin(bug.bugAngle) * bug.bugSpeed * dt;
            bug.setRotation(bug.bugAngle);
            if (bug.x < minX) { bug.x = minX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.x > maxX) { bug.x = maxX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.y < minY) { bug.y = minY; bug.bugAngle = -bug.bugAngle; }
            if (bug.y > maxY) { bug.y = maxY; bug.bugAngle = -bug.bugAngle; }
            if (Math.random() < 0.005) bug.bugAngle += (Math.random() - 0.5) * 1.5;
        }
    }
}

/* ============================================================
   8. SHOPUI — с превью следующего ковра
   ============================================================ */
class ShopUI {
    constructor(scene, state) {
        this.scene = scene;
        this.state = state;
        this.elements = [];
        this.isOpen = false;
        this.onBuyCarpet = null;
        this.onChanged = null;
        this.onMessage = null;
    }

    open() {
        if (this.isOpen) return;
        this.isOpen = true;
        this.render();
    }
    close() {
        this.isOpen = false;
        this.elements.forEach(e => e.destroy());
        this.elements = [];
    }
    refresh() {
        if (!this.isOpen) return;
        this.close();
        this.open();
    }

    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => { this.elements.push(el); return el; };

        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(20));
        ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1100, 0x2a2a2a).setDepth(21).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 120, 'МАГАЗИН', TEXT_STYLES.title()).setOrigin(0.5).setDepth(22));

        /* --- Еда --- */
        push(s.add.text(W/2, 200, `Купить еду (${BALANCE.foodPrice}💰)\n🍞 +1`, {
            ...TEXT_STYLES.shop('#FFFFFF', 22), backgroundColor: '#444444', padding: { x: 25, y: 10 }
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (st.buyFood()) { await this.onChanged?.(); this.onMessage?.('Куплена еда!'); this.refresh(); }
            else this.onMessage?.('Не хватает денег!');
          }));

        /* --- Автоеда --- */
        const afPrice = st.getAutoFoodPrice();
        const afLabel = st.autoFoodEnabled
            ? `✅ АВТОЕДА ВКЛ\nПокупает еду за ${afPrice}💰`
            : `🛒 АВТОЕДА (${afPrice}💰)\nВкл. навсегда`;
        const afColor = st.autoFoodEnabled ? '#00FF00' : '#FFAA00';
        const afBtn = push(s.add.text(W/2, 300, afLabel, {
            ...TEXT_STYLES.shop(afColor, 20), backgroundColor: '#1a1a1a', padding: { x: 25, y: 10 }
        }).setOrigin(0.5).setDepth(22));
        if (!st.autoFoodEnabled) {
            afBtn.setInteractive({ useHandCursor: true }).on('pointerdown', async () => {
                if (st.buyAutoFood()) {
                    await this.onChanged?.();
                    this.onMessage?.('✅ Автоеда включена!');
                    this.refresh();
                } else this.onMessage?.('Не хватает денег!');
            });
        }

        /* --- Щётка --- */
        const t = st.toolLevel;
        const curR = st.getCurrentRadius();
        const nextR = Math.floor(BALANCE.brushRadius * (1 + t * BALANCE.toolRadiusBonus));
        const curM = Math.round(st.getToolMoneyMultiplier() * 100);
        const nextM = Math.round((1 + t * BALANCE.toolMoneyBonus) * 100);
        const toolPrice = st.getToolUpgradePrice();
        push(s.add.text(W/2, 410,
            `Улучшить щётку (${toolPrice}💰)\nРадиус: ${curR} → ${nextR}\n💰 Доход: ${curM}% → ${nextM}%`, {
            ...TEXT_STYLES.shop('#FFFFFF', 20), backgroundColor: '#444444', padding: { x: 25, y: 10 }
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (!st.upgradeTool()) { this.onMessage?.('Не хватает денег!'); return; }
            await this.onChanged?.();
            this.onMessage?.('Щётка улучшена!');
            if (st.getCurrentRadius() >= st.getRequiredRadius() && st.carpetIndex < BALANCE.totalCarpets) {
                this.onMessage?.('Новый ковёр доступен!');
            }
            this.refresh();
        }));

        /* --- Превью следующего ковра --- */
        this._renderPreview(push);

        /* --- Кнопка «новый ковёр» --- */
        const canBuy = st.canBuyNewCarpet();
        const { label, color } = this._newCarpetLabel();
        const nb = push(s.add.text(W/2, 920, label, {
            ...TEXT_STYLES.shop(color, 18), backgroundColor: '#1a1a1a', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(22));
        if (canBuy) {
            nb.setInteractive({ useHandCursor: true }).on('pointerdown', async () => {
                await this.onBuyCarpet?.();
                this.close();
            });
        }

        /* --- Инфо --- */
        push(s.add.text(W/2, 1080,
            `Уровень ковра: ${st.carpetLevel}  •  Множитель: ×${st.getRewardMultiplier().toFixed(2)}\n` +
            `Доход от щётки: ${Math.round(st.getToolMoneyMultiplier() * 100)}%  •  ` +
            `Почищено: ${st.carpetsCleaned}`, {
            ...TEXT_STYLES.shopInfo('#CCCCCC', 16), backgroundColor: '#1a1a1a', padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setDepth(22));

        /* --- Закрыть --- */
        push(s.add.text(620, 120, '✖', {
            fontSize: '52px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }

    _renderPreview(push) {
        const s = this.scene, st = this.state;
        const nextIdx = st.carpetIndex + 1;
        if (nextIdx > BALANCE.totalCarpets) return;

        const cx = 360, cy = 620;
        const pw = 260, ph = 160;

        push(s.add.rectangle(cx, cy, pw + 20, ph + 20, 0x111111).setDepth(21).setStrokeStyle(3, 0x00FF00, 0.6));
        push(s.add.text(cx, cy - ph/2 - 20, `СЛЕДУЮЩИЙ КОВЁР №${nextIdx}`, {
            ...TEXT_STYLES.shop('#00FF00', 16)
        }).setOrigin(0.5).setDepth(22));

        const key = 'carpet' + nextIdx;
        if (s.textures.exists(key)) {
            push(s.add.image(cx, cy, key).setDisplaySize(pw, ph).setDepth(22));
        } else {
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(nextIdx - 1) % palettes.length];
            const g = s.add.graphics().setDepth(22);
            g.fillStyle(p.main, 1); g.fillRect(cx - pw/2, cy - ph/2, pw, ph);
            g.lineStyle(8, p.border, 1); g.strokeRect(cx - pw/2 + 6, cy - ph/2 + 6, pw - 12, ph - 12);
            g.lineStyle(3, p.accent, 0.7);
            g.beginPath();
            g.moveTo(cx, cy - 40); g.lineTo(cx + 50, cy);
            g.lineTo(cx, cy + 40); g.lineTo(cx - 50, cy);
            g.closePath(); g.strokePath();
            push(g);
        }

        const hints = [];
        if (nextIdx === 2) hints.push('🐛 Появятся жуки');
        else hints.push('🐛 Жуков станет больше');
        hints.push(`🧹 Нужен радиус: ${st.getRequiredRadius() + BALANCE.newCarpetRadiusIncrease}`);
        hints.push(`🛒 Автоеда: ${st.getAutoFoodPrice() + BALANCE.autoFoodPriceIncrease}💰`);

        push(s.add.text(cx, cy + ph/2 + 30, hints.join('   •   '), {
            ...TEXT_STYLES.shopInfo('#FFFF00', 14), wordWrap: { width: 620 }
        }).setOrigin(0.5).setDepth(22));
    }

    _newCarpetLabel() {
        const st = this.state;
        const price = st.getNewCarpetPrice();
        const reqR = st.getRequiredRadius();
        const hasNext = st.carpetIndex < BALANCE.totalCarpets;
        const radiusOk = st.getCurrentRadius() >= reqR;
        const moneyOk = st.money >= price;

        if (!hasNext) return { label: '🏆 ВСЕ КОВРЫ ОТКРЫТЫ', color: '#FFD700' };
        if (!radiusOk) return { label: `🔒 Нужен радиус ${reqR}\n(сейчас ${st.getCurrentRadius()})`, color: '#AAAAAA' };
        if (!moneyOk)  return { label: `🆕 КУПИТЬ (${price}💰)\nНе хватает денег`, color: '#AAAAAA' };

        const nextNum = st.carpetIndex + 1;
        const curMult = Math.round(st.getRewardMultiplier() * 100);
        const nextMult = Math.round(Math.pow(BALANCE.rewardMultiplierPerCarpet, st.carpetLevel + 1) * 100);
        return {
            label:
                `🆕 КУПИТЬ КОВЁР №${nextNum} (${price}💰)\n` +
                `📈 Множитель: ${curMult}% → ${nextMult}%\n` +
                `⚠️ Сброс: только деньги (щётка остаётся!)`,
            color: '#00FF00'
        };
    }
}

/* ============================================================
   9. PRELOAD SCENE  ← путь к картинкам ИСПРАВЛЕН
   ============================================================ */
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }

    preload() {
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            this.load.image('carpet' + i, `image.carpet/carpet${i}.png`);
        }
        this.load.on('loaderror', (file) => console.warn('Не загрузилось:', file.key, file.src));

        const w = this.cameras.main.width, h = this.cameras.main.height;
        this.add.text(w/2, h/2 - 50, 'Загрузка...', TEXT_STYLES.title()).setOrigin(0.5);
        this.add.rectangle(w/2, h/2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w/2 - 200, h/2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (v) => { bar.width = 400 * v; });
    }

    async create() {
        const state = new GameState();
        const saveSystem = await new SaveSystem(state).init();
        this.registry.set('gameState', state);
        this.registry.set('saveSystem', saveSystem);
        this.scene.start('MainScene');
    }
}

/* ============================================================
   10. MAIN SCENE
   ============================================================ */
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    create() {
        this.state = this.registry.get('gameState');
        this.saveSystem = this.registry.get('saveSystem');

        if (this.input.mouse) this.input.mouse.disableContextMenu();
        this.saveSystem.ready();

        const W = 720, H = 1280;
        this.carpetW = 500; this.carpetH = 700;
        this.carpetX = W / 2; this.carpetY = 600;
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW / 2, this.carpetY - this.carpetH / 2,
            this.carpetW, this.carpetH
        );

        this.roomGfx = this.add.graphics().setDepth(-10);
        this.drawRoom();
        this.carpetContainer = this.add.container(0, 0).setDepth(0);
        this.drawCarpet();

        /* --- Системы --- */
        this.effects = new Effects(this);

        this.cleaning = new CleaningSystem(this, this.carpetBounds);
        this.cleaning.onProgress = (p) => this.updateProgressBar(p);
        this.cleaning.onSoap = (x, y) => this.effects.bubbles(x, y);
        this.cleaning.onErase = (x, y) => { this.effects.splash(x, y); this.effects.star(x, y); };
        this.cleaning.onCelebrate = () => { this.effects.celebration(W, H); this.showMessage('Ковёр чистый! ✨'); };

        this.bugs = new BugSystem(this, this.carpetBounds, {
            onKill: (x, y) => this.effects.starBurst(x, y, 3)
        });

        this.shop = new ShopUI(this, this.state);
        this.shop.onChanged = async () => { this.refreshHUD(); await this.saveSystem.save(); };
        this.shop.onMessage = (t) => this.showMessage(t);
        this.shop.onBuyCarpet = async () => this.buyNewCarpet();

        /* --- Инструменты / ввод --- */
        this.currentTool = 'soap';
        this.isPointerDown = false;
        this.lastLocalX = -9999;
        this.lastLocalY = -9999;
        this.inputLocked = false;

        this.noFoodText = null; this.noFoodTween = null; this.noFoodCooldown = false;
        this.bugWarningText = null; this.bugWarningTween = null; this.bugWarningCooldown = false;

        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        this.autoCleanIdleTimer = null;
        this.autoCleanTweenTimer = null;

        this.brush = this.add.text(0, 0, '🧼', { fontSize: '70px', fontFamily: 'Arial' })
            .setOrigin(0.5).setDepth(3).setVisible(false);

        this.buildHUD(W, H);
        this.buildToolButtons(W, H);
        this.setupInput();
        this.selectTool('soap');

        this.bugs.spawnForLevel(this.state.carpetIndex);
    }

    /* ---------- HUD ---------- */
    buildHUD(W, H) {
        this.add.rectangle(0, 0, 280, 180, 0x000000, 0.5).setOrigin(0, 0).setDepth(9);
        this.moneyText = this.add.text(30, 30, '💰 ' + this.state.money, TEXT_STYLES.stat('#FFD700', 34)).setDepth(10);
        this.foodText = this.add.text(30, 80, '🍞 ' + this.state.food, TEXT_STYLES.stat('#FFFFFF', 26)).setDepth(10);
        this.toolText = this.add.text(30, 118, '🧹 Радиус: ' + this.state.getCurrentRadius(), TEXT_STYLES.stat('#87CEEB', 20)).setDepth(10);
        this.carpetText = this.add.text(30, 148, '🧽 Почищено: ' + this.state.carpetsCleaned, TEXT_STYLES.stat('#FFD700', 20)).setDepth(10);

        this.add.rectangle(W/2, 200, 400, 30, 0x000000, 0.6).setDepth(10);
        this.add.rectangle(W/2, 200, 400, 30, 0x333333).setDepth(10);
        this.progressBar = this.add.rectangle(W/2 - 200, 200, 0, 26, 0x00FF00).setOrigin(0, 0.5).setDepth(10);
        this.progressText = this.add.text(W/2, 200, '0%', TEXT_STYLES.stat('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);

        this.add.text(640, 40, '🛒', { fontSize: '48px' })
            .setDepth(10).setInteractive({ useHandCursor: true })
            .on('pointerdown', () => { this.shop.open(); });

        this.add.text(W/2, 1050, 'ПОЛУЧИТЬ ДЕНЬГИ', {
            ...TEXT_STYLES.button('#00FF00', 30),
            backgroundColor: '#000000', padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.finishCarpet());
    }

    refreshHUD() {
        this.moneyText.setText('💰 ' + this.state.money);
        this.foodText.setText('🍞 ' + this.state.food);
        this.toolText.setText('🧹 Радиус: ' + this.state.getCurrentRadius());
        this.carpetText.setText('🧽 Почищено: ' + this.state.carpetsCleaned);
    }

    buildToolButtons(W, H) {
        const btnY = 1200;
        const hasSwatter = this.state.carpetIndex >= 2;
        const soapX = hasSwatter ? 120 : 240;
        const washX = hasSwatter ? 360 : 480;
        const swatterX = 600;

        this.soapBtnBg = this.add.rectangle(soapX, btnY, 200, 80, 0x4A90D9).setDepth(10).setStrokeStyle(5, 0xFFFFFF);
        this.soapBtnText = this.add.text(soapX, btnY, '🧼 МЫЛО', TEXT_STYLES.button('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('soap'));

        this.washBtnBg = this.add.rectangle(washX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.washBtnText = this.add.text(washX, btnY, '💧 СМЫТЬ', TEXT_STYLES.button('#AAAAAA', 22)).setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('wash'));

        this.swatterBtnBg = this.add.rectangle(swatterX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.swatterBtnText = this.add.text(swatterX, btnY, '🪰 МУХОБОЙКА', TEXT_STYLES.button('#AAAAAA', 18)).setOrigin(0.5).setDepth(11);
        this.swatterBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('swatter'));

        this.swatterBtnBg.setVisible(hasSwatter);
        this.swatterBtnText.setVisible(hasSwatter);
    }

    selectTool(tool) {
        this.currentTool = tool;

        const setStyle = (bg, txt, active, activeColor = 0x4A90D9) => {
            if (active) { bg.setFillStyle(activeColor); bg.setStrokeStyle(5, 0xFFFFFF); txt.setColor('#FFFFFF'); }
            else { bg.setFillStyle(0x555555); bg.setStrokeStyle(5, 0x888888); txt.setColor('#AAAAAA'); }
        };

        setStyle(this.soapBtnBg, this.soapBtnText, tool === 'soap');
        setStyle(this.washBtnBg, this.washBtnText, tool === 'wash');
        setStyle(this.swatterBtnBg, this.swatterBtnText, tool === 'swatter', 0xFF4444);

        if (tool === 'soap') this.brush.setText('🧼');
        else if (tool === 'wash') this.brush.setText('🧹');
        else this.brush.setVisible(false);

        if (tool !== 'swatter') this.effects.hideSwatterCursor();
    }

    /* ---------- Ввод ---------- */
    setupInput() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });

        const handlePointer = (pointer) => {
            if (this.inputLocked || this.shop.isOpen) return;
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.brush.setVisible(false);
                return;
            }
            this.effects.hideSwatterCursor();
            this.brush.setPosition(pointer.x, pointer.y);
            const inBounds = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(inBounds);
            if (!inBounds) return;

            const localX = pointer.x - this.carpetBounds.x;
            const localY = pointer.y - this.carpetBounds.y;
            const dx = localX - this.lastLocalX;
            const dy = localY - this.lastLocalY;
            if (dx * dx + dy * dy < 64) return;
            this.lastLocalX = localX;
            this.lastLocalY = localY;
            this.applyTool(localX, localY);
        };

        this.input.on('pointerdown', (pointer) => {
            if (this.inputLocked || this.shop.isOpen) return;
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.effects.swatEffect(pointer.x, pointer.y);
                this.bugs.swat(pointer.x, pointer.y, this.time.now);
                return;
            }
            this.isPointerDown = true;
            this.lastLocalX = -9999; this.lastLocalY = -9999;
            handlePointer(pointer);
        });

        this.input.on('pointermove', (pointer) => {
            if (this.inputLocked || this.shop.isOpen) return;
            if (this.currentTool !== 'swatter') {
                this.brush.setPosition(pointer.x, pointer.y);
                this.brush.setVisible(Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y));
            }
            if (!pointer.isDown) { this.isPointerDown = false; return; }
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                return;
            }
            handlePointer(pointer);
        });

        const stop = () => {
            this.isPointerDown = false;
            this.effects.hideSwatterCursor();
            this.brush.setVisible(false);
            this.lastLocalX = -9999; this.lastLocalY = -9999;
        };
        this.input.on('pointerup', stop);
        this.input.on('pointerout', stop);
        this.input.on('pointerupoutside', stop);
        window.addEventListener('blur', stop);
        document.addEventListener('touchend', () => { this.effects.hideSwatterCursor(); }, { passive: true });
        document.addEventListener('mouseup', () => { this.effects.hideSwatterCursor(); });
    }

    applyTool(localX, localY) {
        if (this.shop.isOpen) return;
        if (this.state.food <= 0) { this.showNoFoodWarning(); return; }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }

        this.resetAutoCleanTimer();
        this.cleaning.applyStroke(localX, localY, this.state.getCurrentRadius(), this.currentTool);
    }

    /* ---------- Авто-очистка (последний %) ---------- */
    scheduleAutoClean() {
        if (this.autoCleanStarted || this.autoCleanPending) return;
        if (this.cleaning.progress < BALANCE.autoCleanThreshold) return;
        this.autoCleanPending = true;
        this.autoCleanIdleTimer = this.time.delayedCall(BALANCE.autoCleanIdleDelay, () => {
            this.autoCleanPending = false;
            this.autoCleanIdleTimer = null;
            if (this.cleaning.progress >= BALANCE.autoCleanThreshold && this.cleaning.progress < 1.0) {
                this.startAutoClean();
            }
        });
    }
    cancelAutoClean() {
        if (!this.autoCleanPending) return;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
    }
    startAutoClean() {
        if (this.autoCleanStarted) return;
        this.autoCleanStarted = true;
        this.showMessage('✨ Ковёр сам очищается...');

        const dirt = this.cleaning.dirt;
        const soap = this.cleaning.soap;
        const dirtyIndices = [];
        for (let i = 0; i < dirt.length; i++) if (dirt[i] > 0.01) dirtyIndices.push(i);

        if (dirtyIndices.length === 0) { this.cleaning.recalcProgress(); return; }

        const tickDelay = 50;
        const totalTicks = BALANCE.autoCleanDuration / tickDelay;
        const cellsPerTick = Math.max(1, Math.ceil(dirtyIndices.length / totalTicks));
        let index = 0;

        this.autoCleanTweenTimer = this.time.addEvent({
            delay: tickDelay,
            repeat: totalTicks,
            callback: () => {
                for (let i = 0; i < cellsPerTick && index < dirtyIndices.length; i++) {
                    dirt[dirtyIndices[index]] = 0;
                    soap[dirtyIndices[index]] = 0;
                    index++;
                }
                this.cleaning.needRedrawDirt = true;
                this.cleaning.needRedrawSoap = true;
                this.cleaning.recalcProgress();
                if (index >= dirtyIndices.length) {
                    if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }
                }
            }
        });
    }
    resetAutoCleanTimer() {
        this.cancelAutoClean();
        if (this.autoCleanStarted) return;
        this.scheduleAutoClean();
    }

    /* ---------- Финализация ковра ---------- */
    async finishCarpet() {
        if (this.shop.isOpen) return;
        if (this.cleaning.progress < 1.0) { this.showMessage('Ковёр ещё грязный! Нужно 100%.'); return; }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }

        this.unlockInput();
        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
        if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }

        const reward = this.state.addReward();
        this.refreshHUD();
        await this.saveSystem.save();
        this.showMessage(`+${reward} 💰!`);

        this.bugs.clear();
        this.cleaning.reset();
        this.updateProgressBar(0);

        this.time.delayedCall(50, () => {
            this.bugs.spawnForLevel(this.state.carpetIndex);
        });
    }

    /* ---------- Покупка ковра ---------- */
    async buyNewCarpet() {
        if (!this.state.buyNewCarpet()) return;
        this.unlockInput();
        this.shop.close();

        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
        if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }

        this.refreshHUD();
        this.drawRoom();
        this.drawCarpet();
        this.cleaning.reset();
        this.updateProgressBar(0);
        this.bugs.clear();

        if (this.state.carpetIndex >= 2) {
            this.swatterBtnBg.setVisible(true);
            this.swatterBtnText.setVisible(true);
            this.soapBtnBg.setX(120);  this.soapBtnText.setX(120);
            this.washBtnBg.setX(360);  this.washBtnText.setX(360);
        }

        await this.saveSystem.save();
        this.effects.celebration(720, 1280);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }

    /* ---------- Вспомогательные ---------- */
    unlockInput() {
        this.inputLocked = true;
        this.isPointerDown = false;
        this.lastLocalX = -9999; this.lastLocalY = -9999;
        this.brush.setVisible(false);
        this.effects.hideSwatterCursor();
        this.time.delayedCall(BALANCE.inputLockDuration, () => { this.inputLocked = false; });
    }

    updateProgressBar(p) {
        this.progressBar.width = 400 * p;
        this.progressText.setText(Math.min(100, Math.floor(p * 100)) + '%');
    }

    showNoFoodWarning() {
        if (this.noFoodCooldown) return;
        this.noFoodCooldown = true;
        if (this.noFoodText) {
            if (this.noFoodTween) this.noFoodTween.remove();
            this.noFoodText.destroy(); this.noFoodText = null;
        }
        this.noFoodText = this.add.text(360, 640, '🍞 НЕТ ЕДЫ!\nКУПИ В МАГАЗИНЕ', {
            fontSize: '52px', fill: '#FF0000', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(50);
        this.noFoodTween = this.tweens.add({
            targets: this.noFoodText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.noFoodText) { this.noFoodText.destroy(); this.noFoodText = null; }
                this.noFoodTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.noFoodCooldown = false; });
    }

    showBugWarning() {
        if (this.bugWarningCooldown) return;
        this.bugWarningCooldown = true;
        if (this.bugWarningText) {
            if (this.bugWarningTween) this.bugWarningTween.remove();
            this.bugWarningText.destroy(); this.bugWarningText = null;
        }
        this.bugWarningText = this.add.text(360, 640, '🐛 СНАЧАЛА УБЕРИ ЖУКОВ!\n(мухобойка 🪰)', {
            fontSize: '42px', fill: '#FF4444', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(50);
        this.bugWarningTween = this.tweens.add({
            targets: this.bugWarningText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.bugWarningText) { this.bugWarningText.destroy(); this.bugWarningText = null; }
                this.bugWarningTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.bugWarningCooldown = false; });
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            ...TEXT_STYLES.message('#FFFF00', 26),
            backgroundColor: '#000000', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(2200, () => msg.destroy());
    }

    /* ---------- Отрисовка комнаты и ковра ---------- */
    drawRoom() {
        const W = 720, H = 1280;
        const level = this.state.carpetLevel;
        const g = this.roomGfx;
        g.clear();
        const isCozy = (level % 2 === 0);
        if (isCozy) {
            const wallColors = [0xE8D5B7, 0xD4B896, 0xC9A87C, 0xB89A6A, 0xA8895A];
            const wallColor = wallColors[level % wallColors.length];
            g.fillStyle(wallColor, 1); g.fillRect(0, 0, W, 900);
            for (let x = 0; x < W; x += 60) { g.fillStyle(0x000000, 0.05); g.fillRect(x, 0, 30, 900); }
            g.fillStyle(0x8B5A2B, 1); g.fillRect(0, 900, W, H - 900);
            for (let y = 900; y < H; y += 40) { g.fillStyle(0x000000, 0.15); g.fillRect(0, y, W, 3); }
            for (let x = 0; x < W; x += 100) { g.fillStyle(0x000000, 0.1); g.fillRect(x, 900, 2, H - 900); }
            g.fillStyle(0x5C3A1E, 1); g.fillRect(0, 880, W, 20);
            g.fillStyle(0xFFFFFF, 1); g.fillRect(80, 150, 200, 250);
            g.lineStyle(8, 0x5C3A1E, 1); g.strokeRect(80, 150, 200, 250);
            g.fillStyle(0x5C3A1E, 1); g.fillRect(175, 150, 10, 250); g.fillRect(80, 270, 200, 10);
            g.fillStyle(0xFFEB3B, 0.8); g.fillCircle(240, 200, 35);
            g.fillStyle(0x8B4513, 1); g.fillRect(480, 200, 150, 120);
            g.fillStyle(0x87CEEB, 1); g.fillRect(490, 210, 130, 100);
        } else {
            const colors = [0x2C3E50, 0x34495E, 0x1A252F, 0x3D5A80, 0x293241];
            const wallColor = colors[level % colors.length];
            g.fillStyle(wallColor, 1); g.fillRect(0, 0, W, 900);
            g.fillStyle(0x00E5FF, 0.5); g.fillRect(0, 400, W, 4);
            g.fillStyle(0xFF00E5, 0.5); g.fillRect(0, 500, W, 4);
            g.fillStyle(0x1a1a1a, 1); g.fillRect(0, 900, W, H - 900);
            g.lineStyle(3, 0x00E5FF, 0.6); g.strokeCircle(600, 250, 80);
            g.lineStyle(3, 0xFF00E5, 0.6); g.strokeRect(100, 180, 120, 120);
            g.fillStyle(0x000000, 1); g.fillRect(0, 880, W, 20);
        }
    }

    drawCarpet() {
        this.carpetContainer.removeAll(true);
        const carpetKey = 'carpet' + this.state.carpetIndex;
        if (this.textures.exists(carpetKey)) {
            const img = this.add.image(this.carpetX, this.carpetY, carpetKey);
            img.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetContainer.add(img);
        } else {
            const g = this.add.graphics();
            const cx = this.carpetX - this.carpetW / 2;
            const cy = this.carpetY - this.carpetH / 2;
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(this.state.carpetIndex - 1) % palettes.length];
            g.fillStyle(p.main, 1); g.fillRect(cx, cy, this.carpetW, this.carpetH);
            g.lineStyle(20, p.border, 1); g.strokeRect(cx + 10, cy + 10, this.carpetW - 20, this.carpetH - 20);
            g.lineStyle(4, p.accent, 0.7);
            for (let i = 0; i < 3; i++) {
                const size = 100 - i * 30;
                g.beginPath();
                g.moveTo(this.carpetX, this.carpetY - size);
                g.lineTo(this.carpetX + size, this.carpetY);
                g.lineTo(this.carpetX, this.carpetY + size);
                g.lineTo(this.carpetX - size, this.carpetY);
                g.closePath(); g.strokePath();
            }
            g.fillStyle(p.accent, 1);
            g.fillCircle(cx + 50, cy + 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + 50, 12);
            g.fillCircle(cx + 50, cy + this.carpetH - 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + this.carpetH - 50, 12);
            this.carpetContainer.add(g);
        }
    }

    /* ---------- UPDATE ---------- */
    update(_, delta) {
        if (this.shop.isOpen) return;      // жуки на паузе
        this.cleaning.draw();
        this.bugs.update(delta);
    }
}

/* ============================================================
   11. SIMULATOR — вызывай __simulate() в консоли
   ============================================================ */
function simulateRun(verbose = true) {
    const s = new GameState();
    const log = [];
    let minute = 0;
    const MIN_PER_CARPET = 1;
    const MAX_CARPETS = 100;

    for (let i = 0; i < MAX_CARPETS; i++) {
        if (s.food <= 0) {
            if (s.money >= BALANCE.foodPrice) { s.money -= BALANCE.foodPrice; s.food += 1; }
            else {
                log.push({ minute, event: 'STUCK', reason: 'no food, no money', money: s.money });
                break;
            }
        }
        const reward = s.addReward();
        minute += MIN_PER_CARPET;

        let guard = 0;
        while (guard++ < 20) {
            const needR = s.getRequiredRadius();
            const curR = s.getCurrentRadius();
            const carpetPrice = s.getNewCarpetPrice();
            const toolPrice = s.getToolUpgradePrice();
            const radiusOk = curR >= needR;
            const hasNext = s.carpetIndex < BALANCE.totalCarpets;

            if (hasNext && radiusOk && s.money >= carpetPrice) {
                s.buyNewCarpet();
                log.push({
                    minute, event: 'NEW_CARPET', carpet: s.carpetIndex, level: s.carpetLevel,
                    toolLevel: s.toolLevel, radius: s.getCurrentRadius(),
                    money: s.money, food: s.food, reward
                });
                break;
            }
            if (!radiusOk && s.money >= toolPrice) { s.upgradeTool(); continue; }
            if (s.food < 5 && s.money >= BALANCE.foodPrice * 3) {
                s.money -= BALANCE.foodPrice; s.food += 1; continue;
            }
            break;
        }

        if (s.carpetIndex >= BALANCE.totalCarpets && s.getCurrentRadius() >= s.getRequiredRadius()) {
            log.push({ minute, event: 'FINISH', carpet: s.carpetIndex, money: s.money, food: s.food });
            break;
        }
    }

    if (verbose) {
        console.log('%c=== СИМУЛЯЦИЯ ПРОХОЖДЕНИЯ ===', 'color:#0f0;font-weight:bold');
        console.table(log);
        const finish = log.find(l => l.event === 'FINISH' || (l.event === 'NEW_CARPET' && l.carpet === BALANCE.totalCarpets));
        if (finish) console.log(`%cДошёл до 5-го ковра за ~${finish.minute} минут`, 'color:#ff0;font-weight:bold');
    }
    return log;
}

function printBalance() {
    console.log('%c=== КРИВАЯ ДОХОДА ===', 'color:#0ff;font-weight:bold');
    const s = new GameState();
    const rows = [];
    for (let lvl = 0; lvl < BALANCE.totalCarpets; lvl++) {
        s.carpetLevel = lvl;
        for (let t = 1; t <= 14; t += 2) {
            s.toolLevel = t;
            const mult = s.getRewardMultiplier() * s.getToolMoneyMultiplier();
            rows.push({
                carpetLevel: lvl, toolLevel: t,
                radius: s.getCurrentRadius(),
                avgReward: Math.round((BALANCE.rewardMin + BALANCE.rewardMax) / 2 * mult),
                multiplier: mult.toFixed(2)
            });
        }
    }
    console.table(rows);
}

window.__simulate = simulateRun;
window.__balance = printBalance;

/* ============================================================
   12. BOOT
   ============================================================ */
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
    setTimeout(() => {
        console.log('💡 Вызови __simulate() для прогона 100 ковров или __balance() для таблицы дохода');
    }, 1000);
});
</script>
