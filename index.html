function loc(obj) {
    if (obj == null) return '';
    if (typeof obj === 'string') return obj;
    return obj[LANG] || obj.ru || '';
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let LANG = 'ru';
function detectLang(ysdk) {
    try {
        const lang = ysdk?.environment?.i18n?.lang;
        if (lang && I18N[lang]) return lang;
        if (lang && ['uk', 'be', 'kk', 'ky', 'uz'].includes(lang)) return 'ru';
        if (lang) return 'en';
    } catch {}
    try {
        const nav = (navigator.language || 'ru').slice(0, 2).toLowerCase();
        if (I18N[nav]) return nav;
        if (['uk', 'be', 'kk'].includes(nav)) return 'ru';
    } catch {}
    return 'ru';
}
function t(key, ...args) {
    const dict = I18N[LANG] || I18N.ru;
    let s = dict[key] !== undefined ? dict[key] : (I18N.ru[key] !== undefined ? I18N.ru[key] : key);
    for (let i = 0; i < args.length; i++) s = s.replace('{' + i + '}', args[i]);
    return s;
}
function tArr(key) {
    const dict = I18N[LANG] || I18N.ru;
    const arr = dict[key] || I18N.ru[key];
    return Array.isArray(arr) ? arr : [key];
}

function formatTime(sec) {
    if (!sec || sec <= 0 || sec > 99999) return '—';
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}
function todayKey() {
    const d = new Date();
    return `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
}
function getTimeOfDay() {
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return 'morning';
    if (h >= 11 && h < 17) return 'day';
    if (h >= 17 && h < 22) return 'evening';
    return 'night';
}

function makePill(scene, x, y, w, h, opts = {}) {
    const r = opts.radius ?? Math.min(w, h) / 2;
    const cont = scene.add.container(x, y).setDepth(opts.depth ?? 10);
    const g = scene.add.graphics();
    cont.add(g);
    const hit = scene.add.rectangle(0, 0, w, h, 0x000000, 0.001);
    hit.setInteractive({ useHandCursor: true });
    cont.add(hit);
    const api = {
        cont, g, hit, w, h, r,
        _fill: opts.fill ?? 0x444444, _stroke: opts.stroke ?? 0x888888, _strokeW: opts.strokeW ?? 4,
        redraw(fill, stroke, strokeW) {
            if (fill !== undefined) api._fill = fill;
            if (stroke !== undefined) api._stroke = stroke;
            if (strokeW !== undefined) api._strokeW = strokeW;
            g.clear();
            g.fillStyle(api._fill, 1);
            g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
            if (api._strokeW > 0) { g.lineStyle(api._strokeW, api._stroke, 1); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r); }
        },
        press() {
            scene.tweens.killTweensOf(cont); cont.setScale(1);
            scene.tweens.add({ targets: cont, scaleX: 1.08, scaleY: 1.08, duration: 90, yoyo: true, ease: 'Quad.easeOut' });
        },
        tap() {
            scene.tweens.killTweensOf(cont); cont.setScale(1);
            scene.tweens.add({ targets: cont, scaleX: 0.92, scaleY: 0.92, duration: 70, yoyo: true, ease: 'Quad.easeOut' });
        }
    };
    api.redraw();
    return api;
}

class AmbientMusic {
    constructor() {
        this.ctx = null; this.master = null; this.bus = null;
        this.enabled = true; this._playing = false;
        this._chordTimer = null; this._chimeTimer = null; this._chordIdx = 0;
        this._chords = [
            [220.00, 261.63, 329.63], [174.61, 220.00, 261.63],
            [130.81, 164.81, 196.00], [196.00, 246.94, 293.66]
        ];
        this._chimeScale = [523.25, 587.33, 659.25, 783.99, 880.00];
    }
    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.0;
            const lp = this.ctx.createBiquadFilter();
            lp.type = 'lowpass'; lp.frequency.value = 1000; lp.Q.value = 0.3;
            const dly = this.ctx.createDelay(); dly.delayTime.value = 0.28;
            const fb = this.ctx.createGain(); fb.gain.value = 0.28;
            const wet = this.ctx.createGain(); wet.gain.value = 0.35;
            lp.connect(dly); dly.connect(fb); fb.connect(dly);
            dly.connect(wet); wet.connect(this.master);
            lp.connect(this.master);
            this.bus = lp;
            this.master.connect(this.ctx.destination);
        } catch {}
    }
        resume() {
        try {
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                const p = this.ctx.resume();
                if (p && p.then) {
                    p.then(() => {
                        if (this.enabled && !this._playing) this.start();
                    }).catch(() => {});
                }
            } else if (this.enabled && !this._playing) {
                this.start();
            }
        } catch {}
    }
    _playNote(freq, dur, type = 'sine', vol = 0.1) {
        if (!this.ctx || !this.bus) return;
        const t = this.ctx.currentTime;
        const o1 = this.ctx.createOscillator(); o1.type = type; o1.frequency.value = freq;
        const o2 = this.ctx.createOscillator(); o2.type = type; o2.frequency.value = freq * 1.004;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + dur * 0.35);
        g.gain.linearRampToValueAtTime(0, t + dur);
        o1.connect(g); o2.connect(g); g.connect(this.bus);
        o1.start(t); o2.start(t);
        o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
    }
    start() {
        if (!this.ctx || this._playing || !this.enabled) return;
        this._playing = true;
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setValueAtTime(this.master.gain.value, t);
        this.master.gain.linearRampToValueAtTime(BALANCE.musicVolume, t + 3);
        this._scheduleChord(); this._scheduleChime();
    }
    stop() {
        this._playing = false;
        clearTimeout(this._chordTimer); clearTimeout(this._chimeTimer);
        if (this.master && this.ctx) {
            const t = this.ctx.currentTime;
            this.master.gain.cancelScheduledValues(t);
            this.master.gain.setValueAtTime(this.master.gain.value, t);
            this.master.gain.linearRampToValueAtTime(0, t + 1);
        }
    }
    setEnabled(v) { this.enabled = !!v; if (v) this.start(); else this.stop(); }
    _scheduleChord() {
        if (!this._playing) return;
        const chord = this._chords[this._chordIdx % this._chords.length];
        this._chordIdx++;
        chord.forEach((f, i) => setTimeout(() => this._playNote(f, 5.5, 'sine', 0.08), i * 220));
        chord.forEach(f => setTimeout(() => this._playNote(f * 2, 5.5, 'sine', 0.025), 100));
        this._chordTimer = setTimeout(() => this._scheduleChord(), 5000);
    }
    _scheduleChime() {
        if (!this._playing) return;
        const f = this._chimeScale[Math.floor(Math.random() * this._chimeScale.length)];
        this._playNote(f, 2.5, 'triangle', 0.045);
        this._chimeTimer = setTimeout(() => this._scheduleChime(), 3500 + Math.random() * 4500);
    }
}

class Mascot {
    constructor(scene) {
        this.scene = scene;
        this.x = 640; this.y = 1020;
        this.container = scene.add.container(this.x, this.y).setDepth(50);
        this._buildKitten();
        this._buildHitZone();
        this.bubble = null;
        this._idleTimer = null;
        this._cooldownKeys = {};
        this._lastTap = 0;
        this._scheduleIdle();
    }
    _buildKitten() {
        const g = this.scene.add.graphics();
        g.fillStyle(0xF3A44B, 1); g.fillEllipse(0, 22, 72, 60);
        g.fillStyle(0xFFE5C2, 1); g.fillEllipse(0, 28, 40, 36);
        g.fillStyle(0xF3A44B, 1); g.fillCircle(0, -12, 38);
        g.fillStyle(0xF3A44B, 1);
        g.fillTriangle(-34, -30, -18, -60, -6, -34);
        g.fillTriangle( 34, -30,  18, -60,  6, -34);
        g.fillStyle(0xFFC9A0, 1);
        g.fillTriangle(-30, -33, -18, -52, -10, -35);
        g.fillTriangle( 30, -33,  18, -52,  10, -35);
        g.fillStyle(0x1A1A1A, 1);
        g.fillCircle(-13, -14, 4.5); g.fillCircle(13, -14, 4.5);
        g.fillStyle(0xFFFFFF, 1);
        g.fillCircle(-12, -15, 1.6); g.fillCircle(14, -15, 1.6);
        g.fillStyle(0xFF7A7A, 1); g.fillTriangle(-3, -2, 3, -2, 0, 2);
        g.lineStyle(1.5, 0x1A1A1A, 1);
        g.beginPath(); g.moveTo(0, 2); g.lineTo(-4, 6); g.moveTo(0, 2); g.lineTo(4, 6); g.strokePath();
        g.lineStyle(1.2, 0x1A1A1A, 0.8);
        g.lineBetween(-30, -6, -12, -3); g.lineBetween(-30, 2, -12, 0);
        g.lineBetween( 30, -6,  12, -3); g.lineBetween( 30, 2,  12, 0);
        g.fillStyle(0xF3A44B, 1);
        g.fillEllipse(-18, 46, 22, 16); g.fillEllipse(18, 46, 22, 16);
        this.container.add(g);
        this.scene.tweens.add({ targets: this.container, y: this.y - 4, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
    _buildHitZone() {
        const hit = this.scene.add.circle(this.x, this.y, 60, 0x000000, 0.001)
            .setDepth(49)
            .setInteractive({ useHandCursor: true });
        hit.on('pointerdown', () => this._onTap());
        this.hitZone = hit;
    }
    _onTap() {
        const now = Date.now();
        if (now - this._lastTap < 350) return;
        this._lastTap = now;

        // Анимация «поглаживания»
        this.scene.tweens.killTweensOf(this.container);
        this.scene.tweens.add({
            targets: this.container,
            scaleX: 1.12, scaleY: 0.88,
            duration: 130, yoyo: true, ease: 'Quad.easeOut',
            onComplete: () => {
                this.scene.tweens.add({ targets: this.container, scaleX: 1, scaleY: 1, duration: 120 });
            }
        });

        // Реплика при поглаживании
        const pool = tArr('m_pet');
        this.say(pick(pool), 2400);
    }
    say(text, ms = 3200) {
        if (!text) return;
        if (this.bubble) { try { this.bubble.destroy(); } catch {} this.bubble = null; }
        const bx = this.x - 200, by = this.y - 80;
        const bubble = this.scene.add.container(bx, by).setDepth(51);
        const bg = this.scene.add.graphics();
        bg.fillStyle(0xFFFFFF, 0.96);
        bg.fillRoundedRect(-160, -46, 220, 70, 18);
        bg.lineStyle(3, 0x4A90D9, 1);
        bg.strokeRoundedRect(-160, -46, 220, 70, 18);
        bg.fillStyle(0xFFFFFF, 0.96);
        bg.fillTriangle(40, 20, 74, 40, 40, 40);
        bubble.add(bg);
        const txt = this.scene.add.text(-50, -10, text, {
            fontSize: '22px', fill: '#1A1A1A', fontFamily: FONT_HAND,
            fontStyle: 'bold', align: 'center', wordWrap: { width: 200 }
        }).setOrigin(0.5);
        bubble.add(txt);
        bubble.setAlpha(0).setScale(0.85);
        this.bubble = bubble;
        this.scene.tweens.add({ targets: bubble, alpha: 1, scaleX: 1, scaleY: 1, duration: 220, ease: 'Back.easeOut' });
        this.scene.time.delayedCall(ms, () => {
            if (!bubble.active) return;
            this.scene.tweens.add({ targets: bubble, alpha: 0, scaleX: 0.9, scaleY: 0.9, duration: 250,
                onComplete: () => { try { bubble.destroy(); } catch {} if (this.bubble === bubble) this.bubble = null; } });
        });
    }
    react(key, ms = 3000) {
        const now = Date.now();
        if (now - (this._cooldownKeys[key] || 0) < 5000) return;
        this._cooldownKeys[key] = now;
        const pool = tArr('m_' + key);
        this.say(pick(pool), ms);
    }
    _scheduleIdle() {
        const loop = () => {
            if (!this.bubble) this.say(pick(tArr('m_idle')), 2600);
            this._idleTimer = setTimeout(loop, 22000 + Math.random() * 20000);
        };
        this._idleTimer = setTimeout(loop, 30000);
    }
}

class GameState {
    constructor() {
        this.money = BALANCE.startMoney;
        this.food = BALANCE.startFood;
        this.toolLevel = BALANCE.startToolLevel;
        this.soapLevel = 1; this.washLevel = 1; this.swatterLevel = 0;
        this.carpetIndex = 1; this.carpetLevel = 0;
        this.carpetsCleaned = 0; this.bugsKilledTotal = 0; this.starsPopped = 0;
        this.maxMoney = 0; this.autoFoodEnabled = false;
        this.prestigeLevel = 0; this.legacyPoints = 0; this.legacyUpgrades = {};
        this.carpetStats = {};
        for (let i = 1; i <= BALANCE.totalCarpets; i++) this.carpetStats[i] = { cleanings: 0, bestTime: 0, tutorialDone: false };
        this.doubleBugReward = false;
        this.selectedRoom = 'classic'; this.selectedBrush = 'classic';
        this.unlockedRooms = ['classic']; this.unlockedBrushes = ['classic'];
        this.achievements = {}; this.questDate = ''; this.quests = [];
        this.questProgress = {}; this.questClaimed = {};
        this.questCounters = { cleanToday: 0, killBugsToday: 0, fastCleanToday: 0, soapUsesToday: 0, moneyEarnedToday: 0, petActionsToday: 0, starsToday: 0 };
        this.lastAdTime = 0; this.tutorialDone = false;
        this.pets = { cat: { owned: false, level: 1 }, dog: { owned: false, level: 1 }, hamster: { owned: false, level: 1 }, parrot: { owned: false, level: 1 } };
        this.settings = { vibration: true, lang: null, music: true };
        this.dailyBonus = { lastClaimDate: '', streakDay: 0 };
        this.leaderboardBestMoney = 0; this.leaderboardBestPrestige = 0;
    }
    getCurrentRadius() {
        const legacyBonus = (this.legacyUpgrades.brush_master || 0) * 5;
        return Math.floor(BALANCE.brushRadius * (1 + (this.toolLevel - 1) * BALANCE.toolRadiusBonus)) + legacyBonus;
    }
    getRewardMultiplier() {
        let m = Math.pow(BALANCE.rewardMultiplierPerCarpet, this.carpetLevel);
        if (this.pets.parrot.owned) m *= (1 + this.getParrotBonus());
        return m;
    }
    getToolMoneyMultiplier() { return 1 + (this.toolLevel - 1) * BALANCE.toolMoneyBonus; }
    getRequiredRadius() { return BALANCE.newCarpetRadiusRequired + this.carpetLevel * BALANCE.newCarpetRadiusIncrease; }
    getNewCarpetPrice() { return BALANCE.newCarpetBasePrice * this.carpetIndex; }
    getAutoFoodPrice() { return BALANCE.autoFoodBasePrice + this.carpetLevel * BALANCE.autoFoodPriceIncrease; }
    getToolUpgradePrice() { return this.toolLevel * BALANCE.toolBasePrice; }
    getSoapUpgradePrice() { return this.soapLevel * BALANCE.soapBasePrice; }
    getWashUpgradePrice() { return this.washLevel * BALANCE.washBasePrice; }
    getSwatterUpgradePrice() { return BALANCE.swatterBasePrice + this.swatterLevel * BALANCE.swatterBasePrice; }
    getSoapPower() {
        const base = BALANCE.soapPower * (1 + (this.soapLevel - 1) * 0.40);
        return base * (1 + (this.legacyUpgrades.soap_master || 0) * 0.25);
    }
    getWashStrength() {
        const base = BALANCE.washStrength * (1 + (this.washLevel - 1) * 0.35);
        return base * (1 + (this.legacyUpgrades.wash_master || 0) * 0.25);
    }
    getSwatterCooldown() { return Math.max(BALANCE.swatterCooldownMin, BALANCE.swatterCooldown - this.swatterLevel * BALANCE.swatterCooldownStep); }
    getSwatterRadius() { return BALANCE.swatterRadius + this.swatterLevel * BALANCE.swatterRadiusStep; }
    getSwatterRewardBonus() { return this.swatterLevel * BALANCE.swatterBonusPerLevel; }
    getPrestigeMultiplier() {
        let mult = BALANCE.prestigeMultiplier;
        if (this.legacyUpgrades.double_income) mult = 2.0;
        if (this.legacyUpgrades.gods_legacy) mult = 3.0;
        return Math.pow(mult, this.prestigeLevel);
    }
    getPrestigeTitle() {
        const titles = LANG === 'ru' ? ['Новичок','Профи','Мастер','Гуру ковров','Легенда'] : ['Novice','Pro','Master','Carpet Guru','Legend'];
        return titles[Math.min(this.prestigeLevel, titles.length - 1)];
    }
    getPetsOwned() { return Object.values(this.pets).filter(p => p.owned).length; }
    getDayNightBonus() {
        const t = getTimeOfDay();
        if (t === 'night') return BALANCE.dayNightBonus * 1.5;
        if (t === 'morning') return BALANCE.dayNightBonus;
        if (t === 'evening') return BALANCE.dayNightBonus * 0.8;
        return 0;
    }
    getCatInterval() { const l = this.pets.cat.level; return BALANCE.petCatIntervalMs * Math.max(0.15, 1 - (l - 1) * BALANCE.petCatSpeedStep); }
    getCatCellsPerAction() { const l = this.pets.cat.level; return BALANCE.petCatCountBase + (l - 1) * BALANCE.petCatCountPerLevel; }
    getDogInterval() { const l = this.pets.dog.level; return BALANCE.petDogIntervalMs * Math.max(0.15, 1 - (l - 1) * BALANCE.petDogSpeedStep); }
    getDogBugsPerAction() { const l = this.pets.dog.level; return BALANCE.petDogCountBase + (l - 1) * BALANCE.petDogCountPerLevel; }
    getHamsterInterval() { const l = this.pets.hamster.level; return BALANCE.petHamsterIntervalMs * Math.max(0.15, 1 - (l - 1) * BALANCE.petHamsterSpeedStep); }
    getHamsterFoodPerAction() { const l = this.pets.hamster.level; return BALANCE.petHamsterCountBase + (l - 1) * BALANCE.petHamsterCountPerLevel; }
    getParrotBonus() { const l = this.pets.parrot.level; return BALANCE.petParrotBonus + (l - 1) * BALANCE.petParrotBonusPerLevel; }
    getPetUpgradeCost(id) {
        const pet = this.pets[id];
        if (!pet || !pet.owned) return 0;
        if (pet.level >= BALANCE.petMaxLevel) return Infinity;
        const def = PETS.find(p => p.id === id);
        return (def ? def.foodBase : BALANCE.petUpgradeCostStep) + (pet.level - 1) * BALANCE.petUpgradeCostStep;
    }
    canUpgradePet(id) {
        const pet = this.pets[id];
        if (!pet || !pet.owned) return false;
        if (pet.level >= BALANCE.petMaxLevel) return false;
        return this.food >= this.getPetUpgradeCost(id);
    }
    upgradePet(id) {
        if (!this.canUpgradePet(id)) return false;
        this.food -= this.getPetUpgradeCost(id);
        this.pets[id].level += 1; return true;
    }
    getLegacyUpgradeLevel(id) { return this.legacyUpgrades[id] || 0; }
    getLegacyUpgradeCost(id) {
        const def = LEGACY_UPGRADES.find(u => u.id === id);
        if (!def) return Infinity;
        const lvl = this.getLegacyUpgradeLevel(id);
        if (lvl >= def.maxLevel) return Infinity;
        return def.cost * (lvl + 1);
    }
    canBuyLegacy(id) {
        const def = LEGACY_UPGRADES.find(u => u.id === id);
        if (!def) return false;
        if (this.getLegacyUpgradeLevel(id) >= def.maxLevel) return false;
        return this.legacyPoints >= this.getLegacyUpgradeCost(id);
    }
    buyLegacy(id) {
        if (!this.canBuyLegacy(id)) return false;
        this.legacyPoints -= this.getLegacyUpgradeCost(id);
        this.legacyUpgrades[id] = (this.legacyUpgrades[id] || 0) + 1; return true;
    }
    getLegacyUpgradesBought() { let c = 0; for (const id in this.legacyUpgrades) c += this.legacyUpgrades[id]; return c; }
    canPrestige() { return this.carpetIndex >= BALANCE.totalCarpets; }
    prestige() {
        if (!this.canPrestige()) return false;
        this.prestigeLevel += 1;
        const gain = this.prestigeLevel === 1 ? BALANCE.legacyPerPrestige1 : BALANCE.legacyPerPrestigeN;
        this.legacyPoints += gain;
        this.money = 0; this.food = BALANCE.startFood; this.toolLevel = BALANCE.startToolLevel;
        if (this.legacyUpgrades.jump_start) { this.carpetIndex = 3; this.carpetLevel = 2; }
        else if (this.legacyUpgrades.fast_start) { this.carpetIndex = 2; this.carpetLevel = 1; }
        else { this.carpetIndex = 1; this.carpetLevel = 0; }
        this.autoFoodEnabled = false;
        if (!this.legacyUpgrades.pet_friends) {
            this.pets = { cat: { owned: false, level: 1 }, dog: { owned: false, level: 1 }, hamster: { owned: false, level: 1 }, parrot: { owned: false, level: 1 } };
        }
        if (this.prestigeLevel > this.leaderboardBestPrestige) this.leaderboardBestPrestige = this.prestigeLevel;
        return gain;
    }
    recordCarpetFinish(carpetIndex, timeSec) {
        if (!this.carpetStats[carpetIndex]) this.carpetStats[carpetIndex] = { cleanings: 0, bestTime: 0, tutorialDone: false };
        const st = this.carpetStats[carpetIndex];
        st.cleanings += 1;
        if (timeSec > 0 && (st.bestTime === 0 || timeSec < st.bestTime)) st.bestTime = timeSec;
    }
    addReward(timeSec = 0) {
        const base = Math.floor(BALANCE.rewardMin + Math.random() * (BALANCE.rewardMax - BALANCE.rewardMin));
        const dayNight = 1 + this.getDayNightBonus();
        const legacyMoneyMult = 1 + (this.legacyUpgrades.money_flow || 0) * 0.15;
        const reward = Math.floor(base * this.getRewardMultiplier() * this.getToolMoneyMultiplier() * this.getPrestigeMultiplier() * dayNight * legacyMoneyMult);
        this.money += reward;
        if (this.money > this.maxMoney) this.maxMoney = this.money;
        if (this.maxMoney > this.leaderboardBestMoney) this.leaderboardBestMoney = this.maxMoney;
        if (!this.autoFoodEnabled) this.food -= 1;
        this.carpetsCleaned += 1;
        this.questCounters.cleanToday += 1;
        this.questCounters.moneyEarnedToday += reward;
        if (timeSec > 0 && timeSec < 50) this.questCounters.fastCleanToday += 1;
        this.recordCarpetFinish(this.carpetIndex, timeSec);
        return reward;
    }
    addMoney(amount) {
        this.money += amount;
        if (this.money > this.maxMoney) this.maxMoney = this.money;
        if (this.maxMoney > this.leaderboardBestMoney) this.leaderboardBestMoney = this.maxMoney;
    }
    registerBugKill() { this.bugsKilledTotal += 1; this.questCounters.killBugsToday += 1; }
    registerSoapUse(n = 1) { this.questCounters.soapUsesToday += n; }
    registerPetAction() { this.questCounters.petActionsToday += 1; }
    registerStarPopped(n = 1) { this.starsPopped += n; this.questCounters.starsToday += n; }
    canBuyNewCarpet() {
        return this.getCurrentRadius() >= this.getRequiredRadius() && this.money >= this.getNewCarpetPrice() && this.carpetIndex < BALANCE.totalCarpets;
    }
    buyNewCarpet() {
        if (!this.canBuyNewCarpet()) return false;
        this.money = 0; this.food = BALANCE.startFood;
        this.carpetIndex += 1; this.carpetLevel += 1; return true;
    }
    upgradeTool() { const p = this.getToolUpgradePrice(); if (this.money < p) return false; this.money -= p; this.toolLevel += 1; return true; }
    upgradeSoap() { const p = this.getSoapUpgradePrice(); if (this.money < p) return false; this.money -= p; this.soapLevel += 1; return true; }
    upgradeWash() { const p = this.getWashUpgradePrice(); if (this.money < p) return false; this.money -= p; this.washLevel += 1; return true; }
    upgradeSwatter() { const p = this.getSwatterUpgradePrice(); if (this.money < p) return false; this.money -= p; this.swatterLevel += 1; return true; }
    buyDoubleBug() {
        if (this.doubleBugReward) return false;
        if (this.money < BALANCE.doubleBugPrice) return false;
        this.money -= BALANCE.doubleBugPrice; this.doubleBugReward = true; return true;
    }
    buyFood() { if (this.money < BALANCE.foodPrice) return false; this.money -= BALANCE.foodPrice; this.food += 1; return true; }
    buyFoodBulk() {
        const total = Math.floor(BALANCE.foodPrice * BALANCE.foodBulkCount * BALANCE.foodBulkDiscount);
        if (this.money < total) return false;
        this.money -= total; this.food += BALANCE.foodBulkCount; return true;
    }
    buyAutoFood() {
        if (this.autoFoodEnabled) return false;
        const p = this.getAutoFoodPrice();
        if (this.money < p) return false;
        this.money -= p; this.autoFoodEnabled = true; return true;
    }
    buyPet(id) {
        if (!this.pets[id] || this.pets[id].owned) return false;
        const pet = PETS.find(p => p.id === id);
        if (!pet || this.money < pet.price) return false;
        this.money -= pet.price; this.pets[id].owned = true; return true;
    }
    buyRoomSkin(id) {
        const skin = ROOM_SKINS.find(s => s.id === id);
        if (!skin || this.unlockedRooms.includes(id) || this.money < skin.price) return false;
        this.money -= skin.price; this.unlockedRooms.push(id); return true;
    }
    selectRoomSkin(id) { if (!this.unlockedRooms.includes(id)) return false; this.selectedRoom = id; return true; }
    buyBrushSkin(id) {
        const skin = BRUSH_SKINS.find(s => s.id === id);
        if (!skin || this.unlockedBrushes.includes(id) || this.money < skin.price) return false;
        this.money -= skin.price; this.unlockedBrushes.push(id); return true;
    }
    selectBrushSkin(id) { if (!this.unlockedBrushes.includes(id)) return false; this.selectedBrush = id; return true; }
    getBrushIcon() { const s = BRUSH_SKINS.find(b => b.id === this.selectedBrush); return s ? s.icon : '🧼'; }
    getAchievementValue(type) {
        switch (type) {
            case 'carpetsCleaned': return this.carpetsCleaned;
            case 'maxMoney': return this.maxMoney;
            case 'bugsKilledTotal': return this.bugsKilledTotal;
            case 'starsPopped': return this.starsPopped;
            case 'bestTime': { let best = 99999; for (const k in this.carpetStats) { const tt = this.carpetStats[k].bestTime; if (tt > 0 && tt < best) best = tt; } return best; }
            case 'prestigeLevel': return this.prestigeLevel;
            case 'soapLevel': return this.soapLevel;
            case 'washLevel': return this.washLevel;
            case 'swatterLevel': return this.swatterLevel;
            case 'roomsUnlocked': return this.unlockedRooms.length;
            case 'brushesUnlocked': return this.unlockedBrushes.length;
            case 'petsOwned': return this.getPetsOwned();
            case 'maxPetLevel': { let maxLvl = 0; for (const id of ['cat','dog','hamster','parrot']) { if (this.pets[id] && this.pets[id].level > maxLvl) maxLvl = this.pets[id].level; } return maxLvl; }
            case 'dailyStreak': return this.dailyBonus.streakDay;
            case 'legacyUpgradesBought': return this.getLegacyUpgradesBought();
            default: return 0;
        }
    }
    checkAchievements() {
        const unlocked = [];
        for (const a of ACHIEVEMENTS) {
            if (this.achievements[a.id]) continue;
            const val = this.getAchievementValue(a.type);
            const ok = a.type === 'bestTime' ? (val <= a.target && val > 0) : (val >= a.target);
            if (ok) { this.achievements[a.id] = true; this.money += a.reward; unlocked.push(a); }
        }
        return unlocked;
    }
    refreshDailyQuests() {
        const today = todayKey();
        if (this.questDate === today && this.quests.length === 3) return false;
        this.questDate = today;
        const pool = [...QUEST_POOL];
        this.quests = [];
        for (let i = 0; i < 3 && pool.length > 0; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            this.quests.push(pool.splice(idx, 1)[0]);
        }
        this.questProgress = {}; this.questClaimed = {};
        this.questCounters = { cleanToday: 0, killBugsToday: 0, fastCleanToday: 0, soapUsesToday: 0, moneyEarnedToday: 0, petActionsToday: 0, starsToday: 0 };
        return true;
    }
    getQuestValue(q) { return this.questCounters[q.type] || 0; }
    isQuestComplete(q) { return this.getQuestValue(q) >= q.target; }
    claimQuest(q) {
        if (this.questClaimed[q.id]) return false;
        if (!this.isQuestComplete(q)) return false;
        this.questClaimed[q.id] = true; this.money += q.reward; return true;
    }
    getDailyStatus() {
        const today = todayKey();
        const last = this.dailyBonus.lastClaimDate;
        const canClaim = last !== today;
        let nextDay = this.dailyBonus.streakDay + 1;
        if (!last) nextDay = 1;
        else if (last !== today) {
            const y = new Date(); y.setUTCDate(y.getUTCDate() - 1);
            const yKey = `${y.getUTCFullYear()}-${y.getUTCMonth() + 1}-${y.getUTCDate()}`;
            if (last !== yKey) nextDay = 1;
        }
        if (nextDay > 7) nextDay = 1;
        return { canClaim, nextDay };
    }
    claimDailyBonus() {
        const st = this.getDailyStatus();
        if (!st.canClaim) return null;
        const reward = DAILY_REWARDS[st.nextDay - 1];
        this.money += reward.money; this.food += reward.food;
        this.dailyBonus.lastClaimDate = todayKey();
        this.dailyBonus.streakDay = st.nextDay;
        return reward;
    }
    toSaveObject() {
        const obj = {
            money: this.money, food: this.food, toolLevel: this.toolLevel,
            soapLevel: this.soapLevel, washLevel: this.washLevel, swatterLevel: this.swatterLevel,
            carpetIndex: this.carpetIndex, carpetLevel: this.carpetLevel,
            carpetsCleaned: this.carpetsCleaned, bugsKilledTotal: this.bugsKilledTotal,
            starsPopped: this.starsPopped, maxMoney: this.maxMoney,
            autoFoodEnabled: this.autoFoodEnabled ? 1 : 0,
            prestigeLevel: this.prestigeLevel, legacyPoints: this.legacyPoints,
            legacyUpgrades: JSON.stringify(this.legacyUpgrades),
            doubleBugReward: this.doubleBugReward ? 1 : 0,
            selectedRoom: this.selectedRoom, selectedBrush: this.selectedBrush,
            unlockedRooms: this.unlockedRooms.join(','),
            unlockedBrushes: this.unlockedBrushes.join(','),
            achievements: Object.keys(this.achievements).join(','),
            questDate: this.questDate,
            quests: JSON.stringify(this.quests),
            questProgress: JSON.stringify(this.questProgress),
            questClaimed: JSON.stringify(this.questClaimed),
            questCounters: JSON.stringify(this.questCounters),
            lastAdTime: this.lastAdTime,
            tutorialDone: this.tutorialDone ? 1 : 0,
            pets: JSON.stringify(this.pets),
            settings: JSON.stringify(this.settings),
            dailyBonus: JSON.stringify(this.dailyBonus),
            leaderboardBestMoney: this.leaderboardBestMoney,
            leaderboardBestPrestige: this.leaderboardBestPrestige
        };
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            const st = this.carpetStats[i] || { cleanings: 0, bestTime: 0, tutorialDone: false };
            obj['carpet' + i + '_cleanings'] = st.cleanings;
            obj['carpet' + i + '_best'] = st.bestTime;
            obj['carpet' + i + '_tut'] = st.tutorialDone ? 1 : 0;
        }
        return obj;
    }
    fromSaveObject(d) {
        if (!d) return;
        const n = (v, fb) => (v === undefined || v === null ? fb : Number(v));
        const s = (v, fb) => (v === undefined || v === null || v === '' ? fb : String(v));
        this.money = n(d.money, this.money);
        this.food = n(d.food, this.food);
        this.toolLevel = n(d.toolLevel, this.toolLevel);
        this.soapLevel = n(d.soapLevel, 1);
        this.washLevel = n(d.washLevel, 1);
        this.swatterLevel = n(d.swatterLevel, 0);
        this.carpetIndex = n(d.carpetIndex, this.carpetIndex);
        this.carpetLevel = n(d.carpetLevel, this.carpetLevel);
        this.carpetsCleaned = n(d.carpetsCleaned, this.carpetsCleaned);
        this.bugsKilledTotal = n(d.bugsKilledTotal, 0);
        this.starsPopped = n(d.starsPopped, 0);
        this.maxMoney = n(d.maxMoney, this.money);
        this.autoFoodEnabled = Number(d.autoFoodEnabled) === 1;
        this.prestigeLevel = n(d.prestigeLevel, 0);
        this.legacyPoints = n(d.legacyPoints, 0);
        try { this.legacyUpgrades = d.legacyUpgrades ? JSON.parse(d.legacyUpgrades) : {}; } catch { this.legacyUpgrades = {}; }
        this.doubleBugReward = Number(d.doubleBugReward) === 1;
        this.selectedRoom = s(d.selectedRoom, 'classic');
        this.selectedBrush = s(d.selectedBrush, 'classic');
        this.unlockedRooms = d.unlockedRooms ? String(d.unlockedRooms).split(',').filter(Boolean) : ['classic'];
        this.unlockedBrushes = d.unlockedBrushes ? String(d.unlockedBrushes).split(',').filter(Boolean) : ['classic'];
        this.achievements = {};
        if (d.achievements) String(d.achievements).split(',').filter(Boolean).forEach(id => this.achievements[id] = true);
        this.questDate = s(d.questDate, '');
        try { this.quests = d.quests ? JSON.parse(d.quests) : []; } catch { this.quests = []; }
        try { this.questProgress = d.questProgress ? JSON.parse(d.questProgress) : {}; } catch { this.questProgress = {}; }
        try { this.questClaimed = d.questClaimed ? JSON.parse(d.questClaimed) : {}; } catch { this.questClaimed = {}; }
        try { this.questCounters = d.questCounters ? JSON.parse(d.questCounters) : this.questCounters; } catch {}
        this.lastAdTime = n(d.lastAdTime, 0);
        this.tutorialDone = Number(d.tutorialDone) === 1;
        try {
            const raw = d.pets ? JSON.parse(d.pets) : null;
            if (raw && typeof raw === 'object') {
                for (const id of ['cat','dog','hamster','parrot']) {
                    const v = raw[id];
                    if (typeof v === 'boolean') this.pets[id] = { owned: v, level: 1 };
                    else if (v && typeof v === 'object') this.pets[id] = { owned: !!v.owned, level: Math.max(1, Math.min(BALANCE.petMaxLevel, Number(v.level) || 1)) };
                }
            }
        } catch {}
        try { this.settings = d.settings ? Object.assign(this.settings, JSON.parse(d.settings)) : this.settings; } catch {}
        try { this.dailyBonus = d.dailyBonus ? Object.assign(this.dailyBonus, JSON.parse(d.dailyBonus)) : this.dailyBonus; } catch {}
        this.leaderboardBestMoney = n(d.leaderboardBestMoney, 0);
        this.leaderboardBestPrestige = n(d.leaderboardBestPrestige, 0);
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            this.carpetStats[i] = {
                cleanings: n(d['carpet' + i + '_cleanings'], 0),
                bestTime: n(d['carpet' + i + '_best'], 0),
                tutorialDone: Number(d['carpet' + i + '_tut']) === 1
            };
        }
    }
}

class SaveSystem {
    constructor(state) { this.state = state; this.ysdk = null; this.useLocal = false; this._saving = false; }
    async init() {
        try {
            if (typeof YaGames === 'undefined') throw new Error('no SDK');
            this.ysdk = await YaGames.init();
            const detected = detectLang(this.ysdk);
            if (this.state.settings.lang && I18N[this.state.settings.lang]) LANG = this.state.settings.lang;
            else { LANG = detected; this.state.settings.lang = detected; }
            const keys = Object.keys(this.state.toSaveObject());
            const stats = await this.ysdk.player.getStats(keys);
            this.state.fromSaveObject(stats);
            if (this.state.settings.lang && I18N[this.state.settings.lang]) LANG = this.state.settings.lang;
        } catch {
            this.useLocal = true;
            LANG = detectLang(null);
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (raw) { this.state.fromSaveObject(JSON.parse(raw)); if (this.state.settings.lang && I18N[this.state.settings.lang]) LANG = this.state.settings.lang; }
            } catch {}
        }
        return this;
    }
    ready() { try { this.ysdk?.features?.LoadingAPI?.ready?.(); } catch {} }
    gameplayStart() { try { this.ysdk?.features?.GameplayAPI?.start?.(); } catch {} }
    gameplayStop() { try { this.ysdk?.features?.GameplayAPI?.stop?.(); } catch {} }
    onPause(cb) { try { this.ysdk?.on?.('game_api_pause', cb); } catch {} }
    onResume(cb) { try { this.ysdk?.on?.('game_api_resume', cb); } catch {} }
    async save() {
        if (this._saving) return;
        this._saving = true;
        try {
            const data = this.state.toSaveObject();
            if (!this.useLocal && this.ysdk) { try { await this.ysdk.player.setStats(data); } catch {} }
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
        } finally { this._saving = false; }
    }
    saveSync() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.state.toSaveObject())); } catch {} }
    async fullReset() {
        try {
            const fresh = new GameState();
            const savedLang = this.state.settings.lang;
            const savedMusic = this.state.settings.music;
            this.state.fromSaveObject(fresh.toSaveObject());
            this.state.settings.lang = savedLang;
            this.state.settings.music = savedMusic;
            try { localStorage.removeItem(SAVE_KEY); } catch {}
            const data = this.state.toSaveObject();
            if (!this.useLocal && this.ysdk) { try { await this.ysdk.player.setStats(data); } catch {} }
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
            return true;
        } catch { return false; }
    }
}

class AdsSystem {
    constructor(saveSystem) {
        this.saveSystem = saveSystem;
        this.ysdk = saveSystem.ysdk;
        this.busy = false; this.onAdStart = null; this.onAdEnd = null;
    }
    isAvailable() { return !!this.ysdk?.adv?.showRewardedVideo; }
    getCooldownRemaining() {
        const now = Date.now();
        const last = this.saveSystem.state.lastAdTime || 0;
        return Math.max(0, BALANCE.adCooldownMs - (now - last));
    }
    async showRewarded() {
        if (this.busy) return false;
        if (this.getCooldownRemaining() > 0) return false;
        this.busy = true;
        this.onAdStart?.();
        if (!this.isAvailable()) {
            this.busy = false;
            this.saveSystem.state.lastAdTime = Date.now();
            this.onAdEnd?.();
            return true;
        }
        return new Promise((resolve) => {
            let rewarded = false;
            try {
                this.ysdk.adv.showRewardedVideo({
                    callbacks: {
                        onRewarded: () => { rewarded = true; },
                        onClose: () => { this.busy = false; if (rewarded) this.saveSystem.state.lastAdTime = Date.now(); this.onAdEnd?.(); resolve(rewarded); },
                        onError: () => { this.busy = false; this.onAdEnd?.(); resolve(false); }
                    }
                });
            } catch { this.busy = false; this.onAdEnd?.(); resolve(false); }
        });
    }
    async showFullscreen() {
        this.onAdStart?.();
        if (!this.ysdk?.adv?.showFullscreenAdv) { this.onAdEnd?.(); return; }
        try {
            this.ysdk.adv.showFullscreenAdv({ callbacks: { onClose: () => { this.onAdEnd?.(); }, onError: () => { this.onAdEnd?.(); } } });
        } catch { this.onAdEnd?.(); }
    }
}

class LeaderboardSystem {
    constructor(state, saveSystem) {
        this.state = state; this.saveSystem = saveSystem;
        this.ysdk = saveSystem.ysdk; this.lb = null;
    }
    isAvailable() { return !!(this.ysdk?.getLeaderboards) && !this.saveSystem.useLocal; }
    async _init() {
        if (!this.isAvailable()) return false;
        if (this.lb) return true;
        try { this.lb = await this.ysdk.getLeaderboards(); return true; } catch { return false; }
    }
    async submitScores() {
        if (!await this._init()) return;
        try { await this.lb.setLeaderboardScore('bestMoney', this.state.leaderboardBestMoney); } catch {}
        try { await this.lb.setLeaderboardScore('prestige', this.state.leaderboardBestPrestige); } catch {}
    }
    async fetchTop(name = 'bestMoney', count = 10) {
        if (!await this._init()) return this._localTop(name, count);
        try {
            const res = await this.lb.getLeaderboardEntries(name, { quantityTop: count, includeUser: true, quantityAround: 3 });
            return res.entries.map(e => ({
                rank: e.rank, score: e.score, name: e.player?.publicName || 'Guest',
                avatar: e.player?.avatarSmall || null, isMe: e.player?.scopePermission && e.rank === res.userRank
            }));
        } catch { return this._localTop(name, count); }
    }
    _localTop(name) {
        const myBest = name === 'bestMoney' ? this.state.leaderboardBestMoney : this.state.leaderboardBestPrestige;
        return [{ rank: 1, score: myBest, name: 'You', avatar: null, isMe: true }];
    }
}

class Effects {
    constructor(scene) {
        this.scene = scene;
        this.gfxSwatter = scene.add.graphics().setDepth(6);
        this.gfxSwatter.setVisible(false);
        this._fxCount = 0; this._fxMax = 40;
        this._ensureTextures();
    }
    _ensureTextures() {
        const s = this.scene;
        if (!s.textures.exists('fx_bubble')) {
            const g = s.add.graphics();
            g.fillStyle(0xE0F4FF, 0.85); g.fillCircle(8, 8, 7);
            g.lineStyle(1.5, 0xFFFFFF, 0.9); g.strokeCircle(8, 8, 7);
            g.fillStyle(0xFFFFFF, 1); g.fillCircle(6, 6, 2);
            g.generateTexture('fx_bubble', 16, 16); g.destroy();
        }
        if (!s.textures.exists('fx_drop')) {
            const g = s.add.graphics();
            g.fillStyle(0x9AD6FF, 1); g.fillCircle(4, 5, 4); g.fillTriangle(0, 5, 8, 5, 4, 0);
            g.generateTexture('fx_drop', 8, 10); g.destroy();
        }
    }
    _emitter(key, x, y, cfg) {
        const em = this.scene.add.particles(x, y, key, Object.assign({
            lifespan: 600, speed: { min: 40, max: 120 }, scale: { start: 1, end: 0 }, alpha: { start: 1, end: 0 },
            quantity: 4, emitting: false
        }, cfg)).setDepth(8);
        em.explode(cfg.quantity || 4);
        this.scene.time.delayedCall((cfg.lifespan || 600) + 200, () => { try { em.destroy(); } catch {} });
    }
    bubbles(x, y) {
        if (this._fxCount >= this._fxMax) return;
        if (Math.random() > BALANCE.bubbleChance) return;
        this._emitter('fx_bubble', x, y, { quantity: 2, lifespan: 700, speed: { min: 30, max: 70 }, scale: { start: 0.9, end: 1.4 }, alpha: { start: 0.9, end: 0 } });
    }
    splash(x, y) {
        if (this._fxCount >= this._fxMax) return;
        if (Math.random() > BALANCE.splashChance) return;
        this._emitter('fx_drop', x, y, { quantity: 3, lifespan: 550, speed: { min: 50, max: 130 }, angle: { min: 0, max: 360 }, scale: { start: 1.1, end: 0.2 } });
    }
    star(x, y) {
        if (this._fxCount >= this._fxMax) return;
        if (Math.random() > BALANCE.starChance) return;
        this._fxCount++;
        const tt = this.scene.add.text(x, y, Math.random() > 0.5 ? '⭐' : '✨', { fontSize: (18 + Math.random() * 15) + 'px' }).setOrigin(0.5).setDepth(5);
        const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 60;
        this.scene.tweens.add({ targets: tt, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d - 40,
            alpha: { from: 1, to: 0 }, scale: { from: 1, to: 0.3 },
            duration: BALANCE.starLifetime, ease: 'Cubic.easeOut',
            onComplete: () => { this._fxCount--; tt.destroy(); } });
    }
    starBurst(x, y, count = 3) { for (let i = 0; i < count; i++) { if (this._fxCount >= this._fxMax) return; this.star(x, y); } }
    moneyPopup(x, y, amount, color = '#FFD700') {
        if (this._fxCount >= this._fxMax) return;
        this._fxCount++;
        const tt = this.scene.add.text(x, y, `+${amount}💰`, { fontSize: '28px', fill: color, fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 5 }).setOrigin(0.5).setDepth(30);
        this.scene.tweens.add({ targets: tt, y: y - 70, alpha: { from: 1, to: 0 }, scale: { from: 1, to: 1.4 }, duration: 900, ease: 'Cubic.easeOut',
            onComplete: () => { this._fxCount--; tt.destroy(); } });
    }
    petAction(x, y, icon) {
        if (this._fxCount >= this._fxMax) return;
        this._fxCount++;
        const tt = this.scene.add.text(x, y, icon, { fontSize: '42px' }).setOrigin(0.5).setDepth(21);
        this.scene.tweens.add({ targets: tt, y: y - 60, alpha: { from: 1, to: 0 }, scale: { from: 0.8, to: 1.3 }, duration: 800, ease: 'Back.easeOut',
            onComplete: () => { this._fxCount--; tt.destroy(); } });
    }
    swatEffect(x, y) {
        if (this._fxCount >= this._fxMax) return;
        this._fxCount++;
        const tt = this.scene.add.text(x, y, '💥', { fontSize: '60px' }).setOrigin(0.5).setDepth(20);
        this.scene.tweens.add({ targets: tt, alpha: 0, scale: 1.8, duration: 400, ease: 'Cubic.easeOut',
            onComplete: () => { this._fxCount--; tt.destroy(); } });
    }
    steamEffect(x, y) {
        if (this._fxCount >= this._fxMax) return;
        this._fxCount++;
        const s = ['☁️','💨','🌫️'][Math.floor(Math.random() * 3)];
        const tt = this.scene.add.text(x, y, s, { fontSize: '40px' }).setOrigin(0.5).setDepth(9).setAlpha(0.7);
        this.scene.tweens.add({ targets: tt, y: y - 40, alpha: { from: 0.7, to: 0 }, scale: { from: 1, to: 1.4 }, duration: 500, ease: 'Cubic.easeOut',
            onComplete: () => { this._fxCount--; tt.destroy(); } });
    }
    drawSwatterCursor(x, y) {
        const g = this.gfxSwatter;
        g.clear();
        const r = this.scene.bugsRef ? this.scene.bugsRef.getSwatterRadius() : BALANCE.swatterRadius;
        g.lineStyle(6, 0xFF4444, 0.8); g.strokeCircle(x, y, r);
        g.lineStyle(4, 0xFF8888, 0.6);
        g.beginPath(); g.moveTo(x - 15, y); g.lineTo(x + 15, y); g.moveTo(x, y - 15); g.lineTo(x, y + 15); g.strokePath();
        g.setVisible(true);
    }
    hideSwatterCursor() { this.gfxSwatter.setVisible(false); }
    celebration(W, H) {
        const sym = ['⭐','✨','🌟','💫'];
        for (let i = 0; i < BALANCE.finishStarCount; i++) {
            const sx = Math.random() * W, sy = Math.random() * H;
            const tt = this.scene.add.text(sx, sy, sym[Math.floor(Math.random() * 4)], { fontSize: (25 + Math.random() * 30) + 'px' }).setOrigin(0.5).setDepth(15);
            const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 150;
            this.scene.tweens.add({ targets: tt, x: sx + Math.cos(a) * d, y: sy + Math.sin(a) * d,
                alpha: { from: 0, to: 1 }, scale: { from: 0.3, to: 1.2 },
                delay: Math.random() * 600, duration: BALANCE.finishStarDuration * 0.4, ease: 'Back.easeOut',
                onComplete: () => this.scene.tweens.add({ targets: tt, alpha: 0, scale: 0.2, y: tt.y - 60,
                    duration: BALANCE.finishStarDuration * 0.6, ease: 'Cubic.easeIn', onComplete: () => tt.destroy() }) });
        }
    }
}
</script>

<script>
/* FINISH STARS */
class FinishStarsSystem {
    constructor(scene, cleaning, state, effects) {
        this.scene = scene; this.cleaning = cleaning; this.state = state; this.effects = effects;
        this.stars = []; this.active = false;
        this.onAllPopped = null; this.onStarPopped = null;
    }
    activate() {
        if (this.active) return;
        const cs = this.cleaning.cellSize, cols = this.cleaning.cols, rows = this.cleaning.rows;
        const originX = this.cleaning.originX, originY = this.cleaning.originY;
        const dirt = this.cleaning.dirt, crust = this.cleaning.crust, stainType = this.cleaning.stainType;
        const minDist = BALANCE.finishStarMinDist;
        const clusters = [];
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const i = row * cols + col;
                const hasDirt = dirt[i] > 0.01;
                const hasCrust = crust[i] > 0.05;
                const hasStain = stainType[i] > 0;
                if (!hasDirt && !hasCrust && !hasStain) continue;
                const cx = originX + col * cs + cs / 2, cy = originY + row * cs + cs / 2;
                let found = null;
                for (const c of clusters) {
                    const dx = c.x - cx, dy = c.y - cy;
                    if (dx * dx + dy * dy < minDist * minDist) { found = c; break; }
                }
                if (found) {
                    found.cells.push(i);
                    found.x = (found.x * (found.cells.length - 1) + cx) / found.cells.length;
                    found.y = (found.y * (found.cells.length - 1) + cy) / found.cells.length;
                    if (hasCrust) found.hasCrust = true;
                    if (hasStain) found.hasStain = true;
                } else clusters.push({ x: cx, y: cy, cells: [i], hasCrust, hasStain });
            }
        }
        if (clusters.length === 0) { this.forceComplete(); return; }
        this.active = true;
        for (const c of clusters) {
            let icon = '⭐';
            if (c.hasStain) icon = '🧴';
            else if (c.hasCrust) icon = '🧱';
            const star = this.scene.add.text(c.x, c.y, icon, { fontSize: '44px', fontFamily: 'Arial' }).setOrigin(0.5).setDepth(24);
            star.setScale(0);
            this.scene.tweens.add({ targets: star, scale: 1, duration: 350, ease: 'Back.easeOut' });
            const hit = this.scene.add.circle(c.x, c.y, 45, 0x000000, 0.001).setDepth(25).setInteractive({ useHandCursor: true });
            hit.on('pointerdown', () => this.popStar(c));
            this.stars.push({ star, hit, cells: c.cells });
        }
    }
    popStar(cluster) {
        const entry = this.stars.find(s => s.cells === cluster.cells);
        if (!entry) return;
        const dirt = this.cleaning.dirt, soap = this.cleaning.soap, crust = this.cleaning.crust, stainType = this.cleaning.stainType;
        for (const i of cluster.cells) { dirt[i] = 0; soap[i] = 0; crust[i] = 0; stainType[i] = 0; }
        this.cleaning.needRedrawDirt = true; this.cleaning.needRedrawSoap = true;
        this.cleaning.needRedrawCrust = true; this.cleaning.needRedrawStain = true;
        this.cleaning.recalcProgress();
        const reward = BALANCE.finishStarReward;
        this.state.addMoney(reward); this.state.registerStarPopped(1);
        this.effects.moneyPopup(cluster.x, cluster.y, reward, '#FFD700');
        this.effects.starBurst(cluster.x, cluster.y, 4);
        entry.star.disableInteractive(); entry.hit.disableInteractive();
        this.scene.tweens.add({ targets: entry.star, scale: 2, alpha: 0, angle: 180, duration: 350, ease: 'Cubic.easeOut',
            onComplete: () => { entry.star.destroy(); } });
        entry.hit.destroy();
        const idx = this.stars.indexOf(entry);
        if (idx > -1) this.stars.splice(idx, 1);
        this.onStarPopped?.(cluster.cells.length);
        if (this.stars.length === 0) { this.active = false; this.forceComplete(); this.onAllPopped?.(); }
    }
    forceComplete() {
        const dirt = this.cleaning.dirt, soap = this.cleaning.soap, crust = this.cleaning.crust, stainType = this.cleaning.stainType;
        const total = dirt.length;
        for (let i = 0; i < total; i++) { dirt[i] = 0; soap[i] = 0; crust[i] = 0; stainType[i] = 0; }
        this.cleaning.needRedrawDirt = true; this.cleaning.needRedrawSoap = true;
        this.cleaning.needRedrawCrust = true; this.cleaning.needRedrawStain = true;
        this.cleaning.progress = 1.0;
        this.cleaning.recalcProgress();
    }
    clear() {
        for (const s of this.stars) {
            if (s.star && s.star.active) s.star.destroy();
            if (s.hit && s.hit.active) s.hit.destroy();
        }
        this.stars = []; this.active = false;
    }
    get count() { return this.stars.length; }
}

class CleaningSystem {
    constructor(scene, bounds, state) {
        this.scene = scene; this.bounds = bounds; this.state = state;
        this.cellSize = BALANCE.gridCellSize;
        this.cols = Math.ceil(bounds.width / this.cellSize);
        this.rows = Math.ceil(bounds.height / this.cellSize);
        this.originX = bounds.x; this.originY = bounds.y;
        const total = this.cols * this.rows;
        this.dirt = new Float32Array(total);
        this.soap = new Float32Array(total);
        this.crust = new Float32Array(total);
        this.stainType = new Uint8Array(total);
        this.moldTimer = new Float32Array(total);
        this.dirt.fill(1.0);
        this.dirtGfx = scene.add.graphics().setDepth(1);
        this.soapGfx = scene.add.graphics().setDepth(2);
        this.crustGfx = scene.add.graphics().setDepth(2.5);
        this.stainGfx = scene.add.graphics().setDepth(2.7);
        this.needRedrawDirt = true; this.needRedrawSoap = true;
        this.needRedrawCrust = true; this.needRedrawStain = true;
        this.progress = 0;
        this.onProgress = null; this.onErase = null; this.onSoap = null;
        this.onSteam = null; this.onCrustRemove = null; this.onStainRemove = null;
        this.onCelebrate = null; this.celebrationFired = false;
    }
    hasCrustLeft() {
        for (let i = 0; i < this.crust.length; i++) {
            if (this.crust[i] > 0.05) return true;
        }
        return false;
    }
    reset(carpetIndex) {
        this.dirt.fill(1.0); this.soap.fill(0.0); this.crust.fill(0.0);
        this.stainType.fill(0); this.moldTimer.fill(0);
        if (carpetIndex >= 3) {
            const chance = carpetIndex === 3 ? 0.40 : 0.25;
            for (let i = 0; i < this.crust.length; i++) if (Math.random() < chance) this.crust[i] = 1.0;
        }
        if (carpetIndex >= 5) {
            for (let i = 0; i < this.stainType.length; i++) {
                if (Math.random() < 0.15) this.stainType[i] = 1 + Math.floor(Math.random() * 4);
            }
        }
        this.needRedrawDirt = true; this.needRedrawSoap = true;
        this.needRedrawCrust = true; this.needRedrawStain = true;
        this.progress = 0; this.celebrationFired = false;
        this.recalcProgress();
        this.onProgress?.(this.progress);
    }
    applyStroke(localX, localY, radius, tool) {
        const cs = this.cellSize, cols = this.cols, rows = this.rows;
        const r2 = radius * radius;
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(cols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(rows - 1, Math.floor((localY + radius) / cs));
        const soapPower = this.state.getSoapPower(), washStrength = this.state.getWashStrength();
        let dirtChanged = false, soapChanged = false, crustChanged = false, stainChanged = false, erased = false, soapCells = 0;
        for (let row = minRow; row <= maxRow; row++) {
            const rowOff = row * cols;
            const dy = row * cs + cs / 2 - localY; const dy2 = dy * dy;
            if (dy2 > r2) continue;
            for (let col = minCol; col <= maxCol; col++) {
                const dx = col * cs + cs / 2 - localX;
                const d2 = dx * dx + dy2;
                if (d2 > r2) continue;
                const falloff = Math.max(0.5, 1 - Math.sqrt(d2) / radius);
                const i = rowOff + col;
                if (tool === 'scraper') {
                    if (this.crust[i] > 0) {
                        this.crust[i] = Math.max(0, this.crust[i] - BALANCE.scraperBasePower * falloff);
                        crustChanged = true;
                        this.onCrustRemove?.(localX + this.originX, localY + this.originY);
                    }
                } else if (tool === 'steam') {
                    if (this.crust[i] > 0) { this.crust[i] = 0; crustChanged = true; }
                    if (this.dirt[i] > 0) { this.dirt[i] = 0; dirtChanged = true; erased = true; }
                    if (this.stainType[i] > 0) { this.stainType[i] = 0; stainChanged = true; this.onStainRemove?.(localX + this.originX, localY + this.originY); }
                } else if (tool === 'remover') {
                    if (this.stainType[i] > 0) {
                        this.stainType[i] = 0; stainChanged = true;
                        this.dirt[i] = Math.max(0, this.dirt[i] - BALANCE.stainRemoverPower * falloff);
                        if (this.dirt[i] < 0.01) this.dirt[i] = 0;
                        dirtChanged = true; erased = true;
                        this.onStainRemove?.(localX + this.originX, localY + this.originY);
                    } else if (this.dirt[i] > 0.01) {
                        this.dirt[i] = Math.max(0, this.dirt[i] - 0.15 * falloff);
                        if (this.dirt[i] < 0.01) this.dirt[i] = 0;
                        dirtChanged = true;
                    }
                } else if (tool === 'soap') {
                    if (this.soap[i] < 1.0 && this.crust[i] < 0.5) {
                        this.soap[i] = Math.min(1.0, this.soap[i] + soapPower * falloff);
                        soapChanged = true; soapCells++;
                    }
                } else {
                    if (this.crust[i] > 0.5) continue;
                    if (this.soap[i] < BALANCE.soapThreshold) continue;
                    if (this.dirt[i] > 0.001) {
                        let strength = washStrength;
                        if (this.stainType[i] > 0) strength *= 0.2;
                        this.dirt[i] = Math.max(0, this.dirt[i] - strength * falloff);
                        if (this.dirt[i] < 0.01) this.dirt[i] = 0;
                        this.soap[i] = Math.max(0, this.soap[i] - 0.05);
                        dirtChanged = true; soapChanged = true; erased = true;
                    }
                }
            }
        }
        if (tool === 'soap' && soapCells > 0) this.state.registerSoapUse(soapCells);
        const screenX = localX + this.originX, screenY = localY + this.originY;
        if (tool === 'soap' && soapChanged) this.onSoap?.(screenX, screenY);
        if (tool === 'wash' && erased) this.onErase?.(screenX, screenY);
        if (tool === 'steam') this.onSteam?.(screenX, screenY);
        if (dirtChanged) { this.needRedrawDirt = true; this.recalcProgress(); }
        if (soapChanged) this.needRedrawSoap = true;
        if (crustChanged) { this.needRedrawCrust = true; this.recalcProgress(); }
        if (stainChanged) { this.needRedrawStain = true; this.recalcProgress(); }
        return { dirtChanged, soapChanged, erased, crustChanged, stainChanged };
    }
    updateMold(delta) {
        let changed = false;
        const total = this.stainType.length;
        for (let i = 0; i < total; i++) {
            if (this.stainType[i] === 4) {
                this.moldTimer[i] += delta;
                if (this.moldTimer[i] >= BALANCE.moldSpreadMs) {
                    this.moldTimer[i] = 0;
                    const col = i % this.cols, row = Math.floor(i / this.cols);
                    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                    const [dc, dr] = dirs[Math.floor(Math.random() * 4)];
                    const nc = col + dc, nr = row + dr;
                    if (nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows) {
                        const ni = nr * this.cols + nc;
                        if (this.stainType[ni] === 0) { this.stainType[ni] = 4; this.moldTimer[ni] = 0; changed = true; }
                    }
                }
            }
        }
        if (changed) this.needRedrawStain = true;
    }
    recalcProgress() {
        let total = 0;
        const cells = this.dirt.length;
        let allClean = true;
        for (let i = 0; i < cells; i++) {
            const d = this.dirt[i], c = this.crust[i], s = this.stainType[i] > 0 ? 1 : 0;
            const rem = Math.max(d, c, s);
            total += 1 - rem;
            if (rem > 0.05) allClean = false;
        }
        this.progress = total / cells;
        if (this.progress >= 0.9999 && allClean) this.progress = 1.0;
        if (this.progress >= 0.9999 && !allClean) this.progress = 0.9999;
        this.onProgress?.(this.progress);
        if (this.progress >= 1.0 && !this.celebrationFired) { this.celebrationFired = true; this.onCelebrate?.(); }
    }
    isFullyClean() {
        const cells = this.dirt.length;
        for (let i = 0; i < cells; i++) {
            if (this.dirt[i] > 0.05) return false;
            if (this.crust[i] > 0.05) return false;
            if (this.stainType[i] > 0) return false;
        }
        return true;
    }
    draw() {
        if (this.needRedrawDirt) this.drawDirt();
        if (this.needRedrawCrust) this.drawCrust();
        if (this.needRedrawStain) this.drawStain();
        if (this.needRedrawSoap) this.drawSoap();
    }
    drawDirt() {
        const g = this.dirtGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols; const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const d = this.dirt[rowOff + col];
                if (d <= 0.05) continue;
                g.fillStyle(0x2a1a0a, d * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawDirt = false;
    }
    drawCrust() {
        const g = this.crustGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols; const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const c = this.crust[rowOff + col];
                if (c <= 0.05) continue;
                g.fillStyle(0x5a3a1a, c * 0.85);
                g.fillRect(this.originX + col * cs, py, cs, cs);
                g.lineStyle(1, 0x2a1a0a, c * 0.8);
                g.strokeRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawCrust = false;
    }
    drawStain() {
        const g = this.stainGfx, cs = this.cellSize;
        g.clear();
        const colors = { 1: 0x8B0000, 2: 0x6B3410, 3: 0x660011, 4: 0x2A6A2A };
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols; const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const t = this.stainType[rowOff + col];
                if (t === 0) continue;
                g.fillStyle(colors[t] || 0x884400, 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
                if (t === 4) { g.lineStyle(1, 0x88FF88, 0.6); g.strokeRect(this.originX + col * cs, py, cs, cs); }
            }
        }
        this.needRedrawStain = false;
    }
    drawSoap() {
        const g = this.soapGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols; const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const s = this.soap[rowOff + col];
                if (s < 0.05 || this.dirt[rowOff + col] < 0.1) continue;
                g.fillStyle(0xAAE0FF, s * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawSoap = false;
    }
}

class BugSystem {
    constructor(scene, bounds, state, opts = {}) {
        this.scene = scene; this.bounds = bounds; this.state = state;
        this.padding = 40; this.bugs = []; this.lastSwat = 0;
        this.onKill = opts.onKill || null; this.onReward = opts.onReward || null;
    }
    get count() { return this.bugs.length; }
    getSwatterRadius() { return this.state.getSwatterRadius(); }
    clear() { this.bugs.forEach(b => b.destroy()); this.bugs = []; }
    spawnForLevel(carpetIndex) {
        if (carpetIndex < 2) return;
        const maxBugs = BALANCE.bugCountBase + carpetIndex;
        const n = Phaser.Math.Between(1, maxBugs);
        for (let i = 0; i < n; i++) this.spawnOne();
    }
    spawnOne() {
        const b = this.bounds;
        const x = Phaser.Math.Between(b.x + this.padding, b.x + b.width - this.padding);
        const y = Phaser.Math.Between(b.y + this.padding, b.y + b.height - this.padding);
        const bug = this.scene.add.container(x, y).setDepth(4);
        bug.add(this.buildBody());
        bug.bugAngle = Math.random() * Math.PI * 2;
        bug.bugSpeed = BALANCE.bugSpeed * (0.7 + Math.random() * 0.6);
        bug.isDead = false;
        bug.setRotation(bug.bugAngle);
        this.bugs.push(bug);
    }
    buildBody() {
        const g = this.scene.add.graphics();
        g.fillStyle(0x1a1a1a, 1); g.fillEllipse(0, 0, 36, 24);
        g.lineStyle(2, 0x000000, 1); g.strokeEllipse(0, 0, 36, 24);
        g.fillStyle(0x0a0a0a, 1); g.fillCircle(15, 0, 9);
        g.fillStyle(0xFFFFFF, 1); g.fillCircle(18, -4, 2.5); g.fillCircle(18, 4, 2.5);
        g.fillStyle(0x000000, 1); g.fillCircle(19, -4, 1.2); g.fillCircle(19, 4, 1.2);
        g.lineStyle(2, 0x0a0a0a, 1);
        g.beginPath();
        g.moveTo(-10, -10); g.lineTo(-15, -15);
        g.moveTo(-10, 10); g.lineTo(-15, 15);
        g.moveTo(0, -12); g.lineTo(-2, -18);
        g.moveTo(0, 12); g.lineTo(-2, 18);
        g.moveTo(10, -10); g.lineTo(15, -15);
        g.moveTo(10, 10); g.lineTo(15, 15);
        g.strokePath();
        return g;
    }
    kill(bug, fromPet = false) {
        if (bug.isDead) return;
        bug.isDead = true;
        if (!fromPet) this.state.registerBugKill();
        this.onKill?.(bug.x, bug.y, fromPet);
        if (!fromPet) {
            const lvlBonus = this.state.getSwatterRewardBonus();
            if (lvlBonus > 0) { this.state.addMoney(lvlBonus); this.onReward?.(bug.x, bug.y, lvlBonus); }
            if (this.state.doubleBugReward) { this.state.addMoney(BALANCE.bugRewardPerKill); this.onReward?.(bug.x, bug.y, BALANCE.bugRewardPerKill); }
        }
        this.scene.tweens.add({ targets: bug, alpha: 0, scale: 1.5, duration: BALANCE.bugFadeDuration, ease: 'Cubic.easeOut',
            onComplete: () => { const idx = this.bugs.indexOf(bug); if (idx > -1) this.bugs.splice(idx, 1); bug.destroy(); } });
    }
    swat(x, y, now) {
        if (now - this.lastSwat < this.state.getSwatterCooldown()) return false;
        this.lastSwat = now;
        const r = this.state.getSwatterRadius();
        const r2 = r * r;
        let hit = false;
        for (let i = this.bugs.length - 1; i >= 0; i--) {
            const bug = this.bugs[i];
            if (bug.isDead) continue;
            const dx = bug.x - x, dy = bug.y - y;
            if (dx * dx + dy * dy <= r2) { this.kill(bug); hit = true; }
        }
        return hit;
    }
    scareOne() { if (this.bugs.length === 0) return null; const bug = this.bugs[0]; this.kill(bug, true); return bug; }
    update(delta) {
        if (this.bugs.length === 0) return;
        const dt = delta / 1000;
        const b = this.bounds;
        const minX = b.x + this.padding, maxX = b.x + b.width - this.padding;
        const minY = b.y + this.padding, maxY = b.y + b.height - this.padding;
        for (const bug of this.bugs) {
            if (bug.isDead) continue;
            bug.x += Math.cos(bug.bugAngle) * bug.bugSpeed * dt;
            bug.y += Math.sin(bug.bugAngle) * bug.bugSpeed * dt;
            bug.setRotation(bug.bugAngle);
            if (bug.x < minX) { bug.x = minX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.x > maxX) { bug.x = maxX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.y < minY) { bug.y = minY; bug.bugAngle = -bug.bugAngle; }
            if (bug.y > maxY) { bug.y = maxY; bug.bugAngle = -bug.bugAngle; }
            if (Math.random() < 0.005) bug.bugAngle += (Math.random() - 0.5) * 1.5;
        }
    }
}

/* ROOM RENDERER
   Логика:
   1. Если картинка комнаты загружена (rooms/room_{id}.png) — используется она.
   2. Если нет — процедурная отрисовка (уютная зимняя хижина для classic).
*/
class RoomRenderer {
    constructor(scene) {
        this.scene = scene;
        this.gfx = scene.add.graphics().setDepth(-10);
        this.img = null;
    }
    draw(skinId) {
        const W = 720, H = 1280, g = this.gfx;
        g.clear();
        if (this.img) { try { this.img.destroy(); } catch {} this.img = null; }

        const key = 'room_' + skinId;
        if (this.scene.textures.exists(key)) {
            // Загружена картинка — используем её, растягиваем на весь экран (9:16)
            this.img = this.scene.add.image(W / 2, H / 2, key)
                .setDisplaySize(W, H)
                .setDepth(-10);
            return;
        }
        // Иначе процедурная отрисовка
        switch (skinId) {
            case 'neon': this.drawNeon(g, W, H); break;
            case 'beach': this.drawBeach(g, W, H); break;
            case 'space': this.drawSpace(g, W, H); break;
            case 'candy': this.drawCandy(g, W, H); break;
            default: this.drawCozyCabin(g, W, H);
        }
    }
    drawCozyCabin(g, W, H) {
        // Тёмные деревянные стены
        g.fillStyle(0x2a1a10, 1); g.fillRect(0, 0, W, H);
        for (let y = 0; y < 1000; y += 26) {
            g.fillStyle(0x1a0f06, 0.5); g.fillRect(0, y, W, 2);
        }
        g.fillStyle(0x1a0f06, 0.75);
        g.fillRect(0, 0, 55, 1000);
        g.fillRect(W - 55, 0, 55, 1000);

        // Окно
        const wx = 75, wy = 55, ww = W - 150, wh = 520;
        g.fillStyle(0x4a2c14, 1); g.fillRect(wx - 18, wy - 18, ww + 36, wh + 36);
        g.fillStyle(0x2a1a0e, 1); g.fillRect(wx - 10, wy - 10, ww + 20, wh + 20);

        // Небо (градиент)
        for (let i = 0; i < wh; i++) {
            const tt = i / wh;
            const r = Math.floor(0x14 + (0x28 - 0x14) * tt);
            const gg = Math.floor(0x1e + (0x32 - 0x1e) * tt);
            const b = Math.floor(0x3a + (0x52 - 0x3a) * tt);
            g.fillStyle((r << 16) | (gg << 8) | b, 1);
            g.fillRect(wx, wy + i, ww, 1);
        }
        // Звёзды
        for (let i = 0; i < 70; i++) {
            const sx = wx + Math.random() * ww;
            const sy = wy + Math.random() * wh * 0.5;
            g.fillStyle(0xffffff, 0.4 + Math.random() * 0.5);
            g.fillCircle(sx, sy, 0.7 + Math.random() * 1);
        }
        // Луна
        g.fillStyle(0xf5f0d8, 0.9); g.fillCircle(wx + ww * 0.78, wy + wh * 0.18, 26);
        g.fillStyle(0x2a3455, 1); g.fillCircle(wx + ww * 0.78 - 8, wy + wh * 0.18 - 4, 22);

        // Дальние горы
        g.fillStyle(0x2c3a55, 1);
        g.beginPath();
        g.moveTo(wx, wy + wh * 0.68);
        g.lineTo(wx + ww * 0.12, wy + wh * 0.5);
        g.lineTo(wx + ww * 0.24, wy + wh * 0.6);
        g.lineTo(wx + ww * 0.42, wy + wh * 0.36);
        g.lineTo(wx + ww * 0.58, wy + wh * 0.55);
        g.lineTo(wx + ww * 0.72, wy + wh * 0.42);
        g.lineTo(wx + ww * 0.88, wy + wh * 0.58);
        g.lineTo(wx + ww, wy + wh * 0.5);
        g.lineTo(wx + ww, wy + wh);
        g.lineTo(wx, wy + wh);
        g.closePath(); g.fillPath();
        // Снег на горах
        g.fillStyle(0xdde8f5, 0.95);
        g.fillTriangle(wx + ww * 0.42, wy + wh * 0.36, wx + ww * 0.36, wy + wh * 0.44, wx + ww * 0.48, wy + wh * 0.44);
        g.fillTriangle(wx + ww * 0.12, wy + wh * 0.5, wx + ww * 0.07, wy + wh * 0.56, wx + ww * 0.17, wy + wh * 0.56);
        g.fillTriangle(wx + ww * 0.72, wy + wh * 0.42, wx + ww * 0.68, wy + wh * 0.48, wx + ww * 0.76, wy + wh * 0.48);

        g.fillStyle(0x5a3a20, 0.18); g.fillRect(0, 500, 130, 450);
      

        // Передние горы
        g.fillStyle(0x3a4d6b, 1);
        g.beginPath();
        g.moveTo(wx, wy + wh * 0.82);
        g.lineTo(wx + ww * 0.18, wy + wh * 0.62);
        g.lineTo(wx + ww * 0.35, wy + wh * 0.78);
        g.lineTo(wx + ww * 0.55, wy + wh * 0.58);
        g.lineTo(wx + ww * 0.75, wy + wh * 0.75);
        g.lineTo(wx + ww, wy + wh * 0.68);
        g.lineTo(wx + ww, wy + wh);
        g.lineTo(wx, wy + wh);
        g.closePath(); g.fillPath();
        g.fillStyle(0xc8d4e4, 0.7);
        g.fillTriangle(wx + ww * 0.55, wy + wh * 0.58, wx + ww * 0.51, wy + wh * 0.63, wx + ww * 0.59, wy + wh * 0.63);

        // Снежный пол в окне
        g.fillStyle(0xb8c8dc, 0.55);
        g.fillRect(wx, wy + wh * 0.88, ww, wh * 0.12);

        // Ёлки
        for (let i = 0; i < 9; i++) {
            const tx = wx + 25 + i * (ww / 9) + (Math.random() * 20 - 10);
            const ty = wy + wh * 0.78 + Math.random() * 40;
            const th = 50 + Math.random() * 40;
            g.fillStyle(0x101a26, 0.95);
            for (let layer = 0; layer < 3; layer++) {

            g.fillCircle(sx, sy, 0.5 + Math.random() * 1.6);
        }

        // Переплёт
        g.fillStyle(0x4a2c14, 1);
        g.fillRect(wx + ww / 2 - 6, wy, 12, wh);
        g.fillRect(wx, wy + wh / 2 - 6, ww, 12);
        g.lineStyle(4, 0x6a4220, 1);
        g.strokeRect(wx - 6, wy - 6, ww + 12, wh + 12);

        // Пол
        g.fillStyle(0x4a2e18, 1); g.fillRect(0, 950, W, H - 950);
        for (let y = 950; y < H; y += 24) {
            g.fillStyle(0x2a1a0e, 0.45); g.fillRect(0, y, W, 3);
