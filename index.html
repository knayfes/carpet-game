const QUEST_POOL = [

    { id: 'clean5',   icon: '🧽', text: 'Почисти 5 ковров',          target: 5,   type: 'cleanToday',       reward: 400 },
    { id: 'clean10',  icon: '🧽', text: 'Почисти 10 ковров',         target: 10,  type: 'cleanToday',       reward: 900 },

const ROOM_SKINS = [

const BRUSH_SKINS = [

const PETS = [

    { id: 'parrot',  icon: '🦜', name: 'Попугай',  desc: '+10% к деньгам навсегда', price: BALANCE.petParrotPrice }

const DAILY_REWARDS = [
    { money: 200, food: 0, icon: '💰' },
    { money: 300, food: 0, icon: '💰' },
    { money: 500, food: 0, icon: '💰' },
    { money: 300, food: 1, icon: '🍞' },
    { money: 800, food: 0, icon: '💰' },
    { money: 1000, food: 0, icon: '💰' },
    { money: 5000, food: 1, icon: '👑' }
];

const TEXT_STYLES = {
    title: (color = '#FFD700') => ({
        fontSize: '48px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 6,
        shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
    }),
    stat: (color = '#FFFFFF', size = 30) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true }
    }),
    button: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true }
    }),
    shop: (color = '#FFFFFF', size = 28) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 4, align: 'center'
    }),
    shopInfo: (color = '#FFFFFF', size = 20) => ({
        fontSize: size + 'px', fill: color, fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 3, align: 'center'
    }),
    message: (color = '#FFFF00', size = 26) => ({
        fontSize: size + 'px', fill: color, fontStyle: 'bold', fontFamily: 'Arial',
        stroke: '#000000', strokeThickness: 5,
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 4, fill: true },
        align: 'center', wordWrap: { width: 640 }
    })
};

function formatTime(sec) {
    if (!sec || sec <= 0 || sec > 99999) return '—';
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}
function todayKey() {
    const d = new Date();
    return `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
}
function getTimeOfDay() {
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return 'morning';
    if (h >= 11 && h < 17) return 'day';
    if (h >= 17 && h < 22) return 'evening';
    return 'night';
}

/* ============================================================
   GAMESTATE
   ============================================================ */
class GameState {
    constructor() {
        this.money = BALANCE.startMoney;
        this.food = BALANCE.startFood;
        this.toolLevel = BALANCE.startToolLevel;
        this.soapLevel = 1;
        this.washLevel = 1;
        this.swatterLevel = 0;
        this.carpetIndex = 1;
        this.carpetLevel = 0;
        this.carpetsCleaned = 0;
        this.bugsKilledTotal = 0;
        this.starsPopped = 0;
        this.maxMoney = 0;
        this.autoFoodEnabled = false;
        this.prestigeLevel = 0;
        this.carpetStats = {};
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            this.carpetStats[i] = { cleanings: 0, bestTime: 0 };
        }
        this.doubleBugReward = false;
        this.selectedRoom = 'classic';
        this.selectedBrush = 'classic';
        this.unlockedRooms = ['classic'];
        this.unlockedBrushes = ['classic'];
        this.achievements = {};
        this.questDate = '';
        this.quests = [];
        this.questProgress = {};
        this.questClaimed = {};
        this.questCounters = {
            cleanToday: 0, killBugsToday: 0, fastCleanToday: 0,
            soapUsesToday: 0, moneyEarnedToday: 0, petActionsToday: 0, starsToday: 0
        };
        this.lastAdTime = 0;
        this.tutorialDone = false;
        this.pets = { cat: false, dog: false, hamster: false, parrot: false };
        this.settings = { vibration: true };
        this.dailyBonus = { lastClaimDate: '', streakDay: 0 };
        this.leaderboardBestMoney = 0;
        this.leaderboardBestPrestige = 0;
    }

    getCurrentRadius() { return Math.floor(BALANCE.brushRadius * (1 + (this.toolLevel - 1) * BALANCE.toolRadiusBonus)); }
    getRewardMultiplier() {
        let m = Math.pow(BALANCE.rewardMultiplierPerCarpet, this.carpetLevel);
        if (this.pets.parrot) m *= (1 + BALANCE.petParrotBonus);
        return m;
    }
    getToolMoneyMultiplier() { return 1 + (this.toolLevel - 1) * BALANCE.toolMoneyBonus; }
    getRequiredRadius() { return BALANCE.newCarpetRadiusRequired + this.carpetLevel * BALANCE.newCarpetRadiusIncrease; }
    getNewCarpetPrice() { return BALANCE.newCarpetBasePrice * this.carpetIndex; }
    getAutoFoodPrice() { return BALANCE.autoFoodBasePrice + this.carpetLevel * BALANCE.autoFoodPriceIncrease; }
    getToolUpgradePrice() { return this.toolLevel * BALANCE.toolBasePrice; }
    getSoapUpgradePrice() { return this.soapLevel * BALANCE.soapBasePrice; }
    getWashUpgradePrice() { return this.washLevel * BALANCE.washBasePrice; }
    getSwatterUpgradePrice() { return BALANCE.swatterBasePrice + this.swatterLevel * BALANCE.swatterBasePrice; }
    getSoapPower() { return BALANCE.soapPower * (1 + (this.soapLevel - 1) * 0.40); }
    getWashStrength() { return BALANCE.washStrength * (1 + (this.washLevel - 1) * 0.35); }
    getSwatterCooldown() { return Math.max(80, BALANCE.swatterCooldown - this.swatterLevel * 20); }
    getSwatterRadius() { return BALANCE.swatterRadius + this.swatterLevel * 3; }
    getPrestigeMultiplier() { return Math.pow(BALANCE.prestigeMultiplier, this.prestigeLevel); }
    getPrestigeTitle() {
        const titles = ['Новичок', 'Профи', 'Мастер', 'Гуру ковров', 'Легенда'];
        return titles[Math.min(this.prestigeLevel, titles.length - 1)];
    }
    getPetsOwned() { return Object.values(this.pets).filter(Boolean).length; }
    getDayNightBonus() {
        const t = getTimeOfDay();
        if (t === 'night') return BALANCE.dayNightBonus * 1.5;
        if (t === 'morning') return BALANCE.dayNightBonus;
        if (t === 'evening') return BALANCE.dayNightBonus * 0.8;
        return 0;
    }

    canPrestige() { return this.carpetIndex >= BALANCE.totalCarpets; }
    prestige() {
        if (!this.canPrestige()) return false;
        this.prestigeLevel += 1;
        this.money = 0;
        this.food = BALANCE.startFood;
        this.toolLevel = BALANCE.startToolLevel;
        this.carpetIndex = 1;
        this.carpetLevel = 0;
        this.autoFoodEnabled = false;
        if (this.prestigeLevel > this.leaderboardBestPrestige) this.leaderboardBestPrestige = this.prestigeLevel;
        return true;
    }

    recordCarpetFinish(carpetIndex, timeSec) {
        if (!this.carpetStats[carpetIndex]) this.carpetStats[carpetIndex] = { cleanings: 0, bestTime: 0 };
        const st = this.carpetStats[carpetIndex];
        st.cleanings += 1;
        if (timeSec > 0 && (st.bestTime === 0 || timeSec < st.bestTime)) st.bestTime = timeSec;
    }

    addReward(timeSec = 0) {
        const base = Math.floor(BALANCE.rewardMin + Math.random() * (BALANCE.rewardMax - BALANCE.rewardMin));
        const dayNight = 1 + this.getDayNightBonus();
        const reward = Math.floor(base * this.getRewardMultiplier() * this.getToolMoneyMultiplier() * this.getPrestigeMultiplier() * dayNight);
        this.money += reward;
        if (this.money > this.maxMoney) this.maxMoney = this.money;
        if (this.maxMoney > this.leaderboardBestMoney) this.leaderboardBestMoney = this.maxMoney;
        this.food -= 1;
        this.carpetsCleaned += 1;
        this.questCounters.cleanToday += 1;
        this.questCounters.moneyEarnedToday += reward;
        if (timeSec > 0 && timeSec < 50) this.questCounters.fastCleanToday += 1;
        this.recordCarpetFinish(this.carpetIndex, timeSec);
        if (this.autoFoodEnabled && this.money >= this.getAutoFoodPrice()) {
            this.money -= this.getAutoFoodPrice();
            this.food += 1;
        }
        return reward;
    }

    addMoney(amount) {
        this.money += amount;
        if (this.money > this.maxMoney) this.maxMoney = this.money;
        if (this.maxMoney > this.leaderboardBestMoney) this.leaderboardBestMoney = this.maxMoney;
    }

    registerBugKill() {
        this.bugsKilledTotal += 1;
        this.questCounters.killBugsToday += 1;
    }
    registerSoapUse(n = 1) { this.questCounters.soapUsesToday += n; }
    registerPetAction() { this.questCounters.petActionsToday += 1; }
    registerStarPopped(n = 1) {
        this.starsPopped += n;
        this.questCounters.starsToday += n;
    }

    canBuyNewCarpet() {
        return this.getCurrentRadius() >= this.getRequiredRadius()
            && this.money >= this.getNewCarpetPrice()
            && this.carpetIndex < BALANCE.totalCarpets;
    }
    buyNewCarpet() {
        if (!this.canBuyNewCarpet()) return false;
        this.money = 0;
        this.food = BALANCE.startFood;
        this.carpetIndex += 1;
        this.carpetLevel += 1;
        return true;
    }

    upgradeTool() { const p = this.getToolUpgradePrice(); if (this.money < p) return false; this.money -= p; this.toolLevel += 1; return true; }
    upgradeSoap() { const p = this.getSoapUpgradePrice(); if (this.money < p) return false; this.money -= p; this.soapLevel += 1; return true; }
    upgradeWash() { const p = this.getWashUpgradePrice(); if (this.money < p) return false; this.money -= p; this.washLevel += 1; return true; }
    upgradeSwatter() { const p = this.getSwatterUpgradePrice(); if (this.money < p) return false; this.money -= p; this.swatterLevel += 1; return true; }
    buyDoubleBug() {
        if (this.doubleBugReward) return false;
        if (this.money < BALANCE.doubleBugPrice) return false;
        this.money -= BALANCE.doubleBugPrice; this.doubleBugReward = true; return true;
    }
    buyFood() { if (this.money < BALANCE.foodPrice) return false; this.money -= BALANCE.foodPrice; this.food += 1; return true; }
    buyFoodBulk() {
        const total = Math.floor(BALANCE.foodPrice * BALANCE.foodBulkCount * BALANCE.foodBulkDiscount);
        if (this.money < total) return false;
        this.money -= total; this.food += BALANCE.foodBulkCount; return true;
    }
    buyAutoFood() {
        if (this.autoFoodEnabled) return false;
        const p = this.getAutoFoodPrice();
        if (this.money < p) return false;
        this.money -= p; this.autoFoodEnabled = true; return true;
    }
    buyPet(id) {
        if (this.pets[id]) return false;
        const pet = PETS.find(p => p.id === id);
        if (!pet) return false;
        if (this.money < pet.price) return false;
        this.money -= pet.price;
        this.pets[id] = true;
        return true;
    }

    buyRoomSkin(id) {
        const skin = ROOM_SKINS.find(s => s.id === id);
        if (!skin || this.unlockedRooms.includes(id)) return false;
        if (this.money < skin.price) return false;
        this.money -= skin.price; this.unlockedRooms.push(id); return true;
    }
    selectRoomSkin(id) { if (!this.unlockedRooms.includes(id)) return false; this.selectedRoom = id; return true; }
    buyBrushSkin(id) {
        const skin = BRUSH_SKINS.find(s => s.id === id);
        if (!skin || this.unlockedBrushes.includes(id)) return false;
        if (this.money < skin.price) return false;
        this.money -= skin.price; this.unlockedBrushes.push(id); return true;
    }
    selectBrushSkin(id) { if (!this.unlockedBrushes.includes(id)) return false; this.selectedBrush = id; return true; }
    getBrushIcon() { const s = BRUSH_SKINS.find(b => b.id === this.selectedBrush); return s ? s.icon : '🧼'; }

    getAchievementValue(type) {
        switch (type) {
            case 'carpetsCleaned': return this.carpetsCleaned;
            case 'maxMoney': return this.maxMoney;
            case 'bugsKilledTotal': return this.bugsKilledTotal;
            case 'starsPopped': return this.starsPopped;
            case 'bestTime': {
                let best = 99999;
                for (const k in this.carpetStats) {
                    const t = this.carpetStats[k].bestTime;
                    if (t > 0 && t < best) best = t;
                }
                return best;
            }
            case 'prestigeLevel': return this.prestigeLevel;
            case 'soapLevel': return this.soapLevel;
            case 'washLevel': return this.washLevel;
            case 'roomsUnlocked': return this.unlockedRooms.length;
            case 'brushesUnlocked': return this.unlockedBrushes.length;
            case 'petsOwned': return this.getPetsOwned();
            case 'dailyStreak': return this.dailyBonus.streakDay;
            default: return 0;
        }
    }
    checkAchievements() {
        const unlocked = [];
        for (const a of ACHIEVEMENTS) {
            if (this.achievements[a.id]) continue;
            const val = this.getAchievementValue(a.type);
            const ok = a.type === 'bestTime' ? (val <= a.target && val > 0) : (val >= a.target);
            if (ok) { this.achievements[a.id] = true; this.money += a.reward; unlocked.push(a); }
        }
        return unlocked;
    }

    refreshDailyQuests() {
        const today = todayKey();
        if (this.questDate === today && this.quests.length === 3) return false;
        this.questDate = today;
        const pool = [...QUEST_POOL];
        this.quests = [];
        for (let i = 0; i < 3 && pool.length > 0; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            this.quests.push(pool.splice(idx, 1)[0]);
        }
        this.questProgress = {};
        this.questClaimed = {};
        this.questCounters = {
            cleanToday: 0, killBugsToday: 0, fastCleanToday: 0,
            soapUsesToday: 0, moneyEarnedToday: 0, petActionsToday: 0, starsToday: 0
        };
        return true;
    }
    getQuestValue(q) { return this.questCounters[q.type] || 0; }
    isQuestComplete(q) { return this.getQuestValue(q) >= q.target; }
    claimQuest(q) {
        if (this.questClaimed[q.id]) return false;
        if (!this.isQuestComplete(q)) return false;
        this.questClaimed[q.id] = true;
        this.money += q.reward;
        return true;
    }

    getDailyStatus() {
        const today = todayKey();
        const last = this.dailyBonus.lastClaimDate;
        const canClaim = last !== today;
        let nextDay = this.dailyBonus.streakDay + 1;
        if (!last) nextDay = 1;
        else if (last !== today) {
            const yesterday = new Date();
            yesterday.setUTCDate(yesterday.getUTCDate() - 1);
            const yKey = `${yesterday.getUTCFullYear()}-${yesterday.getUTCMonth() + 1}-${yesterday.getUTCDate()}`;
            if (last !== yKey) nextDay = 1;
        }
        if (nextDay > 7) nextDay = 1;
        return { canClaim, nextDay };
    }
    claimDailyBonus() {
        const st = this.getDailyStatus();
        if (!st.canClaim) return null;
        const reward = DAILY_REWARDS[st.nextDay - 1];
        this.money += reward.money;
        this.food += reward.food;
        this.dailyBonus.lastClaimDate = todayKey();
        this.dailyBonus.streakDay = st.nextDay;
        return reward;
    }

    toSaveObject() {
        const obj = {
            money: this.money, food: this.food, toolLevel: this.toolLevel,
            soapLevel: this.soapLevel, washLevel: this.washLevel, swatterLevel: this.swatterLevel,
            carpetIndex: this.carpetIndex, carpetLevel: this.carpetLevel,
            carpetsCleaned: this.carpetsCleaned, bugsKilledTotal: this.bugsKilledTotal,
            starsPopped: this.starsPopped,
            maxMoney: this.maxMoney,
            autoFoodEnabled: this.autoFoodEnabled ? 1 : 0,
            prestigeLevel: this.prestigeLevel,
            doubleBugReward: this.doubleBugReward ? 1 : 0,
            selectedRoom: this.selectedRoom, selectedBrush: this.selectedBrush,
            unlockedRooms: this.unlockedRooms.join(','),
            unlockedBrushes: this.unlockedBrushes.join(','),
            achievements: Object.keys(this.achievements).join(','),
            questDate: this.questDate,
            quests: JSON.stringify(this.quests),
            questProgress: JSON.stringify(this.questProgress),
            questClaimed: JSON.stringify(this.questClaimed),
            questCounters: JSON.stringify(this.questCounters),
            lastAdTime: this.lastAdTime,
            tutorialDone: this.tutorialDone ? 1 : 0,
            pets: JSON.stringify(this.pets),
            settings: JSON.stringify(this.settings),
            dailyBonus: JSON.stringify(this.dailyBonus),
            leaderboardBestMoney: this.leaderboardBestMoney,
            leaderboardBestPrestige: this.leaderboardBestPrestige
        };
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            const st = this.carpetStats[i] || { cleanings: 0, bestTime: 0 };
            obj['carpet' + i + '_cleanings'] = st.cleanings;
            obj['carpet' + i + '_best'] = st.bestTime;
        }
        return obj;
    }
    fromSaveObject(d) {
        if (!d) return;
        const n = (v, fallback) => (v === undefined || v === null ? fallback : Number(v));
        const s = (v, fallback) => (v === undefined || v === null || v === '' ? fallback : String(v));
        this.money = n(d.money, this.money);
        this.food = n(d.food, this.food);
        this.toolLevel = n(d.toolLevel, this.toolLevel);
        this.soapLevel = n(d.soapLevel, 1);
        this.washLevel = n(d.washLevel, 1);
        this.swatterLevel = n(d.swatterLevel, 0);
        this.carpetIndex = n(d.carpetIndex, this.carpetIndex);
        this.carpetLevel = n(d.carpetLevel, this.carpetLevel);
        this.carpetsCleaned = n(d.carpetsCleaned, this.carpetsCleaned);
        this.bugsKilledTotal = n(d.bugsKilledTotal, 0);
        this.starsPopped = n(d.starsPopped, 0);
        this.maxMoney = n(d.maxMoney, this.money);
        this.autoFoodEnabled = Number(d.autoFoodEnabled) === 1;
        this.prestigeLevel = n(d.prestigeLevel, 0);
        this.doubleBugReward = Number(d.doubleBugReward) === 1;
        this.selectedRoom = s(d.selectedRoom, 'classic');
        this.selectedBrush = s(d.selectedBrush, 'classic');
        this.unlockedRooms = d.unlockedRooms ? String(d.unlockedRooms).split(',').filter(Boolean) : ['classic'];
        this.unlockedBrushes = d.unlockedBrushes ? String(d.unlockedBrushes).split(',').filter(Boolean) : ['classic'];
        this.achievements = {};
        if (d.achievements) String(d.achievements).split(',').filter(Boolean).forEach(id => this.achievements[id] = true);
        this.questDate = s(d.questDate, '');
        try { this.quests = d.quests ? JSON.parse(d.quests) : []; } catch { this.quests = []; }
        try { this.questProgress = d.questProgress ? JSON.parse(d.questProgress) : {}; } catch { this.questProgress = {}; }
        try { this.questClaimed = d.questClaimed ? JSON.parse(d.questClaimed) : {}; } catch { this.questClaimed = {}; }
        try { this.questCounters = d.questCounters ? JSON.parse(d.questCounters) : this.questCounters; } catch {}
        this.lastAdTime = n(d.lastAdTime, 0);
        this.tutorialDone = Number(d.tutorialDone) === 1;
        try { this.pets = d.pets ? JSON.parse(d.pets) : this.pets; } catch {}
        try { this.settings = d.settings ? Object.assign(this.settings, JSON.parse(d.settings)) : this.settings; } catch {}
        try { this.dailyBonus = d.dailyBonus ? Object.assign(this.dailyBonus, JSON.parse(d.dailyBonus)) : this.dailyBonus; } catch {}
        this.leaderboardBestMoney = n(d.leaderboardBestMoney, 0);
        this.leaderboardBestPrestige = n(d.leaderboardBestPrestige, 0);
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            this.carpetStats[i] = {
                cleanings: n(d['carpet' + i + '_cleanings'], 0),
                bestTime: n(d['carpet' + i + '_best'], 0)
            };
        }
    }
}

/* ============================================================
   SAVE / ADS / LEADERBOARD
   ============================================================ */
class SaveSystem {
    constructor(state) { this.state = state; this.ysdk = null; this.useLocal = false; }
    async init() {
        try {
            if (typeof YaGames === 'undefined') throw new Error('no SDK');
            this.ysdk = await YaGames.init();
            const keys = Object.keys(this.state.toSaveObject());
            const stats = await this.ysdk.player.getStats(keys);
            this.state.fromSaveObject(stats);
        } catch (e) {
            this.useLocal = true;
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (raw) this.state.fromSaveObject(JSON.parse(raw));
            } catch {}
        }
        return this;
    }
    ready() { try { this.ysdk?.features?.LoadingAPI?.ready(); } catch {} }
    async save() {
        const data = this.state.toSaveObject();
        if (!this.useLocal && this.ysdk) {
            try { await this.ysdk.player.setStats(data); } catch {}
        }
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
    }
    async fullReset() {
        try {
            const fresh = new GameState();
            this.state.fromSaveObject(fresh.toSaveObject());
            try { localStorage.removeItem(SAVE_KEY); } catch {}
            const data = this.state.toSaveObject();
            if (!this.useLocal && this.ysdk) {
                try { await this.ysdk.player.setStats(data); } catch {}
            }
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch {}
            return true;
        } catch { return false; }
    }
}

class AdsSystem {
    constructor(saveSystem) {
        this.saveSystem = saveSystem;
        this.ysdk = saveSystem.ysdk;
        this.busy = false;
    }
    isAvailable() { return !!this.ysdk?.adv?.showRewardedVideo; }
    getCooldownRemaining() {
        const now = Date.now();
        const last = this.saveSystem.state.lastAdTime || 0;
        return Math.max(0, BALANCE.adCooldownMs - (now - last));
    }
    async showRewarded() {
        if (this.busy) return false;
        if (this.getCooldownRemaining() > 0) return false;
        this.busy = true;
        if (!this.isAvailable()) {
            this.busy = false;
            this.saveSystem.state.lastAdTime = Date.now();
            return true;
        }
        return new Promise((resolve) => {
            let rewarded = false;
            try {
                this.ysdk.adv.showRewardedVideo({
                    callbacks: {
                        onRewarded: () => { rewarded = true; },
                        onClose: () => {
                            this.busy = false;
                            if (rewarded) this.saveSystem.state.lastAdTime = Date.now();
                            resolve(rewarded);
                        },
                        onError: () => { this.busy = false; resolve(false); }
                    }
                });
            } catch (e) { this.busy = false; resolve(false); }
        });
    }
    async showFullscreen() {
        if (!this.ysdk?.adv?.showFullscreenAdv) return;
        try { this.ysdk.adv.showFullscreenAdv({ callbacks: { onClose: () => {} } }); } catch {}
    }
}

class LeaderboardSystem {
    constructor(state, saveSystem) {
        this.state = state;
        this.saveSystem = saveSystem;
        this.ysdk = saveSystem.ysdk;
        this.lb = null;
    }
    isAvailable() { return !!(this.ysdk?.getLeaderboards) && !this.saveSystem.useLocal; }
    async _init() {
        if (!this.isAvailable()) return false;
        if (this.lb) return true;
        try { this.lb = await this.ysdk.getLeaderboards(); return true; }
        catch { return false; }
    }
    async submitScores() {
        if (!await this._init()) return;
        try { await this.lb.setLeaderboardScore('bestMoney', this.state.leaderboardBestMoney); } catch {}
        try { await this.lb.setLeaderboardScore('prestige', this.state.leaderboardBestPrestige); } catch {}
    }
    async fetchTop(name = 'bestMoney', count = 10) {
        if (!await this._init()) return this._localTop(name, count);
        try {
            const res = await this.lb.getLeaderboardEntries(name, {
                quantityTop: count, includeUser: true, quantityAround: 3
            });
            return res.entries.map(e => ({
                rank: e.rank,
                score: e.score,
                name: e.player?.publicName || 'Гость',
                avatar: e.player?.avatarSmall || null,
                isMe: e.player?.scopePermission && e.rank === res.userRank
            }));
        } catch { return this._localTop(name, count); }
    }
    _localTop(name) {
        const st = this.state;
        const myBest = name === 'bestMoney' ? st.leaderboardBestMoney : st.leaderboardBestPrestige;
        return [{ rank: 1, score: myBest, name: 'Вы', avatar: null, isMe: true }];
    }
}

/* ============================================================
   FINISH STARS — финальные звёзды
   ============================================================ */
class FinishStarsSystem {
    constructor(scene, cleaning, state, effects) {
        this.scene = scene;
        this.cleaning = cleaning;
        this.state = state;
        this.effects = effects;
        this.stars = [];       // { icon, hit, cells: [] }
        this.active = false;
        this.onAllPopped = null;
        this.onStarPopped = null;
    }

    /* Активация: превращаем оставшуюся грязь в кликабельные звёзды */
    activate() {
        if (this.active) return;
        const cs = this.cleaning.cellSize;
        const cols = this.cleaning.cols;
        const rows = this.cleaning.rows;
        const originX = this.cleaning.originX;
        const originY = this.cleaning.originY;
        const dirt = this.cleaning.dirt;

        const minDist = BALANCE.finishStarMinDist;
        const clusters = [];

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const i = row * cols + col;
                if (dirt[i] < 0.01) continue;
                const cx = originX + col * cs + cs / 2;
                const cy = originY + row * cs + cs / 2;

                let found = null;
                for (const c of clusters) {
                    const dx = c.x - cx;
                    const dy = c.y - cy;
                    if (dx * dx + dy * dy < minDist * minDist) { found = c; break; }
                }
                if (found) {
                    found.cells.push(i);
                    found.x = (found.x * (found.cells.length - 1) + cx) / found.cells.length;
                    found.y = (found.y * (found.cells.length - 1) + cy) / found.cells.length;
                } else {
                    clusters.push({ x: cx, y: cy, cells: [i] });
                }
            }
        }

        if (clusters.length === 0) {
            // Уже всё чисто — на всякий случай
            this.forceComplete();
            return;
        }

        this.active = true;

        for (const c of clusters) {
            const star = this.scene.add.text(c.x, c.y, '⭐', {
                fontSize: '44px', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(24);
            star.setScale(0);
            this.scene.tweens.add({
                targets: star, scale: 1, duration: 350, ease: 'Back.easeOut'
            });
            this.scene.tweens.add({
                targets: star, scaleX: 1.15, scaleY: 1.15,
                duration: 700, yoyo: true, repeat: -1, delay: 350, ease: 'Sine.easeInOut'
            });

            const hit = this.scene.add.circle(c.x, c.y, 45, 0x000000, 0.001)
                .setDepth(25).setInteractive({ useHandCursor: true });
            hit.on('pointerdown', () => this.popStar(c));

            this.stars.push({ star, hit, cells: c.cells });
        }

        this.scene.showMessage(`⭐ Собери все звёзды! (+${BALANCE.finishStarReward}💰 за каждую)`);
    }

    /* Тап по звезде: обнуляем клетки, даём деньги */
    popStar(cluster) {
        const entry = this.stars.find(s => s.cells === cluster.cells);
        if (!entry) return;

        const dirt = this.cleaning.dirt;
        const soap = this.cleaning.soap;
        for (const i of cluster.cells) { dirt[i] = 0; soap[i] = 0; }
        this.cleaning.needRedrawDirt = true;
        this.cleaning.needRedrawSoap = true;
        this.cleaning.recalcProgress();

        // Награда
        const reward = BALANCE.finishStarReward;
        this.state.addMoney(reward);
        this.state.registerStarPopped(1);
        this.effects.moneyPopup(cluster.x, cluster.y, reward, '#FFD700');
        this.effects.starBurst(cluster.x, cluster.y, 6);

        // Убираем звезду
        entry.star.disableInteractive();
        entry.hit.disableInteractive();
        this.scene.tweens.add({
            targets: entry.star,
            scale: 2, alpha: 0, angle: 180,
            duration: 350, ease: 'Cubic.easeOut',
            onComplete: () => entry.star.destroy()
        });
        entry.hit.destroy();

        const idx = this.stars.indexOf(entry);
        if (idx > -1) this.stars.splice(idx, 1);

        this.onStarPopped?.(cluster.cells.length);

        if (this.stars.length === 0) {
            this.active = false;
            this.forceComplete();
            this.onAllPopped?.();
        }
    }

    /* Форсированно очищаем всё и ставим 100% */
    forceComplete() {
        const dirt = this.cleaning.dirt;
        const soap = this.cleaning.soap;
        const total = dirt.length;
        for (let i = 0; i < total; i++) { dirt[i] = 0; soap[i] = 0; }
        this.cleaning.needRedrawDirt = true;
        this.cleaning.needRedrawSoap = true;
        this.cleaning.progress = 1.0;
        this.cleaning.recalcProgress();
    }

    /* Полная очистка при смене ковра / престиже */
    clear() {
        for (const s of this.stars) {
            if (s.star && s.star.active) s.star.destroy();
            if (s.hit && s.hit.active) s.hit.destroy();
        }
        this.stars = [];
        this.active = false;
    }

    get count() { return this.stars.length; }
}

/* ============================================================
   CLEANING / BUGS / ROOM / PETS
   ============================================================ */
class CleaningSystem {
    constructor(scene, bounds, state) {
        this.scene = scene;
        this.bounds = bounds;
        this.state = state;
        this.cellSize = BALANCE.gridCellSize;
        this.cols = Math.ceil(bounds.width / this.cellSize);
        this.rows = Math.ceil(bounds.height / this.cellSize);
        this.originX = bounds.x;
        this.originY = bounds.y;
        this.dirt = new Float32Array(this.cols * this.rows);
        this.soap = new Float32Array(this.cols * this.rows);
        this.dirt.fill(1.0);
        this.dirtGfx = scene.add.graphics().setDepth(1);
        this.soapGfx = scene.add.graphics().setDepth(2);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.progress = 0;
        this.onProgress = null;
        this.onErase = null;
        this.onSoap = null;
        this.onCelebrate = null;
        this.celebrationFired = false;
    }
    reset() {
        this.dirt.fill(1.0);
        this.soap.fill(0.0);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.progress = 0;
        this.celebrationFired = false;
        this.onProgress?.(this.progress);
    }
    applyStroke(localX, localY, radius, tool) {
        const cs = this.cellSize, cols = this.cols, rows = this.rows;
        const r2 = radius * radius;
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(cols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(rows - 1, Math.floor((localY + radius) / cs));
        const isSoap = tool === 'soap';
        const soapPower = this.state.getSoapPower();
        const washStrength = this.state.getWashStrength();
        let dirtChanged = false, soapChanged = false, erased = false, soapCells = 0;
        for (let row = minRow; row <= maxRow; row++) {
            const rowOff = row * cols;
            const dy = row * cs + cs / 2 - localY;
            const dy2 = dy * dy;
            if (dy2 > r2) continue;
            for (let col = minCol; col <= maxCol; col++) {
                const dx = col * cs + cs / 2 - localX;
                const d2 = dx * dx + dy2;
                if (d2 > r2) continue;
                const falloff = Math.max(0.5, 1 - Math.sqrt(d2) / radius);
                const i = rowOff + col;
                if (isSoap) {
                    if (this.soap[i] < 1.0) {
                        this.soap[i] = Math.min(1.0, this.soap[i] + soapPower * falloff);
                        soapChanged = true; soapCells++;
                    }
                } else {
                    if (this.soap[i] < BALANCE.soapThreshold) continue;
                    if (this.dirt[i] > 0.001) {
                        this.dirt[i] = Math.max(0, this.dirt[i] - washStrength * falloff);
                        if (this.dirt[i] < 0.01) this.dirt[i] = 0;
                        this.soap[i] = Math.max(0, this.soap[i] - 0.05);
                        dirtChanged = true; soapChanged = true; erased = true;
                    }
                }
            }
        }
        if (isSoap && soapCells > 0) this.state.registerSoapUse(soapCells);
        const screenX = localX + this.originX;
        const screenY = localY + this.originY;
        if (isSoap && soapChanged) this.onSoap?.(screenX, screenY);
        if (!isSoap && erased) this.onErase?.(screenX, screenY);
        if (dirtChanged) { this.needRedrawDirt = true; this.recalcProgress(); }
        if (soapChanged) this.needRedrawSoap = true;
        return { dirtChanged, soapChanged, erased };
    }
    recalcProgress() {
        let total = 0;
        const cells = this.dirt.length;
        let allClean = true;
        for (let i = 0; i < cells; i++) {
            total += 1 - this.dirt[i];
            if (this.dirt[i] > 0.05) allClean = false;
        }
        this.progress = total / cells;
        if (this.progress >= 0.9999 && allClean) this.progress = 1.0;
        if (this.progress >= 0.9999 && !allClean) this.progress = 0.9999;
        this.onProgress?.(this.progress);
        if (this.progress >= 1.0 && !this.celebrationFired) {
            this.celebrationFired = true;
            this.onCelebrate?.();
        }
    }
    draw() {
        if (this.needRedrawDirt) this.drawDirt();
        if (this.needRedrawSoap) this.drawSoap();
    }
    drawDirt() {
        const g = this.dirtGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols;
            const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const d = this.dirt[rowOff + col];
                if (d <= 0.05) continue;
                g.fillStyle(0x2a1a0a, d * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawDirt = false;
    }
    drawSoap() {
        const g = this.soapGfx, cs = this.cellSize;
        g.clear();
        for (let row = 0; row < this.rows; row++) {
            const rowOff = row * this.cols;
            const py = this.originY + row * cs;
            for (let col = 0; col < this.cols; col++) {
                const s = this.soap[rowOff + col];
                if (s < 0.05 || this.dirt[rowOff + col] < 0.1) continue;
                g.fillStyle(0xAAE0FF, s * 0.75);
                g.fillRect(this.originX + col * cs, py, cs, cs);
            }
        }
        this.needRedrawSoap = false;
    }
}

class BugSystem {
    constructor(scene, bounds, state, opts = {}) {
        this.scene = scene;
        this.bounds = bounds;
        this.state = state;
        this.padding = 40;
        this.bugs = [];
        this.lastSwat = 0;
        this.onKill = opts.onKill || null;
        this.onReward = opts.onReward || null;
    }
    get count() { return this.bugs.length; }
    getSwatterRadius() { return this.state.getSwatterRadius(); }
    clear() { this.bugs.forEach(b => b.destroy()); this.bugs = []; }
    spawnForLevel(carpetIndex) {
        if (carpetIndex < 2) return;
        const maxBugs = BALANCE.bugCountBase + carpetIndex;
        const n = Phaser.Math.Between(1, maxBugs);
        for (let i = 0; i < n; i++) this.spawnOne();
    }
    spawnOne() {
        const b = this.bounds;
        const x = Phaser.Math.Between(b.x + this.padding, b.x + b.width - this.padding);
        const y = Phaser.Math.Between(b.y + this.padding, b.y + b.height - this.padding);
        const bug = this.scene.add.container(x, y).setDepth(4);
        bug.add(this.buildBody());
        bug.bugAngle = Math.random() * Math.PI * 2;
        bug.bugSpeed = BALANCE.bugSpeed * (0.7 + Math.random() * 0.6);
        bug.isDead = false;
        bug.setRotation(bug.bugAngle);
        this.bugs.push(bug);
    }
    buildBody() {
        const g = this.scene.add.graphics();
        g.fillStyle(0x1a1a1a, 1); g.fillEllipse(0, 0, 36, 24);
        g.lineStyle(2, 0x000000, 1); g.strokeEllipse(0, 0, 36, 24);
        g.fillStyle(0x0a0a0a, 1); g.fillCircle(15, 0, 9);
        g.fillStyle(0xFFFFFF, 1); g.fillCircle(18, -4, 2.5); g.fillCircle(18, 4, 2.5);
        g.fillStyle(0x000000, 1); g.fillCircle(19, -4, 1.2); g.fillCircle(19, 4, 1.2);
        g.lineStyle(2, 0x0a0a0a, 1);
        g.beginPath();
        g.moveTo(-10, -10); g.lineTo(-15, -15);
        g.moveTo(-10, 10); g.lineTo(-15, 15);
        g.moveTo(0, -12); g.lineTo(-2, -18);
        g.moveTo(0, 12); g.lineTo(-2, 18);
        g.moveTo(10, -10); g.lineTo(15, -15);
        g.moveTo(10, 10); g.lineTo(15, 15);
        g.strokePath();
        return g;
    }
    kill(bug, fromPet = false) {
        if (bug.isDead) return;
        bug.isDead = true;
        if (!fromPet) this.state.registerBugKill();
        this.onKill?.(bug.x, bug.y, fromPet);
        if (!fromPet && this.state.doubleBugReward) {
            this.state.addMoney(BALANCE.bugRewardPerKill);
            this.onReward?.(bug.x, bug.y, BALANCE.bugRewardPerKill);
        }
        this.scene.tweens.add({
            targets: bug, alpha: 0, scale: 1.5,
            duration: BALANCE.bugFadeDuration, ease: 'Cubic.easeOut',
            onComplete: () => {
                const idx = this.bugs.indexOf(bug);
                if (idx > -1) this.bugs.splice(idx, 1);
                bug.destroy();
            }
        });
    }
    swat(x, y, now) {
        if (now - this.lastSwat < this.state.getSwatterCooldown()) return false;
        this.lastSwat = now;
        const r = this.state.getSwatterRadius();
        const r2 = r * r;
        let hit = false;
        for (let i = this.bugs.length - 1; i >= 0; i--) {
            const bug = this.bugs[i];
            if (bug.isDead) continue;
            const dx = bug.x - x, dy = bug.y - y;
            if (dx * dx + dy * dy <= r2) { this.kill(bug); hit = true; }
        }
        return hit;
    }
    scareOne() {
        if (this.bugs.length === 0) return null;
        const bug = this.bugs[0];
        this.kill(bug, true);
        return bug;
    }
    update(delta) {
        if (this.bugs.length === 0) return;
        const dt = delta / 1000;
        const b = this.bounds;
        const minX = b.x + this.padding, maxX = b.x + b.width - this.padding;
        const minY = b.y + this.padding, maxY = b.y + b.height - this.padding;
        for (const bug of this.bugs) {
            if (bug.isDead) continue;
            bug.x += Math.cos(bug.bugAngle) * bug.bugSpeed * dt;
            bug.y += Math.sin(bug.bugAngle) * bug.bugSpeed * dt;
            bug.setRotation(bug.bugAngle);
            if (bug.x < minX) { bug.x = minX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.x > maxX) { bug.x = maxX; bug.bugAngle = Math.PI - bug.bugAngle; }
            if (bug.y < minY) { bug.y = minY; bug.bugAngle = -bug.bugAngle; }
            if (bug.y > maxY) { bug.y = maxY; bug.bugAngle = -bug.bugAngle; }
            if (Math.random() < 0.005) bug.bugAngle += (Math.random() - 0.5) * 1.5;
        }
    }
}

class RoomRenderer {
    constructor(scene) {
        this.scene = scene;
        this.gfx = scene.add.graphics().setDepth(-10);
        this.tintRect = scene.add.rectangle(360, 640, 720, 1280, 0x000000, 0).setDepth(-5);
    }
    draw(skinId, level = 0, timeOfDay = 'day') {
        const W = 720, H = 1280, g = this.gfx;
        g.clear();
        switch (skinId) {
            case 'neon': this.drawNeon(g, W, H); break;
            case 'beach': this.drawBeach(g, W, H); break;
            case 'space': this.drawSpace(g, W, H); break;
            case 'candy': this.drawCandy(g, W, H); break;
            default: this.drawClassic(g, W, H, level);
        }
        this.applyTimeOfDay(timeOfDay);
    }
    applyTimeOfDay(time) {
        let color = 0x000000, alpha = 0;
        if (time === 'morning') { color = 0xFFDD88; alpha = 0.06; }
        else if (time === 'day') { color = 0x000000; alpha = 0; }
        else if (time === 'evening') { color = 0xFF6622; alpha = 0.18; }
        else if (time === 'night') { color = 0x0a0a2a; alpha = 0.35; }
        this.tintRect.setFillStyle(color, alpha);
    }
    drawClassic(g, W, H, level) {
        const isCozy = (level % 2 === 0);
        if (isCozy) {
            const colors = [0xE8D5B7, 0xD4B896, 0xC9A87C, 0xB89A6A, 0xA8895A];
            g.fillStyle(colors[level % colors.length], 1); g.fillRect(0, 0, W, 900);
            for (let x = 0; x < W; x += 60) { g.fillStyle(0x000000, 0.05); g.fillRect(x, 0, 30, 900); }
            g.fillStyle(0x8B5A2B, 1); g.fillRect(0, 900, W, H - 900);
            for (let y = 900; y < H; y += 40) { g.fillStyle(0x000000, 0.15); g.fillRect(0, y, W, 3); }
            g.fillStyle(0x5C3A1E, 1); g.fillRect(0, 880, W, 20);
            g.fillStyle(0xFFFFFF, 1); g.fillRect(80, 150, 200, 250);
            g.lineStyle(8, 0x5C3A1E, 1); g.strokeRect(80, 150, 200, 250);
            g.fillStyle(0xFFEB3B, 0.8); g.fillCircle(240, 200, 35);
        } else {
            const colors = [0x2C3E50, 0x34495E, 0x1A252F, 0x3D5A80, 0x293241];
            g.fillStyle(colors[level % colors.length], 1); g.fillRect(0, 0, W, 900);
            g.fillStyle(0x00E5FF, 0.5); g.fillRect(0, 400, W, 4);
            g.fillStyle(0xFF00E5, 0.5); g.fillRect(0, 500, W, 4);
            g.fillStyle(0x1a1a1a, 1); g.fillRect(0, 900, W, H - 900);
            g.lineStyle(3, 0x00E5FF, 0.6); g.strokeCircle(600, 250, 80);
            g.lineStyle(3, 0xFF00E5, 0.6); g.strokeRect(100, 180, 120, 120);
        }
    }
    drawNeon(g, W, H) {
        g.fillStyle(0x0a0a1a, 1); g.fillRect(0, 0, W, 900);
        for (let i = 0; i < 6; i++) { g.fillStyle(0xFF00E5, 0.04); g.fillRect(0, i * 150, W, 100); }
        g.fillStyle(0x1a1a2a, 1); g.fillRect(0, 900, W, H - 900);
        for (let x = 0; x < W; x += 40) { g.fillStyle(0x00E5FF, 0.15); g.fillRect(x, 900, 2, H - 900); }
        g.lineStyle(4, 0x00E5FF, 0.8); g.strokeCircle(600, 250, 100);
        g.lineStyle(4, 0xFF00E5, 0.8); g.strokeRect(80, 180, 160, 160);
        g.fillStyle(0xFF00E5, 0.3); g.fillRect(0, 880, W, 20);
    }
    drawBeach(g, W, H) {
        g.fillStyle(0x87CEEB, 1); g.fillRect(0, 0, W, 500);
        g.fillStyle(0xFFEB3B, 0.9); g.fillCircle(600, 200, 80);
        g.fillStyle(0x1E90FF, 1); g.fillRect(0, 500, W, 400);
        for (let y = 500; y < 900; y += 40) { g.fillStyle(0xFFFFFF, 0.2); g.fillRect(0, y, W, 3); }
        g.fillStyle(0xF4E4A0, 1); g.fillRect(0, 900, W, H - 900);
    }
    drawSpace(g, W, H) {
        g.fillStyle(0x050510, 1); g.fillRect(0, 0, W, H);
        for (let i = 0; i < 100; i++) {
            const x = (i * 137) % W, y = (i * 253) % 900;
            g.fillStyle(0xFFFFFF, 0.3 + (i % 10) * 0.07);
            g.fillCircle(x, y, 1 + (i % 3));
        }
        g.fillStyle(0x8844FF, 0.15); g.fillCircle(200, 300, 180);
        g.fillStyle(0xFF44AA, 0.1); g.fillCircle(550, 500, 220);
        g.fillStyle(0x0a0a1a, 1); g.fillRect(0, 900, W, H - 900);
    }
    drawCandy(g, W, H) {
        g.fillStyle(0xFFB6D9, 1); g.fillRect(0, 0, W, 900);
        for (let x = -200; x < W + 200; x += 80) {
            g.fillStyle(0xFFFFFF, 0.5);
            g.beginPath();
            g.moveTo(x, 0); g.lineTo(x + 40, 0); g.lineTo(x + 240, 900); g.lineTo(x + 200, 900);
            g.closePath(); g.fillPath();
        }
        g.fillStyle(0xFF8FC7, 1); g.fillRect(0, 900, W, H - 900);
        g.fillStyle(0xFF4488, 1); g.fillCircle(150, 250, 60);
        g.fillStyle(0x44FF88, 1); g.fillCircle(500, 200, 50);
    }
}

class PetSystem {
    constructor(scene, cleaning, bugs, effects, state) {
        this.scene = scene;
        this.cleaning = cleaning;
        this.bugs = bugs;
        this.effects = effects;
        this.state = state;
        this.timers = { cat: 0, dog: 0, hamster: 0 };
        this.icons = [];
        this.createIndicators();
    }
    createIndicators() {
        const order = ['cat', 'dog', 'hamster', 'parrot'];
        order.forEach((id, i) => {
            if (!this.state.pets[id]) return;
            const pet = PETS.find(p => p.id === id);
            const icon = this.scene.add.text(670, 240 + i * 55, pet.icon, { fontSize: '34px' })
                .setOrigin(0.5).setDepth(10).setAlpha(0.85);
            this.icons.push({ id, icon });
        });
    }
    refreshIndicators() {
        this.icons.forEach(i => i.icon.destroy());
        this.icons = [];
        this.createIndicators();
    }
    update(delta) {
        if (this.state.pets.cat) {
            this.timers.cat += delta;
            if (this.timers.cat >= BALANCE.petCatIntervalMs) { this.timers.cat = 0; this.catAction(); }
        }
        if (this.state.pets.dog) {
            this.timers.dog += delta;
            if (this.timers.dog >= BALANCE.petDogIntervalMs) { this.timers.dog = 0; this.dogAction(); }
        }
        if (this.state.pets.hamster) {
            this.timers.hamster += delta;
            if (this.timers.hamster >= BALANCE.petHamsterIntervalMs) { this.timers.hamster = 0; this.hamsterAction(); }
        }
    }
    catAction() {
        const dirt = this.cleaning.dirt;
        const cells = dirt.length;
        let tries = 0;
        while (tries++ < 30) {
            const i = Math.floor(Math.random() * cells);
            if (dirt[i] > 0.05) {
                dirt[i] = 0;
                this.cleaning.needRedrawDirt = true;
                this.cleaning.recalcProgress();
                this.state.registerPetAction();
                const col = i % this.cleaning.cols;
                const row = Math.floor(i / this.cleaning.cols);
                const px = this.cleaning.originX + col * this.cleaning.cellSize + this.cleaning.cellSize / 2;
                const py = this.cleaning.originY + row * this.cleaning.cellSize + this.cleaning.cellSize / 2;
                this.effects.petAction(px, py, '🐈');
                return;
            }
        }
    }
    dogAction() {
        const bug = this.bugs.scareOne();
        if (bug) {
            this.effects.petAction(bug.x, bug.y, '🐕');
            this.state.registerPetAction();
        }
    }
    hamsterAction() {
        this.state.food += 1;
        this.state.registerPetAction();
        this.effects.petAction(670, 320, '🐹');
        if (this.scene.refreshHUD) this.scene.refreshHUD();
    }
}

        this.onPrestige = null; this.onSkinChange = null; this.onPetBought = null;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.render(); }
    close() { this.isOpen = false; this.elements.forEach(e => e.destroy()); this.elements = []; }
    refresh() { if (!this.isOpen) return; this.close(); this.open(); }
    render() {
        const s = this.scene, W = 720, H = 1280;
        const push = (el) => { this.elements.push(el); return el; };
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(40)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 680, 1180, 0x2a2a2a).setDepth(41).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 100, '🛒 МАГАЗИН', TEXT_STYLES.title()).setOrigin(0.5).setDepth(42));
        this._renderTabs(push);
        if (this.activeTab === 'upgrades') this._renderUpgrades(push);
        else if (this.activeTab === 'skins') this._renderSkins(push);
        else if (this.activeTab === 'pets') this._renderPets(push);
        else if (this.activeTab === 'prestige') this._renderPrestige(push);
        push(s.add.text(630, 100, '✖', {
            fontSize: '52px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }
    _renderTabs(push) {
        const s = this.scene, st = this.state;
        const tabs = [
            { id: 'upgrades', label: '⚙️' },
            { id: 'skins', label: '🎨' },
            { id: 'pets', label: '🐾' },
            { id: 'prestige', label: '👑' + (st.canPrestige() ? '⚡' : '') }
        ];
        const tabW = 150, tabH = 55;
        const totalW = tabs.length * tabW + (tabs.length - 1) * 8;
        const startX = 360 - totalW / 2 + tabW / 2;
        tabs.forEach((tab, i) => {
            const x = startX + i * (tabW + 8);
            const y = 175;
            const active = this.activeTab === tab.id;
            push(s.add.rectangle(x, y, tabW, tabH, active ? 0xFFD700 : 0x444444)
                .setDepth(41).setStrokeStyle(3, active ? 0xFFFFFF : 0x666666)
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', () => { this.activeTab = tab.id; this.refresh(); }));
            push(s.add.text(x, y, tab.label, {
                fontSize: '26px', fill: active ? '#000000' : '#CCCCCC',
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(42));
        });
    }
    _renderUpgrades(push) {
        const s = this.scene, st = this.state;
        const item = (y, sublabel, price, onBuy, opts = {}) => {
            const canBuy = st.money >= price && !opts.disabled;
            const color = opts.disabled ? 0x333333 : (canBuy ? 0x444444 : 0x2a2a2a);
            const borderColor = opts.disabled ? 0x555555 : (canBuy ? 0x00FF00 : 0x666666);
            push(s.add.rectangle(360, y, 620, 56, color).setDepth(41).setStrokeStyle(2, borderColor, 0.6));
            push(s.add.text(70, y, sublabel, {
                fontSize: '15px', fill: opts.disabled ? '#888888' : '#FFFFFF',
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0, 0.5).setDepth(42));
            const priceStr = opts.priceLabel || `${price}💰`;
            push(s.add.text(630, y, priceStr, {
                fontSize: '18px', fill: opts.disabled ? '#666666' : (canBuy ? '#00FF00' : '#FF6666'),
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(1, 0.5).setDepth(42));
            const hit = push(s.add.rectangle(360, y, 620, 56, 0x000000, 0.001).setDepth(43));
            hit.setInteractive({ useHandCursor: true });
            hit.on('pointerdown', async () => {
                if (opts.disabled) return;
                if (canBuy) { onBuy(); }
                else { await this._offerAd(push, price - st.money); }
            });
        };
        let y = 240;
        item(y, `🍞 Купить еду (+1)`, BALANCE.foodPrice, async () => { st.buyFood(); await this._afterBuy(); });
        y += 62;
        const bulkPrice = Math.floor(BALANCE.foodPrice * BALANCE.foodBulkCount * BALANCE.foodBulkDiscount);
        item(y, `🍞 Купить ${BALANCE.foodBulkCount} еды (-15%)`, bulkPrice, async () => { st.buyFoodBulk(); await this._afterBuy(); });
        y += 62;
        item(y, st.autoFoodEnabled ? '✅ АВТОЕДА ВКЛ' : '🍞➡️ Автоеда (навсегда)', st.getAutoFoodPrice(),
            async () => { st.buyAutoFood(); await this._afterBuy(); }, { disabled: st.autoFoodEnabled });
        y += 62;
        const curR = st.getCurrentRadius();
        const nextR = Math.floor(BALANCE.brushRadius * (1 + st.toolLevel * BALANCE.toolRadiusBonus));
        const curM = Math.round(st.getToolMoneyMultiplier() * 100);
        const nextM = Math.round((1 + st.toolLevel * BALANCE.toolMoneyBonus) * 100);
        item(y, `🧹 Щётка ур.${st.toolLevel}  радиус ${curR}→${nextR}  доход ${curM}%→${nextM}%`,
            st.getToolUpgradePrice(), async () => { st.upgradeTool(); await this._afterBuy(); });
        y += 62;
        const curSoap = (st.getSoapPower() * 100).toFixed(0);
        const nextSoap = ((st.getSoapPower() + BALANCE.soapPower * 0.40) * 100).toFixed(0);
        item(y, `🧼 Мыло ур.${st.soapLevel}  сила ${curSoap}%→${nextSoap}%`,
            st.getSoapUpgradePrice(), async () => { st.upgradeSoap(); await this._afterBuy(); });
        y += 62;
        const curWash = (st.getWashStrength() * 100).toFixed(0);
        const nextWash = ((st.getWashStrength() + BALANCE.washStrength * 0.35) * 100).toFixed(0);
        item(y, `💧 Смыв ур.${st.washLevel}  сила ${curWash}%→${nextWash}%`,
            st.getWashUpgradePrice(), async () => { st.upgradeWash(); await this._afterBuy(); });
        y += 62;
        const curCd = st.getSwatterCooldown();
        const nextCd = Math.max(80, curCd - 20);
        item(y, `🪰 Мухобойка ур.${st.swatterLevel}  перезаряд ${curCd}→${nextCd}мс`,
            st.getSwatterUpgradePrice(), async () => { st.upgradeSwatter(); await this._afterBuy(); });
        y += 62;
        if (st.doubleBugReward) {
            item(y, `💰 Двойная награда за жука — ✅ ВКЛ`, 0, () => {}, { disabled: true, priceLabel: 'КУПЛЕНО' });
        } else {
            item(y, `💰 Двойная награда за жука (+${BALANCE.bugRewardPerKill}💰 за каждого)`,
                BALANCE.doubleBugPrice, async () => { st.buyDoubleBug(); await this._afterBuy(); });
        }
        y += 62;
        this._renderAdBlock(push, y);
        y += 90;
        this._renderNewCarpetSection(push, y);
    }
    _renderAdBlock(push, y) {
        const s = this.scene;
        const cooldown = this.ads.getCooldownRemaining();
        const available = cooldown <= 0;
        const label = available
            ? `📺 ПОСМОТРЕТЬ РЕКЛАМУ → +${BALANCE.adRewardMoney}💰`
            : `⏳ Реклама через ${Math.ceil(cooldown / 1000)}с`;
        push(s.add.rectangle(360, y, 620, 60, available ? 0x4a3a10 : 0x2a2a2a)
            .setDepth(41).setStrokeStyle(3, available ? 0xFFD700 : 0x666666, 0.8));
        push(s.add.text(360, y, label, {
            fontSize: '15px', fill: available ? '#FFD700' : '#888888',
            fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(42));
        if (available) {
            push(s.add.rectangle(360, y, 620, 60, 0x000000, 0.001).setDepth(43))
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', async () => { await this._showAdAndRefresh(); });
        }
    }
    _renderNewCarpetSection(push, y) {
        const s = this.scene, st = this.state;
        const hasNext = st.carpetIndex < BALANCE.totalCarpets;
        if (!hasNext) {
            push(s.add.rectangle(360, y, 620, 70, 0x2a2010).setDepth(41).setStrokeStyle(3, 0xFFD700, 0.8));
            push(s.add.text(360, y, '🏆 ВСЕ КОВРЫ ОТКРЫТЫ', {
                fontSize: '20px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(42));
            return;
        }
        const price = st.getNewCarpetPrice();
        const reqR = st.getRequiredRadius();
        const curR = st.getCurrentRadius();
        const radiusOk = curR >= reqR;
        const moneyOk = st.money >= price;
        const canBuy = radiusOk && moneyOk;
        let label, bg, border, textColor, hint;
        if (canBuy) {
            bg = 0x205020; border = 0x00FF00; textColor = '#00FF00';
            label = `🆕 КУПИТЬ КОВЁР №${st.carpetIndex + 1} — ${price}💰`;
            hint = '👆 НАЖМИ ЧТОБЫ КУПИТЬ';
        } else if (!radiusOk) {
            bg = 0x2a1010; border = 0xFF6666; textColor = '#FF8888';
            label = `🔒 Нужен радиус ${reqR} (сейчас ${curR})`;
            hint = '🧹 Прокачай щётку выше';
        } else {
            bg = 0x2a2010; border = 0xFFD700; textColor = '#FFD700';
            label = `🆕 Ковёр №${st.carpetIndex + 1} — нужно ${price}💰 (есть ${st.money}💰)`;
            hint = '💰 Не хватает денег — чисти или смотри рекламу';
        }
        push(s.add.rectangle(360, y, 620, 80, bg).setDepth(41).setStrokeStyle(3, border, 0.8));
        push(s.add.text(360, y - 14, label, {
            fontSize: '17px', fill: textColor, fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(42));
        push(s.add.text(360, y + 14, hint, {
            fontSize: '12px', fill: '#AAAAAA', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(42));
        if (canBuy) {
            push(s.add.rectangle(360, y, 620, 80, 0x000000, 0.001).setDepth(43))
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', async () => { await this.onBuyCarpet?.(); this.close(); });
        }
    }
    async _offerAd(push, missing) {
        const s = this.scene;
        const ov = s.add.rectangle(360, 640, 720, 1280, 0x000000, 0.7).setDepth(50); ov.setInteractive();
        const box = s.add.rectangle(360, 640, 560, 380, 0x1a1a1a).setDepth(51).setStrokeStyle(4, 0xFFD700);
        const txt = s.add.text(360, 540,
            `Не хватает ${missing}💰\n\nПосмотреть рекламу\nи получить +${BALANCE.adRewardMoney}💰?`,
            { ...TEXT_STYLES.shopInfo('#FFFFFF', 22), align: 'center' }).setOrigin(0.5).setDepth(52);
        const yes = s.add.text(260, 700, '📺 СМОТРЕТЬ', {
            fontSize: '22px', fill: '#000000', fontStyle: 'bold', fontFamily: 'Arial',
            backgroundColor: '#FFD700', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
        const no = s.add.text(460, 700, '❌ ОТМЕНА', {
            fontSize: '22px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial',
            backgroundColor: '#444444', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
        const cleanup = () => { ov.destroy(); box.destroy(); txt.destroy(); yes.destroy(); no.destroy(); };
        no.on('pointerdown', () => cleanup());
        yes.on('pointerdown', async () => { cleanup(); await this._showAdAndRefresh(); });
    }
    async _showAdAndRefresh() {
        const ok = await this.ads.showRewarded();
        if (ok) {
            this.state.addMoney(BALANCE.adRewardMoney);
            await this.onChanged?.();
            this.onMessage?.(`📺 +${BALANCE.adRewardMoney}💰!`);
            this.refresh();
        } else {
            this.onMessage?.('Реклама недоступна или отменена');
        }
    }
    async _afterBuy() { await this.onChanged?.(); this.refresh(); }
    _renderSkins(push) {
        const s = this.scene;
        push(s.add.text(360, 235, '🎨 СКИНЫ КОМНАТ', {
            ...TEXT_STYLES.shop('#FFFFFF', 20)
        }).setOrigin(0.5).setDepth(42));
        this._renderSkinGrid(push, ROOM_SKINS, 295, 'room');
        push(s.add.text(360, 520, '✨ СКИНЫ ЩЁТОК', {
            ...TEXT_STYLES.shop('#FFFFFF', 20)
        }).setOrigin(0.5).setDepth(42));
        this._renderSkinGrid(push, BRUSH_SKINS, 580, 'brush');
    }
    _renderSkinGrid(push, list, startY, kind) {
        const s = this.scene, st = this.state;
        const cardW = 110, cardH = 140, gap = 8;
        const totalW = list.length * cardW + (list.length - 1) * gap;
        const startX = 360 - totalW / 2 + cardW / 2;
        list.forEach((skin, i) => {
            const x = startX + i * (cardW + gap);
            const y = startY + cardH / 2;
            const unlocked = kind === 'room' ? st.unlockedRooms.includes(skin.id) : st.unlockedBrushes.includes(skin.id);
            const selected = kind === 'room' ? st.selectedRoom === skin.id : st.selectedBrush === skin.id;
            const bg = selected ? 0x2a5020 : (unlocked ? 0x2a2a2a : 0x1a1a1a);
            const border = selected ? 0x00FF00 : (unlocked ? 0x888888 : 0x444444);
            push(s.add.rectangle(x, y, cardW, cardH, bg).setDepth(41).setStrokeStyle(selected ? 4 : 2, border, 0.8));
            push(s.add.text(x, y - 30, skin.icon, { fontSize: '46px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(x, y + 15, skin.name, {
                fontSize: '13px', fill: unlocked ? '#FFFFFF' : '#888888',
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(42));
            const priceY = y + 45;
            if (selected) {
                push(s.add.text(x, priceY, '✅ ВЫБРАНО', {
                    fontSize: '12px', fill: '#00FF00', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(42));
            } else if (unlocked) {
                push(s.add.text(x, priceY, '👆 ВЫБРАТЬ', {
                    fontSize: '12px', fill: '#00E5FF', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(42));
            } else {
                push(s.add.text(x, priceY, `${skin.price}💰`, {
                    fontSize: '14px', fill: st.money >= skin.price ? '#FFD700' : '#FF6666',
                    fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(42));
            }
            const hit = push(s.add.rectangle(x, y, cardW, cardH, 0x000000, 0.001).setDepth(43));
            hit.setInteractive({ useHandCursor: true });
            hit.on('pointerdown', async () => {
                if (selected) return;
                if (unlocked) {
                    if (kind === 'room') st.selectRoomSkin(skin.id);
                    else st.selectBrushSkin(skin.id);
                    await this._afterBuy();
                    this.onSkinChange?.(kind);
                } else {
                    if (st.money >= skin.price) {
                        if (kind === 'room') st.buyRoomSkin(skin.id);
                        else st.buyBrushSkin(skin.id);
                        await this._afterBuy();
                        this.onMessage?.(`🎨 Куплен скин: ${skin.name}`);
                    } else {
                        await this._offerAd(push, skin.price - st.money);
                    }
                }
            });
        });
    }
    _renderPets(push) {
        const s = this.scene, st = this.state;
        push(s.add.text(360, 230, '🐾 ПИТОМЦЫ', {
            ...TEXT_STYLES.shop('#FFD700', 26)
        }).setOrigin(0.5).setDepth(42));
        push(s.add.text(360, 265, 'Помогают автоматически', {
            ...TEXT_STYLES.shopInfo('#AAAAAA', 15)
        }).setOrigin(0.5).setDepth(42));
        PETS.forEach((pet, i) => {
            const y = 340 + i * 130;
            const owned = st.pets[pet.id];
            const canBuy = st.money >= pet.price;
            push(s.add.rectangle(360, y, 620, 110, owned ? 0x2a4020 : 0x252525)
                .setDepth(41).setStrokeStyle(3, owned ? 0x00FF00 : 0x666666, 0.7));
            push(s.add.text(80, y, pet.icon, { fontSize: '56px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(130, y - 25, pet.name, {
                fontSize: '22px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0, 0.5).setDepth(42));
            push(s.add.text(130, y + 8, pet.desc, {
                fontSize: '15px', fill: '#AAAAAA', fontFamily: 'Arial'
            }).setOrigin(0, 0.5).setDepth(42));
            if (owned) {
                push(s.add.text(600, y, '✅ ЕСТЬ', {
                    fontSize: '22px', fill: '#00FF00', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(1, 0.5).setDepth(42));
            } else {
                push(s.add.text(600, y, `${pet.price}💰`, {
                    fontSize: '22px', fill: canBuy ? '#FFD700' : '#FF6666',
                    fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(1, 0.5).setDepth(42));
                const hit = push(s.add.rectangle(360, y, 620, 110, 0x000000, 0.001).setDepth(43));
                hit.setInteractive({ useHandCursor: true });
                hit.on('pointerdown', async () => {
                    if (canBuy) {
                        if (st.buyPet(pet.id)) {
                            await this._afterBuy();
                            this.onMessage?.(`🐾 Куплен: ${pet.name}!`);
                            this.onPetBought?.(pet.id);
                        }
                    } else {
                        await this._offerAd(push, pet.price - st.money);
                    }
                });
            }
        });
    }
    _renderPrestige(push) {
        const s = this.scene, st = this.state;
        if (!st.canPrestige()) {
            push(s.add.text(360, 640,
                '👑 ПРЕСТИЖ\n\nДоступен после открытия\nвсех 5 ковров',
                { ...TEXT_STYLES.shopInfo('#AAAAAA', 24), align: 'center' }).setOrigin(0.5).setDepth(42));
            return;
        }
        const cy = 640;
        push(s.add.rectangle(360, cy, 620, 500, 0x1a0a1a).setDepth(41).setStrokeStyle(3, 0xFFD700, 0.7));
        push(s.add.text(360, cy - 200, '👑 ПРЕСТИЖ ДОСТУПЕН', {
            ...TEXT_STYLES.shop('#FFD700', 28)
        }).setOrigin(0.5).setDepth(42));
        const curMult = st.getPrestigeMultiplier();
        const nextMult = curMult * BALANCE.prestigeMultiplier;
        const nextTitles = ['Новичок', 'Профи', 'Мастер', 'Гуру ковров', 'Легенда'];
        const nextTitle = nextTitles[Math.min(st.prestigeLevel + 1, nextTitles.length - 1)];
        const info =
            `${st.getPrestigeTitle()} → ${nextTitle}\n\n` +
            `Множитель дохода:\n×${curMult.toFixed(2)} → ×${nextMult.toFixed(2)}\n\n` +
            `✅ ОСТАНЕТСЯ:\nПитомцы, скины, достижения, дейли\n\n` +
            `❌ СБРОСИТСЯ:\nДеньги, ковры, щётка, автоеда`;
        push(s.add.text(360, cy - 20, info, {
            ...TEXT_STYLES.shopInfo('#FFFFFF', 15), align: 'center', lineSpacing: 4
        }).setOrigin(0.5).setDepth(42));
        let confirmPending = false;
        const btnLabel = `🔄 ПРЕСТИЖ (+×${nextMult.toFixed(2)})`;
        const btn = push(s.add.text(360, cy + 180, btnLabel, {
            fontSize: '22px', fill: '#000000', fontStyle: 'bold', fontFamily: 'Arial',
            backgroundColor: '#FFD700', padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (!confirmPending) {
                confirmPending = true;
                btn.setText('⚠️ ТОЧНО? ЕЩЁ РАЗ');
                btn.setBackgroundColor('#FF4444'); btn.setColor('#FFFFFF');
                s.time.delayedCall(3000, () => {
                    if (confirmPending && btn.active) {
                        confirmPending = false;
                        btn.setText(btnLabel);
                        btn.setBackgroundColor('#FFD700'); btn.setColor('#000000');
                    }
                });
            } else {
                confirmPending = false;
                await this.onPrestige?.();
                this.close();
            }
          }));
    }
}

class MuseumUI {
    constructor(scene, state) { this.scene = scene; this.state = state; this.elements = []; this.isOpen = false; }
    open() { if (this.isOpen) return; this.isOpen = true; this.render(); }
    close() { this.isOpen = false; this.elements.forEach(e => e.destroy()); this.elements = []; }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => { this.elements.push(el); return el; };
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.92).setDepth(40)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1140, 0x1e1e28).setDepth(41).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 110, '🏛️ МУЗЕЙ КОВРОВ', TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(42));
        const info =
            `👑 ${st.getPrestigeTitle()}  •  Престиж ${st.prestigeLevel}\n` +
            `Чисток: ${st.carpetsCleaned}  •  Жуков: ${st.bugsKilledTotal}  •  Звёзд: ${st.starsPopped}`;
        push(s.add.text(W/2, 180, info, {
            ...TEXT_STYLES.shopInfo('#FFD700', 16),
            backgroundColor: '#000000', padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setDepth(42));
        const startY = 250, cardH = 130, gap = 10;
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            const y = startY + (i - 1) * (cardH + gap) + cardH / 2;
            const stat = st.carpetStats[i] || { cleanings: 0, bestTime: 0 };
            const unlocked = stat.cleanings > 0;
            push(s.add.rectangle(W/2, y, 600, cardH, unlocked ? 0x2a2a2a : 0x1a1a1a)
                .setDepth(41).setStrokeStyle(3, unlocked ? 0x00FF00 : 0x444444, unlocked ? 0.6 : 0.3));
            const previewX = W/2 - 220;
            const key = 'carpet' + i;
            if (s.textures.exists(key)) {
                const img = push(s.add.image(previewX, y, key).setDisplaySize(120, 100).setDepth(42));
                if (!unlocked) img.setAlpha(0.25);
            } else {
                const palettes = [0x8B4513, 0x8B0000, 0x191970, 0x2E8B57, 0x4B0082];
                const g = s.add.graphics().setDepth(42);
                g.fillStyle(palettes[i-1], unlocked ? 1 : 0.25);
                g.fillRect(previewX - 60, y - 50, 120, 100);
                push(g);

            }).setOrigin(0.5).setDepth(42));

                    ...TEXT_STYLES.shopInfo('#00FF00', 17)
                }).setOrigin(0, 0.5).setDepth(42));
                push(s.add.text(infoX, y + 5, `⏱ Лучшее: ${formatTime(stat.bestTime)}`, {
                    ...TEXT_STYLES.shopInfo('#87CEEB', 17)
                }).setOrigin(0, 0.5).setDepth(42));
            } else {
                push(s.add.text(infoX, y, '🔒 Не открыт', {
                    ...TEXT_STYLES.shopInfo('#888888', 18)
