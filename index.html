            fontSize: '52px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }
}

class DailyBonusUI {
    constructor(scene, state) {
        this.scene = scene; this.state = state;
        this.elements = []; this.isOpen = false;
        this.onClaim = null;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.render(); }
    close() { this.isOpen = false; this.elements.forEach(e => e.destroy()); this.elements = []; }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => { this.elements.push(el); return el; };
        const status = st.getDailyStatus();
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 940, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 280, '🎁 ЕЖЕДНЕВНЫЙ БОНУС', TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(62));
        push(s.add.text(W/2, 340, `День ${status.nextDay} из 7`, {
            ...TEXT_STYLES.shopInfo('#FFFFFF', 20)
        }).setOrigin(0.5).setDepth(62));
        const cardW = 130, cardH = 130, gap = 12;
        for (let i = 0; i < 7; i++) {
            const row = i < 4 ? 0 : 1;
            const col = i < 4 ? i : (i - 4);
            const cols = row === 0 ? 4 : 3;
            const rowW = cols * cardW + (cols - 1) * gap;
            const rowStartX = W / 2 - rowW / 2 + cardW / 2;
            const x = rowStartX + col * (cardW + gap);
            const y = 460 + row * (cardH + gap);
            const isToday = (i + 1) === status.nextDay && status.canClaim;
            const isPast = (i + 1) < status.nextDay;
            const isFuture = (i + 1) > status.nextDay;
            let bg = 0x252525, border = 0x555555;
            if (isToday) { bg = 0x4a3a10; border = 0xFFD700; }
            else if (isPast) { bg = 0x2a4020; border = 0x00AA00; }
            push(s.add.rectangle(x, y, cardW, cardH, bg)
                .setDepth(62).setStrokeStyle(isToday ? 4 : 2, border, 0.9));
            push(s.add.text(x, y - 40, DAILY_REWARDS[i].icon, { fontSize: '34px' }).setOrigin(0.5).setDepth(63));
            push(s.add.text(x, y - 5, `День ${i + 1}`, {
                fontSize: '13px', fill: isFuture ? '#888888' : '#FFFFFF',
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(63));
            const rewardText = DAILY_REWARDS[i].food > 0
                ? `${DAILY_REWARDS[i].money}💰\n+${DAILY_REWARDS[i].food}🍞`
                : `${DAILY_REWARDS[i].money}💰`;
            push(s.add.text(x, y + 30, rewardText, {
                fontSize: '13px', fill: isFuture ? '#888888' : '#FFD700',
                fontStyle: 'bold', fontFamily: 'Arial', align: 'center'
            }).setOrigin(0.5).setDepth(63));
            if (isToday) {
                push(s.add.text(x, y + 55, '👈 СЕЙЧАС', {
                    fontSize: '10px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(63));
            } else if (isPast) {
                push(s.add.text(x, y + 55, '✅', { fontSize: '14px' }).setOrigin(0.5).setDepth(63));
            }
        }
        if (status.canClaim) {
            const btn = push(s.add.text(W/2, 900, '🎁 ЗАБРАТЬ', {
                fontSize: '26px', fill: '#000000', fontStyle: 'bold', fontFamily: 'Arial',
                backgroundColor: '#FFD700', padding: { x: 45, y: 18 }
            }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }));
            btn.on('pointerdown', async () => {
                const reward = this.state.claimDailyBonus();
                if (reward) {
                    await this.onClaim?.();
                    this.close();
                    this.scene.showMessage(`+${reward.money}💰${reward.food ? ` +${reward.food}🍞` : ''}`);
                }
            });
        } else {
            push(s.add.text(W/2, 900, '✅ СЕГОДНЯ ПОЛУЧЕНО', {
                fontSize: '20px', fill: '#00AA00', fontStyle: 'bold', fontFamily: 'Arial',
                backgroundColor: '#1a1a1a', padding: { x: 30, y: 15 }
            }).setOrigin(0.5).setDepth(63));
            push(s.add.text(W/2, 960, 'Приходи завтра!', {
                fontSize: '16px', fill: '#AAAAAA', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(63));
        }
        push(s.add.text(640, 260, '✖', {
            fontSize: '44px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }
}

class SettingsUI {
    constructor(scene, state, saveSystem, onReset) {
        this.scene = scene; this.state = state; this.saveSystem = saveSystem;
        this.onReset = onReset;
        this.elements = []; this.isOpen = false;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.render(); }
    close() { this.isOpen = false; this.elements.forEach(e => e.destroy()); this.elements = []; }
    refresh() { if (!this.isOpen) return; this.close(); this.open(); }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => { this.elements.push(el); return el; };
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 640, 760, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0x00E5FF));
        push(s.add.text(W/2, 320, '⚙️ НАСТРОЙКИ', TEXT_STYLES.title('#00E5FF')).setOrigin(0.5).setDepth(62));

        const vibY = 440;
        push(s.add.rectangle(W/2, vibY, 560, 60, 0x252525).setDepth(62).setStrokeStyle(2, 0x666666));
        push(s.add.text(120, vibY, '📳 Вибрация', {
            fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0, 0.5).setDepth(63));
        const vibLabel = st.settings.vibration ? '✅ ВКЛ' : '❌ ВЫКЛ';
        const vibBtn = push(s.add.text(540, vibY, vibLabel, {
            fontSize: '20px', fill: st.settings.vibration ? '#00FF00' : '#FF6666',
            fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(1, 0.5).setDepth(63).setInteractive({ useHandCursor: true }));
        vibBtn.on('pointerdown', async () => {
            st.settings.vibration = !st.settings.vibration;
            await this.saveSystem.save();
            if (st.settings.vibration) { try { navigator.vibrate?.(BALANCE.vibrationMs); } catch {} }
            this.refresh();
        });

        const expY = 530;
        push(s.add.rectangle(W/2, expY, 560, 60, 0x252525).setDepth(62).setStrokeStyle(2, 0x666666));
        push(s.add.text(120, expY, '📤 Экспорт сейва', {
            fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0, 0.5).setDepth(63));
        const expBtn = push(s.add.text(540, expY, '📋 Копировать', {
            fontSize: '16px', fill: '#00E5FF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(1, 0.5).setDepth(63).setInteractive({ useHandCursor: true }));
        expBtn.on('pointerdown', () => {
            const data = JSON.stringify(st.toSaveObject());
            try {
                navigator.clipboard.writeText(data);
                this.scene.showMessage('📋 Сейв скопирован!');
            } catch {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = data;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    this.scene.showMessage('📋 Сейв скопирован!');
                } catch {}
            }
        });

        const impY = 600;
        push(s.add.rectangle(W/2, impY, 560, 60, 0x252525).setDepth(62).setStrokeStyle(2, 0x666666));
        push(s.add.text(120, impY, '📥 Импорт сейва', {
            fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0, 0.5).setDepth(63));
        const impBtn = push(s.add.text(540, impY, '📋 Вставить', {
            fontSize: '16px', fill: '#00E5FF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(1, 0.5).setDepth(63).setInteractive({ useHandCursor: true }));
        impBtn.on('pointerdown', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const data = JSON.parse(text);
                if (data && typeof data === 'object') {
                    st.fromSaveObject(data);
                    await this.saveSystem.save();
                    this.scene.showMessage('✅ Сейв загружен!');
                    this.scene.scene.restart();
                }
            } catch { this.scene.showMessage('❌ Неверный формат'); }
        });

        const rstY = 680;
        let confirmPending = false;
        const rstBtn = push(s.add.text(W/2, rstY, '🗑️ СБРОСИТЬ ВЕСЬ ПРОГРЕСС', {
            fontSize: '18px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial',
            backgroundColor: '#550000', padding: { x: 25, y: 14 }
        }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }));
        rstBtn.on('pointerdown', async () => {
            if (!confirmPending) {
                confirmPending = true;
                rstBtn.setText('⚠️ ТОЧНО СБРОСИТЬ?');
                rstBtn.setBackgroundColor('#FF0000');
                s.time.delayedCall(3000, () => {
                    if (confirmPending && rstBtn.active) {
                        confirmPending = false;
                        rstBtn.setText('🗑️ СБРОСИТЬ ВЕСЬ ПРОГРЕСС');
                        rstBtn.setBackgroundColor('#550000');
                    }
                });
            } else {
                confirmPending = false;
                await this.onReset?.();
            }
        });

        push(s.add.text(620, 290, '✖', {
            fontSize: '44px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }
}

class LeaderboardUI {
    constructor(scene, state, lb) {
        this.scene = scene; this.state = state; this.lb = lb;
        this.elements = []; this.isOpen = false;
        this.currentBoard = 'bestMoney';
        this.loading = false;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.loadAndRender(); }
    close() { this.isOpen = false; this.elements.forEach(e => e.destroy()); this.elements = []; }
    async loadAndRender() {
        this.elements.forEach(e => e.destroy());
        this.elements = [];
        const s = this.scene, W = 720, H = 1280;
        const push = (el) => { this.elements.push(el); return el; };
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.92).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1000, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 200, '📊 РЕКОРДЫ', TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(62));

        const tabs = [
            { id: 'bestMoney', label: '💰 Монеты' },
            { id: 'prestige', label: '👑 Престиж' }
        ];
        tabs.forEach((t, i) => {
            const x = 200 + i * 160;
            const y = 270;
            const active = this.currentBoard === t.id;
            push(s.add.rectangle(x, y, 150, 45, active ? 0xFFD700 : 0x444444)
                .setDepth(62).setStrokeStyle(2, active ? 0xFFFFFF : 0x666666)
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', () => { this.currentBoard = t.id; this.loadAndRender(); }));
            push(s.add.text(x, y, t.label, {
                fontSize: '15px', fill: active ? '#000000' : '#CCCCCC',
                fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(63));
        });

        const loadingText = push(s.add.text(W/2, 640, '⏳ Загрузка...', {
            ...TEXT_STYLES.shopInfo('#FFFFFF', 22)
        }).setOrigin(0.5).setDepth(62));

        if (this.loading) return;
        this.loading = true;
        let entries = [];
        try { entries = await this.lb.fetchTop(this.currentBoard, 10); }
        catch { entries = []; }
        this.loading = false;
        if (!this.isOpen) return;

        loadingText.destroy();
        this.elements = this.elements.filter(e => e !== loadingText);

        if (!entries || entries.length === 0) {
            push(s.add.text(W/2, 640, 'Пока никого нет :(', {
                ...TEXT_STYLES.shopInfo('#AAAAAA', 22)
            }).setOrigin(0.5).setDepth(62));
        } else {
            entries.forEach((e, i) => {
                const y = 340 + i * 60;
                const rankColor = e.rank === 1 ? '#FFD700' : e.rank === 2 ? '#C0C0C0' : e.rank === 3 ? '#CD7F32' : '#FFFFFF';
                push(s.add.rectangle(W/2, y, 600, 52, e.isMe ? 0x205020 : 0x252525)
                    .setDepth(62).setStrokeStyle(2, e.isMe ? 0x00FF00 : 0x555555, 0.6));
                push(s.add.text(140, y, `${e.rank}.`, {
                    fontSize: '22px', fill: rankColor, fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(63));
                push(s.add.text(200, y, e.name.substring(0, 18), {
                    fontSize: '18px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0, 0.5).setDepth(63));
                push(s.add.text(620, y, `${e.score}`, {
                    fontSize: '22px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(1, 0.5).setDepth(63));
            });
        }

        push(s.add.text(620, 200, '✖', {
            fontSize: '44px', fill: '#FF4444', fontStyle: 'bold',
            stroke: '#000000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.close()));
    }
}

<script>
/* ============================================================

class Tutorial {
    constructor(scene) {
        this.scene = scene;
        this.step = 0;
        this.elements = [];
        this.pulseTween = null;
        this.steps = [
            {
                title: '🧼 Добро пожаловать!',
                text: 'Намыль ковёр мылом,\nпотом смывай водой.\nЗа каждый чистый ковёр — деньги!',
                target: null
            },
            {
                title: '🧼 Шаг 1. Намыль',
                text: 'Кнопка «МЫЛО» уже активна.\nВеди пальцем по ковру,\nчтобы нанести мыло.',
                target: { x: 240, y: 1200, w: 200, h: 80 }
            },
            {
                title: '💧 Шаг 2. Смой',
                text: 'Выбери «СМЫТЬ» и проведи\nпо мыльным местам.',
                target: { x: 480, y: 1200, w: 200, h: 80 }
            },
            {
                title: '⭐ Шаг 3. Собери звёзды!',
                text: 'Когда ковёр почти чист —\nоставшаяся грязь превращается\nв звёзды ⭐.\n\nТапай по ним → +5💰 за каждую!',
                target: null
            },
            {
                title: '💰 Шаг 4. Получи деньги',
                text: 'Когда ковёр чист на 100% —\nжми «ПОЛУЧИТЬ ДЕНЬГИ»\nвнизу экрана.',
                target: { x: 360, y: 1050, w: 320, h: 60 }
            },
            {
                title: '🛒 Магазин',
                text: 'Здесь: щётка, мыло, смыв,\nдвойная награда за жуков,\nпитомцы и скины.',
                target: { x: 550, y: 130, w: 100, h: 100 }
            },
            {
                title: '🏆 Прогресс',
                text: 'Трекеры:\n🏆 достижения · 📅 задания\n🏛️ музей · 📊 рекорды',
                target: { x: 445, y: 45, w: 100, h: 100 }
            },
            {
                title: '🎁 Дейли и ⚙️',
                text: '🎁 Ежедневный бонус — заходи\nкаждый день за наградой!\n\n⚙️ Настройки — вибрация,\nэкспорт/импорт сейва.',
                target: { x: 655, y: 130, w: 100, h: 100 }
            },
            {
                title: '🌗 День и ночь',
                text: 'Игра меняется по времени суток:\n🌅 утро · ☀️ день\n🌇 вечер · 🌙 ночь — за ночь ×1.75💰',
                target: null
            }
        ];
    }
    start() { if (this.scene.state.tutorialDone) return; this.step = 0; this.show(); }
    show() {
        this.destroy();
        const s = this.scene, W = 720, H = 1280;
        const step = this.steps[this.step];
        const g = s.add.graphics().setDepth(100);
        if (step.target) {
            const t = step.target, pad = 12;
            const left = t.x - t.w / 2 - pad, right = t.x + t.w / 2 + pad;
            const top = t.y - t.h / 2 - pad, bottom = t.y + t.h / 2 + pad;
            g.fillStyle(0x000000, 0.82);
            g.fillRect(0, 0, W, top);
            g.fillRect(0, bottom, W, H - bottom);
            g.fillRect(0, top, left, bottom - top);
            g.fillRect(right, top, W - right, bottom - top);
            g.lineStyle(5, 0xFFD700, 1);
            g.strokeRect(left, top, right - left, bottom - top);
        } else {
            g.fillStyle(0x000000, 0.82);
            g.fillRect(0, 0, W, H);
        }
        this.elements.push(g);
        if (step.target) {
            const t = step.target;
            const glow = s.add.rectangle(t.x, t.y, t.w + 24, t.h + 24, 0xFFFF00, 0.2).setDepth(101);
            this.elements.push(glow);
            const ring = s.add.rectangle(t.x, t.y, t.w + 24, t.h + 24, 0x000000, 0).setDepth(102);
            ring.setStrokeStyle(4, 0xFFFFFF);
            this.elements.push(ring);
            this.pulseTween = s.tweens.add({
                targets: [glow, ring], scaleX: { from: 1, to: 1.10 }, scaleY: { from: 1, to: 1.10 },
                alpha: { from: 1, to: 0.5 }, duration: 650, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
            const isBottom = t.y > 640;
            const arrowY = isBottom ? t.y - t.h / 2 - 50 : t.y + t.h / 2 + 50;
            const arrow = s.add.text(t.x, arrowY, isBottom ? '👇' : '👆', { fontSize: '60px', fontFamily: 'Arial' })
                .setOrigin(0.5).setDepth(103);
            this.elements.push(arrow);
            s.tweens.add({ targets: arrow, y: arrowY + (isBottom ? 15 : -15), duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
        const cardY = 600, cardW = 640, cardH = 340;
        this.elements.push(s.add.rectangle(W/2 + 4, cardY + 4, cardW, cardH, 0x000000, 0.5).setDepth(103));
        const cardBg = s.add.rectangle(W/2, cardY, cardW, cardH, 0x1a1a1a, 0.98).setDepth(104);
        cardBg.setStrokeStyle(5, 0xFFD700);
        this.elements.push(cardBg);
        this.elements.push(s.add.text(W/2, cardY - cardH / 2 + 30, `Шаг ${this.step + 1} из ${this.steps.length}`, {
            fontSize: '14px', fill: '#AAAAAA', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(105));
        this.elements.push(s.add.text(W/2, cardY - cardH / 2 + 68, step.title, {
            fontSize: '30px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(105));
        this.elements.push(s.add.text(W/2, cardY - 20, step.text, {
            fontSize: '20px', fill: '#FFFFFF', fontFamily: 'Arial',
            align: 'center', lineSpacing: 10, wordWrap: { width: cardW - 60 }
        }).setOrigin(0.5).setDepth(105));
        const btnY = cardY + cardH / 2 - 50;
        const isLast = this.step === this.steps.length - 1;
        const isFirst = this.step === 0;
        const nextBtn = s.add.text(isFirst ? W / 2 : W / 2 + 90, btnY,
            isLast ? '✅ Начать!' : 'Далее ▶', {
            fontSize: '20px', fill: '#000000', fontStyle: 'bold', fontFamily: 'Arial',
            backgroundColor: '#FFD700', padding: { x: 30, y: 12 }
        }).setOrigin(0.5).setDepth(105).setInteractive({ useHandCursor: true });
        nextBtn.on('pointerdown', () => this.next());
        this.elements.push(nextBtn);
        if (!isFirst) {
            const backBtn = s.add.text(W / 2 - 90, btnY, '◀ Назад', {
                fontSize: '18px', fill: '#CCCCCC', fontStyle: 'bold', fontFamily: 'Arial',
                backgroundColor: '#333333', padding: { x: 20, y: 12 }
            }).setOrigin(0.5).setDepth(105).setInteractive({ useHandCursor: true });
            backBtn.on('pointerdown', () => this.prev());
            this.elements.push(backBtn);
        }
        if (!isLast) {
            const skipBtn = s.add.text(W / 2, cardY + cardH / 2 + 25, 'Пропустить', {
                fontSize: '14px', fill: '#888888', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(105).setInteractive({ useHandCursor: true });
            skipBtn.on('pointerdown', () => this.finish());
            this.elements.push(skipBtn);
        }
    }
    next() { if (this.step >= this.steps.length - 1) { this.finish(); return; } this.step++; this.show(); }
    prev() { if (this.step <= 0) return; this.step--; this.show(); }
    destroy() { this.elements.forEach(el => el.destroy()); this.elements = []; if (this.pulseTween) { this.pulseTween.remove(); this.pulseTween = null; } }
    async finish() {
        this.destroy();
        this.scene.state.tutorialDone = true;
        try { await this.scene.saveSystem.save(); } catch {}
        this.scene.showMessage('🧼 Удачи!');
        if (this.scene.pendingDailyBonus) {
            this.scene.pendingDailyBonus = false;
            this.scene.time.delayedCall(900, () => this.scene.dailyUI.open());
        }
    }
}

   ============================================================ */
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }
    preload() {
        for (let i = 1; i <= BALANCE.totalCarpets; i++) {
            this.load.image('carpet' + i, `image.carpet/carpet${i}.png`);
        }
        this.load.on('loaderror', (file) => console.warn('Не загрузилось:', file.key, file.src));
        const w = this.cameras.main.width, h = this.cameras.main.height;
        this.add.text(w / 2, h / 2 - 50, 'Загрузка...', TEXT_STYLES.title()).setOrigin(0.5);
        this.add.rectangle(w / 2, h / 2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w / 2 - 200, h / 2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (v) => { bar.width = 400 * v; });
    }
    async create() {
        const state = new GameState();
        const saveSystem = await new SaveSystem(state).init();
        const ads = new AdsSystem(saveSystem);
        const leaderboard = new LeaderboardSystem(state, saveSystem);
        state.refreshDailyQuests();
        state.checkAchievements();
        await saveSystem.save();
        this.registry.set('gameState', state);
        this.registry.set('saveSystem', saveSystem);
        this.registry.set('ads', ads);
        this.registry.set('leaderboard', leaderboard);
        this.scene.start('MainScene');
    }
}

/* ============================================================
   MAIN
   ============================================================ */
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    create() {
        this.state = this.registry.get('gameState');
        this.saveSystem = this.registry.get('saveSystem');
        this.ads = this.registry.get('ads');
        this.leaderboard = this.registry.get('leaderboard');

        if (this.input.mouse) this.input.mouse.disableContextMenu();
        this.saveSystem.ready();

        const W = 720, H = 1280;
        this.carpetW = 500; this.carpetH = 700;
        this.carpetX = W / 2; this.carpetY = 600;
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW / 2, this.carpetY - this.carpetH / 2,
            this.carpetW, this.carpetH
        );

        this.room = new RoomRenderer(this);
        this.currentTimeOfDay = getTimeOfDay();
        this.room.draw(this.state.selectedRoom, this.state.carpetLevel, this.currentTimeOfDay);

        this.carpetContainer = this.add.container(0, 0).setDepth(0);
        this.drawCarpet();

        this.effects = new Effects(this);

        this.cleaning = new CleaningSystem(this, this.carpetBounds, this.state);
        this.cleaning.onProgress = (p) => this.updateProgressBar(p);
        this.cleaning.onSoap = (x, y) => this.effects.bubbles(x, y);
        this.cleaning.onErase = (x, y) => { this.effects.splash(x, y); this.effects.star(x, y); };
        this.cleaning.onCelebrate = () => { this.effects.celebration(W, H); this.showMessage('Ковёр чистый! ✨'); };

        // Финальные звёзды
        this.stars = new FinishStarsSystem(this, this.cleaning, this.state, this.effects);
        this.stars.onStarPopped = () => {
            this.refreshHUD();
            this.vibrate();
        };
        this.stars.onAllPopped = () => {
            this.showMessage('⭐ Все звёзды собраны!');
            this.refreshHUD();
        };

        this.bugs = new BugSystem(this, this.carpetBounds, this.state, {
            onKill: (x, y) => this.effects.starBurst(x, y, 3),
            onReward: (x, y, amt) => this.effects.moneyPopup(x, y, amt)
        });
        this.bugsRef = this.bugs;

        this.pets = new PetSystem(this, this.cleaning, this.bugs, this.effects, this.state);

        this.shop = new ShopUI(this, this.state, this.ads);
        this.shop.onChanged = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.shop.onMessage = (t) => this.showMessage(t);
        this.shop.onBuyCarpet = async () => this.buyNewCarpet();
        this.shop.onPrestige = async () => this.doPrestige();
        this.shop.onPetBought = () => this.pets.refreshIndicators();
        this.shop.onSkinChange = (kind) => {
            if (kind === 'room') this.room.draw(this.state.selectedRoom, this.state.carpetLevel, this.currentTimeOfDay);
            if (kind === 'brush') this.updateBrushIcon();
        };

        this.museum = new MuseumUI(this, this.state);
        this.questsUI = new QuestsUI(this, this.state);
        this.questsUI.onClaim = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.achievementsUI = new AchievementsUI(this, this.state);
        this.dailyUI = new DailyBonusUI(this, this.state);
        this.dailyUI.onClaim = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.settingsUI = new SettingsUI(this, this.state, this.saveSystem,
            async () => { await this.saveSystem.fullReset(); this.scene.restart(); });
        this.leaderboardUI = new LeaderboardUI(this, this.state, this.leaderboard);

        this.currentTool = 'soap';
        this.isPointerDown = false;
        this.lastLocalX = -9999;
        this.lastLocalY = -9999;
        this.inputLocked = false;
        this.pendingDailyBonus = false;

        this.noFoodText = null; this.noFoodTween = null; this.noFoodCooldown = false;

        this.carpetElapsed = 0;
        this.prestigeText = null;
        this.dayNightText = null;

        this.brush = this.add.text(0, 0, this.state.getBrushIcon(), { fontSize: '70px', fontFamily: 'Arial' })

        this.buildToolButtons(W, H);

        if (this.state.refreshDailyQuests()) {
            this.saveSystem.save();
            this.time.delayedCall(800, () => this.showMessage('📅 Новые задания!'));
        }

        if (!this.state.tutorialDone) {
            this.pendingDailyBonus = dailyCanClaim;

            this.time.delayedCall(400, () => this.tutorial.start());
        } else if (dailyCanClaim) {

            delay: 60000, loop: true,

        }).setOrigin(1, 0).setDepth(10);

            .setOrigin(0.5).setDepth(13).setVisible(false);

            targets: this.questBadge, alpha: { from: 1, to: 0.3 },

        });

                .setOrigin(0.5).setDepth(15);
            this.tweens.add({
                targets: [dailyBg, dailyIcon],

                duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
            const hit = this.add.circle(360, 100, 30, 0x000000, 0.001).setDepth(16)
                .setInteractive({ useHandCursor: true });

        this.progressText = this.add.text(W / 2, 230, '0%', TEXT_STYLES.stat('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);

        // Счётчик звёзд (появится позже)

            fontSize: '18px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial',
            stroke: '#000000', strokeThickness: 5
        }).setOrigin(0.5).setDepth(11).setVisible(false);

        this.add.text(W / 2, 1050, 'ПОЛУЧИТЬ ДЕНЬГИ', {

    updateDayNightText() {
        if (!this.dayNightText) return;
        const t = getTimeOfDay();
        const icon = t === 'morning' ? '🌅' : t === 'day' ? '☀️' : t === 'evening' ? '🌇' : '🌙';
        const bonus = Math.round(this.state.getDayNightBonus() * 100);
        const label = t === 'morning' ? 'Утро' : t === 'day' ? 'День' : t === 'evening' ? 'Вечер' : 'Ночь';
        this.dayNightText.setText(`${icon} ${label}  +${bonus}%💰`);
    }

    refreshHUD() {
        this.moneyText.setText('💰 ' + this.state.money);
        this.foodText.setText('🍞 ' + this.state.food);
        this.toolText.setText('🧹 ' + this.state.getCurrentRadius());
        this.carpetText.setText('🧽 ' + this.state.carpetsCleaned);
        this.soapLvlText.setText(`🧼${this.state.soapLevel}  💤${this.state.washLevel}  🪰${this.state.swatterLevel}`);
        this.updateQuestBadge();
        this.updateDayNightText();
        this.updateStarsCounter();
    }

    updateStarsCounter() {
        if (!this.starsCounter) return;
        if (this.stars.active && this.stars.count > 0) {
            this.starsCounter.setText(`⭐ Осталось звёзд: ${this.stars.count}`);
            this.starsCounter.setVisible(true);
        } else {
            this.starsCounter.setVisible(false);
        }
    }

    updateQuestBadge() {
        if (!this.questBadge) return;
        const hasReady = this.state.quests.some(q =>
            this.state.isQuestComplete(q) && !this.state.questClaimed[q.id]
        );
        this.questBadge.setVisible(hasReady);
    }

    updateBrushIcon() {
        if (this.currentTool === 'soap') this.brush.setText(this.state.getBrushIcon());
    }

    buildToolButtons(W, H) {
        const btnY = 1200;
        const hasSwatter = this.state.carpetIndex >= 2;
        const soapX = hasSwatter ? 120 : 240;
        const washX = hasSwatter ? 360 : 480;
        const swatterX = 600;

        this.soapBtnBg = this.add.rectangle(soapX, btnY, 200, 80, 0x4A90D9).setDepth(10).setStrokeStyle(5, 0xFFFFFF);
        this.soapBtnText = this.add.text(soapX, btnY, '🧼 МЫЛО', TEXT_STYLES.button('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('soap'));

        this.washBtnBg = this.add.rectangle(washX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.washBtnText = this.add.text(washX, btnY, '💧 СМЫТЬ', TEXT_STYLES.button('#AAAAAA', 22)).setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('wash'));

        this.swatterBtnBg = this.add.rectangle(swatterX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.swatterBtnText = this.add.text(swatterX, btnY, '🪰 МУХОБОЙКА', TEXT_STYLES.button('#AAAAAA', 18)).setOrigin(0.5).setDepth(11);
        this.swatterBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('swatter'));

        this.swatterBtnBg.setVisible(hasSwatter);
        this.swatterBtnText.setVisible(hasSwatter);
    }

    selectTool(tool) {
        this.currentTool = tool;
        const setStyle = (bg, txt, active, activeColor = 0x4A90D9) => {
            if (active) { bg.setFillStyle(activeColor); bg.setStrokeStyle(5, 0xFFFFFF); txt.setColor('#FFFFFF'); }
            else { bg.setFillStyle(0x555555); bg.setStrokeStyle(5, 0x888888); txt.setColor('#AAAAAA'); }
        };
        setStyle(this.soapBtnBg, this.soapBtnText, tool === 'soap');
        setStyle(this.washBtnBg, this.washBtnText, tool === 'wash');
        setStyle(this.swatterBtnBg, this.swatterBtnText, tool === 'swatter', 0xFF4444);
        if (tool === 'soap') this.brush.setText(this.state.getBrushIcon());
        else if (tool === 'wash') this.brush.setText('🧹');
        else this.brush.setVisible(false);
        if (tool !== 'swatter') this.effects.hideSwatterCursor();
    }

    setupInput() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });
        const uiOpen = () => this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen
            || (this.tutorial && this.tutorial.elements.length > 0);

        const handlePointer = (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.stars.active) return; // звёзды сами обрабатывают тап
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.brush.setVisible(false);
                return;
            }
            this.effects.hideSwatterCursor();
            this.brush.setPosition(pointer.x, pointer.y);
            const inBounds = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(inBounds);
            if (!inBounds) return;
            const localX = pointer.x - this.carpetBounds.x;
            const localY = pointer.y - this.carpetBounds.y;
            const dx = localX - this.lastLocalX;
            const dy = localY - this.lastLocalY;
            if (dx * dx + dy * dy < 64) return;
            this.lastLocalX = localX;
            this.lastLocalY = localY;
            this.applyTool(localX, localY);
        };

        this.input.on('pointerdown', (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.stars.active) return;
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.effects.swatEffect(pointer.x, pointer.y);
                this.bugs.swat(pointer.x, pointer.y, this.time.now);
                this.refreshHUD();
                return;
            }
            this.isPointerDown = true;
            this.lastLocalX = -9999; this.lastLocalY = -9999;
            handlePointer(pointer);
        });

        this.input.on('pointermove', (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.stars.active) return;
            if (this.currentTool !== 'swatter') {
                this.brush.setPosition(pointer.x, pointer.y);
                this.brush.setVisible(Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y));
            }
            if (!pointer.isDown) { this.isPointerDown = false; return; }
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                return;
            }
            handlePointer(pointer);
        });

        const stop = () => {
            this.isPointerDown = false;
            this.effects.hideSwatterCursor();
            this.brush.setVisible(false);
            this.lastLocalX = -9999; this.lastLocalY = -9999;
        };
        this.input.on('pointerup', stop);
        this.input.on('pointerout', stop);
        this.input.on('pointerupoutside', stop);
        window.addEventListener('blur', stop);
        document.addEventListener('touchend', () => { this.effects.hideSwatterCursor(); }, { passive: true });
        document.addEventListener('mouseup', () => { this.effects.hideSwatterCursor(); });
    }

    applyTool(localX, localY) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        if (this.stars.active) return;
        if (this.state.food <= 0) {
            if (this.state.money < BALANCE.foodPrice) {
                this.state.food = 1;
                this.refreshHUD();
                this.showMessage('🎁 Бонус: 1 еда!');
            } else {
                this.showNoFoodWarning();
                return;
            }
        }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }

        const radius = this.state.getCurrentRadius();
        this.cleaning.applyStroke(localX, localY, radius, this.currentTool);

        // Проверяем порог финальных звёзд
        const p = this.cleaning.progress;
        if (!this.stars.active && p >= BALANCE.finishThreshold && p < 1.0) {
            this.stars.activate();
            this.updateStarsCounter();
        }
    }

    async finishCarpet() {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        if (this.cleaning.progress < 1.0) {
            if (this.stars.active && this.stars.count > 0) {
                this.showMessage('⭐ Собери все звёзды!');
            } else {
                this.showMessage('Ковёр ещё грязный! Нужно 100%.');
            }
            return;
        }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }

        this.unlockInput();

        const timeSec = Math.floor(this.carpetElapsed / 1000);
        const reward = this.state.addReward(timeSec);
        this.refreshHUD();
        await this.saveSystem.save();
        this.showMessage(`+${reward} 💰!  ⏱ ${formatTime(timeSec)}`);

        this.bugs.clear();
        this.cleaning.reset();
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.updateStarsCounter();
        this.checkAndNotifyAchievements();
        this.leaderboard.submitScores();

        if (this.state.canPrestige()) {
            this.time.delayedCall(400, () => this.showMessage('👑 ПРЕСТИЖ В МАГАЗИНЕ!'));
        }
        if (this.state.carpetsCleaned % 5 === 0) {
            this.ads.showFullscreen();
        }
        this.time.delayedCall(50, () => {
            this.bugs.spawnForLevel(this.state.carpetIndex);
        });
    }

    checkAndNotifyAchievements() {
        const unlocked = this.state.checkAchievements();
        if (unlocked.length > 0) {
            this.saveSystem.save();
            unlocked.forEach((a, i) => {
                this.time.delayedCall(400 + i * 600, () => {
                    this.showMessage(`🏆 ${a.name}: +${a.reward}💰`);
                });
            });
            this.refreshHUD();
        }
    }

    async buyNewCarpet() {
        if (!this.state.buyNewCarpet()) return;
        this.unlockInput();
        this.shop.close();
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom, this.state.carpetLevel, this.currentTimeOfDay);
        this.drawCarpet();
        this.cleaning.reset();
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.bugs.clear();
        this.updateStarsCounter();
        if (this.state.carpetIndex >= 2) {
            this.swatterBtnBg.setVisible(true);
            this.swatterBtnText.setVisible(true);
            this.soapBtnBg.setX(120);  this.soapBtnText.setX(120);
            this.washBtnBg.setX(360);  this.washBtnText.setX(360);
        }
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.effects.celebration(720, 1280);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }

    async doPrestige() {
        if (!this.state.prestige()) return;
        this.unlockInput();
        this.shop.close();
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom, this.state.carpetLevel, this.currentTimeOfDay);
        this.drawCarpet();
        this.cleaning.reset();
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.bugs.clear();
        this.updateStarsCounter();
        this.swatterBtnBg.setVisible(false);
        this.swatterBtnText.setVisible(false);
        this.soapBtnBg.setX(240);  this.soapBtnText.setX(240);
        this.washBtnBg.setX(480);  this.washBtnText.setX(480);
        if (this.prestigeText) this.prestigeText.destroy();
        if (this.state.prestigeLevel > 0) {
            this.prestigeText = this.add.text(325, 16, '👑' + this.state.prestigeLevel,
                TEXT_STYLES.stat('#FFD700', 20)).setOrigin(1, 0).setDepth(10);
        }
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.leaderboard.submitScores();
        this.effects.celebration(720, 1280);
        this.showMessage(`👑 ПРЕСТИЖ ${this.state.prestigeLevel}!`);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }

    unlockInput() {
        this.inputLocked = true;
        this.isPointerDown = false;
        this.lastLocalX = -9999; this.lastLocalY = -9999;
        this.brush.setVisible(false);
        this.effects.hideSwatterCursor();
        this.time.delayedCall(BALANCE.inputLockDuration, () => { this.inputLocked = false; });
    }

    updateProgressBar(p) {
        this.progressBar.width = 400 * p;
        this.progressText.setText(Math.min(100, Math.floor(p * 100)) + '%');
    }

    vibrate() {
        if (!this.state.settings.vibration) return;
        try { navigator.vibrate?.(BALANCE.vibrationMs); } catch {}
    }

    showNoFoodWarning() {
        if (this.noFoodCooldown) return;
        this.noFoodCooldown = true;
        if (this.noFoodText) {
            if (this.noFoodTween) this.noFoodTween.remove();
            this.noFoodText.destroy(); this.noFoodText = null;
        }
        this.noFoodText = this.add.text(360, 640, '🍞 НЕТ ЕДЫ!\nКУПИ В МАГАЗИНЕ', {
            fontSize: '52px', fill: '#FF0000', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(80);
        this.noFoodTween = this.tweens.add({
            targets: this.noFoodText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.noFoodText) { this.noFoodText.destroy(); this.noFoodText = null; }
                this.noFoodTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.noFoodCooldown = false; });
    }

    showBugWarning() {
        if (this.bugWarningCooldown) return;
        this.bugWarningCooldown = true;
        if (this.bugWarningText) {
            if (this.bugWarningTween) this.bugWarningTween.remove();
            this.bugWarningText.destroy(); this.bugWarningText = null;
        }
        this.bugWarningText = this.add.text(360, 640, '🐛 СНАЧАЛА УБЕРИ ЖУКОВ!\n(мухобойка 🪰)', {
            fontSize: '42px', fill: '#FF4444', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(80);
        this.bugWarningTween = this.tweens.add({
            targets: this.bugWarningText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.bugWarningText) { this.bugWarningText.destroy(); this.bugWarningText = null; }
                this.bugWarningTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.bugWarningCooldown = false; });
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            ...TEXT_STYLES.message('#FFFF00', 26),
            backgroundColor: '#000000', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(2400, () => msg.destroy());
    }

    drawCarpet() {
        this.carpetContainer.removeAll(true);
        const carpetKey = 'carpet' + this.state.carpetIndex;
        if (this.textures.exists(carpetKey)) {
            const img = this.add.image(this.carpetX, this.carpetY, carpetKey);
            img.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetContainer.add(img);
        } else {
            const g = this.add.graphics();
            const cx = this.carpetX - this.carpetW / 2;
            const cy = this.carpetY - this.carpetH / 2;
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(this.state.carpetIndex - 1) % palettes.length];
            g.fillStyle(p.main, 1); g.fillRect(cx, cy, this.carpetW, this.carpetH);
            g.lineStyle(20, p.border, 1); g.strokeRect(cx + 10, cy + 10, this.carpetW - 20, this.carpetH - 20);
            g.lineStyle(4, p.accent, 0.7);
            for (let i = 0; i < 3; i++) {
                const size = 100 - i * 30;
                g.beginPath();
                g.moveTo(this.carpetX, this.carpetY - size);
                g.lineTo(this.carpetX + size, this.carpetY);
                g.lineTo(this.carpetX, this.carpetY + size);
                g.lineTo(this.carpetX - size, this.carpetY);
                g.closePath(); g.strokePath();
            }
            g.fillStyle(p.accent, 1);
            g.fillCircle(cx + 50, cy + 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + 50, 12);
            g.fillCircle(cx + 50, cy + this.carpetH - 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + this.carpetH - 50, 12);
            this.carpetContainer.add(g);
        }
    }

    update(_, delta) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        if (this.tutorial && this.tutorial.elements.length > 0) return;
        this.cleaning.draw();
        this.bugs.update(delta);
        this.pets.update(delta);
        this.carpetElapsed += delta;
        const elapsedSec = Math.floor(this.carpetElapsed / 1000);
        this.timerText.setText('⏱ ' + formatTime(elapsedSec));

        // Автоактивация звёзд при 97%+
        if (!this.stars.active) {
            const p = this.cleaning.progress;
            if (p >= BALANCE.finishThreshold && p < 1.0) {
                this.stars.activate();
                this.updateStarsCounter();
            }
        }
    }
}

/* ============================================================
   BOOT
   ============================================================ */
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>
