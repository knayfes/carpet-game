<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чистим Ковры</title>
    <script src="phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%;
            background: #1a1a1a; overflow: hidden;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script>
// ============================================
// ⚙️ НАСТРОЙКИ
// ============================================
const CONFIG = {
    startMoney: 10, startFood: 3, startToolLevel: 1,
    foodPrice: 20, toolBasePrice: 50,
    rewardMin: 50, rewardMax: 100,
    brushRadius: 35, toolRadiusBonus: 0.05,
    eraseStrength: 0.5, finishThreshold: 1.0,
    soapThreshold: 0.3
};

// ============================================
// 🖼️ КАРТИНКА КОВРА
// ============================================
const CARPET_IMAGE = 'carpet.png';

// ============================================
// СОСТОЯНИЕ
// ============================================
const GameState = {
    money: CONFIG.startMoney, food: CONFIG.startFood,
    toolLevel: CONFIG.startToolLevel
};
let ysdk = null;

// ============================================
// YANDEX SDK
// ============================================
async function initYandexSDK() {
    try {
        if (typeof YaGames === 'undefined') throw new Error('YaGames не определён');
        ysdk = await YaGames.init();
        console.log('✅ Yandex SDK загружен');
        const stats = await ysdk.player.getStats(['money', 'food', 'toolLevel']);
        if (stats.money !== undefined) GameState.money = Number(stats.money) || 0;
        if (stats.food !== undefined) GameState.food = Number(stats.food) || 3;
        if (stats.toolLevel !== undefined) GameState.toolLevel = Number(stats.toolLevel) || 1;
    } catch (e) {
        console.log('⚠️ SDK не загружен. Заглушка.');
        ysdk = {
            player: {
                getStats: async () => {
                    const saved = localStorage.getItem('carpetGameStats');
                    return saved ? JSON.parse(saved) : {};
                },
                setStats: async (stats) => {
                    localStorage.setItem('carpetGameStats', JSON.stringify(stats));
                }
            },
            adv: {
                showRewardedVideo: (opts) => {
                    if (opts?.callbacks?.onRewarded) opts.callbacks.onRewarded();
                    if (opts?.callbacks?.onClose) opts.callbacks.onClose();
                },
                showFullscreenAdv: (opts) => {
                    if (opts?.callbacks?.onClose) opts.callbacks.onClose();
                }
            },
            features: { LoadingAPI: { ready: () => {} } }
        };
        const saved = localStorage.getItem('carpetGameStats');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.money !== undefined) GameState.money = Number(data.money) || 0;
                if (data.food !== undefined) GameState.food = Number(data.food) || 3;
                if (data.toolLevel !== undefined) GameState.toolLevel = Number(data.toolLevel) || 1;
            } catch (err) {}
        }
    }
}

async function saveGame() {
    if (!ysdk) return;
    try {
        await ysdk.player.setStats({
            money: GameState.money, food: GameState.food, toolLevel: GameState.toolLevel
        });
    } catch (e) {}
}

// ============================================
// СЦЕНА ЗАГРУЗКИ
// ============================================
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }

    preload() {
        if (CARPET_IMAGE) this.load.image('carpet', CARPET_IMAGE);
        
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        this.add.text(w/2, h/2 - 50, 'Загрузка...', {
            fontSize: '40px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5);
        this.add.rectangle(w/2, h/2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w/2 - 200, h/2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (value) => { bar.width = 400 * value; });
    }

    create() {
        initYandexSDK();
        this.scene.start('MainScene');
    }
}

// ============================================
// ОСНОВНАЯ СЦЕНА
// ============================================
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    create() {
        if (this.input.mouse) this.input.mouse.disableContextMenu();
        if (ysdk?.features?.LoadingAPI) ysdk.features.LoadingAPI.ready();
        
        const W = 720, H = 1280;
        this.add.rectangle(W/2, H/2, W, H, 0x2a2a2a);
        
        this.carpetW = 500;
        this.carpetH = 700;
        this.carpetX = W/2;
        this.carpetY = 700;
        
        // ============================================
        // СЛОЙ 1: КОВЁР (внизу)
        // ============================================
        if (this.textures.exists('carpet')) {
            this.carpetImg = this.add.image(this.carpetX, this.carpetY, 'carpet');
            this.carpetImg.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetImg.setDepth(0);
            console.log('✅ Ковёр загружен из carpet.png');
        } else {
            this.carpetImg = this.add.rectangle(
                this.carpetX, this.carpetY, this.carpetW, this.carpetH, 0x8B4513
            );
            this.carpetImg.setStrokeStyle(6, 0x654321);
            this.carpetImg.setDepth(0);
            console.log('⚠️ carpet.png НЕ загружен, используется заглушка');
        }
        
        // ============================================
        // СЛОЙ 2: ГРЯЗЬ (полупрозрачная, поверх ковра)
        // ============================================
        this.dirtGfx = this.add.graphics();
        this.dirtGfx.setDepth(1);
        
        // ============================================
        // СЛОЙ 3: МЫЛО (поверх грязи)
        // ============================================
        this.soapGfx = this.add.graphics();
        this.soapGfx.setDepth(2);
        
        // ============================================
        // СЕТКА
        // ============================================
        this.gridCellSize = 10;
        this.gridCols = Math.ceil(this.carpetW / this.gridCellSize);
        this.gridRows = Math.ceil(this.carpetH / this.gridCellSize);
        
        this.dirtGrid = [];
        this.soapGrid = [];
        
        for (let y = 0; y < this.gridRows; y++) {
            this.dirtGrid[y] = [];
            this.soapGrid[y] = [];
            for (let x = 0; x < this.gridCols; x++) {
                this.dirtGrid[y][x] = 1.0;
                this.soapGrid[y][x] = 0.0;
            }
        }
        
        this.drawAll();
        
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW/2,
            this.carpetY - this.carpetH/2,
            this.carpetW, this.carpetH
        );
        
        this.cleanProgress = 0;
        this.isPointerDown = false;
        this.currentTool = 'soap';
        
        // Кисть (поверх всего)
        this.brush = this.add.circle(0, 0, CONFIG.brushRadius, 0xFFFFFF, 0.15);
        this.brush.setDepth(3);
        this.brush.setVisible(false);
        
        // ============================================
        // UI (самый верхний слой)
        // ============================================
        this.moneyText = this.add.text(30, 30, '💰 ' + GameState.money, {
            fontSize: '36px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setDepth(10);
        
        this.foodText = this.add.text(30, 80, '🍞 ' + GameState.food, {
            fontSize: '28px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setDepth(10);
        
        this.toolText = this.add.text(30, 120, '🧹 Радиус: ' + CONFIG.brushRadius, {
            fontSize: '20px', fill: '#AAAAAA', fontFamily: 'Arial'
        }).setDepth(10);
        
        this.add.rectangle(W/2, 200, 400, 30, 0x333333).setDepth(10);
        this.progressBar = this.add.rectangle(W/2 - 200, 200, 0, 26, 0x00FF00).setOrigin(0, 0.5).setDepth(10);
        this.progressText = this.add.text(W/2, 200, '0%', {
            fontSize: '22px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(10);
        
        this.add.text(640, 40, '🛒', { fontSize: '48px' })
            .setDepth(10)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.openShop());
        
        // ============================================
        // КНОПКИ
        // ============================================
        const btnY = 1200;
        
        this.soapBtnBg = this.add.rectangle(180, btnY, 280, 80, 0x4A90D9).setDepth(10);
        this.soapBtnBg.setStrokeStyle(4, 0xFFFFFF);
        this.soapBtnText = this.add.text(180, btnY, '🧼 МЫЛО', {
            fontSize: '28px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('soap'));
        
        this.washBtnBg = this.add.rectangle(540, btnY, 280, 80, 0x555555).setDepth(10);
        this.washBtnBg.setStrokeStyle(4, 0x888888);
        this.washBtnText = this.add.text(540, btnY, '💧 СМЫТЬ', {
            fontSize: '28px', fill: '#AAAAAA', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('wash'));
        
        this.add.text(W/2, 1100, 'ПОЛУЧИТЬ ДЕНЬГИ', {
            fontSize: '28px', fill: '#00FF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 },
            fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(10)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.finishCarpet());
        
        this.selectTool('soap');
        this.setupCleaning();
    }

    selectTool(tool) {
        this.currentTool = tool;
        if (tool === 'soap') {
            this.soapBtnBg.setFillStyle(0x4A90D9);
            this.soapBtnBg.setStrokeStyle(4, 0xFFFFFF);
            this.soapBtnText.setColor('#FFFFFF');
            this.washBtnBg.setFillStyle(0x555555);
            this.washBtnBg.setStrokeStyle(4, 0x888888);
            this.washBtnText.setColor('#AAAAAA');
        } else {
            this.soapBtnBg.setFillStyle(0x555555);
            this.soapBtnBg.setStrokeStyle(4, 0x888888);
            this.soapBtnText.setColor('#AAAAAA');
            this.washBtnBg.setFillStyle(0x4A90D9);
            this.washBtnBg.setStrokeStyle(4, 0xFFFFFF);
            this.washBtnText.setColor('#FFFFFF');
        }
    }

    // ============================================
    // ОТРИСОВКА — ГРЯЗЬ ПОЛУПРОЗРАЧНАЯ, КОВЁР ВИДЕН
    // ============================================
    drawAll() {
        this.dirtGfx.clear();
        this.soapGfx.clear();
        
        const cx = this.carpetX - this.carpetW / 2;
        const cy = this.carpetY - this.carpetH / 2;
        const cs = this.gridCellSize;
        
        for (let y = 0; y < this.gridRows; y++) {
            for (let x = 0; x < this.gridCols; x++) {
                const dirt = this.dirtGrid[y][x];
                const soap = this.soapGrid[y][x];
                const px = cx + x * cs;
                const py = cy + y * cs;
                
                // ✅ ГРЯЗЬ: максимум 0.5 прозрачности — ковёр всегда виден
                if (dirt > 0.05) {
                    this.dirtGfx.fillStyle(0x2a1a0a, dirt * 0.8);
                    this.dirtGfx.fillRect(px, py, cs, cs);
                }
                
                // Мыло: белая пена
                if (soap > 0.05) {
                    this.soapGfx.fillStyle(0xFFFFFF, soap * 0.5);
                    this.soapGfx.fillRect(px, py, cs, cs);
                }
            }
        }
    }

    setupCleaning() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        const handlePointer = (pointer) => {
            this.brush.setPosition(pointer.x, pointer.y);
            this.brush.setVisible(
                GameState.food > 0 &&
                Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y)
            );
            if (GameState.food <= 0) return;
            if (!Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y)) return;
            this.applyTool(pointer.x, pointer.y);
        };
        
        this.input.on('pointerdown', (pointer) => {
            this.isPointerDown = true;
            handlePointer(pointer);
        });
        this.input.on('pointermove', (pointer) => {
            if (!this.isPointerDown && !pointer.isDown) return;
            handlePointer(pointer);
        });
        this.input.on('pointerup', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
        this.input.on('pointerout', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
    }

    applyTool(screenX, screenY) {
        const localX = screenX - (this.carpetX - this.carpetW/2);
        const localY = screenY - (this.carpetY - this.carpetH/2);
        const radius = CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus);
        const cs = this.gridCellSize;
        
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(this.gridCols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(this.gridRows - 1, Math.floor((localY + radius) / cs));
        
        let changed = false;
        
        for (let row = minRow; row <= maxRow; row++) {
            for (let col = minCol; col <= maxCol; col++) {
                const ccx = col * cs + cs / 2;
                const ccy = row * cs + cs / 2;
                const dx = ccx - localX;
                const dy = ccy - localY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > radius) continue;
                const falloff = 1 - (dist / radius);
                
                if (this.currentTool === 'soap') {
                    const before = this.soapGrid[row][col];
                    this.soapGrid[row][col] = Math.min(1.0, before + 0.3 * falloff);
                    if (this.soapGrid[row][col] !== before) changed = true;
                } else {
                    if (this.soapGrid[row][col] < CONFIG.soapThreshold) continue;
                    const before = this.dirtGrid[row][col];
                    this.dirtGrid[row][col] = Math.max(0, before - CONFIG.eraseStrength * falloff);
                    this.soapGrid[row][col] = Math.max(0, this.soapGrid[row][col] - 0.1 * falloff);
                    if (this.dirtGrid[row][col] !== before) changed = true;
                }
            }
        }
        
        if (changed) {
            this.drawAll();
            this.recalcProgress();
        }
    }

    recalcProgress() {
        let totalCleaned = 0;
        const cells = this.gridCols * this.gridRows;
        for (let y = 0; y < this.gridRows; y++) {
            for (let x = 0; x < this.gridCols; x++) {
                totalCleaned += (1 - this.dirtGrid[y][x]);
            }
        }
        this.cleanProgress = totalCleaned / cells;
        if (this.cleanProgress >= 0.9999) {
            let allClean = true;
            for (let y = 0; y < this.gridRows; y++) {
                for (let x = 0; x < this.gridCols; x++) {
                    if (this.dirtGrid[y][x] > 0.05) { allClean = false; break; }
                }
                if (!allClean) break;
            }
            this.cleanProgress = allClean ? 1.0 : 0.99;
        }
        this.updateProgressBar();
    }

    updateProgressBar() {
        const percent = Math.min(100, Math.floor(this.cleanProgress * 100));
        this.progressBar.width = 400 * this.cleanProgress;
        this.progressText.setText(percent + '%');
    }

    async finishCarpet() {
        if (this.cleanProgress < CONFIG.finishThreshold) {
            this.showMessage('Ковёр ещё грязный! Нужно 100%.');
            return;
        }
        const reward = Math.floor(
            CONFIG.rewardMin + Math.random() * (CONFIG.rewardMax - CONFIG.rewardMin)
        ) * GameState.toolLevel;
        GameState.money += reward;
        GameState.food -= 1;
        this.moneyText.setText('💰 ' + GameState.money);
        this.foodText.setText('🍞 ' + GameState.food);
        await saveGame();
        this.showMessage(`+${reward} 💰!`);
        for (let y = 0; y < this.gridRows; y++) {
            for (let x = 0; x < this.gridCols; x++) {
                this.dirtGrid[y][x] = 1.0;
                this.soapGrid[y][x] = 0.0;
            }
        }
        this.drawAll();
        this.cleanProgress = 0;
        this.updateProgressBar();
    }

    openShop() {
        const W = 720, H = 1280;
        const elements = [];
        const overlay = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85).setDepth(20);
        overlay.setInteractive();
        elements.push(overlay);
        const bg = this.add.rectangle(W/2, H/2, 600, 800, 0x333333).setDepth(21);
        bg.setStrokeStyle(4, 0xFFD700);
        elements.push(bg);
        elements.push(this.add.text(W/2, 280, 'МАГАЗИН', {
            fontSize: '48px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22));
        
        const foodBtn = this.add.text(W/2, 450,
            `Купить еду (${CONFIG.foodPrice}💰)\n🍞 +1`, {
            fontSize: '32px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 },
            fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (GameState.money >= CONFIG.foodPrice) {
                GameState.money -= CONFIG.foodPrice;
                GameState.food += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                this.foodText.setText('🍞 ' + GameState.food);
                await saveGame();
                this.showMessage('Куплена еда!');
            } else this.showMessage('Не хватает денег!');
        });
        elements.push(foodBtn);
        
        const toolCost = GameState.toolLevel * CONFIG.toolBasePrice;
        const curR = Math.floor(CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus));
        const newR = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
        
        const toolBtn = this.add.text(W/2, 620,
            `Улучшить щётку (${toolCost}💰)\nРадиус: ${curR} → ${newR}`, {
            fontSize: '28px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 },
            fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            const cost = GameState.toolLevel * CONFIG.toolBasePrice;
            if (GameState.money >= cost) {
                GameState.money -= cost;
                GameState.toolLevel += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                const r = Math.floor(CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus));
                this.toolText.setText('🧹 Радиус: ' + r);
                await saveGame();
                this.showMessage('Щётка улучшена!');
                const newCost = GameState.toolLevel * CONFIG.toolBasePrice;
                const newR2 = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
                toolBtn.setText(`Улучшить щётку (${newCost}💰)\nРадиус: ${r} → ${newR2}`);
            } else this.showMessage('Не хватает денег!');
        });
        elements.push(toolBtn);
        
        const closeBtn = this.add.text(620, 280, '✖', {
            fontSize: '48px', fill: '#FF4444', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => { elements.forEach(el => el.destroy()); });
        elements.push(closeBtn);
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            fontSize: '32px', fill: '#FFFF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 },
            fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(1500, () => msg.destroy());
    }
}

// ============================================
// ЗАПУСК
// ============================================
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>

</body>
</html>
