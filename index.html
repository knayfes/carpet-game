<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чистим Ковры</title>
    <script src="phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%;
            background: #1a1a1a; overflow: hidden;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>

<script>
// ============================================
// ⚙️ НАСТРОЙКИ
// ============================================
const CONFIG = {
    startMoney: 0, startFood: 3, startToolLevel: 1,
    foodPrice: 10, toolBasePrice: 50,
    rewardMin: 50, rewardMax: 100,
    brushRadius: 40,
    toolRadiusBonus: 0.05,
    
    soapPower: 1.0,
    soapThreshold: 0.01,
    eraseStrength: 0.9,
    
    // ✅ 98% достаточно для завершения
    finishThreshold: 0.98
};

const CARPET_IMAGE = 'carpet.png';

// ============================================
// СОСТОЯНИЕ
// ============================================
const GameState = {
    money: CONFIG.startMoney, food: CONFIG.startFood,
    toolLevel: CONFIG.startToolLevel
};
let ysdk = null;

// ============================================
// YANDEX SDK
// ============================================
async function initYandexSDK() {
    try {
        if (typeof YaGames === 'undefined') throw new Error('no SDK');
        ysdk = await YaGames.init();
        const stats = await ysdk.player.getStats(['money', 'food', 'toolLevel']);
        if (stats.money !== undefined) GameState.money = Number(stats.money) || 0;
        if (stats.food !== undefined) GameState.food = Number(stats.food) || 3;
        if (stats.toolLevel !== undefined) GameState.toolLevel = Number(stats.toolLevel) || 1;
    } catch (e) {
        ysdk = {
            player: {
                getStats: async () => {
                    const s = localStorage.getItem('carpetGameStats');
                    return s ? JSON.parse(s) : {};
                },
                setStats: async (stats) => localStorage.setItem('carpetGameStats', JSON.stringify(stats))
            },
            adv: {
                showRewardedVideo: (o) => { if (o?.callbacks?.onRewarded) o.callbacks.onRewarded(); if (o?.callbacks?.onClose) o.callbacks.onClose(); },
                showFullscreenAdv: (o) => { if (o?.callbacks?.onClose) o.callbacks.onClose(); }
            },
            features: { LoadingAPI: { ready: () => {} } }
        };
        const s = localStorage.getItem('carpetGameStats');
        if (s) {
            try {
                const d = JSON.parse(s);
                if (d.money !== undefined) GameState.money = Number(d.money) || 0;
                if (d.food !== undefined) GameState.food = Number(d.food) || 3;
                if (d.toolLevel !== undefined) GameState.toolLevel = Number(d.toolLevel) || 1;
            } catch (err) {}
        }
    }
}

async function saveGame() {
    if (!ysdk) return;
    try {
        await ysdk.player.setStats({
            money: GameState.money, food: GameState.food, toolLevel: GameState.toolLevel
        });
    } catch (e) {}
}

// ============================================
// СЦЕНА ЗАГРУЗКИ
// ============================================
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }
    preload() {
        if (CARPET_IMAGE) this.load.image('carpet', CARPET_IMAGE);
        const w = this.cameras.main.width, h = this.cameras.main.height;
        this.add.text(w/2, h/2 - 50, 'Загрузка...', {
            fontSize: '40px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5);
        this.add.rectangle(w/2, h/2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w/2 - 200, h/2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (v) => { bar.width = 400 * v; });
    }
    create() {
        initYandexSDK();
        this.scene.start('MainScene');
    }
}

// ============================================
// ОСНОВНАЯ СЦЕНА
// ============================================
class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }

    create() {
        if (this.input.mouse) this.input.mouse.disableContextMenu();
        if (ysdk?.features?.LoadingAPI) ysdk.features.LoadingAPI.ready();
        
        const W = 720, H = 1280;
        this.add.rectangle(W/2, H/2, W, H, 0x2a2a2a);
        
        this.carpetW = 500;
        this.carpetH = 700;
        this.carpetX = W/2;
        this.carpetY = 700;
        
        // Ковёр
        if (this.textures.exists('carpet')) {
            this.carpetImg = this.add.image(this.carpetX, this.carpetY, 'carpet');
            this.carpetImg.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetImg.setDepth(0);
        } else {
            this.carpetImg = this.add.rectangle(
                this.carpetX, this.carpetY, this.carpetW, this.carpetH, 0x8B4513
            );
            this.carpetImg.setStrokeStyle(6, 0x654321);
            this.carpetImg.setDepth(0);
        }
        
        // Сетка
        this.gridCellSize = 20;
        this.gridCols = Math.ceil(this.carpetW / this.gridCellSize);
        this.gridRows = Math.ceil(this.carpetH / this.gridCellSize);
        
        this.dirtGrid = new Float32Array(this.gridCols * this.gridRows);
        this.soapGrid = new Float32Array(this.gridCols * this.gridRows);
        this.dirtGrid.fill(1.0);
        
        this.dirtGfx = this.add.graphics().setDepth(1);
        this.soapGfx = this.add.graphics().setDepth(2);
        
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW/2, this.carpetY - this.carpetH/2,
            this.carpetW, this.carpetH
        );
        
        this.cleanProgress = 0;
        this.isPointerDown = false;
        this.currentTool = 'soap';
        this.lastLocalX = -9999;
        this.lastLocalY = -9999;
        
        this.brush = this.add.circle(0, 0, CONFIG.brushRadius, 0xFFFFFF, 0.15).setDepth(3);
        this.brush.setVisible(false);
        
        // UI
        this.moneyText = this.add.text(30, 30, '💰 ' + GameState.money, {
            fontSize: '36px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setDepth(10);
        this.foodText = this.add.text(30, 80, '🍞 ' + GameState.food, {
            fontSize: '28px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setDepth(10);
        this.toolText = this.add.text(30, 120, '🧹 Радиус: ' + CONFIG.brushRadius, {
            fontSize: '20px', fill: '#AAAAAA', fontFamily: 'Arial'
        }).setDepth(10);
        
        this.add.rectangle(W/2, 200, 400, 30, 0x333333).setDepth(10);
        this.progressBar = this.add.rectangle(W/2 - 200, 200, 0, 26, 0x00FF00).setOrigin(0, 0.5).setDepth(10);
        this.progressText = this.add.text(W/2, 200, '0%', {
            fontSize: '22px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(10);
        
        this.add.text(640, 40, '🛒', { fontSize: '48px' })
            .setDepth(10).setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.openShop());
        
        // Кнопки
        const btnY = 1200;
        this.soapBtnBg = this.add.rectangle(180, btnY, 280, 80, 0x4A90D9).setDepth(10);
        this.soapBtnBg.setStrokeStyle(4, 0xFFFFFF);
        this.soapBtnText = this.add.text(180, btnY, '🧼 МЫЛО', {
            fontSize: '28px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('soap'));
        
        this.washBtnBg = this.add.rectangle(540, btnY, 280, 80, 0x555555).setDepth(10);
        this.washBtnBg.setStrokeStyle(4, 0x888888);
        this.washBtnText = this.add.text(540, btnY, '💧 СМЫТЬ', {
            fontSize: '28px', fill: '#AAAAAA', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.selectTool('wash'));
        
        this.add.text(W/2, 1100, 'ПОЛУЧИТЬ ДЕНЬГИ', {
            fontSize: '28px', fill: '#00FF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 }, fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.finishCarpet());
        
        this.selectTool('soap');
        this.setupCleaning();
    }

    selectTool(tool) {
        this.currentTool = tool;
        if (tool === 'soap') {
            this.soapBtnBg.setFillStyle(0x4A90D9); this.soapBtnBg.setStrokeStyle(4, 0xFFFFFF); this.soapBtnText.setColor('#FFFFFF');
            this.washBtnBg.setFillStyle(0x555555); this.washBtnBg.setStrokeStyle(4, 0x888888); this.washBtnText.setColor('#AAAAAA');
        } else {
            this.soapBtnBg.setFillStyle(0x555555); this.soapBtnBg.setStrokeStyle(4, 0x888888); this.soapBtnText.setColor('#AAAAAA');
            this.washBtnBg.setFillStyle(0x4A90D9); this.washBtnBg.setStrokeStyle(4, 0xFFFFFF); this.washBtnText.setColor('#FFFFFF');
        }
    }

    // ============================================
    // ОТРИСОВКА
    // ============================================
    drawDirt() {
        this.dirtGfx.clear();
        const cx = this.carpetX - this.carpetW / 2;
        const cy = this.carpetY - this.carpetH / 2;
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        
        for (let row = 0; row < this.gridRows; row++) {
            for (let col = 0; col < cols; col++) {
                const dirt = this.dirtGrid[row * cols + col];
                if (dirt < 0.05) continue;
                const px = cx + col * cs;
                const py = cy + row * cs;
                this.dirtGfx.fillStyle(0x2a1a0a, dirt * 0.55);
                this.dirtGfx.fillRect(px, py, cs, cs);
            }
        }
        this.needRedrawDirt = false;
    }

    // ✅ Мыло — лёгкая голубая подсветка, НЕ засвечивает ковёр
    drawSoap() {
        this.soapGfx.clear();
        const cx = this.carpetX - this.carpetW / 2;
        const cy = this.carpetY - this.carpetH / 2;
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        
        for (let row = 0; row < this.gridRows; row++) {
            for (let col = 0; col < cols; col++) {
                const soap = this.soapGrid[row * cols + col];
                if (soap < 0.05) continue;
                const px = cx + col * cs;
                const py = cy + row * cs;
                // Голубая подсветка с alpha 0.1 — ковёр не белеет
                this.soapGfx.fillStyle(0x88CCFF, soap * 0.1);
                this.soapGfx.fillRect(px, py, cs, cs);
            }
        }
        this.needRedrawSoap = false;
    }

    update() {
        if (this.needRedrawDirt) this.drawDirt();
        if (this.needRedrawSoap) this.drawSoap();
    }

    setupCleaning() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        const handlePointer = (pointer) => {
            this.brush.setPosition(pointer.x, pointer.y);
            const inBounds = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(GameState.food > 0 && inBounds);
            if (GameState.food <= 0 || !inBounds) return;
            
            const localX = pointer.x - (this.carpetX - this.carpetW/2);
            const localY = pointer.y - (this.carpetY - this.carpetH/2);
            
            const dx = localX - this.lastLocalX;
            const dy = localY - this.lastLocalY;
            if (dx*dx + dy*dy < 64) return;
            
            this.lastLocalX = localX;
            this.lastLocalY = localY;
            
            this.applyTool(localX, localY);
        };
        
        this.input.on('pointerdown', (pointer) => {
            this.isPointerDown = true;
            this.lastLocalX = -9999;
            this.lastLocalY = -9999;
            handlePointer(pointer);
        });
        this.input.on('pointermove', (pointer) => {
            if (!this.isPointerDown && !pointer.isDown) return;
            handlePointer(pointer);
        });
        this.input.on('pointerup', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
        this.input.on('pointerout', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
    }

    applyTool(localX, localY) {
        const radius = CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus);
        const cs = this.gridCellSize;
        const cols = this.gridCols;
        
        const minCol = Math.max(0, Math.floor((localX - radius) / cs));
        const maxCol = Math.min(cols - 1, Math.floor((localX + radius) / cs));
        const minRow = Math.max(0, Math.floor((localY - radius) / cs));
        const maxRow = Math.min(this.gridRows - 1, Math.floor((localY + radius) / cs));
        
        const radiusSq = radius * radius;
        let dirtChanged = false;
        let soapChanged = false;
        
        for (let row = minRow; row <= maxRow; row++) {
            for (let col = minCol; col <= maxCol; col++) {
                const ccx = col * cs + cs / 2;
                const ccy = row * cs + cs / 2;
                const dx = ccx - localX;
                const dy = ccy - localY;
                const distSq = dx*dx + dy*dy;
                if (distSq > radiusSq) continue;
                
                const falloff = Math.max(0.5, 1 - Math.sqrt(distSq) / radius);
                const index = row * cols + col;
                
                if (this.currentTool === 'soap') {
                    if (this.soapGrid[index] < 1.0) {
                        this.soapGrid[index] = Math.min(1.0, this.soapGrid[index] + CONFIG.soapPower * falloff);
                        soapChanged = true;
                    }
                } else {
                    if (this.soapGrid[index] < CONFIG.soapThreshold) continue;
                    if (this.dirtGrid[index] > 0.01) {
                        this.dirtGrid[index] = Math.max(0, this.dirtGrid[index] - CONFIG.eraseStrength * falloff);
                        dirtChanged = true;
                        this.soapGrid[index] = Math.max(0, this.soapGrid[index] - 0.05);
                        soapChanged = true;
                    }
                }
            }
        }
        
        if (dirtChanged) {
            this.needRedrawDirt = true;
            this.recalcProgress();
        }
        if (soapChanged) {
            this.needRedrawSoap = true;
        }
    }

    // ✅ Прогресс: если >= 98%, показываем 100%
    recalcProgress() {
        let total = 0;
        const cells = this.dirtGrid.length;
        for (let i = 0; i < cells; i++) {
            total += (1 - this.dirtGrid[i]);
        }
        this.cleanProgress = total / cells;
        
        // Если достигли 98% — считаем за 100%
        if (this.cleanProgress >= CONFIG.finishThreshold) {
            this.cleanProgress = 1.0;
        }
        
        this.updateProgressBar();
    }

    updateProgressBar() {
        const p = Math.min(100, Math.floor(this.cleanProgress * 100));
        this.progressBar.width = 400 * this.cleanProgress;
        this.progressText.setText(p + '%');
    }

    async finishCarpet() {
        if (this.cleanProgress < 1.0) {
            this.showMessage('Ковёр ещё грязный! Нужно 98%.');
            return;
        }
        const reward = Math.floor(CONFIG.rewardMin + Math.random() * (CONFIG.rewardMax - CONFIG.rewardMin)) * GameState.toolLevel;
        GameState.money += reward;
        GameState.food -= 1;
        this.moneyText.setText('💰 ' + GameState.money);
        this.foodText.setText('🍞 ' + GameState.food);
        await saveGame();
        this.showMessage(`+${reward} 💰!`);
        
        this.dirtGrid.fill(1.0);
        this.soapGrid.fill(0.0);
        this.needRedrawDirt = true;
        this.needRedrawSoap = true;
        this.cleanProgress = 0;
        this.updateProgressBar();
    }

    openShop() {
        const W = 720, H = 1280;
        const els = [];
        const ov = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85).setDepth(20);
        ov.setInteractive(); els.push(ov);
        const bg = this.add.rectangle(W/2, H/2, 600, 800, 0x333333).setDepth(21);
        bg.setStrokeStyle(4, 0xFFD700); els.push(bg);
        els.push(this.add.text(W/2, 280, 'МАГАЗИН', {
            fontSize: '48px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22));
        
        const fb = this.add.text(W/2, 450, `Купить еду (${CONFIG.foodPrice}💰)\n🍞 +1`, {
            fontSize: '32px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 }, fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (GameState.money >= CONFIG.foodPrice) {
                GameState.money -= CONFIG.foodPrice; GameState.food += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                this.foodText.setText('🍞 ' + GameState.food);
                await saveGame(); this.showMessage('Куплена еда!');
            } else this.showMessage('Не хватает денег!');
        });
        els.push(fb);
        
        const tc = GameState.toolLevel * CONFIG.toolBasePrice;
        const cr = Math.floor(CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus));
        const nr = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
        const tb = this.add.text(W/2, 620, `Улучшить щётку (${tc}💰)\nРадиус: ${cr} → ${nr}`, {
            fontSize: '28px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 }, fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            const cost = GameState.toolLevel * CONFIG.toolBasePrice;
            if (GameState.money >= cost) {
                GameState.money -= cost; GameState.toolLevel += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                const r = Math.floor(CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus));
                this.toolText.setText('🧹 Радиус: ' + r);
                await saveGame(); this.showMessage('Щётка улучшена!');
                const nc = GameState.toolLevel * CONFIG.toolBasePrice;
                const nr2 = Math.floor(CONFIG.brushRadius * (1 + GameState.toolLevel * CONFIG.toolRadiusBonus));
                tb.setText(`Улучшить щётку (${nc}💰)\nРадиус: ${r} → ${nr2}`);
            } else this.showMessage('Не хватает денег!');
        });
        els.push(tb);
        
        const cb = this.add.text(620, 280, '✖', {
            fontSize: '48px', fill: '#FF4444', fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(22).setInteractive({ useHandCursor: true })
          .on('pointerdown', () => { els.forEach(el => el.destroy()); });
        els.push(cb);
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            fontSize: '32px', fill: '#FFFF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 }, fontFamily: 'Arial'
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(1500, () => msg.destroy());
    }
}

// ============================================
// ЗАПУСК
// ============================================
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>

</body>
</html>
