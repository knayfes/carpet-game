        }
        g.fillStyle(0x1a0f06, 1); g.fillRect(0, 940, W, 12);

        // Камин
        const fx = W - 95, fy = 1060;
        g.fillStyle(0x3a2a1e, 1); g.fillRect(fx - 95, fy - 105, 190, 170);
        g.fillStyle(0x2a1a12, 1); g.fillRect(fx - 85, fy - 95, 170, 150);
        g.fillStyle(0x0a0505, 1); g.fillRect(fx - 68, fy - 68, 136, 110);
        g.fillStyle(0x3a2210, 1);
        g.fillRect(fx - 60, fy + 20, 120, 14);
        g.fillRect(fx - 50, fy + 10, 100, 12);
        // Огонь
        g.fillStyle(0xff5522, 1);
        g.fillTriangle(fx - 38, fy + 40, fx - 18, fy - 25, fx + 2, fy + 40);
        g.fillTriangle(fx - 8, fy + 40, fx + 10, fy - 10, fx + 30, fy + 40);
        g.fillStyle(0xffaa33, 1);
        g.fillTriangle(fx - 25, fy + 40, fx - 8, fy - 15, fx + 10, fy + 40);
        g.fillTriangle(fx + 5, fy + 40, fx + 22, fy - 5, fx + 35, fy + 40);
        g.fillStyle(0xffdd66, 1);
        g.fillTriangle(fx - 12, fy + 40, fx, fy - 10, fx + 14, fy + 40);
        g.fillTriangle(fx + 8, fy + 40, fx + 18, fy + 0, fx + 28, fy + 40);
        // Ковёр
        g.fillStyle(0x6a3a1e, 0.5);
        g.fillEllipse(W / 2, 1180, 620, 100);
        g.fillStyle(0x8a4a26, 0.35);
        g.fillEllipse(W / 2, 1180, 500, 70);
    }
    drawNeon(g, W, H) {
        g.fillStyle(0x0a0a1a, 1); g.fillRect(0, 0, W, 900);
        for (let i = 0; i < 6; i++) { g.fillStyle(0xFF00E5, 0.04); g.fillRect(0, i * 150, W, 100); }
        g.fillStyle(0x1a1a2a, 1); g.fillRect(0, 900, W, H - 900);
        for (let x = 0; x < W; x += 40) { g.fillStyle(0x00E5FF, 0.15); g.fillRect(x, 900, 2, H - 900); }
        g.lineStyle(4, 0x00E5FF, 0.8); g.strokeCircle(600, 250, 100);
        g.lineStyle(4, 0xFF00E5, 0.8); g.strokeRect(80, 180, 160, 160);
        g.fillStyle(0xFF00E5, 0.3); g.fillRect(0, 880, W, 20);
    }
    drawBeach(g, W, H) {
        g.fillStyle(0x87CEEB, 1); g.fillRect(0, 0, W, 500);
        g.fillStyle(0xFFEB3B, 0.9); g.fillCircle(600, 200, 80);
        g.fillStyle(0x1E90FF, 1); g.fillRect(0, 500, W, 400);
        for (let y = 500; y < 900; y += 40) { g.fillStyle(0xFFFFFF, 0.2); g.fillRect(0, y, W, 3); }
        g.fillStyle(0xF4E4A0, 1); g.fillRect(0, 900, W, H - 900);
    }
    drawSpace(g, W, H) {
        g.fillStyle(0x050510, 1); g.fillRect(0, 0, W, H);
        for (let i = 0; i < 100; i++) {
            const x = (i * 137) % W, y = (i * 253) % 900;
            g.fillStyle(0xFFFFFF, 0.3 + (i % 10) * 0.07);
            g.fillCircle(x, y, 1 + (i % 3));
        }
        g.fillStyle(0x8844FF, 0.15); g.fillCircle(200, 300, 180);
        g.fillStyle(0xFF44AA, 0.1); g.fillCircle(550, 500, 220);
        g.fillStyle(0x0a0a1a, 1); g.fillRect(0, 900, W, H - 900);
    }
    drawCandy(g, W, H) {
        g.fillStyle(0xFFB6D9, 1); g.fillRect(0, 0, W, 900);
        for (let x = -200; x < W + 200; x += 80) {
            g.fillStyle(0xFFFFFF, 0.5);
            g.beginPath();
            g.moveTo(x, 0); g.lineTo(x + 40, 0); g.lineTo(x + 240, 900); g.lineTo(x + 200, 900);
            g.closePath(); g.fillPath();
        }
        g.fillStyle(0xFF8FC7, 1); g.fillRect(0, 900, W, H - 900);
        g.fillStyle(0xFF4488, 1); g.fillCircle(150, 250, 60);
        g.fillStyle(0x44FF88, 1); g.fillCircle(500, 200, 50);
    }
}

class PetSystem {
    constructor(scene, cleaning, bugs, effects, state) {
        this.scene = scene; this.cleaning = cleaning; this.bugs = bugs; this.effects = effects; this.state = state;
        this.timers = { cat: 0, dog: 0, hamster: 0 };
        this.icons = []; this.iconsBg = null;
        this.createIndicators();
    }
    createIndicators() {
        const order = ['cat', 'dog', 'hamster', 'parrot'];
        const ownedPets = order.filter(id => this.state.pets[id].owned);
        if (ownedPets.length === 0) return;
        const rowH = 55;
        const boxH = ownedPets.length * rowH + 20;
        const firstIconY = 240, lastIconY = 240 + (ownedPets.length - 1) * rowH;
        const centerY = (firstIconY + lastIconY) / 2;
        this.iconsBg = this.scene.add.rectangle(670, centerY, 120, boxH, 0x000000, 0.75)
            .setDepth(9).setStrokeStyle(3, 0x4A90D9, 0.8);
        ownedPets.forEach((id, i) => {
            const pet = PETS.find(p => p.id === id);
            const lvl = this.state.pets[id].level;
            const icon = this.scene.add.text(670, 240 + i * rowH, pet.icon + ' ' + lvl, {
                fontSize: '26px', fontFamily: 'Arial', stroke: '#000000', strokeThickness: 5
            }).setOrigin(0.5).setDepth(10);
            this.icons.push({ id, icon });
        });
    }
    refreshIndicators() {
        this.icons.forEach(i => i.icon.destroy());
        this.icons = [];
        if (this.iconsBg) { this.iconsBg.destroy(); this.iconsBg = null; }
        this.createIndicators();
    }
    update(delta) {
        if (this.state.pets.cat.owned) { this.timers.cat += delta; if (this.timers.cat >= this.state.getCatInterval()) { this.timers.cat = 0; this.catAction(); } }
        if (this.state.pets.dog.owned) { this.timers.dog += delta; if (this.timers.dog >= this.state.getDogInterval()) { this.timers.dog = 0; this.dogAction(); } }
        if (this.state.pets.hamster.owned) { this.timers.hamster += delta; if (this.timers.hamster >= this.state.getHamsterInterval()) { this.timers.hamster = 0; this.hamsterAction(); } }
    }
    catAction() {
        const dirt = this.cleaning.dirt;
        const cells = dirt.length;
        const count = Math.max(1, Math.round(this.state.getCatCellsPerAction()));
        let cleaned = 0, lastPos = null, tries = 0;
        while (cleaned < count && tries++ < 60) {
            const i = Math.floor(Math.random() * cells);
            if (dirt[i] > 0.05) {
                dirt[i] = 0; cleaned++;
                const col = i % this.cleaning.cols;
                const row = Math.floor(i / this.cleaning.cols);
                lastPos = { x: this.cleaning.originX + col * this.cleaning.cellSize + this.cleaning.cellSize / 2,
                            y: this.cleaning.originY + row * this.cleaning.cellSize + this.cleaning.cellSize / 2 };
            }
        }
        if (cleaned > 0) {
            this.cleaning.needRedrawDirt = true;
            this.cleaning.recalcProgress();
            this.state.registerPetAction();
            if (lastPos) { this.effects.petAction(lastPos.x, lastPos.y, '🐈'); if (cleaned > 1) this.effects.petAction(lastPos.x, lastPos.y - 30, `×${cleaned}`); }
        }
    }
    dogAction() {
        const count = Math.max(1, Math.round(this.state.getDogBugsPerAction()));
        let killed = 0, lastPos = null;
        while (killed < count && this.bugs.bugs.length > 0) {
            const bug = this.bugs.bugs[0];
            if (!bug || bug.isDead) { this.bugs.bugs.shift(); continue; }
            lastPos = { x: bug.x, y: bug.y };
            this.bugs.scareOne();
            killed++;
        }
        if (killed > 0) {
            this.state.registerPetAction();
            if (lastPos) { this.effects.petAction(lastPos.x, lastPos.y, '🐕'); if (killed > 1) this.effects.petAction(lastPos.x, lastPos.y - 30, `×${killed}`); }
        }
    }
    hamsterAction() {
        const food = Math.max(1, Math.round(this.state.getHamsterFoodPerAction()));
        this.state.food += food;
        this.state.registerPetAction();
        this.effects.petAction(670, 320, '🐹');
        if (food > 1) this.effects.petAction(670, 290, `+${food}🍞`);
        if (this.scene.refreshHUD) this.scene.refreshHUD();
    }
}

class CarpetTutorial {
    constructor(scene, carpetIndex) {
        this.scene = scene; this.carpetIndex = carpetIndex;
        this.steps = CARPET_TUTORIALS[carpetIndex] || [];
        this.stepIndex = 0; this.counters = {}; this.elements = [];
        this.isOpen = false; this.done = false;
        this.progressText = null; this._autoBtn = null; this._forceSkipBtn = null; this._stepStartTime = 0;
    }
    start() { if (!this.steps.length) { this.done = true; return; } this.isOpen = true; this.showStep(); }
    showStep() {
        this.clearStep();
        if (this.stepIndex >= this.steps.length) { this.finish(); return; }
        const s = this.scene, W = 720;
        const step = this.steps[this.stepIndex];
        this._stepStartTime = this.scene.time.now;
        const bg = s.add.rectangle(W/2, 200, W, 220, 0x000000, 0.88).setDepth(150);
        this.elements.push(bg);
        const border = s.add.rectangle(W/2, 310, W, 6, 0xFFD700, 1).setDepth(151);
        this.elements.push(border);
        const stepNum = s.add.text(20, 105, t('carpetGrad', this.carpetIndex, this.stepIndex + 1, this.steps.length), {
            fontSize: '16px', fill: '#AAAAAA', fontStyle: 'bold', fontFamily: FONT_HAND
        }).setOrigin(0, 0.5).setDepth(152);
        this.elements.push(stepNum);
        const skipBtn = s.add.text(W - 15, 105, t('skip'), {
            fontSize: '16px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND,
            backgroundColor: '#660000', padding: { x: 12, y: 8 }
        }).setOrigin(1, 0.5).setDepth(153).setInteractive({ useHandCursor: true });
        skipBtn.on('pointerdown', () => this.skip());
        this.elements.push(skipBtn);
        const text = s.add.text(W/2, 200, loc(step.text), {
            fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND,
            align: 'center', lineSpacing: 6, wordWrap: { width: 660 }
        }).setOrigin(0.5).setDepth(152);
        this.elements.push(text);
        if (step.check !== 'auto' && step.need > 0) {
            const progress = s.add.text(W/2, 270, t('progress', 0, step.need), {
                fontSize: '20px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 4
            }).setOrigin(0.5).setDepth(152);
            this.elements.push(progress); this.progressText = progress;
        }
    }
    clearStep() {
        this.elements.forEach(el => { try { el.destroy(); } catch {} });
        this.elements = []; this.progressText = null; this._autoBtn = null; this._forceSkipBtn = null;
    }
    tick(delta) {
        if (!this.isOpen || this.done) return;
        const step = this.steps[this.stepIndex];
        if (!step) return;
        if (step.check === 'auto') { if (!this._autoBtn || !this._autoBtn.active) this.showAutoButton(); return; }
        if (this._stepStartTime && (this.scene.time.now - this._stepStartTime) > 15000) {
            if (!this._forceSkipBtn || !this._forceSkipBtn.active) {
                const s = this.scene;
                this._forceSkipBtn = s.add.text(360, 340, t('skipStep'), {
                    fontSize: '16px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND,
                    backgroundColor: '#660000', padding: { x: 14, y: 10 }
                }).setOrigin(0.5).setDepth(154).setInteractive({ useHandCursor: true });
                this._forceSkipBtn.on('pointerdown', () => {
                    if (this._forceSkipBtn) { this._forceSkipBtn.destroy(); this._forceSkipBtn = null; }
                    this.stepComplete();
                });
                this.elements.push(this._forceSkipBtn);
            }
        }
    }
    skip() {
        if (this.scene.state.carpetStats[this.carpetIndex]) this.scene.state.carpetStats[this.carpetIndex].tutorialDone = true;
        this.scene.saveSystem.save();
        this.scene.showMessage(t('tutorialSkipped', this.carpetIndex));
        this.isOpen = false; this.done = true; this.clearStep();
    }
    reportAction(type) {
        if (!this.isOpen || this.done) return;
        const step = this.steps[this.stepIndex];
        if (!step || step.check !== type) return;
        this.counters[type] = (this.counters[type] || 0) + 1;
        if (this.progressText) this.progressText.setText(t('progress', Math.min(this.counters[type], step.need), step.need));
        if (this.counters[type] >= step.need) this.stepComplete();
    }
    showAutoButton() {
        const s = this.scene, W = 720;
        const step = this.steps[this.stepIndex];
        if (!step || step.check !== 'auto') return;
        if (this._autoBtn && this._autoBtn.active) return;
        this._autoBtn = s.add.text(W/2, 265, t('next'), {
            fontSize: '20px', fill: '#000000', fontStyle: 'bold', fontFamily: FONT_HAND,
            backgroundColor: '#FFD700', padding: { x: 30, y: 12 }
        }).setOrigin(0.5).setDepth(153).setInteractive({ useHandCursor: true });
        this._autoBtn.on('pointerdown', () => {
            if (this._autoBtn) { this._autoBtn.destroy(); this._autoBtn = null; }
            this.stepComplete();
        });
        this.elements.push(this._autoBtn);
    }
    stepComplete() {
        const s = this.scene;
        if (this._autoBtn && this._autoBtn.active) { this._autoBtn.destroy(); this._autoBtn = null; }
        if (this._forceSkipBtn && this._forceSkipBtn.active) { this._forceSkipBtn.destroy(); this._forceSkipBtn = null; }
        const check = s.add.text(360, 200, '✅', { fontSize: '60px' }).setOrigin(0.5).setDepth(160);
        this.scene.tweens.add({ targets: check, scale: { from: 0, to: 1.5 }, alpha: { from: 1, to: 0 }, duration: 700, ease: 'Back.easeOut',
            onComplete: () => check.destroy() });
        this.scene.time.delayedCall(400, () => {
            this.stepIndex++;
            if (this.stepIndex >= this.steps.length) this.finish(); else this.showStep();
        });
    }
    finish() {
        this.isOpen = false; this.done = true; this.clearStep();
        if (this.scene.state.carpetStats[this.carpetIndex]) this.scene.state.carpetStats[this.carpetIndex].tutorialDone = true;
        this.scene.saveSystem.save();
        this.scene.showMessage(t('tutorialDone', this.carpetIndex));
    }
}
</script>

<script>
class FadeGroup {
    constructor(scene) { this.scene = scene; this.elements = []; this._closing = false; }
    push(el) { this.elements.push(el); return el; }
    openFade() { this._closing = false;
        this.elements.forEach(e => { if (e.setAlpha) e.setAlpha(0); });
        this.scene.tweens.add({ targets: this.elements.filter(e => e.setAlpha), alpha: 1, duration: 200, ease: 'Cubic.easeOut' }); }
    closeFade(onDone) {
        if (this._closing) return;
        this._closing = true;
        const alive = this.elements.filter(e => e && e.active);
        if (alive.length === 0) { this._destroyAll(); onDone && onDone(); return; }
        this.scene.tweens.add({ targets: alive.filter(e => e.setAlpha), alpha: 0, duration: 160, ease: 'Cubic.easeIn',
            onComplete: () => { this._destroyAll(); this._closing = false; onDone && onDone(); } });
    }
    _destroyAll() { this.elements.forEach(e => { try { e.destroy(); } catch {} }); this.elements = []; }
}

/* МАГАЗИН: не сворачивается ни при переключении вкладок, ни при покупке */
class ShopUI {
    constructor(scene, state, ads) {
        this.scene = scene; this.state = state; this.ads = ads;
        this.group = new FadeGroup(scene); this.isOpen = false; this.activeTab = 'upgrades';
        this.onBuyCarpet = null; this.onChanged = null; this.onMessage = null;
        this.onPrestige = null; this.onSkinChange = null; this.onPetBought = null;
        this.onLegacyBuy = null; this.onOpen = null; this.onClose = null;
    }
        open() {
        if (this.isOpen) return;
        this.isOpen = true;
        this._fadeIn = true;
        this.onOpen?.();
        this.render();
    }
    close() {
        if (!this.isOpen) return;
        this.isOpen = false;
        this.group.closeFade(() => this.onClose?.());
    }
        refresh() {
        if (!this.isOpen) return;
        this._fadeIn = false;
        this.group._destroyAll();
        this.render();
    }
    // Покупка — обновляем содержимое, окно остаётся открытым
    async _afterBuy() {
        await this.onChanged?.();
        this.refresh();
    }
    render() {
        const s = this.scene, W = 720, H = 1280;
        const push = (el) => this.group.push(el);
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(40)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 680, 1180, 0x2a2a2a).setDepth(41).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 100, '🛒 ' + t('shop'), TEXT_STYLES.title()).setOrigin(0.5).setDepth(42));
        this._renderTabs(push);
        if (this.activeTab === 'upgrades') this._renderUpgrades(push);
        else if (this.activeTab === 'skins') this._renderSkins(push);
        else if (this.activeTab === 'pets') this._renderPets(push);
        else if (this.activeTab === 'legacy') this._renderLegacy(push);
        else if (this.activeTab === 'prestige') this._renderPrestige(push);
        const closeHit = push(s.add.text(630, 100, '✖', { fontSize: '52px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true }));
                closeHit.on('pointerdown', () => this.close());
        if (this._fadeIn) {
            this.group.openFade();
            this._fadeIn = false;
        }
    }
    _renderTabs(push) {
        const s = this.scene, st = this.state;
        const tabs = [
            { id: 'upgrades', label: '⚙️' },
            { id: 'skins', label: '🎨' },
            { id: 'pets', label: '🐾' },
            { id: 'legacy', label: '👑' + (st.legacyPoints > 0 ? st.legacyPoints : '') },
            { id: 'prestige', label: '🔥' }
        ];
        const tabW = 128, tabH = 62;
        const totalW = tabs.length * tabW + (tabs.length - 1) * 6;
        const startX = 360 - totalW / 2 + tabW / 2;
        tabs.forEach((tab, i) => {
            const x = startX + i * (tabW + 6), y = 180;
            const active = this.activeTab === tab.id;
            const pill = makePill(s, x, y, tabW, tabH, { radius: 20, fill: active ? 0xFFD700 : 0x444444, stroke: active ? 0xFFFFFF : 0x666666, strokeW: 3, depth: 41 });
            push(pill.cont);
            // Переключение вкладки — окно остаётся открытым
            pill.hit.on('pointerdown', () => { pill.tap(); this.activeTab = tab.id; this.refresh(); });
            push(s.add.text(x, y, tab.label, { fontSize: '30px', fill: active ? '#000000' : '#CCCCCC', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        });
    }
    _renderUpgrades(push) {
        const s = this.scene, st = this.state;
        const item = (y, sublabel, price, onBuy, opts = {}) => {
            const canBuy = st.money >= price && !opts.disabled;
            const fill = opts.disabled ? 0x2a2a2a : (canBuy ? 0x3a4a3a : 0x2a2a2a);
            const stroke = opts.disabled ? 0x555555 : (canBuy ? 0x00FF00 : 0x666666);
            const pill = makePill(s, 360, y, 620, 68, { radius: 22, fill, stroke, strokeW: 2, depth: 41 });
            push(pill.cont);
            push(s.add.text(70, y, sublabel, { fontSize: '20px', fill: opts.disabled ? '#888888' : '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            const priceStr = opts.priceLabel || `${price}💰`;
            push(s.add.text(630, y, priceStr, { fontSize: '26px', fill: opts.disabled ? '#666666' : (canBuy ? '#00FF00' : '#FF6666'), fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
            pill.hit.on('pointerdown', async () => {
                pill.tap();
                if (opts.disabled) return;
                if (canBuy) { onBuy(); } else { await this._offerAd(push, price - st.money); }
            });
        };
        let y = 250;
        item(y, `🍞 ${t('buyFood')} (+1)`, BALANCE.foodPrice, async () => { st.buyFood(); await this._afterBuy(); }); y += 76;
        const bulkPrice = Math.floor(BALANCE.foodPrice * BALANCE.foodBulkCount * BALANCE.foodBulkDiscount);
        item(y, `🍞 ${t('foodBulk', BALANCE.foodBulkCount)}`, bulkPrice, async () => { st.buyFoodBulk(); await this._afterBuy(); }); y += 76;
        item(y, st.autoFoodEnabled ? `✅ ${t('autoFoodOn')}` : `🍞 ${t('autoFood')} (${st.getAutoFoodPrice()}💰)`, st.getAutoFoodPrice(),
            async () => { st.buyAutoFood(); await this._afterBuy(); }, { disabled: st.autoFoodEnabled }); y += 76;
        const curR = st.getCurrentRadius();
        const nextR = Math.floor(BALANCE.brushRadius * (1 + st.toolLevel * BALANCE.toolRadiusBonus)) + (st.legacyUpgrades.brush_master || 0) * 5;
        const curM = Math.round(st.getToolMoneyMultiplier() * 100);
        const nextM = Math.round((1 + st.toolLevel * BALANCE.toolMoneyBonus) * 100);
        item(y, `🧹 ${t('brush')} ${st.toolLevel}  ${curR}→${nextR}  ${curM}%→${nextM}%💰`, st.getToolUpgradePrice(),
            async () => { st.upgradeTool(); await this._afterBuy(); }); y += 76;
        if (st.carpetIndex <= 3) {
            const curSoap = (st.getSoapPower() * 100).toFixed(0);
            const nextSoap = ((st.getSoapPower() + BALANCE.soapPower * 0.40) * 100).toFixed(0);
            item(y, `🧼 ${t('soap2')} ${st.soapLevel}  ${curSoap}%→${nextSoap}%`, st.getSoapUpgradePrice(),
                async () => { st.upgradeSoap(); await this._afterBuy(); }); y += 76;
            const curWash = (st.getWashStrength() * 100).toFixed(0);
            const nextWash = ((st.getWashStrength() + BALANCE.washStrength * 0.35) * 100).toFixed(0);
            item(y, `💧 ${t('wash2')} ${st.washLevel}  ${curWash}%→${nextWash}%`, st.getWashUpgradePrice(),
                async () => { st.upgradeWash(); await this._afterBuy(); }); y += 76;
        }
        if (st.carpetIndex >= 2) {
            const curCd = st.getSwatterCooldown();
            const nextCd = Math.max(BALANCE.swatterCooldownMin, BALANCE.swatterCooldown - (st.swatterLevel + 1) * BALANCE.swatterCooldownStep);
            const curRad = st.getSwatterRadius();
            const nextRad = BALANCE.swatterRadius + (st.swatterLevel + 1) * BALANCE.swatterRadiusStep;
            const curBonus = st.getSwatterRewardBonus();
            const nextBonus = curBonus + BALANCE.swatterBonusPerLevel;
            item(y, `🪰 ${t('swatter2')} ${st.swatterLevel}  ${curCd}→${nextCd}мс  ${curRad}→${nextRad}  +${curBonus}→+${nextBonus}💰`,
                st.getSwatterUpgradePrice(), async () => { st.upgradeSwatter(); await this._afterBuy(); }); y += 76;
            if (st.doubleBugReward) {
                item(y, `💰 ${t('doubleBugOn')}`, 0, () => {}, { disabled: true, priceLabel: '✅' });
            } else {
                item(y, `💰 ${t('doubleBug')} (+${BALANCE.bugRewardPerKill}💰)`, BALANCE.doubleBugPrice,
                    async () => { st.buyDoubleBug(); await this._afterBuy(); });
            }
            y += 76;
        }
        this._renderAdBlock(push, y); y += 100;
        this._renderNewCarpetSection(push, y);
    }
    _renderAdBlock(push, y) {
        const s = this.scene;
        const cooldown = this.ads.getCooldownRemaining();
        const available = cooldown <= 0;
        const label = available ? t('adWatch', BALANCE.adRewardMoney) : t('adWait', Math.ceil(cooldown / 1000));
        const pill = makePill(s, 360, y, 620, 70, { radius: 22, fill: available ? 0x4a3a10 : 0x2a2a2a, stroke: available ? 0xFFD700 : 0x666666, strokeW: 3, depth: 41 });
        push(pill.cont);
        push(s.add.text(360, y, label, { fontSize: '20px', fill: available ? '#FFD700' : '#888888', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        if (available) pill.hit.on('pointerdown', async () => { pill.tap(); await this._showAdAndRefresh(); });
    }
    _renderNewCarpetSection(push, y) {
        const s = this.scene, st = this.state;
        const hasNext = st.carpetIndex < BALANCE.totalCarpets;
        if (!hasNext) {
            push(s.add.rectangle(360, y, 620, 80, 0x2a2010).setDepth(41).setStrokeStyle(3, 0xFFD700, 0.8));
            push(s.add.text(360, y, '🏆 ' + t('allCarpets'), { fontSize: '22px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
            return;
        }
        const price = st.getNewCarpetPrice();
        const reqR = st.getRequiredRadius();
        const curR = st.getCurrentRadius();
        const radiusOk = curR >= reqR, moneyOk = st.money >= price;
        const canBuy = radiusOk && moneyOk;
        let label, fill, stroke, textColor, hint;
        if (canBuy) { fill = 0x205020; stroke = 0x00FF00; textColor = '#00FF00'; label = t('buyNewCarpet', st.carpetIndex + 1, price); hint = t('clickToBuy'); }
        else if (!radiusOk) { fill = 0x2a1010; stroke = 0xFF6666; textColor = '#FF8888'; label = t('needRadius', reqR, curR); hint = t('upgradeBrush'); }
        else { fill = 0x2a2010; stroke = 0xFFD700; textColor = '#FFD700'; label = t('needMoney', st.carpetIndex + 1, price, st.money); hint = t('noMoneyHint'); }
        const pill = makePill(s, 360, y, 620, 90, { radius: 24, fill, stroke, strokeW: 3, depth: 41 });
        push(pill.cont);
        push(s.add.text(360, y - 15, label, { fontSize: '22px', fill: textColor, fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        push(s.add.text(360, y + 18, hint, { fontSize: '16px', fill: '#AAAAAA', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        if (canBuy) pill.hit.on('pointerdown', async () => { pill.tap(); await this.onBuyCarpet?.(); this.close(); });
    }
    async _offerAd(push, missing) {
        const s = this.scene;
        const el = [];
        const ov = s.add.rectangle(360, 640, 720, 1280, 0x000000, 0.7).setDepth(50); ov.setInteractive(); el.push(ov);
        el.push(s.add.rectangle(360, 640, 560, 400, 0x1a1a1a).setDepth(51).setStrokeStyle(4, 0xFFD700));
        el.push(s.add.text(360, 530, LANG === 'ru'
            ? `Не хватает ${missing}💰\n\nПосмотреть рекламу\nи получить +${BALANCE.adRewardMoney}💰?`
            : `Missing ${missing}💰\n\nWatch ad\nfor +${BALANCE.adRewardMoney}💰?`,
            { ...TEXT_STYLES.shopInfo('#FFFFFF', 24), align: 'center' }).setOrigin(0.5).setDepth(52));
        const yes = s.add.text(260, 710, LANG === 'ru' ? '📺 СМОТРЕТЬ' : '📺 WATCH', {
            fontSize: '22px', fill: '#000000', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#FFD700', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
        const no = s.add.text(460, 710, LANG === 'ru' ? '❌ ОТМЕНА' : '❌ CANCEL', {
            fontSize: '22px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#444444', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(52).setInteractive({ useHandCursor: true });
        el.push(yes, no);
        const cleanup = () => { el.forEach(e => { try { e.destroy(); } catch {} }); };
        no.on('pointerdown', () => cleanup());
        yes.on('pointerdown', async () => { cleanup(); await this._showAdAndRefresh(); });
    }
    async _showAdAndRefresh() {
        const ok = await this.ads.showRewarded();
        if (ok) { this.state.addMoney(BALANCE.adRewardMoney); await this.onChanged?.(); this.onMessage?.(t('adReward', BALANCE.adRewardMoney)); this.refresh(); }
        else this.onMessage?.(t('adUnavailable'));
    }
    _renderSkins(push) {
        const s = this.scene;
        push(s.add.text(360, 245, t('skinsRooms'), { ...TEXT_STYLES.shop('#FFFFFF', 24) }).setOrigin(0.5).setDepth(42));
        this._renderSkinGrid(push, ROOM_SKINS, 320, 'room');
        push(s.add.text(360, 540, t('skinsBrushes'), { ...TEXT_STYLES.shop('#FFFFFF', 24) }).setOrigin(0.5).setDepth(42));
        this._renderSkinGrid(push, BRUSH_SKINS, 615, 'brush');
    }
    _renderSkinGrid(push, list, startY, kind) {
        const s = this.scene, st = this.state;
        const cardW = 118, cardH = 150, gap = 6;
        const totalW = list.length * cardW + (list.length - 1) * gap;
        const startX = 360 - totalW / 2 + cardW / 2;
        list.forEach((skin, i) => {
            const x = startX + i * (cardW + gap), y = startY + cardH / 2;
            const unlocked = kind === 'room' ? st.unlockedRooms.includes(skin.id) : st.unlockedBrushes.includes(skin.id);
            const selected = kind === 'room' ? st.selectedRoom === skin.id : st.selectedBrush === skin.id;
            const fill = selected ? 0x2a5020 : (unlocked ? 0x2a2a2a : 0x1a1a1a);
            const stroke = selected ? 0x00FF00 : (unlocked ? 0x888888 : 0x444444);
            const pill = makePill(s, x, y, cardW, cardH, { radius: 18, fill, stroke, strokeW: selected ? 4 : 2, depth: 41 });
            push(pill.cont);
            push(s.add.text(x, y - 32, skin.icon, { fontSize: '48px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(x, y + 16, loc(skin.name), { fontSize: '15px', fill: unlocked ? '#FFFFFF' : '#888888', fontStyle: 'bold', fontFamily: FONT_HAND, wordWrap: { width: cardW - 10 }, align: 'center' }).setOrigin(0.5).setDepth(42));
            const priceY = y + 50;
            if (selected) push(s.add.text(x, priceY, t('selected'), { fontSize: '14px', fill: '#00FF00', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
            else if (unlocked) push(s.add.text(x, priceY, t('select'), { fontSize: '14px', fill: '#00E5FF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
            else push(s.add.text(x, priceY, `${skin.price}💰`, { fontSize: '17px', fill: st.money >= skin.price ? '#FFD700' : '#FF6666', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
            pill.hit.on('pointerdown', async () => {
                pill.tap();
                if (selected) return;
                if (unlocked) {
                    if (kind === 'room') st.selectRoomSkin(skin.id); else st.selectBrushSkin(skin.id);
                    await this.onChanged?.();
                    this.onSkinChange?.(kind);
                    this.refresh();
                }
                else if (st.money >= skin.price) {
                    if (kind === 'room') st.buyRoomSkin(skin.id); else st.buyBrushSkin(skin.id);
                    this.onMessage?.(t('bought', loc(skin.name)));
                    await this._afterBuy();
                    this.onSkinChange?.(kind);
                }
                else await this._offerAd(push, skin.price - st.money);
            });
        });
    }
    _renderPets(push) {
        const s = this.scene, st = this.state;
        push(s.add.text(360, 230, t('pets'), { ...TEXT_STYLES.shop('#FFD700', 28) }).setOrigin(0.5).setDepth(42));
        push(s.add.text(360, 264, t('petsSubtitle'), { ...TEXT_STYLES.shopInfo('#AAAAAA', 16) }).setOrigin(0.5).setDepth(42));
        PETS.forEach((pet, i) => {
            const y = 320 + i * 122;
            const pdata = st.pets[pet.id];
            const owned = pdata.owned, level = pdata.level;
            const maxed = level >= BALANCE.petMaxLevel;
            const upgradeCost = st.getPetUpgradeCost(pet.id);
            const canUpgrade = st.canUpgradePet(pet.id);
            const canBuy = st.money >= pet.price;
            const pill = makePill(s, 360, y, 620, 112, { radius: 24, fill: owned ? 0x2a4020 : 0x252525, stroke: owned ? 0x00FF00 : 0x666666, strokeW: 3, depth: 41 });
            push(pill.cont);
            push(s.add.text(75, y, pet.icon, { fontSize: '54px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(120, y - 32, loc(pet.name) + (owned ? `  ${level}` : ''), { fontSize: '22px', fill: owned ? '#00FF00' : '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            let desc = '';
            if (!owned) desc = loc(pet.desc);
            else if (maxed) desc = t('maxed');
            else if (pet.id === 'cat') { const cells = Math.round(st.getCatCellsPerAction()); const nextCells = Math.round(BALANCE.petCatCountBase + level * BALANCE.petCatCountPerLevel); const interval = (st.getCatInterval() / 1000).toFixed(1); desc = `${cells} / ${interval}s  →  ${nextCells}`; }
            else if (pet.id === 'dog') { const bugs = Math.round(st.getDogBugsPerAction()); const nextBugs = Math.round(BALANCE.petDogCountBase + level * BALANCE.petDogCountPerLevel); const interval = (st.getDogInterval() / 1000).toFixed(1); desc = `${bugs} / ${interval}s  →  ${nextBugs}`; }
            else if (pet.id === 'hamster') { const food = Math.round(st.getHamsterFoodPerAction()); const nextFood = Math.round(BALANCE.petHamsterCountBase + level * BALANCE.petHamsterCountPerLevel); const interval = (st.getHamsterInterval() / 1000).toFixed(1); desc = `+${food}🍞 / ${interval}s  →  +${nextFood}`; }
            else if (pet.id === 'parrot') { const cur = Math.round(st.getParrotBonus() * 100); const next = Math.round((st.getParrotBonus() + BALANCE.petParrotBonusPerLevel) * 100); desc = `+${cur}%💰  →  +${next}%💰`; }
            push(s.add.text(120, y + 10, desc, { fontSize: '15px', fill: '#AAAAAA', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            if (!owned) {
                push(s.add.text(600, y, `${pet.price}💰`, { fontSize: '26px', fill: canBuy ? '#FFD700' : '#FF6666', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
                pill.hit.on('pointerdown', async () => {
                    pill.tap();
                    if (canBuy) { if (st.buyPet(pet.id)) { this.onMessage?.(t('bought', loc(pet.name))); this.onPetBought?.(pet.id); await this._afterBuy(); } }
                    else await this._offerAd(push, pet.price - st.money);
                });
            } else if (maxed) {
                push(s.add.text(600, y, t('max'), { fontSize: '22px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
            } else {
                push(s.add.text(600, y - 16, `🍞 ${upgradeCost}`, { fontSize: '24px', fill: canUpgrade ? '#FFD700' : '#FF6666', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
                push(s.add.text(600, y + 16, t('lvlUp'), { fontSize: '16px', fill: '#00E5FF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
                pill.hit.on('pointerdown', async () => {
                    pill.tap();
                    if (st.upgradePet(pet.id)) { this.onMessage?.(t('bought', loc(pet.name))); this.onPetBought?.(pet.id); await this._afterBuy(); }
                    else this.onMessage?.(t('notEnoughFood', upgradeCost));
                });
            }
        });
    }
    _renderLegacy(push) {
        const s = this.scene, st = this.state;
        push(s.add.text(360, 230, t('legacy'), { ...TEXT_STYLES.shop('#FFD700', 30) }).setOrigin(0.5).setDepth(42));
        push(s.add.text(360, 270, t('legacyPoints', st.legacyPoints, st.prestigeLevel), { ...TEXT_STYLES.shopInfo('#FFFFFF', 18) }).setOrigin(0.5).setDepth(42));
        LEGACY_UPGRADES.forEach((up, i) => {
            const y = 325 + i * 84;
            const lvl = st.getLegacyUpgradeLevel(up.id);
            const maxed = lvl >= up.maxLevel;
            const cost = st.getLegacyUpgradeCost(up.id);
            const canBuy = st.canBuyLegacy(up.id);
            const pill = makePill(s, 360, y, 620, 76, { radius: 20, fill: maxed ? 0x2a4020 : 0x252525, stroke: maxed ? 0x00FF00 : (canBuy ? 0xFFD700 : 0x555555), strokeW: 3, depth: 41 });
            push(pill.cont);
            push(s.add.text(70, y, up.icon, { fontSize: '38px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(105, y - 14, `${loc(up.name)}  ${lvl}/${up.maxLevel}`, { fontSize: '19px', fill: maxed ? '#00FF00' : '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            push(s.add.text(105, y + 16, loc(up.desc), { fontSize: '14px', fill: '#AAAAAA', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            if (maxed) push(s.add.text(600, y, '✅', { fontSize: '26px', fill: '#00FF00', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
            else {
                push(s.add.text(600, y, `👑 ${cost}`, { fontSize: '22px', fill: canBuy ? '#FFD700' : '#FF6666', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(42));
                pill.hit.on('pointerdown', async () => {
                    pill.tap();
                    if (st.buyLegacy(up.id)) { this.onMessage?.(`👑 ${loc(up.name)}!`); this.onLegacyBuy?.(up.id); await this._afterBuy(); }
                    else this.onMessage?.(`❌ 👑 ${cost}`);
                });
            }
        });
    }
    _renderPrestige(push) {
        const s = this.scene, st = this.state;
        if (!st.canPrestige()) {
            push(s.add.text(360, 640, t('prestigeLocked'), { ...TEXT_STYLES.shopInfo('#AAAAAA', 26), align: 'center' }).setOrigin(0.5).setDepth(42));
            return;
        }
        const cy = 640;
        push(s.add.rectangle(360, cy, 620, 520, 0x1a0a1a).setDepth(41).setStrokeStyle(3, 0xFFD700, 0.7));
        push(s.add.text(360, cy - 210, t('prestigeAvailable'), { ...TEXT_STYLES.shop('#FFD700', 30) }).setOrigin(0.5).setDepth(42));
        const curMult = st.getPrestigeMultiplier();
        const nextMult = curMult * 2.0;
        const gain = st.prestigeLevel === 0 ? BALANCE.legacyPerPrestige1 : BALANCE.legacyPerPrestigeN;
        const info =
            `${st.getPrestigeTitle()} → ${st.prestigeLevel + 1}\n\n` +
            t('prestigeGain', gain) + '\n' +
            t('prestigeMult', curMult.toFixed(2), nextMult.toFixed(2)) + '\n\n' +
            `${t('willStay')}\n` +
            (LANG === 'ru' ? 'Наследие, скины, достижения\n' : 'Legacy, skins, achievements\n') +
            (st.legacyUpgrades.pet_friends ? (LANG === 'ru' ? 'Питомцы\n' : 'Pets\n') : (LANG === 'ru' ? 'Питомцы СБРОСЯТСЯ\n' : 'Pets will RESET\n')) +
            `\n${t('willReset')}\n` +
            (LANG === 'ru' ? 'Деньги, ковры, щётка, автоеда' : 'Money, carpets, brush, auto-food');
        push(s.add.text(360, cy - 20, info, { ...TEXT_STYLES.shopInfo('#FFFFFF', 17), align: 'center', lineSpacing: 4 }).setOrigin(0.5).setDepth(42));
        let confirmPending = false;
        const btnLabel = t('prestigeBtn', gain);
        const btn = push(s.add.text(360, cy + 210, btnLabel, {
            fontSize: '24px', fill: '#000000', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#FFD700', padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true }));
        btn.on('pointerdown', async () => {
            if (!confirmPending) {
                confirmPending = true; btn.setText(t('confirmPrestige'));
                btn.setBackgroundColor('#FF4444'); btn.setColor('#FFFFFF');
                s.time.delayedCall(3000, () => { if (confirmPending && btn.active) { confirmPending = false; btn.setText(btnLabel); btn.setBackgroundColor('#FFD700'); btn.setColor('#000000'); } });
            } else { confirmPending = false; await this.onPrestige?.(); this.close(); }
        });
    }
}

class AchievementsUI {
    constructor(scene, state) {
        this.scene = scene; this.state = state;
        this.group = new FadeGroup(scene); this.isOpen = false;
        this.currentPage = 0;
        this.onOpen = null; this.onClose = null;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.currentPage = 0; this.onOpen?.(); this.render(); }
    close() { if (!this.isOpen) return; this.isOpen = false; this.group.closeFade(() => this.onClose?.()); }
    refresh() { if (!this.isOpen) return; this.group._destroyAll(); this.render(); }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => this.group.push(el);
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.92).setDepth(40)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1140, 0x1e1e28).setDepth(41).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 100, t('achievementsTitle'), TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(42));
        const done = Object.keys(st.achievements).length;
        push(s.add.text(W/2, 152, t('achievementsOpened', done, ACHIEVEMENTS.length), { ...TEXT_STYLES.shopInfo('#FFFFFF', 22) }).setOrigin(0.5).setDepth(42));

        const PAGE_SIZE = 7;
        const totalPages = Math.ceil(ACHIEVEMENTS.length / PAGE_SIZE);
        if (this.currentPage >= totalPages) this.currentPage = 0;
        const start = this.currentPage * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, ACHIEVEMENTS.length);

        const startY = 200, itemH = 118, gap = 8;
        for (let i = start; i < end; i++) {
            const a = ACHIEVEMENTS[i];
            const y = startY + (i - start) * (itemH + gap) + itemH / 2;
            const unlocked = !!st.achievements[a.id];
            const val = st.getAchievementValue(a.type);
            const current = a.type === 'bestTime' ? (val > 0 ? formatTime(val) : '—') : Math.min(val, a.target);
            push(s.add.rectangle(W/2, y, 620, itemH, unlocked ? 0x2a4020 : 0x252525).setDepth(41).setStrokeStyle(3, unlocked ? 0x00FF00 : 0x555555, unlocked ? 0.8 : 0.4));
            push(s.add.text(W/2 - 280, y, a.icon, { fontSize: '54px' }).setOrigin(0.5).setDepth(42));
            push(s.add.text(W/2 - 230, y - 24, loc(a.name), { fontSize: '24px', fill: unlocked ? '#00FF00' : '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            push(s.add.text(W/2 - 230, y + 6, unlocked ? `✅ +${a.reward}💰` : loc(a.desc), { fontSize: '16px', fill: unlocked ? '#88FF88' : '#AAAAAA', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            if (!unlocked && a.type !== 'bestTime') {
                push(s.add.text(W/2 - 230, y + 32, `${current} / ${a.target}`, { fontSize: '16px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(42));
            }
        }

        const navY = 1180;
        const pillPrev = makePill(s, 120, navY, 130, 60, { radius: 22, fill: this.currentPage > 0 ? 0x4a3a10 : 0x2a2a2a, stroke: this.currentPage > 0 ? 0xFFD700 : 0x555555, strokeW: 3, depth: 41 });
        push(pillPrev.cont);
        push(s.add.text(120, navY, '⬅️', { fontSize: '28px', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        if (this.currentPage > 0) pillPrev.hit.on('pointerdown', () => { pillPrev.tap(); this.currentPage--; this.refresh(); });

        push(s.add.text(W/2, navY, t('page', this.currentPage + 1, totalPages), { ...TEXT_STYLES.shopInfo('#FFFFFF', 22) }).setOrigin(0.5).setDepth(42));

        const pillNext = makePill(s, 600, navY, 130, 60, { radius: 22, fill: this.currentPage < totalPages - 1 ? 0x4a3a10 : 0x2a2a2a, stroke: this.currentPage < totalPages - 1 ? 0xFFD700 : 0x555555, strokeW: 3, depth: 41 });
        push(pillNext.cont);
        push(s.add.text(600, navY, '➡️', { fontSize: '28px', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
        if (this.currentPage < totalPages - 1) pillNext.hit.on('pointerdown', () => { pillNext.tap(); this.currentPage++; this.refresh(); });

        push(s.add.text(620, 100, '✖', { fontSize: '52px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.close()));
        this.group.openFade();
    }
}

class QuestsUI {
    constructor(scene, state) { this.scene = scene; this.state = state; this.group = new FadeGroup(scene); this.isOpen = false; this.onClaim = null; this.onOpen = null; this.onClose = null; }

    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => this.group.push(el);
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.92).setDepth(40)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1140, 0x1e1e28).setDepth(41).setStrokeStyle(5, 0x00E5FF));

        push(s.add.text(W/2, 195, t('questsUpdate'), { ...TEXT_STYLES.shopInfo('#AAAAAA', 18) }).setOrigin(0.5).setDepth(42));
        if (st.quests.length === 0) {
            push(s.add.text(W/2, 640, '...', { ...TEXT_STYLES.shopInfo('#FFFFFF', 22) }).setOrigin(0.5).setDepth(42));
        } else {
            st.quests.forEach((q, i) => {
                const y = 330 + i * 270;
                const val = st.getQuestValue(q);
                const done = val >= q.target;
                const claimed = st.questClaimed[q.id];
                const progress = Math.min(1, val / q.target);
                push(s.add.rectangle(W/2, y, 600, 230, 0x252525).setDepth(41).setStrokeStyle(3, claimed ? 0x555555 : (done ? 0x00FF00 : 0x00E5FF), 0.6));
                push(s.add.text(W/2 - 260, y - 75, q.icon, { fontSize: '54px' }).setOrigin(0.5).setDepth(42));
                push(s.add.text(W/2 - 200, y - 75, loc(q.text), { fontSize: '24px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND, wordWrap: { width: 400 } }).setOrigin(0, 0.5).setDepth(42));
                push(s.add.rectangle(W/2, y + 10, 500, 32, 0x111111).setDepth(41));
                push(s.add.rectangle(W/2 - 250, y + 10, 500 * progress, 32, done ? 0x00FF00 : 0x00E5FF).setOrigin(0, 0.5).setDepth(42));
                push(s.add.text(W/2, y + 10, `${Math.min(val, q.target)} / ${q.target}`, { fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5).setDepth(43));
                const btnY = y + 75;
                if (claimed) push(s.add.text(W/2, btnY, t('claimed'), { fontSize: '22px', fill: '#00AA00', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
                else if (done) push(s.add.text(W/2, btnY, t('claim', q.reward), { fontSize: '24px', fill: '#000000', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#FFD700', padding: { x: 30, y: 12 } }).setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true }).on('pointerdown', async () => { if (st.claimQuest(q)) { await this.onClaim?.(); this.refresh(); } }));
                else push(s.add.text(W/2, btnY, t('reward', q.reward), { fontSize: '20px', fill: '#FFD700', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(42));
            });
        }
        push(s.add.text(620, 130, '✖', { fontSize: '52px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(42).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.close()));
        this.group.openFade();
    }
}

class DailyBonusUI {
    constructor(scene, state) { this.scene = scene; this.state = state; this.group = new FadeGroup(scene); this.isOpen = false; this.onClaim = null; this.onOpen = null; this.onClose = null; }
    open() { if (this.isOpen) return; this.isOpen = true; this.onOpen?.(); this.render(); }
    close() { if (!this.isOpen) return; this.isOpen = false; this.group.closeFade(() => this.onClose?.()); }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => this.group.push(el);
        const status = st.getDailyStatus();
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 940, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 280, t('dailyTitle'), TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(62));
        push(s.add.text(W/2, 340, t('dailyDay', status.nextDay), { ...TEXT_STYLES.shopInfo('#FFFFFF', 22) }).setOrigin(0.5).setDepth(62));
        const cardW = 130, cardH = 130, gap = 12;
        for (let i = 0; i < 7; i++) {
            const row = i < 4 ? 0 : 1;
            const col = i < 4 ? i : (i - 4);
            const cols = row === 0 ? 4 : 3;
            const rowW = cols * cardW + (cols - 1) * gap;
            const rowStartX = W / 2 - rowW / 2 + cardW / 2;
            const x = rowStartX + col * (cardW + gap);
            const y = 460 + row * (cardH + gap);
            const isToday = (i + 1) === status.nextDay && status.canClaim;
            const isPast = (i + 1) < status.nextDay;
            const isFuture = (i + 1) > status.nextDay;
            let bg = 0x252525, border = 0x555555;
            if (isToday) { bg = 0x4a3a10; border = 0xFFD700; } else if (isPast) { bg = 0x2a4020; border = 0x00AA00; }
            push(s.add.rectangle(x, y, cardW, cardH, bg).setDepth(62).setStrokeStyle(isToday ? 4 : 2, border, 0.9));
            push(s.add.text(x, y - 40, DAILY_REWARDS[i].icon, { fontSize: '36px' }).setOrigin(0.5).setDepth(63));
            push(s.add.text(x, y - 5, `${LANG === 'ru' ? 'День' : 'Day'} ${i + 1}`, { fontSize: '15px', fill: isFuture ? '#888888' : '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(63));
            const rewardText = DAILY_REWARDS[i].food > 0 ? `${DAILY_REWARDS[i].money}💰\n+${DAILY_REWARDS[i].food}🍞` : `${DAILY_REWARDS[i].money}💰`;
            push(s.add.text(x, y + 30, rewardText, { fontSize: '15px', fill: isFuture ? '#888888' : '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND, align: 'center' }).setOrigin(0.5).setDepth(63));
            if (isToday) push(s.add.text(x, y + 55, t('dailyNow'), { fontSize: '12px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(63));
            else if (isPast) push(s.add.text(x, y + 55, '✅', { fontSize: '16px' }).setOrigin(0.5).setDepth(63));
        }
        if (status.canClaim) {
            const btn = push(s.add.text(W/2, 900, t('dailyClaim'), { fontSize: '28px', fill: '#000000', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#FFD700', padding: { x: 45, y: 18 } }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }));
            btn.on('pointerdown', async () => {
                const reward = this.state.claimDailyBonus();
                if (reward) { await this.onClaim?.(); this.close(); this.scene.showMessage(`+${reward.money}💰${reward.food ? ` +${reward.food}🍞` : ''}`); }
            });
        } else {
            push(s.add.text(W/2, 900, t('dailyDone'), { fontSize: '22px', fill: '#00AA00', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#1a1a1a', padding: { x: 30, y: 15 } }).setOrigin(0.5).setDepth(63));
            push(s.add.text(W/2, 960, t('dailyComeBack'), { fontSize: '18px', fill: '#AAAAAA', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(63));
        }
        push(s.add.text(640, 260, '✖', { fontSize: '44px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.close()));
        this.group.openFade();
    }
}

class SettingsUI {
    constructor(scene, state, saveSystem, onReset) {
        this.scene = scene; this.state = state; this.saveSystem = saveSystem;
        this.onReset = onReset;
        this.group = new FadeGroup(scene); this.isOpen = false;
        this.onOpen = null; this.onClose = null;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.onOpen?.(); this.render(); }
    close() { if (!this.isOpen) return; this.isOpen = false; this.group.closeFade(() => this.onClose?.()); }
    refresh() { if (!this.isOpen) return; this.group._destroyAll(); this.render(); }
    render() {
        const s = this.scene, W = 720, H = 1280, st = this.state;
        const push = (el) => this.group.push(el);
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.9).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 640, 900, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0x00E5FF));
        push(s.add.text(W/2, 300, t('settingsTitle'), TEXT_STYLES.title('#00E5FF')).setOrigin(0.5).setDepth(62));

        const row = (y, label, rightLabel, rightColor, onTap) => {
            const pill = makePill(s, W/2, y, 560, 70, { radius: 22, fill: 0x252525, stroke: 0x666666, strokeW: 2, depth: 62 });
            push(pill.cont);
            push(s.add.text(120, y, label, { fontSize: '22px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(63));
            push(s.add.text(540, y, rightLabel, { fontSize: '20px', fill: rightColor, fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(63));
            pill.hit.on('pointerdown', () => { pill.tap(); onTap(); });
        };

        row(390, t('language'), LANG === 'ru' ? '🇷🇺 Русский' : '🇬🇧 English', '#00FF88', async () => {
            LANG = LANG === 'ru' ? 'en' : 'ru';
            st.settings.lang = LANG;
            await this.saveSystem.save();
            this.scene.scene.restart();
        });
        row(470, t('music'), st.settings.music ? t('musicOn') : t('musicOff'), st.settings.music ? '#00FF00' : '#FF6666', async () => {
            st.settings.music = !st.settings.music;
            await this.saveSystem.save();
            this.scene.ambientMusic?.setEnabled(st.settings.music);
            this.refresh();
        });
        row(550, t('vibration'), st.settings.vibration ? t('vibOn') : t('vibOff'), st.settings.vibration ? '#00FF00' : '#FF6666', async () => {
            st.settings.vibration = !st.settings.vibration;
            await this.saveSystem.save();
            if (st.settings.vibration) { try { navigator.vibrate?.(BALANCE.vibrationMs); } catch {} }
            this.refresh();
        });
        row(630, t('exportSave'), t('exportBtn'), '#00E5FF', () => {
            const data = JSON.stringify(st.toSaveObject());
            try { navigator.clipboard.writeText(data); this.scene.showMessage(t('saveCopied')); }
            catch { try { const ta = document.createElement('textarea'); ta.value = data; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); this.scene.showMessage(t('saveCopied')); } catch {} }
        });
        row(710, t('importSave'), t('importBtn'), '#00E5FF', async () => {
            try {
                const text = await navigator.clipboard.readText();
                const data = JSON.parse(text);
                if (data && typeof data === 'object') {
                    const savedLang = st.settings.lang, savedMusic = st.settings.music;
                    st.fromSaveObject(data);
                    st.settings.lang = savedLang; st.settings.music = savedMusic;
                    await this.saveSystem.save();
                    this.scene.showMessage(t('saveLoaded'));
                    this.scene.scene.restart();
                }
            } catch { this.scene.showMessage(t('saveInvalid')); }
        });

        let confirmPending = false;
        const rstBtn = push(s.add.text(W/2, 800, t('resetProgress'), {
            fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND, backgroundColor: '#550000', padding: { x: 25, y: 14 }
        }).setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }));
        rstBtn.on('pointerdown', async () => {
            if (!confirmPending) {
                confirmPending = true; rstBtn.setText(t('resetConfirm')); rstBtn.setBackgroundColor('#FF0000');
                s.time.delayedCall(3000, () => { if (confirmPending && rstBtn.active) { confirmPending = false; rstBtn.setText(t('resetProgress')); rstBtn.setBackgroundColor('#550000'); } });
            } else { confirmPending = false; await this.onReset?.(); }
        });
        push(s.add.text(620, 280, '✖', { fontSize: '44px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.close()));
        this.group.openFade();
    }
}

class LeaderboardUI {
    constructor(scene, state, lb) {
        this.scene = scene; this.state = state; this.lb = lb;
        this.group = new FadeGroup(scene); this.isOpen = false;
        this.currentBoard = 'bestMoney'; this.loading = false;
        this.onOpen = null; this.onClose = null;
    }
    open() { if (this.isOpen) return; this.isOpen = true; this.onOpen?.(); this.loadAndRender(); }
    close() { if (!this.isOpen) return; this.isOpen = false; this.group.closeFade(() => this.onClose?.()); }
    async loadAndRender() {
        this.group._destroyAll();
        const s = this.scene, W = 720, H = 1280;
        const push = (el) => this.group.push(el);
        const ov = push(s.add.rectangle(W/2, H/2, W, H, 0x000000, 0.92).setDepth(60)); ov.setInteractive();
        push(s.add.rectangle(W/2, H/2, 660, 1000, 0x1e1e28).setDepth(61).setStrokeStyle(5, 0xFFD700));
        push(s.add.text(W/2, 200, t('recordsTitle'), TEXT_STYLES.title('#FFD700')).setOrigin(0.5).setDepth(62));
        const tabs = [{ id: 'bestMoney', label: t('coins') }, { id: 'prestige', label: t('prestigeTab') }];
        tabs.forEach((tab, i) => {
            const x = 200 + i * 160, y = 270;
            const active = this.currentBoard === tab.id;
            push(s.add.rectangle(x, y, 150, 50, active ? 0xFFD700 : 0x444444).setDepth(62).setStrokeStyle(2, active ? 0xFFFFFF : 0x666666)
                .setInteractive({ useHandCursor: true }).on('pointerdown', () => { this.currentBoard = tab.id; this.loadAndRender(); }));
            push(s.add.text(x, y, tab.label, { fontSize: '18px', fill: active ? '#000000' : '#CCCCCC', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(63));
        });
        const loadingText = push(s.add.text(W/2, 640, t('loadingRecords'), { ...TEXT_STYLES.shopInfo('#FFFFFF', 22) }).setOrigin(0.5).setDepth(62));
        if (this.loading) { this.group.openFade(); return; }
        this.loading = true;
        let entries = [];
        try { entries = await this.lb.fetchTop(this.currentBoard, 10); } catch { entries = []; }
        this.loading = false;
        if (!this.isOpen) return;
        try { loadingText.destroy(); } catch {}
        const idx = this.group.elements.indexOf(loadingText);
        if (idx > -1) this.group.elements.splice(idx, 1);
        if (!entries || entries.length === 0) {
            push(s.add.text(W/2, 640, t('noRecords'), { ...TEXT_STYLES.shopInfo('#AAAAAA', 22) }).setOrigin(0.5).setDepth(62));
        } else {
            entries.forEach((e, i) => {
                const y = 340 + i * 60;
                const rankColor = e.rank === 1 ? '#FFD700' : e.rank === 2 ? '#C0C0C0' : e.rank === 3 ? '#CD7F32' : '#FFFFFF';
                push(s.add.rectangle(W/2, y, 600, 52, e.isMe ? 0x205020 : 0x252525).setDepth(62).setStrokeStyle(2, e.isMe ? 0x00FF00 : 0x555555, 0.6));
                push(s.add.text(140, y, `${e.rank}.`, { fontSize: '24px', fill: rankColor, fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(63));
                push(s.add.text(200, y, e.name.substring(0, 18), { fontSize: '20px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0, 0.5).setDepth(63));
                push(s.add.text(620, y, `${e.score}`, { fontSize: '24px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(1, 0.5).setDepth(63));
            });
        }
        push(s.add.text(620, 200, '✖', { fontSize: '44px', fill: '#FF4444', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 })
            .setOrigin(0.5).setDepth(63).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.close()));
        this.group.openFade();
    }
}
</script>

<script>
class PreloadScene extends Phaser.Scene {
    constructor() { super('PreloadScene'); }
    preload() {
        // Загружаем ковры
        for (let i = 1; i <= BALANCE.totalCarpets; i++) this.load.image('carpet' + i, `image.carpet/carpet${i}.png`);

        // Загружаем картинки комнат (если их нет — молча пропустим, будет процедурная отрисовка)
        for (const id in ROOM_IMAGES) {
            const path = ROOM_IMAGES[id];
            this.load.image('room_' + id, path);
        }
        // Глушим ошибки, чтобы отсутствие картинок не ломало игру
        this.load.on('loaderror', () => {});

        const w = this.cameras.main.width, h = this.cameras.main.height;
        this.add.text(w / 2, h / 2 - 50, t('loading'), TEXT_STYLES.title()).setOrigin(0.5);
        this.add.rectangle(w / 2, h / 2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w / 2 - 200, h / 2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.load.on('progress', (v) => { bar.width = 400 * v; });
    }
    async create() {
        const state = new GameState();
        const saveSystem = await new SaveSystem(state).init();
        const ads = new AdsSystem(saveSystem);
        const leaderboard = new LeaderboardSystem(state, saveSystem);
        state.refreshDailyQuests();
        state.checkAchievements();
        await saveSystem.save();
        this.registry.set('gameState', state);
        this.registry.set('saveSystem', saveSystem);
        this.registry.set('ads', ads);
        this.registry.set('leaderboard', leaderboard);
        this.scene.start('MainScene');
    }
}

class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); }
    create() {
        this.state = this.registry.get('gameState');
        this.saveSystem = this.registry.get('saveSystem');
        this.ads = this.registry.get('ads');
        this.leaderboard = this.registry.get('leaderboard');
        if (this.input.mouse) this.input.mouse.disableContextMenu();
        this.saveSystem.ready();
        const W = 720, H = 1280;
        this.carpetW = 500; this.carpetH = 700;
        this.carpetX = W / 2; this.carpetY = 600;
        this.carpetBounds = new Phaser.Geom.Rectangle(this.carpetX - this.carpetW / 2, this.carpetY - this.carpetH / 2, this.carpetW, this.carpetH);

                this.ambientMusic = new AmbientMusic();
        // init() НЕ вызываем здесь — только внутри жеста пользователя (иначе на мобиле контекст не оживёт)

        this._startMusicOnce = () => {
            try {
                if (!this.ambientMusic.ctx) this.ambientMusic.init();
                this.ambientMusic.resume();
                if (this.state.settings.music) this.ambientMusic.setEnabled(true);
            } catch {}
            window.removeEventListener('pointerdown', this._startMusicOnce);
            window.removeEventListener('touchstart', this._startMusicOnce);
            window.removeEventListener('touchend', this._startMusicOnce);
            window.removeEventListener('click', this._startMusicOnce);
            window.removeEventListener('keydown', this._startMusicOnce);
        };
        window.addEventListener('pointerdown', this._startMusicOnce);
        window.addEventListener('touchstart', this._startMusicOnce, { passive: true });
        window.addEventListener('touchend', this._startMusicOnce, { passive: true });
        window.addEventListener('click', this._startMusicOnce);
        window.addEventListener('keydown', this._startMusicOnce);

        this.room = new RoomRenderer(this);
        this.room.draw(this.state.selectedRoom);

        this.carpetContainer = this.add.container(0, 0).setDepth(0);
        this.drawCarpet();
        this.effects = new Effects(this);
        this.cleaning = new CleaningSystem(this, this.carpetBounds, this.state);
        this.cleaning.onProgress = (p) => this.updateProgressBar(p);
        this.cleaning.onSoap = (x, y) => { this.effects.bubbles(x, y); if (this.tutorial) this.tutorial.reportAction('soap'); };
        this.cleaning.onErase = (x, y) => { this.effects.splash(x, y); this.effects.star(x, y); if (this.tutorial) this.tutorial.reportAction('wash'); };
        this.cleaning.onSteam = (x, y) => { this.effects.steamEffect(x, y); if (this.tutorial) this.tutorial.reportAction('steam'); };
        this.cleaning.onCrustRemove = () => { if (this.tutorial) this.tutorial.reportAction('scrape'); };
        this.cleaning.onStainRemove = () => { if (this.tutorial) this.tutorial.reportAction('stain'); };
        this.cleaning.onCelebrate = () => { this.effects.celebration(W, H); this.showMessage(t('carpetClean')); };
        this.stars = new FinishStarsSystem(this, this.cleaning, this.state, this.effects);
        this.stars.onStarPopped = () => { this.refreshHUD(); this.vibrate(); this.mascot?.react('star'); };
        this.stars.onAllPopped = () => { this.showMessage(t('allStars')); this.refreshHUD(); };
        this.bugs = new BugSystem(this, this.carpetBounds, this.state, {
            onKill: (x, y) => this.effects.starBurst(x, y, 3),
            onReward: (x, y, amt) => this.effects.moneyPopup(x, y, amt)
        });
        this.bugsRef = this.bugs;
        this.pets = new PetSystem(this, this.cleaning, this.bugs, this.effects, this.state);

        this.mascot = new Mascot(this);
        this.time.delayedCall(1500, () => this.mascot.react('hello'));

        this.shop = new ShopUI(this, this.state, this.ads);
        this.shop.onChanged = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.shop.onMessage = (msg) => this.showMessage(msg);
        this.shop.onBuyCarpet = async () => this.buyNewCarpet();
        this.shop.onPrestige = async () => this.doPrestige();
        this.shop.onPetBought = () => this.pets.refreshIndicators();
        this.shop.onSkinChange = (kind) => {
            if (kind === 'room') this.room.draw(this.state.selectedRoom);
            if (kind === 'brush') this.updateBrushIcon();
        };
        this.museum = new MuseumUI(this, this.state);
        this.questsUI = new QuestsUI(this, this.state);
        this.questsUI.onClaim = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.achievementsUI = new AchievementsUI(this, this.state);
        this.dailyUI = new DailyBonusUI(this, this.state);
        this.dailyUI.onClaim = async () => { this.refreshHUD(); await this.saveSystem.save(); this.checkAndNotifyAchievements(); };
        this.settingsUI = new SettingsUI(this, this.state, this.saveSystem, async () => { await this.saveSystem.fullReset(); this.scene.restart(); });
        this.leaderboardUI = new LeaderboardUI(this, this.state, this.leaderboard);

        const onUIChange = () => this.updateGameplayAPI();
        [this.shop, this.museum, this.questsUI, this.achievementsUI, this.dailyUI, this.settingsUI, this.leaderboardUI].forEach(ui => { ui.onOpen = onUIChange; ui.onClose = onUIChange; });

        this.currentTool = 'soap';
        this.isPointerDown = false;
        this.lastLocalX = -9999; this.lastLocalY = -9999;
        this.inputLocked = false;
        this.gameplayStopped = false;
        this.noFoodText = null; this.noFoodTween = null; this.noFoodCooldown = false;
        this.bugWarningText = null; this.bugWarningTween = null; this.bugWarningCooldown = false;
        this.crustWarningText = null; this.crustWarningTween = null; this.crustWarningCooldown = false;
        this.carpetElapsed = 0;
        this.prestigeText = null; this.dayNightText = null;
        this.steamFuel = BALANCE.steamMaxFuel;
        this.tutorial = null;
        this.brush = this.add.text(0, 0, this.state.getBrushIcon(), { fontSize: '70px', fontFamily: 'Arial' }).setOrigin(0.5).setDepth(3).setVisible(false);
        this.buildHUD(W, H);
        this.buildToolButtons(W, H);
        this.setupInput();
        this.selectTool('soap');
        this.cleaning.reset(this.state.carpetIndex);
        this.bugs.spawnForLevel(this.state.carpetIndex);
        if (this.state.refreshDailyQuests()) {
            this.saveSystem.save();
            this.time.delayedCall(800, () => this.showMessage(t('newQuests')));
        }
        this.time.delayedCall(400, () => this.startCarpetTutorial());
        this.leaderboard.submitScores();
        this.time.addEvent({ delay: 60000, loop: true, callback: () => { this.updateDayNightText(); }});
        this._onVisibilityChange = () => {
            if (document.hidden) { try { this.saveSystem.saveSync(); } catch {} this.pauseGame(); }
            else this.resumeGame();
        };
        this._onPageHide = () => { try { this.saveSystem.saveSync(); } catch {} };
        document.addEventListener('visibilitychange', this._onVisibilityChange);
        window.addEventListener('pagehide', this._onPageHide);
        window.addEventListener('blur', () => this.pauseGame());
        window.addEventListener('focus', () => this.resumeGame());
        this.saveSystem.gameplayStart();
        this.saveSystem.onPause(() => this.pauseGame());
        this.saveSystem.onResume(() => this.resumeGame());
        this.ads.onAdStart = () => this.pauseGame();
        this.ads.onAdEnd = () => this.resumeGame();
    }
    updateGameplayAPI() {
        const open = this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen;
        if (open && !this.gameplayStopped) { this.saveSystem.gameplayStop(); this.gameplayStopped = true; }
        else if (!open && this.gameplayStopped) { this.saveSystem.gameplayStart(); this.gameplayStopped = false; }
    }
    pauseGame() { if (this._paused) return; this._paused = true; try { if (this.sound && this.sound.pauseAll) this.sound.pauseAll(); } catch {} }
    resumeGame() { if (!this._paused) return; this._paused = false; try { if (this.sound && this.sound.resumeAll) this.sound.resumeAll(); } catch {} this.saveSystem.gameplayStart?.(); }
    startCarpetTutorial() {
        const idx = this.state.carpetIndex;
        const stat = this.state.carpetStats[idx];
        if (!stat || stat.tutorialDone) {
            if (this.state.getDailyStatus().canClaim) this.time.delayedCall(600, () => this.dailyUI.open());
            return;
        }
        this.tutorial = new CarpetTutorial(this, idx);
        this.tutorial.start();
    }

        makeBtn(c2, r1, '🏆', t('achievements'), () => this.achievementsUI.open(), '#FFD700');
        makeBtn(c3, r1, '📅', t('quests'),   () => this.questsUI.open(), '#FFD700');
        makeBtn(c1, r2, '📊', t('records'),  () => this.leaderboardUI.open(), '#00E5FF');
        makeBtn(c2, r2, '🛒', t('shop'),     () => this.shop.open(), '#00FF88');
        makeBtn(c3, r2, '⚙️', t('settings'), () => this.settingsUI.open(), '#CCCCCC');

        this.questBadge = this.add.text(c3 + 22, r1 - 22, '●', { fontSize: '20px', fill: '#FF4444' }).setOrigin(0.5).setDepth(13).setVisible(false);
        this.tweens.add({ targets: this.questBadge, alpha: { from: 1, to: 0.3 }, duration: 700, yoyo: true, repeat: -1 });
        this.updateQuestBadge();

        const ds = this.state.getDailyStatus();
        if (ds.canClaim) {
            const dailyBg = this.add.circle(360, 100, 24, 0xFFD700, 1).setDepth(14).setStrokeStyle(3, 0xFFFFFF, 0.9);
            const dailyIcon = this.add.text(360, 100, '🎁', { fontSize: '28px' }).setOrigin(0.5).setDepth(15);
            const hit = this.add.circle(360, 100, 30, 0x000000, 0.001).setDepth(16).setInteractive({ useHandCursor: true });
            hit.on('pointerdown', () => this.dailyUI.open());
        }

        this.add.rectangle(W / 2, 230, 400, 30, 0x000000, 0.7).setDepth(10);
        this.add.rectangle(W / 2, 230, 400, 30, 0x333333).setDepth(10);
