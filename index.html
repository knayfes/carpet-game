    updateQuestBadge() {
        if (!this.questBadge) return;
        const hasReady = this.state.quests.some(q =>
            this.state.isQuestComplete(q) && !this.state.questClaimed[q.id]
        );
        this.questBadge.setVisible(hasReady);
    }

    updateBrushIcon() {
        if (this.currentTool === 'soap') this.brush.setText(this.state.getBrushIcon());
    }

    buildToolButtons(W, H) {
        const btnY = 1200;
        const hasSwatter = this.state.carpetIndex >= 2;
        const soapX = hasSwatter ? 120 : 240;
        const washX = hasSwatter ? 360 : 480;
        const swatterX = 600;

        this.soapBtnBg = this.add.rectangle(soapX, btnY, 200, 80, 0x4A90D9).setDepth(10).setStrokeStyle(5, 0xFFFFFF);
        this.soapBtnText = this.add.text(soapX, btnY, '🧼 МЫЛО', TEXT_STYLES.button('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);
        this.soapBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('soap'));

        this.washBtnBg = this.add.rectangle(washX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.washBtnText = this.add.text(washX, btnY, '💧 СМЫТЬ', TEXT_STYLES.button('#AAAAAA', 22)).setOrigin(0.5).setDepth(11);
        this.washBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('wash'));

        this.swatterBtnBg = this.add.rectangle(swatterX, btnY, 200, 80, 0x555555).setDepth(10).setStrokeStyle(5, 0x888888);
        this.swatterBtnText = this.add.text(swatterX, btnY, '🪰 МУХОБОЙКА', TEXT_STYLES.button('#AAAAAA', 18)).setOrigin(0.5).setDepth(11);
        this.swatterBtnBg.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.selectTool('swatter'));

        this.swatterBtnBg.setVisible(hasSwatter);
        this.swatterBtnText.setVisible(hasSwatter);
    }

    selectTool(tool) {
        this.currentTool = tool;
        const setStyle = (bg, txt, active, activeColor = 0x4A90D9) => {
            if (active) { bg.setFillStyle(activeColor); bg.setStrokeStyle(5, 0xFFFFFF); txt.setColor('#FFFFFF'); }
            else { bg.setFillStyle(0x555555); bg.setStrokeStyle(5, 0x888888); txt.setColor('#AAAAAA'); }
        };
        setStyle(this.soapBtnBg, this.soapBtnText, tool === 'soap');
        setStyle(this.washBtnBg, this.washBtnText, tool === 'wash');
        setStyle(this.swatterBtnBg, this.swatterBtnText, tool === 'swatter', 0xFF4444);
        if (tool === 'soap') this.brush.setText(this.state.getBrushIcon());
        else if (tool === 'wash') this.brush.setText('🧹');
        else this.brush.setVisible(false);
        if (tool !== 'swatter') this.effects.hideSwatterCursor();
    }

    setupInput() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });
        const uiOpen = () => this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen || (this.tutorial && this.tutorial.elements.length > 0);
        const handlePointer = (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.brush.setVisible(false);
                return;
            }
            this.effects.hideSwatterCursor();
            this.brush.setPosition(pointer.x, pointer.y);
            const inBounds = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(inBounds);
            if (!inBounds) return;
            const localX = pointer.x - this.carpetBounds.x;
            const localY = pointer.y - this.carpetBounds.y;
            const dx = localX - this.lastLocalX;
            const dy = localY - this.lastLocalY;
            if (dx * dx + dy * dy < 64) return;
            this.lastLocalX = localX;
            this.lastLocalY = localY;
            this.applyTool(localX, localY);
        };
        this.input.on('pointerdown', (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.effects.swatEffect(pointer.x, pointer.y);
                this.bugs.swat(pointer.x, pointer.y, this.time.now);
                this.refreshHUD();
                return;
            }
            this.isPointerDown = true;
            this.lastLocalX = -9999; this.lastLocalY = -9999;
            handlePointer(pointer);
        });
        this.input.on('pointermove', (pointer) => {
            if (this.inputLocked || uiOpen()) return;
            if (this.currentTool !== 'swatter') {
                this.brush.setPosition(pointer.x, pointer.y);
                this.brush.setVisible(Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y));
            }
            if (!pointer.isDown) { this.isPointerDown = false; return; }
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                return;
            }
            handlePointer(pointer);
        });
        const stop = () => {
            this.isPointerDown = false;
            this.effects.hideSwatterCursor();
            this.brush.setVisible(false);
            this.lastLocalX = -9999; this.lastLocalY = -9999;
        };
        this.input.on('pointerup', stop);
        this.input.on('pointerout', stop);
        this.input.on('pointerupoutside', stop);
        window.addEventListener('blur', stop);
        document.addEventListener('touchend', () => { this.effects.hideSwatterCursor(); }, { passive: true });
        document.addEventListener('mouseup', () => { this.effects.hideSwatterCursor(); });
    }

    applyTool(localX, localY) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen) return;
        if (this.state.food <= 0) {
            if (this.state.money < BALANCE.foodPrice) {
                this.state.food = 1;
                this.refreshHUD();
                this.showMessage('🎁 Бонус: 1 еда!');
            } else {
                this.showNoFoodWarning();
                return;
            }
        }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }
        this.resetAutoCleanTimer();
        this.cleaning.applyStroke(localX, localY, this.state.getCurrentRadius(), this.currentTool);
    }

    scheduleAutoClean() {
        if (this.autoCleanStarted || this.autoCleanPending) return;
        if (this.cleaning.progress < BALANCE.autoCleanThreshold) return;
        this.autoCleanPending = true;
        this.autoCleanIdleTimer = this.time.delayedCall(BALANCE.autoCleanIdleDelay, () => {
            this.autoCleanPending = false;
            this.autoCleanIdleTimer = null;
            if (this.cleaning.progress >= BALANCE.autoCleanThreshold && this.cleaning.progress < 1.0) {
                this.startAutoClean();
            }
        });
    }
    cancelAutoClean() {
        if (!this.autoCleanPending) return;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
    }
    startAutoClean() {
        if (this.autoCleanStarted) return;
        this.autoCleanStarted = true;
        this.showMessage('✨ Ковёр сам очищается...');
        const dirt = this.cleaning.dirt;
        const soap = this.cleaning.soap;
        const dirtyIndices = [];
        for (let i = 0; i < dirt.length; i++) if (dirt[i] > 0.01) dirtyIndices.push(i);
        if (dirtyIndices.length === 0) { this.cleaning.recalcProgress(); return; }
        const tickDelay = 50;
        const totalTicks = BALANCE.autoCleanDuration / tickDelay;
        const cellsPerTick = Math.max(1, Math.ceil(dirtyIndices.length / totalTicks));
        let index = 0;
        this.autoCleanTweenTimer = this.time.addEvent({
            delay: tickDelay, repeat: totalTicks,
            callback: () => {
                for (let i = 0; i < cellsPerTick && index < dirtyIndices.length; i++) {
                    dirt[dirtyIndices[index]] = 0;
                    soap[dirtyIndices[index]] = 0;
                    index++;
                }
                this.cleaning.needRedrawDirt = true;
                this.cleaning.needRedrawSoap = true;
                this.cleaning.recalcProgress();
                if (index >= dirtyIndices.length) {
                    if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }
                }
            }
        });
    }
    resetAutoCleanTimer() {
        this.cancelAutoClean();
        if (this.autoCleanStarted) return;
        this.scheduleAutoClean();
    }

    async finishCarpet() {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen) return;
        if (this.cleaning.progress < 1.0) { this.showMessage('Ковёр ещё грязный! Нужно 100%.'); return; }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }

        this.unlockInput();
        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
        if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }

        const timeSec = Math.floor(this.carpetElapsed / 1000);
        const reward = this.state.addReward(timeSec);
        this.refreshHUD();
        await this.saveSystem.save();
        this.showMessage(`+${reward} 💰!  ⏱ ${formatTime(timeSec)}`);

        this.bugs.clear();
        this.cleaning.reset();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.checkAndNotifyAchievements();

        if (this.state.canPrestige()) {
            this.time.delayedCall(400, () => this.showMessage('👑 ПРЕСТИЖ В МАГАЗИНЕ!'));
        }
        if (this.state.carpetsCleaned % 5 === 0) {
            this.ads.showFullscreen();
        }
        this.time.delayedCall(50, () => {
            this.bugs.spawnForLevel(this.state.carpetIndex);
        });
    }

    checkAndNotifyAchievements() {
        const unlocked = this.state.checkAchievements();
        if (unlocked.length > 0) {
            this.saveSystem.save();
            unlocked.forEach((a, i) => {
                this.time.delayedCall(400 + i * 600, () => {
                    this.showMessage(`🏆 ${a.name}: +${a.reward}💰`);
                });
            });
            this.refreshHUD();
        }
    }

    async buyNewCarpet() {
        if (!this.state.buyNewCarpet()) return;
        this.unlockInput();
        this.shop.close();
        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
        if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom, this.state.carpetLevel);
        this.drawCarpet();
        this.cleaning.reset();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.bugs.clear();
        if (this.state.carpetIndex >= 2) {
            this.swatterBtnBg.setVisible(true);
            this.swatterBtnText.setVisible(true);
            this.soapBtnBg.setX(120);  this.soapBtnText.setX(120);
            this.washBtnBg.setX(360);  this.washBtnText.setX(360);
        }
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.effects.celebration(720, 1280);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }

    async doPrestige() {
        if (!this.state.prestige()) return;
        this.unlockInput();
        this.shop.close();
        this.autoCleanStarted = false;
        this.autoCleanPending = false;
        if (this.autoCleanIdleTimer) { this.autoCleanIdleTimer.remove(); this.autoCleanIdleTimer = null; }
        if (this.autoCleanTweenTimer) { this.autoCleanTweenTimer.remove(); this.autoCleanTweenTimer = null; }
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom, this.state.carpetLevel);
        this.drawCarpet();
        this.cleaning.reset();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.bugs.clear();
        this.swatterBtnBg.setVisible(false);
        this.swatterBtnText.setVisible(false);
        this.soapBtnBg.setX(240);  this.soapBtnText.setX(240);
        this.washBtnBg.setX(480);  this.washBtnText.setX(480);
        if (this.prestigeText) this.prestigeText.destroy();
        if (this.state.prestigeLevel > 0) {
            this.prestigeText = this.add.text(270, 22, '👑' + this.state.prestigeLevel,
                TEXT_STYLES.stat('#FFD700', 24)).setDepth(10);
        }
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.effects.celebration(720, 1280);
        this.showMessage(`👑 ПРЕСТИЖ ${this.state.prestigeLevel}!`);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }

    unlockInput() {
        this.inputLocked = true;
        this.isPointerDown = false;
        this.lastLocalX = -9999; this.lastLocalY = -9999;
        this.brush.setVisible(false);
        this.effects.hideSwatterCursor();
        this.time.delayedCall(BALANCE.inputLockDuration, () => { this.inputLocked = false; });
    }

    updateProgressBar(p) {
        this.progressBar.width = 400 * p;
        this.progressText.setText(Math.min(100, Math.floor(p * 100)) + '%');
    }

    showNoFoodWarning() {
        if (this.noFoodCooldown) return;
        this.noFoodCooldown = true;
        if (this.noFoodText) {
            if (this.noFoodTween) this.noFoodTween.remove();
            this.noFoodText.destroy(); this.noFoodText = null;
        }
        this.noFoodText = this.add.text(360, 640, '🍞 НЕТ ЕДЫ!\nКУПИ В МАГАЗИНЕ', {
            fontSize: '52px', fill: '#FF0000', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(50);
        this.noFoodTween = this.tweens.add({
            targets: this.noFoodText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.noFoodText) { this.noFoodText.destroy(); this.noFoodText = null; }
                this.noFoodTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.noFoodCooldown = false; });
    }

    showBugWarning() {
        if (this.bugWarningCooldown) return;
        this.bugWarningCooldown = true;
        if (this.bugWarningText) {
            if (this.bugWarningTween) this.bugWarningTween.remove();
            this.bugWarningText.destroy(); this.bugWarningText = null;
        }
        this.bugWarningText = this.add.text(360, 640, '🐛 СНАЧАЛА УБЕРИ ЖУКОВ!\n(мухобойка 🪰)', {
            fontSize: '42px', fill: '#FF4444', fontStyle: 'bold', fontFamily: 'Arial',
            align: 'center', stroke: '#000000', strokeThickness: 8,
            shadow: { offsetX: 3, offsetY: 3, color: '#000000', blur: 5, fill: true }
        }).setOrigin(0.5).setDepth(50);
        this.bugWarningTween = this.tweens.add({
            targets: this.bugWarningText, alpha: { from: 1, to: 0.2 },
            duration: 400, yoyo: true, repeat: 4,
            onComplete: () => {
                if (this.bugWarningText) { this.bugWarningText.destroy(); this.bugWarningText = null; }
                this.bugWarningTween = null;
            }
        });
        this.time.delayedCall(1500, () => { this.bugWarningCooldown = false; });
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            ...TEXT_STYLES.message('#FFFF00', 26),
            backgroundColor: '#000000', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(30);
        this.time.delayedCall(2400, () => msg.destroy());
    }

    drawCarpet() {
        this.carpetContainer.removeAll(true);
        const carpetKey = 'carpet' + this.state.carpetIndex;
        if (this.textures.exists(carpetKey)) {
            const img = this.add.image(this.carpetX, this.carpetY, carpetKey);
            img.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetContainer.add(img);
        } else {
            const g = this.add.graphics();
            const cx = this.carpetX - this.carpetW / 2;
            const cy = this.carpetY - this.carpetH / 2;
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(this.state.carpetIndex - 1) % palettes.length];
            g.fillStyle(p.main, 1); g.fillRect(cx, cy, this.carpetW, this.carpetH);
            g.lineStyle(20, p.border, 1); g.strokeRect(cx + 10, cy + 10, this.carpetW - 20, this.carpetH - 20);
            g.lineStyle(4, p.accent, 0.7);
            for (let i = 0; i < 3; i++) {
                const size = 100 - i * 30;
                g.beginPath();
                g.moveTo(this.carpetX, this.carpetY - size);
                g.lineTo(this.carpetX + size, this.carpetY);
                g.lineTo(this.carpetX, this.carpetY + size);
                g.lineTo(this.carpetX - size, this.carpetY);
                g.closePath(); g.strokePath();
            }
            g.fillStyle(p.accent, 1);
            g.fillCircle(cx + 50, cy + 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + 50, 12);
            g.fillCircle(cx + 50, cy + this.carpetH - 50, 12);
            g.fillCircle(cx + this.carpetW - 50, cy + this.carpetH - 50, 12);
            this.carpetContainer.add(g);
        }
    }

    update(_, delta) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen) return;
        if (this.tutorial && this.tutorial.elements.length > 0) return;
        this.cleaning.draw();
        this.bugs.update(delta);
        this.carpetElapsed += delta;
        const elapsedSec = Math.floor(this.carpetElapsed / 1000);
        this.timerText.setText('⏱ ' + formatTime(elapsedSec));
    }
}

/* ============================================================
   BOOT
   ============================================================ */
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>
