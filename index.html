        this.progressText = this.add.text(W / 2, 230, '0%', TEXT_STYLES.stat('#FFFFFF', 22)).setOrigin(0.5).setDepth(11);

        this.steamBg = this.add.rectangle(W / 2, 265, 200, 14, 0x111111).setDepth(10).setVisible(false);
        this.steamBar = this.add.rectangle(W / 2 - 100, 265, 200, 14, 0xFF8844).setOrigin(0, 0.5).setDepth(11).setVisible(false);
        this.steamText = this.add.text(W / 2, 282, t('steams'), { fontSize: '12px', fill: '#FF8844', fontStyle: 'bold', fontFamily: FONT_HAND }).setOrigin(0.5).setDepth(11).setVisible(false);
        this.starsCounter = this.add.text(W / 2, 300, '', { fontSize: '18px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 5 }).setOrigin(0.5).setDepth(11).setVisible(false);

        const finishBtn = this.add.text(W / 2, 1050, t('getMoney'), { ...TEXT_STYLES.button('#00FF00', 30), backgroundColor: '#000000', padding: { x: 30, y: 15 } }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true });
        finishBtn.on('pointerdown', () => {
            this.tweens.add({ targets: finishBtn, scaleX: 0.94, scaleY: 0.94, duration: 80, yoyo: true, ease: 'Quad.easeOut' });
            this.finishCarpet();
        });
    }
    updateDayNightText() {
        if (!this.dayNightText) return;
        const td = getTimeOfDay();
        const icon = td === 'morning' ? '🌅' : td === 'day' ? '☀️' : td === 'evening' ? '🌇' : '🌙';
        const bonus = Math.round(this.state.getDayNightBonus() * 100);
        this.dayNightText.setText(`${icon} ${t(td)}  +${bonus}%💰`);
    }
    refreshHUD() {
        this.moneyText.setText('💰 ' + this.state.money);
        this.foodText.setText('🍞 ' + this.state.food);
        this.toolText.setText('🧹 ' + this.state.getCurrentRadius());
        this.carpetText.setText('🧽 ' + this.state.carpetsCleaned);
        this.soapLvlText.setText(`🧼${this.state.soapLevel}  💤${this.state.washLevel}  🪰${this.state.swatterLevel}`);
        this.updateQuestBadge(); this.updateDayNightText(); this.updateStarsCounter();
    }
    updateStarsCounter() {
        if (!this.starsCounter) return;
        if (this.stars.active && this.stars.count > 0) { this.starsCounter.setText(t('starsLeft', this.stars.count)); this.starsCounter.setVisible(true); }
        else this.starsCounter.setVisible(false);
    }
    updateQuestBadge() { if (!this.questBadge) return; this.questBadge.setVisible(this.state.quests.some(q => this.state.isQuestComplete(q) && !this.state.questClaimed[q.id])); }
    updateBrushIcon() { if (this.currentTool === 'soap') this.brush.setText(this.state.getBrushIcon()); }
    buildToolButtons(W, H) {
        const btnY = 1195;
        const tools = [];
        if (this.state.carpetIndex <= 3) {
            tools.push({ id: 'soap', icon: '🧼', label: t('soap'), color: 0x4A90D9 });
            tools.push({ id: 'wash', icon: '💧', label: t('wash'), color: 0x4A90D9 });
        }
        if (this.state.carpetIndex >= 2) tools.push({ id: 'swatter', icon: '🪰', label: t('swatter'), color: 0xFF4444 });
        if (this.state.carpetIndex >= 3) tools.push({ id: 'scraper', icon: '🧽', label: t('scraper'), color: 0x8B6A2A });
        if (this.state.carpetIndex >= 4) tools.push({ id: 'steam',   icon: '🔥', label: t('steam'),   color: 0xFF8844 });
        if (this.state.carpetIndex >= 5) tools.push({ id: 'remover', icon: '🧴', label: t('remover'), color: 0xAA44AA });
        const count = tools.length;
        const gap = 8;
        const totalW = 700 - (count - 1) * gap;
        const btnW = Math.floor(totalW / count);
        const btnH = 100;
        const startX = W / 2 - (count * btnW + (count - 1) * gap) / 2 + btnW / 2;
        this.toolBtns = {};
        tools.forEach((tool, i) => {
            const x = startX + i * (btnW + gap);
            const pill = makePill(this, x, btnY, btnW, btnH, { radius: 22, fill: 0x2a2a2a, stroke: 0x666666, strokeW: 4, depth: 10 });
            const accent = this.add.rectangle(x, btnY + btnH / 2 - 8, btnW - 24, 4, tool.color, 0.95).setDepth(11).setOrigin(0.5);
            const icon = this.add.text(x, btnY - 14, tool.icon, { fontSize: '38px', fontFamily: 'Arial' }).setOrigin(0.5).setDepth(11);
            const label = this.add.text(x, btnY + 22, tool.label, { fontSize: '13px', fill: '#FFFFFF', fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setDepth(11);
            pill.hit.on('pointerdown', () => { pill.tap(); this.selectTool(tool.id); });
            this.toolBtns[tool.id] = { pill, txt: label, icon, accent, color: tool.color, x, y: btnY, w: btnW, h: btnH };
        });
        this.updateSteamUI();
        this.selectTool(this.currentTool || 'soap');
    }
    updateSteamUI() {
        const active = this.state.carpetIndex >= 4;
        if (this.steamBg) this.steamBg.setVisible(active);
        if (this.steamBar) this.steamBar.setVisible(active);
        if (this.steamText) this.steamText.setVisible(active);
    }
    selectTool(tool) {
        if (this.state.carpetIndex >= 4 && (tool === 'soap' || tool === 'wash')) tool = 'scraper';
        this.currentTool = tool;
        if (!this.toolBtns) return;
        for (const id in this.toolBtns) {
            const b = this.toolBtns[id];
            const active = id === tool;
            if (active) {
                b.pill.redraw(b.color, 0xFFFFFF, 6);
                b.txt.setColor('#FFFFFF');
                if (b.icon) { b.icon.setScale(1); this.tweens.killTweensOf(b.icon); this.tweens.add({ targets: b.icon, scaleX: 1.2, scaleY: 1.2, duration: 110, yoyo: true, ease: 'Back.easeOut' }); }
                if (b.accent) b.accent.setAlpha(1);
                b.pill.press();
            } else {
                b.pill.redraw(0x2a2a2a, 0x666666, 4);
                b.txt.setColor('#FFFFFF');
                if (b.icon) b.icon.setScale(1);
                if (b.accent) b.accent.setAlpha(0.6);
            }
        }
        if (tool === 'soap') this.brush.setText(this.state.getBrushIcon());
        else if (tool === 'wash') this.brush.setText('🧹');
        else if (tool === 'scraper') this.brush.setText('🧽');
        else if (tool === 'steam') this.brush.setText('🔥');
        else if (tool === 'remover') this.brush.setText('🧴');
        else this.brush.setVisible(false);
        if (tool !== 'swatter') this.effects.hideSwatterCursor();
    }
    setupInput() {
        this.game.canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        this.game.canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });
        const uiOpen = () => this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen;
        const handlePointer = (pointer) => {
            if (this.inputLocked || uiOpen() || this.stars.active) return;
            if (this.currentTool === 'swatter') { this.effects.drawSwatterCursor(pointer.x, pointer.y); this.brush.setVisible(false); return; }
            this.effects.hideSwatterCursor();
            this.brush.setPosition(pointer.x, pointer.y);
            const inB = Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y);
            this.brush.setVisible(inB);
            if (!inB) return;
            const lx = pointer.x - this.carpetBounds.x, ly = pointer.y - this.carpetBounds.y;
            const dx = lx - this.lastLocalX, dy = ly - this.lastLocalY;
            if (dx * dx + dy * dy < 64) return;
            this.lastLocalX = lx; this.lastLocalY = ly;
            this.applyTool(lx, ly);
        };
        this.input.on('pointerdown', (pointer) => {
            if (this.inputLocked || uiOpen() || this.stars.active) return;
            this.ambientMusic.resume();
            if (this.currentTool === 'swatter') {
                this.effects.drawSwatterCursor(pointer.x, pointer.y);
                this.effects.swatEffect(pointer.x, pointer.y);
                const hit = this.bugs.swat(pointer.x, pointer.y, this.time.now);
                if (hit && this.tutorial) this.tutorial.reportAction('killBugs');
                this.refreshHUD();
                return;
            }
            this.isPointerDown = true;
            this.lastLocalX = -9999; this.lastLocalY = -9999;
            handlePointer(pointer);
        });
        this.input.on('pointermove', (pointer) => {
            if (this.inputLocked || uiOpen() || this.stars.active) return;
            if (this.currentTool !== 'swatter') {
                this.brush.setPosition(pointer.x, pointer.y);
                this.brush.setVisible(Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y));
            }
            if (!pointer.isDown) { this.isPointerDown = false; return; }
            if (this.currentTool === 'swatter') { this.effects.drawSwatterCursor(pointer.x, pointer.y); return; }
            handlePointer(pointer);
        });
        const stop = () => { this.isPointerDown = false; this.effects.hideSwatterCursor(); this.brush.setVisible(false); this.lastLocalX = -9999; this.lastLocalY = -9999; };
        this.input.on('pointerup', stop); this.input.on('pointerout', stop); this.input.on('pointerupoutside', stop);
        window.addEventListener('blur', stop);
        document.addEventListener('touchend', () => { this.effects.hideSwatterCursor(); }, { passive: true });
        document.addEventListener('mouseup', () => { this.effects.hideSwatterCursor(); });
    }
    applyTool(lx, ly) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        if (this.stars.active) return;
        if (this.state.carpetIndex >= 4 && (this.currentTool === 'soap' || this.currentTool === 'wash')) return;
        // 1. Жуки
        if (this.bugs.count > 0) { this.showBugWarning(); this.mascot?.react('bugs'); return; }
        // 2. Корки
        if (this.cleaning.hasCrustLeft() && this.currentTool !== 'scraper') {
            this.showCrustWarning(); this.mascot?.react('crust'); return;
        }
        if (this.currentTool === 'steam') {
            if (this.steamFuel <= 0) return;
            this.steamFuel = Math.max(0, this.steamFuel - BALANCE.steamFuelCost);
            this.updateSteamBar();
        }
        if (this.state.food <= 0) {
            if (this.state.money < BALANCE.foodPrice) { this.state.food = 1; this.refreshHUD(); this.showMessage(t('foodBonus')); }
            else { this.showNoFoodWarning(); this.mascot?.react('food'); return; }
        }
        this.cleaning.applyStroke(lx, ly, this.state.getCurrentRadius(), this.currentTool);
        const p = this.cleaning.progress;
        if (!this.stars.active && p >= BALANCE.finishThreshold && p < 1.0) { this.stars.activate(); this.updateStarsCounter(); }
    }
    updateSteamBar() {
        if (!this.steamBar) return;
        const pct = this.steamFuel / BALANCE.steamMaxFuel;
        this.steamBar.width = 200 * pct;
        if (pct < 0.3) this.steamBar.setFillStyle(0xFF4444);
        else if (pct < 0.6) this.steamBar.setFillStyle(0xFFAA44);
        else this.steamBar.setFillStyle(0xFF8844);
    }
    async finishCarpet() {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        if (this.cleaning.progress < 1.0 || !this.cleaning.isFullyClean()) {
            if (this.stars.active && this.stars.count > 0) this.showMessage(t('collectStars'));
            else this.showMessage(t('carpetDirty'));
            return;
        }
        if (this.bugs.count > 0) { this.showBugWarning(); return; }
        this.unlockInput();
        const timeSec = Math.floor(this.carpetElapsed / 1000);
        const reward = this.state.addReward(timeSec);
        this.refreshHUD();
        await this.saveSystem.save();
        this.showMessage(`+${reward} 💰!  ⏱ ${formatTime(timeSec)}`);
        this.mascot?.react('finish');
        if (this.tutorial) this.tutorial.reportAction('finish');
        this.bugs.clear();
        this.cleaning.reset(this.state.carpetIndex);
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.steamFuel = BALANCE.steamMaxFuel;
        this.updateSteamBar();
        this.updateStarsCounter();
        this.checkAndNotifyAchievements();
        this.leaderboard.submitScores();
        if (this.state.canPrestige()) {
            this.time.delayedCall(400, () => this.showMessage(t('prestigeAvailableMsg')));
            this.time.delayedCall(600, () => this.mascot?.react('prestige'));
        }
        if (this.state.carpetsCleaned % 5 === 0) this.ads.showFullscreen();
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
    }
    checkAndNotifyAchievements() {
        const unlocked = this.state.checkAchievements();
        if (unlocked.length > 0) {
            this.saveSystem.save();
            unlocked.forEach((a, i) => { this.time.delayedCall(400 + i * 600, () => this.showMessage(t('achievementUnlocked', loc(a.name), a.reward))); });
            this.refreshHUD();
        }
    }
    async buyNewCarpet() {
        if (!this.state.buyNewCarpet()) return;
        this.unlockInput();
        this.shop.close();
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom);
        this.drawCarpet();
        this.cleaning.reset(this.state.carpetIndex);
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.steamFuel = BALANCE.steamMaxFuel;
        this.updateSteamBar();
        this.bugs.clear();
        this.updateStarsCounter();
        if (this.toolBtns) {
            for (const id in this.toolBtns) {
                const b = this.toolBtns[id];
                if (b.pill) try { b.pill.cont.destroy(true); } catch {}
                if (b.txt) b.txt.destroy();
                if (b.icon) b.icon.destroy();
                if (b.accent) b.accent.destroy();
            }
            this.toolBtns = null;
        }
        this.buildToolButtons(720, 1280);
        this.updateSteamUI();
        this.selectTool('soap');
        if (this.tutorial) { this.tutorial.isOpen = false; this.tutorial.clearStep(); }
        this.tutorial = null;
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.effects.celebration(720, 1280);
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
        this.time.delayedCall(600, () => this.startCarpetTutorial());
    }
    async doPrestige() {
        const gain = this.state.prestige();
        if (!gain) return;
        this.unlockInput();
        this.shop.close();
        this.refreshHUD();
        this.room.draw(this.state.selectedRoom);
        this.drawCarpet();
        this.cleaning.reset(this.state.carpetIndex);
        this.stars.clear();
        this.updateProgressBar(0);
        this.carpetElapsed = 0;
        this.steamFuel = BALANCE.steamMaxFuel;
        this.updateSteamBar();
        this.bugs.clear();
        this.updateStarsCounter();
        this.pets.refreshIndicators();
        if (this.toolBtns) {
            for (const id in this.toolBtns) {
                const b = this.toolBtns[id];
                if (b.pill) try { b.pill.cont.destroy(true); } catch {}
                if (b.txt) b.txt.destroy();
                if (b.icon) b.icon.destroy();
                if (b.accent) b.accent.destroy();
            }
            this.toolBtns = null;
        }
        this.buildToolButtons(720, 1280);
        this.updateSteamUI();
        this.selectTool('soap');
        if (this.prestigeText) this.prestigeText.destroy();
        this.prestigeText = this.add.text(325, 16, `👑${this.state.prestigeLevel}  ✨${this.state.legacyPoints}`, {
            fontSize: '18px', fill: '#FFD700', fontStyle: 'bold', fontFamily: FONT_HAND, stroke: '#000000', strokeThickness: 4
        }).setOrigin(1, 0).setDepth(10);
        if (this.tutorial) { this.tutorial.isOpen = false; this.tutorial.clearStep(); }
        this.tutorial = null;
        await this.saveSystem.save();
        this.checkAndNotifyAchievements();
        this.leaderboard.submitScores();
        this.effects.celebration(720, 1280);
        this.showMessage(t('prestigeDone', gain));
        this.time.delayedCall(50, () => this.bugs.spawnForLevel(this.state.carpetIndex));
        this.time.delayedCall(600, () => this.startCarpetTutorial());
    }
    unlockInput() {
        this.inputLocked = true; this.isPointerDown = false;
        this.lastLocalX = -9999; this.lastLocalY = -9999;
        this.brush.setVisible(false);
        this.effects.hideSwatterCursor();
        this.time.delayedCall(BALANCE.inputLockDuration, () => { this.inputLocked = false; });
    }
    updateProgressBar(p) {
        this.progressBar.width = 400 * p;
        this.progressText.setText(Math.min(100, Math.floor(p * 100)) + '%');
    }
    vibrate() { if (!this.state.settings.vibration) return; try { navigator.vibrate?.(BALANCE.vibrationMs); } catch {} }
    showNoFoodWarning() {
        if (this.noFoodCooldown) return;
        this.noFoodCooldown = true;
        if (this.noFoodText) { if (this.noFoodTween) this.noFoodTween.remove(); this.noFoodText.destroy(); this.noFoodText = null; }
        this.noFoodText = this.add.text(360, 640, t('noFood'), {
            fontSize: '52px', fill: '#FF0000', fontStyle: 'bold', fontFamily: FONT_HAND, align: 'center',
            stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(80).setAlpha(0);
        this.tweens.add({ targets: this.noFoodText, alpha: 1, duration: 200, ease: 'Cubic.easeOut' });
        this.noFoodTween = this.tweens.add({ targets: this.noFoodText, alpha: { from: 1, to: 0.2 }, duration: 400, yoyo: true, repeat: 4, delay: 200,
            onComplete: () => { if (this.noFoodText) { this.noFoodText.destroy(); this.noFoodText = null; } this.noFoodTween = null; } });
        this.time.delayedCall(1800, () => { this.noFoodCooldown = false; });
    }
    showBugWarning() {
        if (this.bugWarningCooldown) return;
        this.bugWarningCooldown = true;
        if (this.bugWarningText) { if (this.bugWarningTween) this.bugWarningTween.remove(); this.bugWarningText.destroy(); this.bugWarningText = null; }
        this.bugWarningText = this.add.text(360, 640, t('bugsFirst'), {
            fontSize: '42px', fill: '#FF4444', fontStyle: 'bold', fontFamily: FONT_HAND, align: 'center',
            stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(80).setAlpha(0);
        this.tweens.add({ targets: this.bugWarningText, alpha: 1, duration: 200, ease: 'Cubic.easeOut' });
        this.bugWarningTween = this.tweens.add({ targets: this.bugWarningText, alpha: { from: 1, to: 0.2 }, duration: 400, yoyo: true, repeat: 4, delay: 200,
            onComplete: () => { if (this.bugWarningText) { this.bugWarningText.destroy(); this.bugWarningText = null; } this.bugWarningTween = null; } });
        this.time.delayedCall(1800, () => { this.bugWarningCooldown = false; });
    }
    showCrustWarning() {
        if (this.crustWarningCooldown) return;
        this.crustWarningCooldown = true;
        if (this.crustWarningText) { if (this.crustWarningTween) this.crustWarningTween.remove(); this.crustWarningText.destroy(); this.crustWarningText = null; }
        this.crustWarningText = this.add.text(360, 640, t('crustFirst'), {
            fontSize: '42px', fill: '#FFAA44', fontStyle: 'bold', fontFamily: FONT_HAND, align: 'center',
            stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(80).setAlpha(0);
        this.tweens.add({ targets: this.crustWarningText, alpha: 1, duration: 200, ease: 'Cubic.easeOut' });
        this.crustWarningTween = this.tweens.add({ targets: this.crustWarningText, alpha: { from: 1, to: 0.2 }, duration: 400, yoyo: true, repeat: 4, delay: 200,
            onComplete: () => { if (this.crustWarningText) { this.crustWarningText.destroy(); this.crustWarningText = null; } this.crustWarningTween = null; } });
        this.time.delayedCall(1800, () => { this.crustWarningCooldown = false; });
    }
    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            ...TEXT_STYLES.message('#FFFF00', 26), backgroundColor: '#000000', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setDepth(30).setAlpha(0).setScale(0.9);
        this.tweens.add({ targets: msg, alpha: 1, scaleX: 1, scaleY: 1, duration: 200, ease: 'Back.easeOut' });
        this.time.delayedCall(2200, () => {
            if (!msg.active) return;
            this.tweens.add({ targets: msg, alpha: 0, scaleX: 0.9, scaleY: 0.9, duration: 220, ease: 'Cubic.easeIn', onComplete: () => msg.destroy() });
        });
    }
    drawCarpet() {
        this.carpetContainer.removeAll(true);
        const key = 'carpet' + this.state.carpetIndex;
        if (this.textures.exists(key)) {
            const img = this.add.image(this.carpetX, this.carpetY, key);
            img.setDisplaySize(this.carpetW, this.carpetH);
            this.carpetContainer.add(img);
        } else {
            const g = this.add.graphics();
            const cx = this.carpetX - this.carpetW / 2, cy = this.carpetY - this.carpetH / 2;
            const palettes = [
                { main: 0x8B4513, accent: 0xFFD700, border: 0x654321 },
                { main: 0x8B0000, accent: 0xFFE4B5, border: 0x5C0000 },
                { main: 0x191970, accent: 0xC0C0C0, border: 0x0F0F40 },
                { main: 0x2E8B57, accent: 0xFFE4E1, border: 0x1F5F3A },
                { main: 0x4B0082, accent: 0xFFD700, border: 0x2F0050 }
            ];
            const p = palettes[(this.state.carpetIndex - 1) % palettes.length];
            g.fillStyle(p.main, 1); g.fillRect(cx, cy, this.carpetW, this.carpetH);
            g.lineStyle(20, p.border, 1); g.strokeRect(cx + 10, cy + 10, this.carpetW - 20, this.carpetH - 20);
            g.lineStyle(4, p.accent, 0.7);
            for (let i = 0; i < 3; i++) {
                const size = 100 - i * 30;
                g.beginPath();
                g.moveTo(this.carpetX, this.carpetY - size); g.lineTo(this.carpetX + size, this.carpetY);
                g.lineTo(this.carpetX, this.carpetY + size); g.lineTo(this.carpetX - size, this.carpetY);
                g.closePath(); g.strokePath();
            }
            g.fillStyle(p.accent, 1);
            g.fillCircle(cx + 50, cy + 50, 12); g.fillCircle(cx + this.carpetW - 50, cy + 50, 12);
            g.fillCircle(cx + 50, cy + this.carpetH - 50, 12); g.fillCircle(cx + this.carpetW - 50, cy + this.carpetH - 50, 12);
            this.carpetContainer.add(g);
        }
    }
    update(_, delta) {
        if (this.shop.isOpen || this.museum.isOpen || this.questsUI.isOpen || this.achievementsUI.isOpen
            || this.dailyUI.isOpen || this.settingsUI.isOpen || this.leaderboardUI.isOpen) return;
        this.cleaning.draw();
        this.bugs.update(delta);
        this.pets.update(delta);
        this.cleaning.updateMold(delta);
        this.carpetElapsed += delta;
        if (this.state.carpetIndex >= 4) {
            if (this.steamFuel < BALANCE.steamMaxFuel) {
                this.steamFuel = Math.min(BALANCE.steamMaxFuel, this.steamFuel + BALANCE.steamFuelRegen);
                this.updateSteamBar();
            }
        }
        const s = Math.floor(this.carpetElapsed / 1000);
        this.timerText.setText(t('timeFormat', formatTime(s)));
        if (!this.stars.active) {
            const p = this.cleaning.progress;
            if (p >= BALANCE.finishThreshold && p < 1.0) { this.stars.activate(); this.updateStarsCounter(); }
        }
        if (this.tutorial && this.tutorial.isOpen) this.tutorial.tick(delta);
    }
}

const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720, height: 1280,
    backgroundColor: '#1a1a1a',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 3, touch: { capture: true } },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>
